  /api/v1/projects/{key}/tickets/{seq}/links:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: 関連チケットの一覧
      operationId: listTicketLinks
      description: |
        チケット間リンク（ApiDesign.md 9.10.1、DbDesign.md 6.6）。**必要権限は
        `ticket.view`**。

        **双方向を1本で返す**——当該チケットが `source` である行（`outgoing`）と
        `target` である行（`incoming`）の両方。GuiDesign.md 5.5 の「関連チケット」は
        「ブロック元」と「ブロック先」を同じリストに並べるため、2回問い合わせると
        N+1 になる（設計方針3）。

        **`ticket` に入るのは常に相手であって自分ではない。**

        **`items[]` は `direction`（`outgoing` → `incoming`）、同じ向きの中は
        `link_type` → 相手の `seq` の昇順。**

        **ページネーションも `ETag` も持たない。** **同じ内容が 9.5.1 の詳細応答の
        `links` にも入る**ので、詳細画面はこのエンドポイントを呼ばない。
      responses:
        '200':
          description: 関連チケットの一覧（双方向）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketLinkList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: 関連チケットの追加
      operationId: createTicketLink
      description: |
        リンクを1件足す（ApiDesign.md 9.10.1）。**必要権限は `ticket.edit`**。

        **当該チケットが常に `source` になる。** `incoming` の行を直接作る手段は
        置かない——相手側のチケットから `outgoing` として作れば同じ行になる。

        **`target_seq` は同一プロジェクト内に存在すること**（無ければ 422、
        `details[].code` は `not_found`）。**自分自身は 422 `self_link`**。

        **同じ `(source, target, link_type)` が既にあれば 409 `already_exists`**
        （`uq_ticket_link`）。`conflict` は使わない——あちらは `If-Match` 不一致の
        ような**状態**の競合で、こちらは**値**が既存の行と衝突している。

        **`link_type` は7種すべて受ける。** ただし**Phase 1 の画面が出すのは
        `relates` / `duplicates` / `blocks` の3つだけ**である（GuiDesign.md 5.5）
        ——`FS` / `SS` / `FF` / `SF` と `lag_days` はガントの依存線のためのもので、
        ガントは Phase 2。**API を絞らないのは、MCP とエージェントがガント用の
        依存を先に積むことを妨げないためである。**

        **親チケットの `version` と `updated_at` は動かない。相手側も動かない。**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketLinkRequest'
      responses:
        '201':
          description: 作成したリンク。
          headers:
            Location:
              description: 作成したリンクの URL。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketLink'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          $ref: '#/components/responses/TicketLinkAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/links/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
      - $ref: '#/components/parameters/TicketLinkID'
    delete:
      tags: [tickets]
      summary: 関連チケットの削除
      operationId: deleteTicketLink
      description: |
        リンクを1件消す（ApiDesign.md 9.10.1）。**必要権限は `ticket.edit`**。

        **`direction` を問わない。** `incoming` の行——相手のチケットが `source` で
        ある行——もここから消せる。GuiDesign.md 5.5 が両方を同じリストに並べる
        以上、**片方だけ消せないと画面に「消せない行」が混ざる。**

        削除も `activity` に記録する（`old_value` は `<link_type> <相手の完全形ID>`、
        `new_value` は `null`）。**相手のチケットの履歴には書かない**——1回の操作で
        2行増えると、同じ出来事が二重に見える。

        **`PATCH` は無い。** 一意制約が `(source, target, link_type)` である以上、
        `link_type` の変更は別の行になるのと同じである。
      responses:
        '204':
          description: 削除した（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketLinkNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{key}/tickets/{seq}/reports:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    post:
      tags: [tickets]
      summary: 完了レポートの提出
      operationId: submitTicketReport
      description: |
        エージェントが1回の作業の結果を構造化して提出する（ApiDesign.md 9.15、
        Requirements.md 10.6.1）。**必要権限は `ticket.transition`**。

        `agent_run` と `agent_report` に1行ずつ書き、**同じトランザクションで
        完了レポートのコメントを1件作る**（`kind='progress'`）。**そのコメントが、
        人がレポートを読む面である**（GuiDesign.md 5.5）。

        **状態を進めない。** 26b で遷移が 9.6 として独立したので、完了レポートの
        提出と状態遷移を1つの操作に混ぜない。**チケットもクローズしない**——
        `done` への遷移は `is_agent_reachable=false` かつ
        `allowed_actor_kinds=["user"]` で、DB とワークフローが拒む。

        **完了条件（`dod_item.is_satisfied`）を書き換えない。** いま API が開けて
        いる DoD の型は `manual` だけで、その定義は「人間がチェックを入れる」で
        ある（Requirements.md 10.5.2）。**エージェントが立てると型の定義に反する。**

        **`unsatisfied_dod` は「レポートの `dod_results` に `passed: true` として
        現れなかった完了条件」である。** `is_satisfied = false` のものではない
        ——この API は `is_satisfied` を動かさないので、それを返すと作業直後は
        必ず全件になり、`/pb-implement` の手順7 が終わらなくなる。

        **検証は「列に出す値」だけ厳しい。** `status` と `knowledge_impact`、
        `cost.tokens` / `cost.turns` は列へ展開されるので値域を見る。
        **それ以外の知らないキーは拒まず、`report` jsonb にそのまま保存する。**

        **9.6 の検証6（エージェントは所有者の担当だけ）は適用しない**——あの規則は
        ボードの状態を動かすことへの制約であり、レポートは状態を動かさない。

        **`GET` を置かない。** Phase 2 で人が読むのは完了レポートのコメントで
        あり、`agent_report` の行そのものを読む面が無い。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTicketReportRequest'
      responses:
        '201':
          description: 受理した完了レポート。
          headers:
            Location:
              description: 受理した完了レポートの URL（`GET` は実装していない）。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/transitions:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: 遷移先の一覧
      operationId: listTicketTransitions
      description: |
        詳細画面のステータスドロップダウン（GuiDesign.md 5.5）に出す選択肢
        （ApiDesign.md 9.7）。**必要権限は `ticket.view`**。

        **`items[]` はワークフローの全ステータス（現在のものを除く）である。**
        遷移が定義されている先だけに絞らない。

        **遷移できない先も `allowed: false` と `reason` を付けて返す。** 設計原則4
        「権限で見えないを作る」は**メニュー項目**についての規則であり、ここでは適用しない。
        ステータスは業務上の到達点であり、存在ごと隠すと「なぜ完了にできないのか」が
        分からなくなる。**この理由は定義が無い先にこそ強く効く**——`with_review` では
        `in_progress → done` の定義が無く、隠すとレビューを通す必要があること自体が
        画面から読めない。

        `reason` は 9.6 の検証2〜6 に対応する（検証1 は `items[]` をワークフローから
        組み立てるため起こらない）。**複数に当たる場合は先の検証の理由を返す**——
        利用者が最初に取り除くべき障害がそれだからである。

        | 9.6 の検証 | `reason` |
        |---|---|
        | 2（定義が無い） | `<現在の名前>から<遷移先の名前>へは直接進められません` |
        | 3（`allowed_actor_kinds`） | `この状態への変更は<種別>からは行えません` |
        | 4（`is_agent_reachable`） | `この状態へはエージェントから変更できません` |
        | 5（`required_permission`） | `<権限キー> 権限が必要です` |
        | 6（担当が所有者でない） | `このチケットの担当者があなたの所有者ではないため、エージェントからは変更できません` |

        **検証6 はチケット単位の条件なので、当たると `items[]` の全行が同時に
        `allowed: false` になる**（手順26b）。遷移先ごとに違う理由が並ぶ他の検証とは
        性質が異なるが、行ごとに理由を付ける形は変えない。

        **このエンドポイントを 9.5.1 の詳細応答に埋めないのは、`PATCH` のたびに再計算が
        要るためである。** ドロップダウンを開いたときにだけ呼べばよい。

        ワークフローを持たないプロジェクト（`project.workflow_id` が `NULL`）では
        `items` が空になる。
      responses:
        '200':
          description: 現在のステータスと遷移先の候補（9.7）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTransitionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/move:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    post:
      tags: [tickets]
      summary: チケットの並べ替え
      operationId: moveTicket
      description: |
        バックログのドラッグ&ドロップによる並べ替え（ApiDesign.md 9.4、GuiDesign.md 5.4）。
        **必要権限は `ticket.edit`**。

        **`PATCH` で `sort_key` を直接書かせない。** LexoRank の桁生成規則をクライアントに
        持たせると、Web・MCP・将来の CLI がそれぞれ同じ規則を実装することになり、1つでも
        ずれると順序が壊れる。**順序キーの生成はサーバに1つだけ置く。**

        **`If-Match` は要求しない**（9.4）。競合しても失われる編集内容が無い（`sort_key` は
        フォームで編集する項目ではない）。ただし **`version` は他の更新と同じく +1 する**。

        **並び順はプロジェクト内で1本である。** グループ化（親・タグ・スプリント）は表示上の
        区切りにすぎず、グループを切り替えても `sort_key` は変わらない。
        **二段（バックログ／オンステージ）も同じ1本を共有する**（9.4、DbDesign.md 6.6）。

        **`activity` には記録しない。** `sort_key` だけの更新であり、記録するとチケット詳細の
        変更履歴が並べ替えで埋まる（利用者の判断、2026-08-23）。

        `position` と `after_seq` / `before_seq` の同時指定は 422。いずれも無い場合も 422。

        **`staged` で段を出し入れする**（9.4.1）。段と位置を1回のリクエストで決めるのは、
        ドラッグ&ドロップの1操作で両方が同時に決まるためで、2本に分けると途中で失敗した
        ときに「段は移ったが位置は末尾」という中途半端な状態が残る。

        検証に失敗したときの `details[].code` は次のとおり。

        | `code` | 意味 |
        |---|---|
        | `not_stageable` | 表示上のトップレベルでないチケットを `staged: true` で上げようとした（9.4.1） |
        | `invalid` / `required` | `position` と `after_seq` / `before_seq` の指定の誤り |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTicketRequest'
      responses:
        '200':
          description: |
            動かした結果。**`rebalanced` が `true` のときはクライアントが一覧を取り直す**
            ——手元の `sort_key` がすべて古くなっている。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveTicketResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/docs:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [docs]
      summary: 文書の目次
      operationId: listDocs
      description: |
        プロジェクト文書（憲章）の目次を返す（ApiDesign.md 10.2）。**必要権限は `doc.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        **`body_md` を含めない。** 目次は「どこに何があるか」を答えるものであり、本文は
        `GET .../docs/{path}` が返す。全文を一度に返す設計にすると、リポジトリの md ファイルより
        劣る（ファイルなら部分読みができる）。

        `items[]` は各階層で `sort_order` 昇順、同値は `slug` 昇順。**ページネーションを
        持たない**——目次は木であり、途中で切ると子が親から外れる。

        **`version` を含める。** 木のドラッグ&ドロップ（GuiDesign.md 5.10）は目次だけを持って
        複数行を `PATCH` するため、`If-Match` の材料がここに要る。
      responses:
        '200':
          description: 文書の木。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocTreeList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [docs]
      summary: 文書の作成
      operationId: createDoc
      description: |
        文書を1件作る（ApiDesign.md 10.4）。**必要権限は `doc.edit`**——**`operator` と
        `project_member` はこれを持たない**（DbDesign.md 8.1.4）。憲章は全参加者を縛るため、
        更新できる人を絞る。

        `slug` は同じ親の下で一意で、重複は 409 `already_exists`。`parent_path` を省略・`null`
        にするとトップレベル。存在しないパスは 422（`details[].code = "not_found"`）。

        `sort_order` を省略すると同じ親の中の末尾（現在の最大値 + 10）に置く。

        **`revision_no = 1` を同時に作る。** リビジョンは「その変更のあとの本文」を持つので、
        作成時の1件が無いと最初の編集で「作ったときの本文」がどの版にも残らない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocRequest'
      responses:
        '201':
          description: 作成された文書。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/docs/rules/naming
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doc'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/DocAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/docs/{path}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/DocPath'
    get:
      tags: [docs]
      summary: 文書の本文
      operationId: getDoc
      description: |
        文書1件を返す（ApiDesign.md 10.3）。必要権限は `doc.view`。

        `created_by` / `updated_by` は `null` になりうる（`ON DELETE SET NULL`。
        DbDesign.md 8.1.1）。コメントの `author` が `null` にならないのと異なり、
        **文書は書いた人が退職しても内容が生き続ける。**

        **`?section=` を付けるとその章だけを返す**（応答は `DocSection`）。`body_md` は
        見出し行から、同じか上のレベルの次の見出しの直前までを含む。見つからないときは
        404 で、本体に `available_sections` が付く——呼び出し側（多くはエージェント）が、
        もう一度目次を取りに行かずに次の一手を選べるようにするため。
      parameters:
        - name: section
          in: query
          required: false
          description: |
            返す章の見出しテキスト。**スラッグ化も番号付けもしない**（10.2）。同じ文書に
            同名の見出しが2つあるときだけ、2つ目以降に `#2` が付く（URL では `%23`）。
          schema:
            type: string
          examples:
            heading:
              value: 命名
      responses:
        '200':
          description: |
            文書の本文。`?section=` を付けた場合は `DocSection`（章だけ）になる。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Doc'
                  - $ref: '#/components/schemas/DocSection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [docs]
      summary: 文書の更新（移動・改名を含む）
      operationId: patchDoc
      description: |
        文書を部分更新する（ApiDesign.md 10.4）。必要権限は `doc.edit`。

        **`If-Match` は必須**（2.8）。省略すると 422（`details[].field` が `If-Match`）、
        現在の `version` と食い違えば 409 `conflict`。**人とエージェントが同じ文書を触るため、
        Phase 1 のプロジェクト設定より競合が起きやすい。**

        **`parent_path` と `slug` の変更が移動・改名である。** 部分木ごと移動する（`path` は
        子孫の分も付け替わる）。自分自身または自分の子孫を `parent_path` に指定すると 422
        （`details[].code = "cycle"`）。移動先に同じ `slug` があれば 409 `already_exists`。

        **リビジョンは `title` か `body_md` が実際に変わったときだけ積む。** `sort_order` の
        変更や同じ本文の送り直しでは作らない——並べ替えのたびに履歴が伸びると「いつ内容が
        変わったか」が読めなくなる。**`version` はどの更新でも +1 する。**

        `change_reason` はリビジョンを作らない更新では捨てる（422 にはしない）。

        **末尾が `_revisions` のパスへ送ると 405。** 履歴は読み取り専用である（10.1）。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDocRequest'
      responses:
        '200':
          description: 更新後の文書。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doc'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '405':
          $ref: '#/components/responses/DocMethodNotAllowed'
        '409':
          description: |
            `If-Match` が現在の `version` と一致しない（`conflict`）、または移動先の階層に
            同じ `slug` の文書がある（`already_exists`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [docs]
      summary: 文書の削除
      operationId: deleteDoc
      description: |
        文書を消す（ApiDesign.md 10.4）。必要権限は `doc.edit`。

        **物理削除で、部分木ごと消える**（`parent_id` の `CASCADE`。DbDesign.md 8.1.1）。
        `document_revision` も一緒に消える。

        **子を持っていても API は止めない。** 件数を示して確認するのは画面の仕事である
        （GuiDesign.md 6.3）——使用中のタグを消せるようにしたのと同じ判断で、消せないと
        構造を直せなくなる。

        **末尾が `_revisions` のパスへ送ると 405。**
      responses:
        '204':
          description: 削除された（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '405':
          $ref: '#/components/responses/DocMethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/docs/{path}/_revisions:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/DocPath'
    get:
      tags: [docs]
      summary: 文書の履歴
      operationId: listDocRevisions
      description: |
        文書のリビジョン一覧を返す（ApiDesign.md 10.5）。必要権限は `doc.view`。

        **`_revisions` はサブ資源の予約語である。** `slug` の検証が `_` を含められないため
        （DbDesign.md 8.1.1）、`.../docs/a/b/_revisions` が「`a/b` のリビジョン一覧」なのか
        「`a/b/_revisions` という文書」なのかで迷うことがない（10.1）。

        **一覧に `body_md` を含めない。** 20件ぶんの Markdown を載せると応答が重くなる。
        本文が要るときは `.../_revisions/{revision_no}` を呼ぶ。

        **`revision_no` の降順に固定**（`sort` を受け付けない）。`per_page` の既定は 20、
        上限は 100。
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: 既定 20、上限 100（ApiDesign.md 10.5 / 2.6）。
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: リビジョンの一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocRevisionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/docs/{path}/_revisions/{revision_no}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/DocPath'
      - $ref: '#/components/parameters/DocRevisionNo'
    get:
      tags: [docs]
      summary: 文書の履歴1件（本文つき）
      operationId: getDocRevision
      description: |
        リビジョン1件を本文つきで返す（ApiDesign.md 10.5）。必要権限は `doc.view`。

        **一覧の1件に `body_md` を足した形である。** `version` も `outline` も持たない——
        `version` は現在の文書の楽観ロック値であって過去の版に属さず、`outline` は現在の
        本文から作るものである。

        **「前の版に戻す」は、取得した `body_md` を `PATCH` で書き戻して行う。** 専用の
        エンドポイントを置かない。**履歴は消さない**——書き戻しも新しいリビジョンとして積む。
      responses:
        '200':
          description: リビジョン1件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocRevision'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: ユーザー一覧
      operationId: listUsers
      description: |
        人間とエージェントを同じ一覧に返す（ApiDesign.md 6.1、DbDesign.md 6.2 の
        `actor` 統合設計）。**必要権限は `user.manage`**（Phase 1 = アドミニストレータのみ）。

        `kind` によって意味を持たないフィールドは `null` を返し、フィールド自体を
        省略しない。**`agent` は Phase 1 では常に `null`**（中身にあたる
        `agent` テーブルは Phase 2 で作られる）。

        `kind = 'system'` の actor は返さない。

        `project_count` は `project_member` の行数で、アーカイブ済みプロジェクトも数える。
      parameters:
        - name: kind
          in: query
          description: 既定は `all`。
          schema:
            type: string
            enum: [user, agent, all]
            default: all
        - name: is_active
          in: query
          description: 既定は `all`。**真偽値ではなく3値の文字列**（未指定と false を区別する）。
          schema:
            type: string
            enum: ['true', 'false', all]
            default: all
        - name: q
          in: query
          description: |
            表示名・メールアドレス・**ロールの表示名**の部分一致。ロールは `role.display_name`
            （「アドミニストレータ」「オペレータ」）と比べる。**画面に出ないキー
            （`administrator`）は対象にしない。** `%` と `_` はサーバ側でエスケープするため
            ワイルドカードとしては働かない。**画面は検索欄を常時表示する**（GuiDesign.md 5.6）。
          schema:
            type: string
        - name: sort
          in: query
          description: |
            `system_role` は `role.sort_order` の順（オペレータ → アドミニストレータ）で、
            表示名の五十音順ではない。**ロールを持たない行（エージェント）は昇順・降順とも末尾。**
            `is_active` の昇順は無効が先（`false < true`）。
          schema:
            type: string
            enum: [display_name, email, system_role, is_active, last_login_at, created_at]
            default: display_name
        - name: order
          in: query
          description: |
            既定は `asc`。名簿は昇順で読むためで、他の一覧（`GET /projects` は `desc`）とは
            既定が違う。
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: 1ページ分のユーザー。
          headers:
            ETag:
              description: |
                弱い検証子 `W/"user-<件数>-<MAX(updated_at) のナノ秒>"`（ApiDesign.md 2.7）。
                `updated_at` は `actor` と `app_user` の新しいほうを採る。
                **Phase 1 では `If-None-Match` を解釈しない**（304 を返さない）。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: ユーザーの作成
      operationId: createUser
      description: |
        ユーザーを作成する（ApiDesign.md 6.2）。必要権限は `user.manage`。

        サーバ側は `actor` → `app_user` → `user_identity`（`provider_key='local'`,
        `subject=email`）→ `local_credential` と `audit_log` への記録を
        **単一トランザクション**で行う（DbDesign.md 6.2）。

        メール重複の検出はDBの `UNIQUE` 制約に委ねる。

        **`generated_password` はこの応答でのみ返る。** 再表示できず、監査ログにも残さない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 作成された。
          headers:
            Location:
              description: '`/api/v1/admin/users/<id>`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            メールアドレスが既に使われている（`already_exists`。ApiDesign.md 6.2）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [admin]
      summary: ユーザーの詳細
      operationId: getUser
      description: |
        1ユーザーの本体・認証手段・プロジェクトごとの権限・有効なセッションを
        1回で返す（ApiDesign.md 6.3）。必要権限は `user.manage`。
        `GuiDesign.md` 5.6.2 の詳細画面が必要とする情報がここに揃う。

        **`kind='user'` のアクターだけを返す。** エージェント・システムアクターは
        404 になる（手順13a の判断）。応答の `version` は `app_user` の列であり、
        `app_user` の行を持たないアクターでは 6.4 の楽観ロックが成立しないため。
        エージェントの詳細は `agent` テーブル（DbDesign.md 8.1）ができる
        Phase 2 で、列構成ごと設計する。

        **一覧（6.1）と違い `ETag` は返さない。** 鮮度は本体の `version` が表す。
      responses:
        '200':
          description: ユーザーの詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            ユーザーが存在しない、または `kind` が `user` ではない（`not_found`）。
            **両者を区別しない**（ApiDesign.md 1.2-5）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [admin]
      summary: ユーザーの更新
      operationId: updateUser
      description: |
        `display_name` / `email` / `system_role` / `is_active` を更新する
        （ApiDesign.md 6.4）。必要権限は `user.manage`。

        **送られたフィールドだけを更新する**（部分更新）。

        **`If-Match` は必須**（2.8）。省略すると 422、現在の `version` と
        食い違えば 409。`display_name` や `is_active`（`actor` の列）だけを
        変えた場合も `version` は +1 される——**ユーザー1人につき `version` は1つ**
        という約束にしないと、直後に古い `version` でもう一度更新が通ってしまう。

        **`email` を変えると `user_identity.subject`（`provider_key='local'`）も
        追随する。** ログインは `subject = app_user.email` で突き合わせるため
        （Design.md 6.2.1 手順2〜3）、片方だけ変えると当人がログインできなくなる。

        `system_role` を変えたときは当該アクターの権限キャッシュを無効化する
        （Design.md 6.4.5）。監査には常に `user.update` を、ロールが変わったときは
        加えて `role.change` を記録する。

        **3つのガードは API 側にある**（6.4）。UIだけで防ぐと、直接APIを叩いた
        場合に誰もログインできないインスタンスが生まれうる。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新後のユーザー（6.3 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            次のいずれか（ApiDesign.md 6.4）。

            - `conflict` — `If-Match` が現在の `version` と一致しない（2.8）
            - `already_exists` — `email` が既に使われている
            - `self_modification_forbidden` — 自分自身のロール変更・無効化
            - `last_administrator` — 最後の有効なアドミニストレータの降格・無効化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: ユーザーの削除
      operationId: deleteUser
      description: |
        物理削除する（ApiDesign.md 6.5、DbDesign.md 4.6）。必要権限は `user.manage`。

        `actor` の削除により `app_user` / `user_identity` / `local_credential` /
        `access_token` / `project_member` が CASCADE で消える。
        `ticket.assignee_id` は `ON DELETE SET NULL` のため**チケットは残る**。

        `comment.author_id` は `NOT NULL` かつ `ON DELETE RESTRICT` のため、
        **削除前にシステムアクター（`kind='system'` の「削除されたユーザー」）へ
        付け替える**（DbDesign.md 6.7）。このアクターはシードに無く、**最初に
        必要になった削除で作る**（手順13a の判断。Phase 1 は `comment` を作る
        経路が無いため、実際には作られない）。

        削除前に `audit_log` へ `user.delete` を記録し、`detail` に削除時点の
        表示名・メール・ロールを保存する。

        **`If-Match` は要求しない**（2.8）。失われる編集内容が無く、競合しても
        「消えている」に収束するため。無効化のみ行いたい場合は 6.4 の
        `is_active: false` を使う。
      responses:
        '204':
          description: 削除された。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            自分自身（`self_modification_forbidden`）、または最後の有効な
            アドミニストレータ（`last_administrator`）。ApiDesign.md 6.5。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: パスワードのリセット
      operationId: resetUserPassword
      description: |
        当該ユーザーの `local_credential` を差し替える（ApiDesign.md 6.6）。
        必要権限は `user.manage`。

        `failed_attempts` と `locked_until` をリセットし、**全セッションを失効**する。
        ロックされた利用者を救うのがこの操作の主な用途であり、パスワードだけ
        変えてロックが残ると目的を果たさない。

        **`mode` は `generate` のみ受け付ける**（手順13a の判断）。応答が
        `generated_password` しか持たず、管理者が手で決めた値を返す意味が無いため。
        本文そのものを省略してもよい（`mode=generate` / `must_change_password=true`）。

        **`generated_password` はこの応答でのみ返る。** 監査ログにも残さない。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: リセットされた。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedPassword'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `local_credential` を持たないユーザー（IdP のみ、Phase 3）に対する
            リセット（`conflict`。ApiDesign.md 6.6）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/sessions/revoke:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: 全セッションの失効
      operationId: revokeUserSessions
      description: |
        当該アクターの全トークンを失効する（ApiDesign.md 6.7）。必要権限は `user.manage`。

        **`token_type` で絞らない。** 6.7 が「エージェントのトークンにも適用される」と
        定めており、セッションだけを消すとAPIトークンで入り続けられる。

        **冪等である。** 有効なトークンが1本も無くても 204 を返す。

        **個別のセッションを失効させる API は Phase 1 では持たない**
        （GuiDesign.md 5.6.2 の行ごとの `[失効]` は出さない。手順13a の判断）。
      responses:
        '204':
          description: 失効した。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/memberships/{key}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ProjectKey'
    put:
      tags: [admin]
      summary: プロジェクトメンバーシップの付与・変更
      operationId: putUserMembership
      description: |
        ユーザーにプロジェクトロールを与える（ApiDesign.md 6.8）。必要権限は `user.manage`。
        `GuiDesign.md` 5.6.2 の「プロジェクトごとの権限」ブロックに対応する。

        **追加と変更を兼ねる（冪等）。** 既にメンバーならロールを上書きし、
        `joined_at` は最初の1回のまま動かない。

        ロールの妥当性はDB（`role.scope='project'`）に問い合わせる。
        メンバーシップは実効権限の第2層であるため、変更後に権限キャッシュを
        無効化する（Design.md 6.4.1 / 6.4.5）。監査は `role.change`
        （`target_type='project_member'`）。

        **Phase 2 で `POST /projects/:key/members` が同じ状態を変えるようになる。**
        6.8 が定めるとおり、内部実装は共通の1関数に集約すること。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '200':
          description: 付与・変更後のメンバーシップ（6.3 の `project_memberships[]` と同形）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーまたはプロジェクトが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: プロジェクトメンバーシップの剥奪
      operationId: deleteUserMembership
      description: |
        ユーザーをプロジェクトから外す（ApiDesign.md 6.8）。必要権限は `user.manage`。

        **冪等である。** 元からメンバーでなくても 204 を返す。ただし監査
        （`role.change`）は実際に消えたときだけ書く——空振りを記録すると
        本当の剥奪が埋もれるため。
      responses:
        '204':
          description: 剥奪された（または元からメンバーではなかった）。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーまたはプロジェクトが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/roles:
    get:
      tags: [roles]
      summary: ロール一覧
      operationId: listRoles
      description: |
        組み込みロールのカタログ（ApiDesign.md 7.1、正本は DbDesign.md 7.3 のシード）。
        GuiDesign.md 5.6.3 の権限マトリクスと、画面がロールの表示名を引くために使う。

        **必要権限は `scope` によって変わる。**

        | 要求 | 返すもの | 必要権限 |
        |---|---|---|
        | `?scope=project` | `scope='project'` の3件 | **不要**（認証済みであればよい） |
        | `?scope=system` | `scope='system'` の2件 | `user.manage` |
        | 未指定 | 全5件 | `user.manage` |

        OpenAPI の `security` は操作単位でしか宣言できず、クエリの値ごとに分けられない。
        ここでは**認証必須**として宣言してある。`?scope=project` 以外で `user.manage` を
        持たない場合は `403` になる。

        `?scope=project` を開放しているのは、プロジェクト設定のメンバータブ
        （GuiDesign.md 5.9.2）がプロジェクト管理者の開く画面でありながら、
        ロールの表示名を必要とするためである。**これは暫定で、画面構成が固まった時点で
        権限の全体像を再整理する**（7.1）。

        `items[]` は `role.sort_order` 昇順、`permissions[]` は `permission.sort_order` 昇順。
        **ページネーションも ETag も持たない**（件数がシードで固定のため）。
      parameters:
        - name: scope
          in: query
          description: |
            未指定は全件。`role.scope` そのものであり、**プロジェクトIDやユーザIDは
            受け付けない**（`role` テーブルは `project_id` を持たない。7.1）。
            解釈できない値は `422`。
          schema:
            type: string
            enum: [system, project]
      responses:
        '200':
          description: ロールのカタログ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/permissions:
    get:
      tags: [roles]
      summary: 権限カタログ
      operationId: listPermissions
      description: |
        権限カタログの30件（ApiDesign.md 7.2、正本は DbDesign.md 7.2 のシード28件と
        8.1.4 の doc 権限2件）。
        **必要権限は不要**（認証済みであればよい。2026-09-02 に `user.manage` から変更）。

        消費者が2つになったため開放した——GuiDesign.md 5.6.3 の権限マトリクス
        （`/admin/users` の中）と、5.8.2 のエージェント用トークンの発行結果
        （`/me/agents`。必要権限は「本人」）である。カタログ自体は Design.md 6.4.2 に
        全文があり、本人の実効権限は `GET /me` が既に返しているので、開放しても
        渡る情報は増えない。

        `items[]` は `permission.sort_order` 昇順。`category` は同じ番号帯で連続しており、
        画面はこれで行を区切る。**ページネーションも ETag も持たない。**
      responses:
        '200':
          description: 権限のカタログ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /healthcheck:
    get:
      tags: [ops]
      summary: ヘルスチェック
      operationId: healthcheck
      description: |
        監視・オーケストレータ用（ApiDesign.md 2.11）。**唯一 `/api/v1` の外にある。**
        認証・CSRF・レート制限・認可の対象外で、DBへは接続しない。
      security: []
      responses:
        '200':
          description: 常に `{"status":"OK"}`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pb_session
      description: |
        ブラウザ（Web UI）用。HttpOnly / SameSite=Lax（ApiDesign.md 2.3）。
        **状態変更系（POST/PATCH/PUT/DELETE）では `X-PB-CSRF` も必要**（2.4）。
    bearerAuth:
      type: http
      scheme: bearer
      description: 'CLI・スクリプト用（`Authorization: Bearer pb_api_...`。ApiDesign.md 2.3）。'

  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: |
        ULID（`actor.id`。ApiDesign.md 6.3）。**形式は検証しない**——不正な ID は
        単に行が見つからず 404 になる。存在しないものと形式が違うものを別の応答に
        分けると、ID の総当たりに手がかりを与えるため（1.2-5）。
      schema:
        type: string
      examples:
        demo:
          value: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
    AgentID:
      name: id
      in: path
      required: true
      description: |
        エージェントの ULID（`agent.actor_id`。ApiDesign.md 4.5）。
        **形式は検証しない**——不正な ID は単に行が見つからず 404 になる。
      schema:
        type: string

    AgentTokenID:
      name: token_id
      in: path
      required: true
      description: |
        エージェント用トークンの ULID（`access_token.id`。ApiDesign.md 4.5.5）。
      schema:
        type: string

    TokenID:
      name: id
      in: path
      required: true
      description: |
        アクセストークンの ULID（`access_token.id`。ApiDesign.md 4.4.3）。
        **形式は検証しない**——不正な ID は単に行が見つからず 404 になる。
      schema:
        type: string
      examples:
        demo:
          value: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
    TagID:
      name: id
      in: path
      required: true
      description: |
        タグの ULID（ApiDesign.md 9.1「チケット以外の子資源は ULID で指す」）。
        タグは `seq` に相当する連番を持たない。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    SprintID:
      name: id
      in: path
      required: true
      description: |
        スプリントの ULID（ApiDesign.md 9.1）。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketReferenceID:
      name: id
      in: path
      required: true
      description: |
        外部参照の ULID（ApiDesign.md 9.1「チケット以外の子資源は ULID で指す」）。
        外部参照は `seq` に相当する連番を持たない。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketCommentID:
      name: id
      in: path
      required: true
      description: |
        コメントの ULID（ApiDesign.md 9.1「チケット以外の子資源は ULID で指す」）。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketDoDID:
      name: id
      in: path
      required: true
      description: |
        完了条件の ULID（ApiDesign.md 9.1）。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketLinkID:
      name: id
      in: path
      required: true
      description: |
        チケット間リンクの ULID（ApiDesign.md 9.1）。**`direction` を問わない**
        ——`incoming` の行の id もここへ渡せる（9.10.1）。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketSeq:
      name: seq
      in: path
      required: true
      description: |
        プロジェクト内連番（`ticket.seq`。ApiDesign.md 9.1）。**チケットを指すのは常に
        `seq` であり ULID ではない**——親もリンク先も同一プロジェクト内に限り（Phase 1）、
        プロジェクトが URL で決まっているため `seq` だけで一意に定まる。
        MCP 経由でエージェントが扱う識別子も `my-app-31` の形になる。
      schema:
        type: integer
        format: int32
        minimum: 1
      examples:
        demo:
          value: 31
    ProjectKey:
      name: key
      in: path
      required: true
      description: |
        プロジェクトキー（ULID ではない。ApiDesign.md 5.4）。URL・チケット番号と
        一致させ、開発時のデバッグを容易にするため。
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,19}$'
      examples:
        demo:
          value: my-app
    DocPath:
      name: path
      in: path
      required: true
      description: |
        文書のパス（ApiDesign.md 10.1）。`slug` を根から連ねたもので、`vision`、
        `rules/naming` のようになる。**スラッシュを含む**——実装は chi の
        ワイルドカード（`/docs/*`）1本で受け、末尾のセグメントで `_revisions` を
        切り分ける。

        **ULID も返すが、指定には使わない。** チケットが `seq` を使うのと同じ理由で、
        共有できる URL になり、画面の URL（`/p/:key/docs/rules/naming`）とそのまま一致する。
      schema:
        type: string
      examples:
        top:
          value: vision
        nested:
          value: rules/naming
    DocRevisionNo:
      name: revision_no
      in: path
      required: true
      description: リビジョン番号（1始まり。ApiDesign.md 10.5）。
      schema:
        type: integer
        minimum: 1
      examples:
        second:
          value: 2
    csrfToken:
      type: apiKey
      in: header
      name: X-PB-CSRF
      description: |
        `pb_csrf` Cookie と同じ値を送る（double submit。ApiDesign.md 2.4）。
        Cookie 認証の状態変更系でのみ要求する。Bearer 認証では不要。

  # 既定では Cookie か Bearer のいずれかを要求する。
  # 認証不要のエンドポイントは security: [] で個別に打ち消す。
  headers:
    RetryAfter:
      description: 再試行までの秒数。`error.retry_after_sec` と同じ値（ApiDesign.md 2.5）。
      schema:
        type: integer
    XRateLimitLimit:
      description: 窓あたりの上限回数（ApiDesign.md 2.9）。
      schema:
        type: integer
    XRateLimitRemaining:
      description: 窓の残り回数（ApiDesign.md 2.9）。
      schema:
        type: integer

  responses:
    BadRequest:
      description: 形式不正・パースエラー（`bad_request`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 未認証・トークン失効・アカウント無効（`unauthenticated`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        権限不足（`forbidden`）。`audit_log` に `permission.denied` が残る（Design.md 6.4.5）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CSRFFailed:
      description: |
        CSRF トークンの不一致（`csrf_failed`）。Cookie 欠落・ヘッダ欠落・不一致を区別しない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: 入力値の検証エラー（`validation_failed`）。`details` を伴う。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProjectStatusChanged:
      description: |
        切り替え後のプロジェクト（5.4 と同形式）。**既にその状態でも 200 を返す**
        （ApiDesign.md 5.6 の冪等）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectDetail'
    ProjectNotFound:
      description: |
        プロジェクトが存在しない、または到達できない（`not_found`）。
        **非メンバーには 403 ではなく 404 を返す**（Design.md 6.4.5「存在を隠す」）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TagNotFound:
      description: |
        タグが存在しない（`not_found`）。**他プロジェクトのタグ ID も同じ 404 に寄せる**
        ——クエリの `WHERE` が `project_id` を含むため区別が付かず、区別する必要もない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TagAlreadyExists:
      description: |
        同じ名前のタグが既にある（`already_exists`。`uq_tag_project_name`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SprintNotFound:
      description: |
        スプリントが存在しない（`not_found`）。TagNotFound と同じ扱い。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketReferenceNotFound:
      description: |
        外部参照が存在しない（`not_found`）。**他チケットの参照も同じ 404 に寄せる**
        ——クエリの `WHERE` が `ticket_id` を含むため区別が付かず、区別する必要も
        ない（Design.md 6.4.5）。チケットそのものが無い場合は TicketNotFound になる。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketCommentNotFound:
      description: |
        コメントが存在しない（`not_found`）。**削除済みもここへ合流する**
        （ApiDesign.md 9.8）——論理削除でも「もう無い」として扱い、二重削除が
        204 で通らないようにする。他チケットのコメントも同じ 404 に寄せる。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketDoDNotFound:
      description: |
        完了条件が存在しない（`not_found`）。他チケットの完了条件も同じ 404 に
        寄せる（Design.md 6.4.5）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketLinkNotFound:
      description: |
        関連チケットのリンクが存在しない（`not_found`）。**このチケットが
        `source` でも `target` でもない行も同じ 404 に寄せる**（ApiDesign.md 9.10.1）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketLinkAlreadyExists:
      description: |
        同じ `(source, target, link_type)` のリンクが既にある（`already_exists`。
        `uq_ticket_link`）。**`conflict` ではない**——あちらは `If-Match` 不一致の
        ような状態の競合で、こちらは値が既存の行と衝突している（ApiDesign.md 9.10.1）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketNotFound:
      description: |
        チケットが存在しない（`not_found`）。**他プロジェクトの番号も同じ 404 に寄せる**
        ——クエリの `WHERE` が `project_id` を含むため区別が付かず、区別する必要もない
        （Design.md 6.4.5）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocNotFound:
      description: |
        文書が存在しない、`?section=` の章が無い、`_revisions/{revision_no}` の版が無い、
        または閲覧権限が無い（`not_found`。ApiDesign.md 10.6）。**閲覧権限が無い場合も
        同じ応答になる**——到達できないものの存在を漏らさないため（Design.md 6.4.5）。

        **章が見つからなかった場合だけ、本体に `available_sections` が付く**（10.3）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocAlreadyExists:
      description: |
        同じ親の下に同じ `slug` の文書がある（`already_exists`。ApiDesign.md 10.6）。
        **`conflict` ではない**——`conflict` は `If-Match` 不一致のような状態の競合を指し、
        こちらは一意なキーの重複である（2.5.1）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocMethodNotAllowed:
      description: |
        `.../_revisions` を `GET` 以外で叩いた（`method_not_allowed`。ApiDesign.md 10.1）。
        `slug` の検証が `_` を弾く以上「`_revisions` という名の文書」は存在しえないので、
        **実在するサブ資源に対する未定義のメソッド**として扱う。「文書が無い」（404）に
        寄せると、書き込み先を間違えた呼び出し側が原因に辿り着けない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: レート制限（`rate_limited`。ApiDesign.md 2.9）。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: サーバ内部エラー（`internal_error`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          examples: ['tanaka@example.com']
        password:
          type: string
          format: password
      additionalProperties: false

    Session:
      description: |
        `POST /auth/login` と `GET /me` が返す共通の本体。**片方だけ形を変えない。**
      type: object
      required: [actor, permissions, projects, expires_at]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        permissions:
          description: システムロール由来の実効権限。権限0件は空配列で表す。
          type: array
          items:
            type: string
          examples: [['project.view', 'ticket.view']]
        projects:
          description: 所属プロジェクトと、そこでの実効権限。`key` の昇順。
          type: array
          items:
            $ref: '#/components/schemas/SessionProject'
        expires_at:
          description: 現在のトークンの有効期限。無期限の API トークンでは null。
          type: [string, 'null']
          format: date-time

    Actor:
      type: object
      required:
        [
          id,
          kind,
          display_name,
          email,
          system_role,
          locale,
          timezone,
          theme,
          hue,
          must_change_password,
        ]
      properties:
        id:
          description: ULID 26文字。
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        kind:
          type: string
          enum: [user, agent]
        display_name:
          type: string
        email:
          description: エージェントは null（ApiDesign.md 6.1。フィールド自体は省略しない）。
          type: [string, 'null']
        system_role:
          description: 同上。
          type: [string, 'null']
          enum: [administrator, operator, null]
        locale:
          type: [string, 'null']
          examples: ['ja']
        timezone:
          type: [string, 'null']
          examples: ['Asia/Tokyo']
        theme:
          description: |
            テーマ（GuiDesign.md 8.11）。エージェントは null。**サーバが返さないと
            別の端末で同じ見た目にならない**——8.11 が app_user と localStorage の
            両方に保存すると定めた目的がそれである。
          type: [string, 'null']
          enum: [light, dark, system, null]
        hue:
          description: ベース色相（GuiDesign.md 8.3）。エージェントは null。
          type: [string, 'null']
          enum: [blue, green, null]
        must_change_password:
          description: true のときフロントはパスワード変更画面へ誘導する（ApiDesign.md 3.1）。
          type: boolean

    UpdateMeRequest:
      type: object
      description: |
        ApiDesign.md 4.2。**送らなかった項目は変更しない**（部分更新）。
        すべて省略可だが、少なくとも1つを送ること自体は必須にしていない——
        空の `{}` は「何も変えない」として 200 を返す。

        `system_role` は**受け口としてだけ**定義してある。送られたら 422 で
        弾くためであり、黙って捨てると呼び出し側が権限が上がったと誤解する。
      properties:
        display_name:
          description: 1〜60文字。前後の空白は取り除かれる。
          type: string
          minLength: 1
          maxLength: 60
          examples: ['田中']
        email:
          description: |
            **ログインIDでもある**（ApiDesign.md 4.2）。画面では「ログインID」と
            「メールアドレス」の2行に分かれるが、Phase 1 ではどちらも本項目を指す。
          type: string
          format: email
          maxLength: 254
          examples: ['tanaka@example.com']
        locale:
          description: Phase 1 は `ja` のみ。
          type: string
          enum: [ja]
        timezone:
          description: |
            IANA のタイムゾーン名。サーバは `time.LoadLocation` で解決できるかを
            見る（値の一覧を持たない）。`Local` は弾く——誰のローカルかがサーバの
            設定に依存し、端末をまたぐと意味が変わるため。
          type: string
          maxLength: 64
          examples: ['Asia/Tokyo']
        theme:
          type: string
          enum: [light, dark, system]
        hue:
          type: string
          enum: [blue, green]
        system_role:
          description: |
            **変更できない。** 送られると 422（`details[].code` が `not_allowed`）。
          type: string
          enum: [administrator, operator]

    AgentClientKindList:
      description: ApiDesign.md 4.5.7。ページネーションも ETag も持たない。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentClientKind'

    AgentSetup:
      description: |
        ApiDesign.md 5.7.1。リポジトリにコミットする配置ファイル一式。
      type: object
      required: [project, base_url, workflow_version, clients, files]
      properties:
        project:
          $ref: '#/components/schemas/ProjectRef'
        base_url:
          type: string
          description: |
            PB の公開 URL。**リクエストの `Host` から組み立てた暫定値**である。
            画面が「エージェントはこの URL へ接続します」と出すために返す。
          example: http://localhost:8081
        workflow_version:
          type: integer
          description: |
            生成した手順ファイルに埋まる版番号（Requirements.md 10.9.3）。
            **Phase 2 では常に 1。** 「PB 側が古いと判断して警告を返す」経路は
            まだ無く、埋めるところまでが手順28a の範囲である。
          example: 1
        clients:
          type: array
          description: 実際に組み立てた種別（重複を畳み、カタログの順に並べたもの）。
          items:
            type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/AgentSetupFile'

    AgentConnect:
      description: |
        ApiDesign.md 4.5.8。**そのエージェント1件のための接続設定一式**（系統B）。
        **`AgentSetup`（系統A）とは別物である**——あちらはリポジトリにコミットする
        ファイル、こちらは各人の手元にしか残らないもの。
      type: object
      required: [agent, project, base_url, mcp_url, export_line, files]
      properties:
        agent:
          type: object
          required: [id, display_name, client_kind, client_display_name, token_env_name]
          properties:
            id:
              type: string
            display_name:
              type: string
            client_kind:
              type: string
            client_display_name:
              type: string
              description: |
                カタログの表示名（4.5.7）。**画面が対応表を持たないために返す**
                ——値域は今後も増えるので、写しを置くと必ず腐る。
                **カタログに無い種別ではキーをそのまま返す。**
            token_env_name:
              type: string
              description: |
                接頭 `PB_TOKEN_` を付けた実際の変数名。**組み立てはサーバの1か所**
                （4.5.1）。**`export_line` が null の種別でも値は返す。**
        project:
          $ref: '#/components/schemas/ProjectRef'
        base_url:
          type: string
          description: |
            PB の公開 URL。**リクエストの `Host` から組み立てた暫定値**
            （5.7.1 と同じ規則。スキームは `PB_COOKIE_SECURE`）。
          example: http://localhost:8081
        mcp_url:
          type: string
          description: |
            `base_url` ＋ `/mcp/<project_key>`（Design.md 8.3）。
            **`files[]` の中に埋まっているものと同じ文字列である。**
          example: http://localhost:8081/mcp/pb
        export_line:
          type: string
          nullable: true
          description: |
            トークンを環境変数へ置く行。**`null` になる種別がある**（4.5.8.2）
            ——Copilot は `${input:pb-token}` を使い、環境変数を読まない。
            **画面は `null` のとき節ごと出さない。**
          example: export PB_TOKEN_MY_LAPTOP='ここに発行したトークンを貼る'
        files:
          type: array
          description: |
            接続設定。**1枚だけか、空である**——`has_setup_template` が偽の種別
            （`gemini` / `other`）では空配列を返し、**エラーにしない**（4.5.8.3）。
            **`mode` は常に `merge`**（4.5.8.4）。
            **zip に入る `PB-README.md` はここに含まれない**（4.5.8.5）。
          items:
            $ref: '#/components/schemas/AgentSetupFile'

    AgentSetupFile:
      description: |
        ApiDesign.md 5.7.1 の `files[]`。**`mode` が要点である**——これが無いと、
        画面が「上書きしてよいファイル」と「壊してはいけないファイル」を同じ見た目で
        並べる。
      type: object
      required: [path, client_kind, mode, language, content]
      properties:
        path:
          type: string
          description: リポジトリ直下からの相対パス。
          example: .claude/commands/pb-onboard.md
        client_kind:
          type: string
          description: |
            どのクライアント向けか。**共通のもの（`.gitignore`）は空文字**。
        mode:
          type: string
          enum: [create, append, merge]
          description: |
            - `create`：そのまま置く
            - `append`：既存の末尾へ追記する（マーカーの内側だけが PB の管理範囲）
            - `merge`：既存の構造へ該当キーだけを足す。**JSON は追記できないので
              `append` と分けている**（`.claude/settings.json` を丸ごと置き換えると
              既存の許可設定が消える）
        language:
          type: string
          description: 画面がハイライトに使う（`markdown` / `json` / `text`）。
        marker_begin:
          type: string
          description: '`append` のときだけ入る（Requirements.md 10.8.8）。'
          example: '<!-- PB:BEGIN v1'
        marker_end:
          type: string
          description: '`append` のときだけ入る。'
          example: '<!-- PB:END -->'
        content:
          type: string
          description: ファイルの中身。

    AgentClientKind:
      description: |
        エージェントのクライアント種別1件（DbDesign.md 8.2.1.1）。
        **値が決めるのは設定ファイルの置き場であって、エディタではない**
        ——同じ VS Code でも Claude 拡張と GitHub Copilot で分かれる。
      type: object
      required: [key, display_name, has_setup_template]
      properties:
        key:
          type: string
          example: claude_code
        display_name:
          type: string
          example: Claude Code
        has_setup_template:
          type: boolean
          description: |
            PB がこの種別の配置ファイルを出せるか（0023。手順28a）。
            **絞り込みは画面が行う**——`/me/agents` の登録モーダルは全種別を出し
            （テンプレートが無くてもエージェントは登録できる）、
            `/p/:key/settings/agents` は真のものだけを出す。

    MyAgentList:
      description: |
        ApiDesign.md 4.5.1。ページネーションも ETag も持たない（4.4.1 と同じく、
        件数が少なく絞り込みも差分取得も意味を持たないため）。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyAgent'

    MyAgent:
      description: |
        ApiDesign.md 4.5.1 / 4.5.2 / 4.5.4。自分のエージェント1件。

        **`/admin/users` の `agent` オブジェクト（6.1）とは別物である。** あちらは
        管理者の一覧が返す形で、所有者を持つ代わりに名前と状態を親が持つ。
      type: object
      required:
        [id, display_name, client_kind, model_name, model_version,
         project, token_env_suffix, token_env_name,
         trust_level, is_active, created_at, token]
      properties:
        id:
          type: string
          description: エージェントの ULID（`agent.actor_id`）。
        display_name:
          type: string
          description: |
            本人が付けた名前。**どの端末のどのクライアントかを思い出すための
            手がかり**であり、一意ではない。
        client_kind:
          type: string
          description: |
            `agent_client_kind` の `key`（DbDesign.md 8.2.1.1）。
            **値域を固定しない**——正本は `GET /api/v1/agent-client-kinds`（4.5.7）で、
            今後も増える。0019 までは CHECK の3値だった。
        model_name:
          type: string
          nullable: true
        model_version:
          type: string
          nullable: true
        project:
          allOf:
            - $ref: '#/components/schemas/ProjectRef'
          description: 参加プロジェクト。登録時に必須なので `null` にならない。
        token_env_suffix:
          type: string
          nullable: true
          description: |
            接続設定ファイルが読む環境変数の**接尾**（`DbDesign.md` 8.2.1）。本人が決める。
            **未設定なら `null`**（0023 より前に登録された行）。
        token_env_name:
          type: string
          description: |
            接頭 `PB_TOKEN_` を付けた**実際の変数名**。
            **`token_env_suffix` が `null` のときは `PB_TOKEN_<エージェントの id>`。**
            **組み立てはサーバの1か所に閉じてある**——画面と生成器が各々
            フォールバックを計算すると、設定ファイルの名前と `export` 行がずれる。
          example: PB_TOKEN_MY_LAPTOP
        trust_level:
          type: integer
          description: |
            0〜3（既定 1）。**Phase 2 では使わない**——段階的な権限昇格の材料
            （`agent_run` の実績）が Phase 3 のため、既定値のまま置く。
        is_active:
          type: boolean
          description: '`false` は無効化されたエージェント。行は残る。'
        created_at:
          type: string
          format: date-time
        token:
          allOf:
            - $ref: '#/components/schemas/AgentToken'
          nullable: true
          description: 有効なトークン1本。無ければ `null`。

    ProjectRef:
      description: プロジェクトの最小の参照（ApiDesign.md 4.5.1）。
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string

    AgentToken:
      description: |
        ApiDesign.md 4.5.1 の `token`。**平文を持たない。**
      type: object
      required: [id, token_prefix, issued_at, last_used_at, expires_at, status]
      properties:
        id:
          type: string
        token_prefix:
          type: string
          description: 先頭8文字（`pb_agt_` + 1文字）。検索キーではない。
        issued_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: 一度も使われていなければ `null`。更新は1分粒度。
        expires_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, expired]

    IssuedAgentToken:
      description: |
        ApiDesign.md 4.5.3。**`token`（平文）を持つ唯一の形**である。
        DB には SHA-256 のハッシュしか残らず、再表示する経路は存在しない。
      type: object
      required: [id, token, token_prefix, scopes, issued_at, expires_at, status]
      properties:
        id:
          type: string
        token:
          type: string
          description: '**この応答でのみ返る平文。** 接頭辞は `pb_agt_`。'
        token_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
          description: |
            Design.md 6.5 の既定スコープ（権限キー8件）。**要求では選べない。**
            `ticket.close` と `doc.edit` は含まれない。
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, expired]

    CreateAgentRequest:
      description: ApiDesign.md 4.5.2。
      type: object
      required: [display_name, project_key, client_kind]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 60
          description: '`actor.display_name` の CHECK（1〜60）に揃える。'
        project_key:
          type: string
          description: |
            **自分がメンバーであるプロジェクトに限る。** それ以外は 422
            （`details[].code` は `not_found`）。
        client_kind:
          type: string
          description: |
            `agent_client_kind` の `key`（DbDesign.md 8.2.1.1）。
            **値域を固定しない**——正本は `GET /api/v1/agent-client-kinds`（4.5.7）で、
            今後も増える。0019 までは CHECK の3値だった。
        model_name:
          type: string
          maxLength: 100
        model_version:
          type: string
          maxLength: 100
        token_env_suffix:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,40}$'
          description: |
            トークンを載せる環境変数の接尾（手順28a）。省略・空は「未設定」で、
            `token_env_name` が id へ倒れる。**同じ所有者の中で一意**
            （重複は 409 `already_exists`）。

    UpdateAgentRequest:
      description: |
        ApiDesign.md 4.5.4。**送られた項目だけを更新する。**
        `project_key` は変えられない（そのエージェントが行った仕事は
        プロジェクトに属するため）。**`client_kind` は 0020 から変えられる**
        ——値域が今後も増えるので、`other` で登録した人が、PB がその種別に
        対応した日に移れる必要がある。
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        client_kind:
          type: string
          description: |
            `agent_client_kind` の `key`（4.5.7 が正本）。変更すると
            （所有者・プロジェクト・クライアント種別・表示名）の4つ組が
            ぶつかりうるので、**重複すれば 409 `already_exists`** になる。
        model_name:
          type: string
          maxLength: 100
        model_version:
          type: string
          maxLength: 100
        token_env_suffix:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,40}$'
          description: |
            **変えられる**（手順28a）。端末を替えたときに直せる必要があるのは
            `display_name` と同じ理由である。**変えたら接続設定を取り直す**
            ——設定ファイルに古い変数名が残っていると繋がらない。
        is_active:
          type: boolean
          description: |
            `false` で無効化する。**そのエージェントのトークンも失効する。**

    CreateAgentTokenRequest:
      description: ApiDesign.md 4.5.3。
      type: object
      required: [expires_in_days]
      properties:
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            **必須。無期限は許さない**（Design.md 6.5「有効期限必須」）。
            値域は `/me/tokens`（4.4.2）と同じ。
        scopes:
          type: array
          items:
            type: string
          minItems: 1
          description: |
            省略可（手順26a で足した）。**省略すると Design.md 6.5 の既定8件**
            （`agent.run` `comment.create` `doc.view` `project.view`
            `ticket.assign` `ticket.create` `ticket.transition` `ticket.view`）。

            渡すときは**許可リストの中だけ**——既定8件に `doc.edit` を加えた
            9件である。それ以外のキーは 422。`ticket.close` は許可リストにも
            入れない（Design.md 6.5 の禁止。ワークフローの
            `is_agent_reachable=false` でも担保される）。

            **`doc.edit` を足せるのは `pb_put_doc` のためである**（Design.md 8.2）。
            載せるかは「そのエージェントが誰に付いているか」で決まる——
            PM のエージェントは持ち、実装だけを行うエージェントは持たない。

            **空配列 `[]` は 422 である。** `/me/tokens`（4.4.2）は `[]` を
            「絞り込みなし」と定めており、同じ意味に取ると**既定より広い
            トークンが黙って出る**。語彙が同じで意味が逆になる欄は作らない。

            **所有者の権限との積になる**ので、許可リストの中でも所有者が
            持たない権限は付かない（`doc.edit` を持つのは `project_admin` だけ）。

    AccessTokenList:
      description: |
        ApiDesign.md 4.4.1。ページネーションも ETag も持たない（1人5本が上限で、
        絞り込みも差分取得も意味を持たないため。7.1 / 7.2 と同じ扱い）。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessToken'

    AccessToken:
      description: |
        `token_type='api'` の access_token 1行（ApiDesign.md 4.4.1）。
        **平文は含まない。**
      type: object
      required: [id, name, token_prefix, scopes, issued_at, status]
      properties:
        id:
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        name:
          description: 発行時に本人が付けた名前。どの端末・どの用途かの唯一の手がかり。
          type: string
          examples: ['CLI (MacBook)']
        token_prefix:
          description: 平文の先頭8文字（DbDesign.md 6.2）。行を見分けるためのもので、検索キーではない。
          type: string
          examples: ['pb_api_9']
        scopes:
          description: |
            権限カタログのキー（Design.md 6.4.2）。**空配列は「絞り込みなし」**であって
            「権限0件」ではない。
          type: array
          items:
            type: string
          examples: [[]]
        issued_at:
          type: string
          format: date-time
        last_used_at:
          description: 一度も使われていなければ null。更新は1分粒度（Design.md 6.2.2）。
          type: string
          format: date-time
          nullable: true
        expires_at:
          description: |
            Phase 1 は必ず入る（無期限を許さない。ApiDesign.md 4.4.2）。列としては
            NULL を許すため nullable にしてある。
          type: string
          format: date-time
          nullable: true
        status:
          description: '`active`（有効）／ `expired`（`expires_at` を過ぎた）。'
          type: string
          enum: [active, expired]
      additionalProperties: false

    IssuedAccessToken:
      description: |
        発行直後の応答（ApiDesign.md 4.4.2）。**`token` を持つ唯一の形**で、
        AccessToken に平文を1項目足したものである。
      type: object
      required: [id, name, token, token_prefix, scopes, issued_at, status]
      properties:
        id:
          type: string
        name:
          type: string
          examples: ['CLI (MacBook)']
        token:
          description: |
            **平文。この応答でしか得られない。** 画面は1回だけ全文を出す
            （GuiDesign.md 5.8.1）。
          type: string
          examples: ['pb_api_9f3c1d2e...']
        token_prefix:
          type: string
          examples: ['pb_api_9']
        scopes:
          type: array
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, expired]
      additionalProperties: false

    CreateTokenRequest:
      description: ApiDesign.md 4.4.2。
      type: object
      required: [name, expires_in_days]
      properties:
        name:
          description: |
            1〜100文字（`project.name` と同じ上限。`access_token.name` に DB の
            CHECK は無く、アプリ側が持つ）。前後の空白は取り除かれる。
          type: string
          minLength: 1
          maxLength: 100
          examples: ['CLI (MacBook)']
        expires_in_days:
          description: |
            1〜365。**無期限は許さない**——失効操作でしか消えないトークンが残り、
            置き忘れを検出できなくなるため（Design.md 6.5 がエージェントトークンに
            課す「有効期限必須」と揃える）。
          type: integer
          minimum: 1
          maximum: 365
          examples: [90]
        scopes:
          description: |
            権限カタログのキー（Design.md 6.4.2 の30件）。カタログに無い値は 422。
            省略時と空配列は「絞り込みなし」。**Phase 1 の画面は常に空で送る。**
          type: array
          items:
            type: string
          examples: [[]]
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      description: ApiDesign.md 4.3。
      required: [current_password, new_password]
      properties:
        current_password:
          description: |
            現在のパスワード。不一致は 401 `invalid_credentials`。
            **失敗しても `failed_attempts` は増えない**（4.3）。
          type: string
        new_password:
          description: 12文字以上（Design.md 6.3）。複雑性要件は課さない。
          type: string
          minLength: 12

    SessionProject:
      type: object
      required: [id, key, name, role, permissions]
      properties:
        id:
          type: string
        key:
          type: string
          examples: ['my-app']
        name:
          type: string
        role:
          description: プロジェクトロールのキー（DbDesign.md 7.3）。
          type: string
          examples: ['project_admin']
        permissions:
          description: 当該プロジェクトでの実効権限。
          type: array
          items:
            type: string

    RoleList:
      type: object
      required: [items]
      description: |
        ApiDesign.md 7.1。**2.6 のページネーション項目を持たない**——件数が
        シードで固定されており、page / per_page / total のいずれも意味を持たない。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    Role:
      type: object
      required: [key, scope, display_name, description, is_builtin, sort_order, permissions]
      properties:
        key:
          description: ロールのキー（DbDesign.md 7.3）。
          type: string
          examples: ['project_admin']
        scope:
          description: |
            権限の効く範囲（Design.md 6.4.1 の三層構造）。`system` はインスタンス全体、
            `project` は個別プロジェクトに対する役割。
          type: string
          enum: [system, project]
        display_name:
          description: |
            画面に出す名前。**画面ごとに略さない**（GuiDesign.md 5.6）。
          type: string
          examples: ['プロジェクト管理者']
        description:
          description: 選択肢の下に添える説明。`role.description` は NULL 許容。
          type: string
          nullable: true
        is_builtin:
          description: |
            組み込みロールか。Phase 1 は常に `true`。カスタムロール（`false`）の
            作成は Phase 3（ApiDesign.md 7.3）。
          type: boolean
        sort_order:
          description: 並び順。表示名の五十音順ではない（GuiDesign.md 5.6）。
          type: integer
        permissions:
          description: |
            割り当てられた権限キー。`permission.sort_order` の昇順。
            **権限を1件も持たないロールでも `[]` を返し、`null` にしない。**
          type: array
          items:
            type: string

    PermissionList:
      type: object
      required: [items]
      description: ApiDesign.md 7.2。RoleList と同じくページネーション項目を持たない。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Permission:
      type: object
      required: [key, category, description, sort_order]
      properties:
        key:
          description: 権限キー（Design.md 6.4.2 の権限カタログ）。
          type: string
          examples: ['ticket.close']
        category:
          description: |
            権限の分類。GuiDesign.md 5.6.3 のマトリクスはこれで行を区切る。
          type: string
          examples: ['ticket']
        description:
          description: 権限の説明。マトリクスではキーの下に副見出しとして出す。
          type: string
          examples: ['チケットのクローズ']
        sort_order:
          type: integer

    UserList:
      description: 一覧の共通エンベロープ（ApiDesign.md 2.6）。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          description: 切り上げ。総件数0のときは0。
          type: integer

    UserListItem:
      description: |
        一覧の1行（ApiDesign.md 6.1）。**`kind` によって意味を持たないフィールドは
        `null` を返し、フィールド自体を省略しない。** フロントの分岐を単純にするため。
      type: object
      required:
        [id, kind, display_name, email, system_role, agent, is_active,
         last_login_at, project_count, created_at]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          type: string
          enum: [user, agent]
        display_name:
          type: string
        email:
          description: エージェントは `null`。
          type: string
          nullable: true
        system_role:
          description: エージェントは `null`。
          type: string
          enum: [operator, administrator]
          nullable: true
        agent:
          description: |
            **Phase 1 では常に `null`。** 中身（`client_kind` / `model_name` /
            `project_key` / `trust_level`）は DbDesign.md 8.1 の `agent` テーブルの列で、
            そのテーブルは Phase 2 で作られる。
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentInfo'
        is_active:
          type: boolean
        last_login_at:
          description: 一度もログインしていなければ `null`。
          type: string
          format: date-time
          nullable: true
        project_count:
          description: |
            `project_member` の行数。**アーカイブ済みプロジェクトも数える**
            （詳細画面の memberships と食い違わせないため）。
          type: integer
        created_at:
          type: string
          format: date-time

    AgentInfo:
      description: |
        エージェントの付帯情報（ApiDesign.md 6.1）。**Phase 1 では返らない**
        （対応する `agent` テーブルが Phase 2 で作られるため）。
      type: object
      required: [client_kind, model_name, project_key, trust_level]
      properties:
        client_kind:
          type: string
        model_name:
          type: string
        project_key:
          type: string
        trust_level:
          type: integer

    CreateUserRequest:
      description: ユーザーの作成（ApiDesign.md 6.2）。
      type: object
      required: [display_name, email]
      properties:
        display_name:
          description: 1〜60文字（`actor.display_name` の CHECK 制約と同じ）。前後の空白は落とす。
          type: string
          minLength: 1
          maxLength: 60
        email:
          description: |
            254文字以内（RFC 5321 4.5.3.1.3）。表示名付き（`山田 <a@example.com>`）は受け付けない。
            既に使われていれば `409 already_exists`。
          type: string
          format: email
          maxLength: 254
        system_role:
          description: 省略時は `operator`。
          type: string
          enum: [operator, administrator]
          default: operator
        password_mode:
          description: 省略時は `generate`（GuiDesign.md 5.6.1 の初期選択）。
          type: string
          enum: [generate, manual]
          default: generate
        password:
          description: |
            `password_mode=manual` のときのみ必須。12文字以上（Design.md 6.3）。
            `generate` のときに送られても無視する（モード切替でフォームに残った値を弾かない）。
          type: string
          minLength: 12
          nullable: true
        must_change_password:
          description: 省略時は `true`（GuiDesign.md 5.6.1 のチェックボックスが既定でオン）。
          type: boolean
          default: true

    CreatedUser:
      description: |
        作成された利用者（ApiDesign.md 6.2 の 201）。一覧の要素（`UserListItem`）とは別で、
        作成直後に確定している値だけを返す。
      type: object
      required: [id, kind, display_name, email, system_role, is_active, generated_password]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          type: string
          enum: [user]
        display_name:
          type: string
        email:
          type: string
        system_role:
          type: string
          enum: [operator, administrator]
        is_active:
          type: boolean
        generated_password:
          description: |
            **この応答でのみ返る。** 再表示できず、監査ログにも残さない。
            形式は `<形容詞>-<名詞>-<4桁数字>`（例 `quiet-harbor-4172`）で、
            読み上げ・転記しやすい語句連結方式（ApiDesign.md 6.2）。
            `password_mode=manual` のときは `null`（呼び出し側が既に平文を持っているため）。
          type: string
          nullable: true

    UserDetail:
      description: |
        1ユーザーの詳細（ApiDesign.md 6.3）。**5.6.2 の詳細画面が必要とする情報を
        1回で返す。** 一覧の要素（`UserListItem`）とは別で、`project_count` を持たず
        代わりに `version` と3つの配列を持つ。
      type: object
      required:
        [id, kind, display_name, email, system_role, is_active, last_login_at,
         created_at, version, identities, project_memberships, sessions]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          description: '**Phase 1 は `user` のみ。** エージェントは 404 になる。'
          type: string
          enum: [user]
        display_name:
          type: string
        email:
          type: string
        system_role:
          type: string
          enum: [operator, administrator]
        is_active:
          type: boolean
        last_login_at:
          description: 一度もログインしていなければ `null`。
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        version:
          description: |
            楽観ロック用（`app_user.version`。ApiDesign.md 2.8）。`PATCH` の
            `If-Match` にこの値を入れる。**`display_name` や `is_active` を
            変えた場合も +1 される。**
          type: integer
        identities:
          description: |
            認証手段（`DbDesign.md` 6.2 の `user_identity`）。**この配列が Phase 3 の
            IdP 連携をそのまま受け入れる**——OIDC を追加しても要素が1つ増えるだけで、
            応答構造もUIも変わらない。
          type: array
          items:
            $ref: '#/components/schemas/UserIdentity'
        project_memberships:
          description: |
            プロジェクトごとの権限。**アーカイブ済みプロジェクトも含む**
            （6.1 の `project_count` と件数を食い違わせないため）。
          type: array
          items:
            $ref: '#/components/schemas/UserMembership'
        sessions:
          description: |
            有効なセッション（`access_token` の `token_type='session'` のうち、
            失効しておらず期限内のもの）。
          type: array
          items:
            $ref: '#/components/schemas/UserSession'

    UserIdentity:
      description: 認証手段1件（ApiDesign.md 6.3 の `identities[]`）。
      type: object
      required:
        [id, provider_key, provider_type, subject, linked_at, last_used_at,
         password_updated_at]
      properties:
        id:
          type: string
        provider_key:
          description: 'Phase 1 は `local` のみ（DbDesign.md 7.1 のシード）。'
          type: string
        provider_type:
          type: string
          enum: [local, oidc, saml]
        subject:
          description: |
            `local` では `app_user.email` と同じ文字列。**メールを変更すると
            この値も追随する**（そうしないとログインできなくなる）。
          type: string
        linked_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        password_updated_at:
          description: |
            `local_credential` の列。ローカル以外のプロバイダでは `null`。
            画面（5.6.2 の「認証手段」ブロック）が「最終更新」として出す。
          type: string
          format: date-time
          nullable: true

    UserMembership:
      description: |
        プロジェクトメンバーシップ1件（ApiDesign.md 6.3 の `project_memberships[]`）。
        6.8 の `PUT` もこの形を返す。
      type: object
      required: [project_id, project_key, project_name, role, joined_at]
      properties:
        project_id:
          type: string
        project_key:
          type: string
        project_name:
          type: string
        role:
          description: |
            プロジェクトロールのキー（`project_member.role_key`。
            `project_admin` / `project_member` / `project_viewer`。DbDesign.md 7.3）。
          type: string
        joined_at:
          description: '**ロールを変えても動かない。**'
          type: string
          format: date-time

    UserSession:
      description: |
        有効なセッション1件（ApiDesign.md 6.3 の `sessions[]`）。
        **平文のトークンも `token_hash` も載せない。**
      type: object
      required: [id, client_info, issued_at, last_used_at, expires_at]
      properties:
        id:
          type: string
        client_info:
          description: 発行時の User-Agent（`access_token.client_info`）。
          type: string
          nullable: true
        issued_at:
          type: string
          format: date-time
        last_used_at:
          description: 一度も使われていなければ `null`。**1分粒度で間引いて更新される**（Design.md 6.2.2）。
          type: string
          format: date-time
          nullable: true
        expires_at:
          description: 無期限なら `null`（Phase 1 のセッションは必ず入る）。
          type: string
          format: date-time
          nullable: true

    UpdateUserRequest:
      description: |
        ユーザーの更新（ApiDesign.md 6.4）。**送られたフィールドだけを更新する。**
        4項目とも `null` への更新は無い。
      type: object
      properties:
        display_name:
          description: 1〜60文字。前後の空白は落とす（作成時と同じ検証）。
          type: string
          minLength: 1
          maxLength: 60
        email:
          description: |
            254文字以内。既に使われていれば `409 already_exists`。
            **変更すると `user_identity.subject` も追随する。**
          type: string
          format: email
          maxLength: 254
        system_role:
          description: |
            変更すると権限キャッシュが無効化される（Design.md 6.4.5）。
            自分自身の変更は `409 self_modification_forbidden`、最後の有効な
            アドミニストレータの降格は `409 last_administrator`。
          type: string
          enum: [operator, administrator]
        is_active:
          description: |
            `false` にすると次のリクエストから認証を通れなくなる（`Authenticate` が
            `actor.is_active` を見る）。**セッションは失効させない**——必要なら
            6.7 を別に呼ぶ。自分自身の無効化は `409 self_modification_forbidden`。
          type: boolean

    PasswordResetRequest:
      description: |
        パスワードのリセット（ApiDesign.md 6.6）。**本文そのものを省略してもよい。**
      type: object
      properties:
        mode:
          description: '**`generate` のみ受け付ける。** 省略時も `generate`。'
          type: string
          enum: [generate]
          default: generate
        must_change_password:
          description: 省略時は `true`。
          type: boolean
          default: true

    GeneratedPassword:
      description: 生成された初期パスワード（ApiDesign.md 6.6 の 200）。
      type: object
      required: [generated_password]
      properties:
        generated_password:
          description: |
            **この応答でのみ返る。** 再表示できず、監査ログにも残さない。
            形式は `<形容詞>-<名詞>-<4桁数字>`（例 `quiet-harbor-4172`。
            ApiDesign.md 6.2.1）。
          type: string

    MembershipRequest:
      description: プロジェクトメンバーシップの付与・変更（ApiDesign.md 6.8）。
      type: object
      required: [role]
      properties:
        role:
          description: |
            プロジェクトロールのキー。妥当性はDB（`role.scope='project'`）に
            問い合わせるため、ここでは列挙しない——`enum` に書き写すと
            DbDesign.md 7.3 のシードと二重管理になる。
          type: string
          examples: ['project_admin']

    ProjectList:
      description: 一覧の共通エンベロープ（ApiDesign.md 2.6）。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          description: 切り上げ。総件数0のときは0。
          type: integer

    ProjectListItem:
      type: object
      required:
        [id, key, name, description, status, ticket_count, closed_count, progress,
         my_role, updated_at]
      properties:
        id:
          type: string
        key:
          type: string
          examples: ['my-app']
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, archived]
        ticket_count:
          type: integer
        closed_count:
          description: '`ticket.closed_at IS NOT NULL` の件数（DbDesign.md 6.6）。'
          type: integer
        progress:
          description: |
            `closed_count / ticket_count`。**サーバで計算する**（定義をフロントに散らさないため）。
            `ticket_count = 0` のときは `0`（null にしない。ApiDesign.md 5.1）。
          type: number
          examples: [0.75]
        my_role:
          description: |
            当該プロジェクトでのプロジェクトロール。
            **メンバーでないアドミニストレータでは null**（5.1 の「管理者は全件」で返る行）。
          type: [string, 'null']
          examples: ['project_admin']
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [key, name]
      properties:
        key:
          description: |
            `^[a-z0-9][a-z0-9-]{1,19}$`。予約語（`admin` `api` `mcp` `login` `logout`
            `me` `p` `new` `projects` `static` `assets` `check-key`）は使えない。
            **作成後は変更不可。**
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,19}$'
          examples: ['my-app']
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        workflow_template:
          description: 実体は DbDesign.md 7.4 のテンプレート。
          type: string
          enum: [simple, with_review, with_approval]
          default: simple

    UpdateProjectRequest:
      description: |
        `PATCH /projects/:key` の本文（ApiDesign.md 5.5）。**送られたフィールドだけを
        更新する**ため required は無い。`key` は受け付けず、送ると 422
        （`details[].code` が `immutable_field`）になる。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          description: |
            `null` を明示すると説明を消す。フィールドごと送らなければ据え置く。
            空文字は `null` と同じ扱い（`POST /projects` に合わせる）。
          type: [string, 'null']
          maxLength: 1000
        settings:
          description: |
            `project.settings`（jsonb）をそのまま置き換える。**部分更新ではない**ので、
            取得した値を保持し、変更するキーだけ差し替えて全体を送ること。

            サーバは JSON オブジェクトであることしか検証しない。Phase 1 の画面が
            使うキーは `repositories` のみで、構造の正本は DbDesign.md 6.4 にある。
          type: object
          additionalProperties: true

    ProjectDetail:
      description: |
        `POST /projects`・`GET /projects/:key`・`PATCH /projects/:key`・
        archive / unarchive が返す共通の本体（ApiDesign.md 5.4）。
        **どれか1つだけ形を変えない。**
      type: object
      required:
        [id, key, name, description, status, workflow, members, my_role,
         my_permissions, settings, version, created_at, updated_at]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, archived]
        workflow:
          description: '`project.workflow_id` が NULL のときは null。'
          oneOf:
            - $ref: '#/components/schemas/Workflow'
            - type: 'null'
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        my_role:
          description: |
            メンバーでないアドミニストレータでは null。
            **エージェントのトークンでは所有者のロールが出る**（委譲。Design.md 6.5）。
          type: [string, 'null']
        my_permissions:
          description: |
            当該プロジェクトでの実効権限
            （システムロール ∪ プロジェクトロール ∩ スコープ。Design.md 6.4.1）。
            **エージェントのトークンでは所有者のロールから導く**（同 6.5）。
          type: array
          items:
            type: string
        settings:
          description: |
            `project.settings`（jsonb）をそのまま返す。Phase 1 の画面が使うキーは
            `repositories` のみで、構造の正本は DbDesign.md 6.4 にある。
          type: object
          additionalProperties: true
        version:
          description: 楽観ロック用（ApiDesign.md 2.8）。作成直後は 1。
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Workflow:
      type: object
      required: [id, name, statuses]
      properties:
        id:
          type: string
        name:
          type: string
        statuses:
          description: '`sort_order` の昇順。'
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatus'

    WorkflowStatus:
      type: object
      required:
        [key, name, category, sort_order, requires_human_approval, is_agent_reachable]
      properties:
        key:
          type: string
          examples: ['todo']
        name:
          type: string
          examples: ['未着手']
        category:
          type: string
          enum: [todo, in_progress, review, done]
        sort_order:
          type: integer
        requires_human_approval:
          description: 人間の承認を要するステータス（Requirements.md 10.10.4）。
          type: boolean
        is_agent_reachable:
          description: エージェントが遷移させてよいか。
          type: boolean

    ProjectMember:
      type: object
      required: [actor_id, kind, display_name, email, role, joined_at]
      properties:
        actor_id:
          type: string
        kind:
          description: エージェントもプロジェクトのメンバーになれる（DbDesign.md 6.3）。
          type: string
          enum: [user, agent, system]
        display_name:
          type: string
        email:
          description: |
            `app_user.email`（DbDesign.md 6.2）。**エージェントとシステムアクターは
            `app_user` の行を持たないため null**。キーは常に返す。
          type: [string, 'null']
          examples: ['tanaka@example.com']
        role:
          type: string
          examples: ['project_admin']
        joined_at:
          type: string
          format: date-time

    CheckKeyResult:
      type: object
      required: [key, available]
      properties:
        key:
          type: string
        available:
          type: boolean
        reason:
          description: '`available: false` のときだけ現れる（ApiDesign.md 5.2）。'
          type: string
          enum: [reserved, already_exists, invalid_format]

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: OK
        version:
          description: '`PB_HEALTH_SHOW_VERSION=true` のときだけ出る（既定は出ない）。'
          type: string

    Error:
      description: |
        全エンドポイント共通のエラー形式（ApiDesign.md 2.5）。
        `message` はそのまま画面に出せる日本語。**フロントで文言を組み立てない。**
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              examples: ['メールアドレスまたはパスワードが正しくありません']
            details:
              description: フィールド単位のエラー。フォームの入力欄に紐づける。
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            retry_after_sec:
              description: |
                再試行までの秒数。`account_locked` と `rate_limited` で返す。
                同じ値が `Retry-After` ヘッダにも入る。
              type: integer
            available_sections:
              description: |
                `GET .../docs/{path}?section=` が命中しなかったときの見出し一覧
                （ApiDesign.md 10.3）。`retry_after_sec` と同じ理由で `details` では
                なく本体に置く——`details` は `{field, code, message}` の配列であり、
                入力欄に紐づかない配列を載せる場所が無い。**呼び出し側（多くは
                エージェント）が、もう一度目次を取りに行かずに次の一手を選べる。**
              type: array
              items:
                type: string
              examples: [['命名', 'ブランチ', '接頭辞']]
            request_id:
              description: |
                `audit_log.request_id`（DbDesign.md 6.8）および構造化ログ
                （Design.md 10.1）と突き合わせられる。
              type: string
              examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']

    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    Tag:
      description: |
        タグ1件（ApiDesign.md 9.11）。**色を持たない**——GuiDesign.md 8.6 が
        ラベルへの任意色を許さない（ユーザーごとに色の意味が食い違い、一覧が
        虹色になって輝度による階層が崩れるため）。
      type: object
      required: [id, name, sort_order, ticket_count]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          minLength: 1
          maxLength: 30
          example: 設計
        sort_order:
          type: integer
          format: int32
          description: バックログのグループ化セクションの順序（GuiDesign.md 5.9.4）。
          example: 10
        ticket_count:
          type: integer
          format: int64
          description: |
            このタグが付いているチケットの件数。削除確認ダイアログが
            「12件のチケットで使われています」を出すために使う（GuiDesign.md 6.3）。
          example: 12

    TagList:
      description: |
        タグの一覧（ApiDesign.md 9.11）。**`page` / `per_page` / `total` を持たない**
        ——バックログのグループ化が全件を必要とするため。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: 前後の空白は取り除かれる。同一プロジェクト内で一意。
          example: 設計
        sort_order:
          type: integer
          format: int32
          description: 省略時は末尾（現在の最大値 + 10）。
          nullable: false

    PatchTagRequest:
      description: |
        送られた項目だけを変える。何も送らない場合は現在の値をそのまま返す。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        sort_order:
          type: integer
          format: int32
          description: 並べ替え（ApiDesign.md 9.11.1）はこの項目で表現する。

    Sprint:
      description: スプリント1件（ApiDesign.md 9.12）。
      type: object
      required: [id, name, goal, start_date, end_date, status, ticket_count, closed_count]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Sprint 3
        goal:
          type: string
          nullable: true
          example: 認証を通す
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-05'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-18'
        status:
          $ref: '#/components/schemas/SprintStatus'
        ticket_count:
          type: integer
          format: int64
          description: このスプリントに割り当てられたチケットの件数。
          example: 12
        closed_count:
          type: integer
          format: int64
          description: |
            そのうち `closed_at IS NOT NULL` の件数。**`status_category = 'done'` では
            数えない**（ApiDesign.md 9.12）。画面は `5/12` の形で出す。
          example: 5

    SprintStatus:
      description: DbDesign.md 6.9 の CHECK と同じ3値。
      type: string
      enum: [planned, active, completed]

    SprintList:
      description: |
        スプリントの一覧（ApiDesign.md 9.12）。タグと同じくページャを持たない。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sprint'

    CreateSprintRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 前後の空白は取り除かれる。**一意制約は無い**（同名を作れる）。
        goal:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
          description: '`start_date` があるとき `start_date <= end_date`。'
        status:
          $ref: '#/components/schemas/SprintStatus'

    StartSprintRequest:
      description: |
        スプリントを始めるときに決めるもの（ApiDesign.md 9.12.1。pb-6）。

        **`status` を受け取らない。** 開始は必ず `active` であり、選ばせる意味がない。
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 前後の空白は取り除かれる。**一意制約は無い**（同名を作れる）。
        goal:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
          description: '`start_date` があるとき `start_date <= end_date`。'

    PatchSprintRequest:
      description: |
        送られた項目だけを変える。**`goal` / `start_date` / `end_date` は `null` を
        送ると値を消す**（キーが無い場合の「据え置き」と区別する）。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        goal:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/SprintStatus'

    SubmitTicketReportRequest:
      description: |
        完了レポートの本文（ApiDesign.md 9.15、Requirements.md 10.6.1）。
        **`task_id` を持たない**——チケットは URL が指す（9.1）。

        **ここに書かれていないキーも受け付け、`report` jsonb にそのまま保存する。**
        検証するのは列へ展開される値だけである。
      type: object
      required: [status]
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [completed, blocked, partial]
          description: 作業の結果。
        knowledge_impact:
          type: string
          enum: [none, minor, major]
          nullable: true
          description: 得た知見がプロジェクトの規約や設計にどれだけ効くか。
        cost:
          type: object
          description: この作業に掛かったもの。`tokens` と `turns` は `agent_run` の列へ展開される。
          properties:
            tokens: { type: integer, format: int64, minimum: 0 }
            turns: { type: integer, minimum: 0 }
            wall_clock_min:
              type: integer
              minimum: 0
              description: 掛かった時間（分）。**`agent_run.started_at` はこれから逆算する。**
        dod_results:
          type: array
          description: 完了条件ごとの自己検証の結果。**`id` はこのチケットの完了条件のものに限る**（他は 422 `not_found`）。
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S }
              passed: { type: boolean }
              evidence: { type: string }
              note: { type: string }
        artifacts:
          type: array
          description: 作った成果物。
          items:
            type: object
            properties:
              type: { type: string, example: pull_request }
              url: { type: string }
              path: { type: string }
        findings:
          type: array
          description: 判明したこと。`kind` は Requirements.md 6.5 の情報類型。
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [decision, discussion, artifact, caveat, reference]
              body: { type: string }
        failures:
          type: array
          description: |
            **試して駄目だったこと。** 10.6.2 が「失敗の記録を第一級の資産とする」と
            定めている——エージェントは同じ失敗を平然と繰り返すため効果が大きい。
          items:
            type: object
            properties:
              approach: { type: string }
              reason: { type: string }
        proposed_subtasks:
          type: array
          description: |
            分割の提案。**チケットにはならない**——承認キュー（`proposal`）は Phase 3 で
            あり、人が読んで要ると判断すれば `pb_create_ticket` を呼ばせれば済む。
          items:
            type: object
            properties:
              title: { type: string }
              rationale: { type: string }

    TicketReport:
      description: |
        受理した完了レポート（ApiDesign.md 9.15）。
      type: object
      required: [id, agent_run_id, seq, status, submitted_at, submitted_by, comment_id, unsatisfied_dod]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        agent_run_id:
          type: string
          description: この提出で作られた実行記録（`agent_run`）の id。
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        seq:
          type: integer
          description: チケット番号。
        status:
          type: string
          enum: [completed, blocked, partial]
        knowledge_impact:
          type: string
          enum: [none, minor, major]
          nullable: true
        submitted_at:
          type: string
          format: date-time
        submitted_by:
          $ref: '#/components/schemas/ActorRef'
        comment_id:
          type: string
          description: 同じトランザクションで作った完了レポートのコメントの id。
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        unsatisfied_dod:
          type: array
          description: |
            **レポートの `dod_results` に `passed: true` として現れなかった完了条件。**
            `is_satisfied = false` のものではない——この API は `is_satisfied` を
            動かさないので、それを返すと作業直後は必ず全件になる。
          items:
            type: object
            required: [id, type, body]
            properties:
              id: { type: string }
              type: { type: string, example: manual }
              body: { type: string }

    ActorRef:
      description: |
        アクターの参照（担当者・報告者。ApiDesign.md 9.2.2）。**`kind` を必ず返す**
        ——画面はこれを見てエージェントに 🤖 バッジを付ける（GuiDesign.md 5.4、設計原則5）。
      type: object
      required: [id, kind, display_name]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        kind:
          type: string
          enum: [user, agent, system]
        display_name:
          type: string
          example: 田中

    TicketStatus:
      description: |
        チケットのステータス（ApiDesign.md 9.2.2）。`name` は画面に出す日本語、
        `category` はバッジの見た目を決める4値（GuiDesign.md 8.7）。
      type: object
      required: [key, name, category]
      properties:
        key:
          type: string
          example: in_progress
        name:
          type: string
          example: 進行中
        category:
          type: string
          enum: [todo, in_progress, review, done]

    TicketTagRef:
      description: チケットに付いているタグ（ApiDesign.md 9.2.2）。**色を持たない**（GuiDesign.md 8.6）。
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          example: 設計

    TicketSprintRef:
      description: チケットが属するスプリント（ApiDesign.md 9.2.2）。
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          example: Sprint 3

    Ticket:
      description: |
        チケット1件（ApiDesign.md 9.2.2 の `items[]`）。

        **`body_md` を持たない。** 一覧は本文を表示せず、200件分の Markdown は応答を
        数十倍にする。本文が要るのは詳細（9.5）だけである。
        **`execution_mode` / `readiness` / `readiness_note` / `scope` / `custom_fields` も
        持たない**——列は DbDesign.md 6.6 に先行定義されているが、GuiDesign.md 5.5 が
        「Phase 1 では非表示」と決めている。画面が使わない項目を応答に載せない
        （載せると、使われないまま形が固まる）。

        **完全形 `my-app-31` はサーバが組み立てない**（9.1）。プロジェクトキーは URL に
        含まれており、フロントが `${key}-${seq}` を組める。
      type: object
      required:
        [id, seq, type, title, status, priority, assignee, reporter, working_agent,
         parent_seq, has_children, sort_key, staged_at, tags, sprint, estimate_point,
         estimate_hours, actual_hours, start_date, due_date, closed_at, version,
         created_at, updated_at]
      properties:
        id:
          type: string
          description: |
            ULID。**リクエストでチケットを指定する箇所はすべて `seq`** であり、この項目は
            `activity.entity_id` との突き合わせと Phase 2 のエージェント連携が使う（9.1）。
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        seq:
          type: integer
          format: int32
          example: 31
        type:
          type: string
          enum: [epic, story, task]
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: 認証APIの実装
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
          nullable: true
        assignee:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
          description: 担当者不在のとき null。
        reporter:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        working_agent:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
          description: |
            **誰が実際に処理しているか**（実行者。9.2.2、`DbDesign.md` 6.6。手順26b）。
            `assignee` が「誰の仕事か」を表すのに対し、こちらは実行者を表す。

            **エージェントが遷移したときに自分で立てる**（9.6）ので、人が手で埋める
            必要はない。**チケットを消化しても消えない**——「誰が処理したか」は完了後に
            こそ読みたい情報である。人が `PATCH`（9.5.2）で消すか差し替える。
            `kind` は常に `agent`。
        parent_seq:
          type: integer
          format: int32
          nullable: true
          description: |
            親チケットの `seq`。**フィルタで親が結果から落ちても保たれる**（9.2.4）。
            画面は「親が結果に含まれていない子」をトップレベルに並べる。
        has_children:
          type: boolean
          description: |
            **プロジェクト内に子がいるか**であって「結果の中に子がいるか」ではない。
        sort_key:
          type: string
          nullable: true
          description: |
            LexoRank 方式の並び順（9.4）。**クライアントはこの値を作らない。**
            並べ替えは `POST /tickets/:seq/move` で行う。
          example: '0|hzzzzz:'
        staged_at:
          type: string
          format: date-time
          nullable: true
          description: |
            「オンステージ」（9.2.2、DbDesign.md 6.6）。`null` がバックログ、
            値が入っているものがオンステージで、値は**いつ上げたか**である。
            バックログ画面はこの1項目で上下二段に振り分ける（GuiDesign.md 5.4）。
            **進捗（`status`）とは独立した軸**で、「未着手だがオンステージ」を表せる。
            **段の出し入れは `POST /tickets/:seq/move`** で行う（9.4.1）。
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TicketTagRef'
        sprint:
          allOf: [$ref: '#/components/schemas/TicketSprintRef']
          nullable: true
        estimate_point:
          type: number
          format: double
          nullable: true
        estimate_hours:
          type: number
          format: double
          nullable: true
        actual_hours:
          type: number
          format: double
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
          description: |
            **`date` 列であって時刻を持たない**（DbDesign.md 6.6）。画面は
            `new Date()` を通さずに整形すること——UTC より西の地域で前日へずれる。
          example: '2026-08-09'
        due_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-14'
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            **ステータス遷移の副作用としてのみ動く**（DbDesign.md 6.6）。直接は更新できない。
        version:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: |
            **`ticket_tag` の付け外しでも動く**（9.2.5）。動かさないと、タグだけを
            変えた場合に一覧の `ETag` が変わらない。

    TicketList:
      description: |
        チケットの一覧（ApiDesign.md 9.2.2）。**`page` / `per_page` / `total` /
        `total_pages` は規約どおり返す**（2.6）。画面がページャを出さないだけである
        （9.2.3）。`total > per_page` になったとき、画面は件数とともに
        「フィルタで絞り込んでください」を表示する。**サーバは 200 件で打ち切るだけで、
        エラーにはしない。**
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    TicketBrief:
      description: 親チケットの要約（ApiDesign.md 9.5.1 の `parent`）。
      type: object
      required: [seq, title, type, status]
      properties:
        seq:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          enum: [epic, story, task]
        status:
          $ref: '#/components/schemas/TicketStatus'

    TicketChild:
      description: 直下の子の要約（ApiDesign.md 9.5.1 の `children`）。**孫は含めない。**
      type: object
      required: [seq, title, type, status, assignee]
      properties:
        seq:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          enum: [epic, story, task]
        status:
          $ref: '#/components/schemas/TicketStatus'
        assignee:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true

    TicketDetail:
      description: |
        チケット1件の詳細（ApiDesign.md 9.5.1）。**9.2 の `items[]` に6項目を加えたもの。**
        手順16b では `POST /tickets` の応答として返る（9.3 が「応答は 9.5 の `GET` と
        同形式」と定めるため）。`GET /tickets/:seq` そのものは手順17 で足す。

        **`dod` / `links` は手順18a から実数である**（9.9 / 9.10.1）。それまでは
        空配列を返していた——作りたてのチケットではどちらも空が正しい値であり、
        実装が入ったときに項目が生えたように見せないためである。
        **`references` は手順17c から、`comment_count` は手順17a から実数である。**

        **`execution_mode` / `readiness` / `readiness_note` / `scope` は手順27 で足した。**
        9.2.2 が「Phase 2 で有効化する際に足す」と書いていたもので、**一覧には含めない**
        （`pb_get_task` と `pb_get_context` はどちらもチケット1件を指して呼ぶ）。
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [body_md, parent, children, dod, links, references, comment_count,
                     execution_mode, readiness, readiness_note, scope]
          properties:
            body_md:
              type: string
              nullable: true
              description: 本文（Markdown ソース）。
            parent:
              allOf: [$ref: '#/components/schemas/TicketBrief']
              nullable: true
            children:
              type: array
              items:
                $ref: '#/components/schemas/TicketChild'
            dod:
              type: array
              items:
                $ref: '#/components/schemas/TicketDoDItem'
              description: |
                完了条件（ApiDesign.md 9.9）。**手順18a から実数を返す。**
                `sort_order` → `created_at` の昇順。
            links:
              type: array
              items:
                $ref: '#/components/schemas/TicketLink'
              description: |
                関連チケット（ApiDesign.md 9.10.1）。**手順18a から実数を返す。**
                **双方向**（`outgoing` → `incoming`）で、`ticket` に入るのは相手である。
            references:
              type: array
              items:
                $ref: '#/components/schemas/TicketReference'
              description: |
                外部参照（ApiDesign.md 9.10.2）。**手順17c から実数を返す。**
                `kind` 昇順、同じ `kind` の中は `sort_order` → `created_at` の昇順。

                **別の `GET` に切らず詳細応答へ入れる**のは、画面を開いた時点で
                見えているものだからである（GuiDesign.md 5.5）。遷移先の一覧（9.7）の
                ように「開いたときだけ要るもの」ではない。
            comment_count:
              type: integer
              format: int64
              description: コメント件数（本文は含めない。ApiDesign.md 9.8）。
            execution_mode:
              type: string
              enum: [human_only, agent_only, agent_draft]
              description: |
                実行主体属性（Requirements.md 10.5.4、DbDesign.md 6.6）。**手順27 で追加。**
                `/pb-implement` は `human_only` のとき実装せず利用者へ返す
                （Requirements.md 10.8.6）。
            readiness:
              type: string
              enum: [red, yellow, green]
              nullable: true
              description: |
                実行可能性の信号（Requirements.md 10.5.1）。未判定は null。**手順27 で追加。**
            readiness_note:
              type: string
              nullable: true
              description: Readiness の理由。未設定は null。**手順27 で追加。**
            scope:
              type: object
              additionalProperties: true
              description: |
                スコープ境界（Requirements.md 10.5.3）。**手順27 で追加。** 未設定は `{}`。
                既知の4キー（allow / deny / repositories / external_apis）は文字列の配列で、
                **未知のキーはそのまま保存する**（ApiDesign.md 9.5.2）。
                コンテキストパックの最優先項目として渡る（Design.md 8.5.5）。

    TicketComment:
      description: |
        チケットのコメント（ApiDesign.md 9.8、DbDesign.md 6.7）。**人とエージェントが
        読み書きする一次資料である**（Requirements.md 6.5 / 10章）。
      type: object
      required: [id, body_md, kind, in_reply_to, origin, author, created_at, updated_at, deleted_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        body_md:
          type: string
          nullable: true
          description: |
            本文（Markdown ソース）。**削除済みは `null`**——行は `items` に残り、
            画面は「削除されました」と表示する（GuiDesign.md 5.5）。
            **DB には本文が残っている**（列が NOT NULL のため）。
          example: レビューをお願いします
        kind:
          type: string
          enum: [discussion, decision, artifact, caveat, reference, progress]
          description: |
            情報の類型（Requirements.md 6.5）。Phase 3 の LLM 分類・要約がこの列を
            土台にする。**`progress` は 9.6 の遷移コメントが使う。**
        in_reply_to:
          type: string
          nullable: true
          description: |
            返信先のコメントの ULID。**作成後は変えられない**（`PATCH` で送ると
            422 `immutable_field`）。
        origin:
          type: string
          enum: [human, agent]
          description: |
            **呼び出し元のアクター種別から決まる**（リクエストでは指定できない）。
            画面はエージェントのコメントをアバターの形（角丸四角）で人間と区別する
            （GuiDesign.md 5.5）。
        author:
          allOf: [$ref: '#/components/schemas/ActorRef']
          description: |
            投稿者。**`null` にならない**——`comment.author_id` は NOT NULL かつ
            `ON DELETE RESTRICT` で、投稿者不在のコメントを DB が許さない
            （DbDesign.md 6.7）。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 論理削除の時刻（DbDesign.md 4.6 / 6.7）。未削除なら `null`。

    ProjectStats:
      description: |
        プロジェクトの集計（ApiDesign.md 9.13.1）。ダッシュボード（GuiDesign.md 5.3）の
        4枚のカードと「要対応」ブロックが読む。

        **エピック（`type='epic'`）はどの項目にも数えない**（手順19b で変更）。
        エピックはグルーピング専用であり（DbDesign.md 6.10）、バックログも行として
        出さない。**4枚のカードは押すとバックログをそのカテゴリで絞って開く**ので、
        除かないとカードの数と押した先の件数が一致しない。
      type: object
      required: [by_category, total, open, overdue, stale, unassigned]
      properties:
        by_category:
          description: |
            `status_category` ごとの件数。**常に4つのキーを持つ**——そのカテゴリの
            ステータスがワークフローに無くても `0` を返す。
          type: object
          required: [todo, in_progress, review, done]
          properties:
            todo: { type: integer, example: 18 }
            in_progress: { type: integer, example: 8 }
            review: { type: integer, example: 4 }
            done: { type: integer, example: 36 }
        total:
          type: integer
          description: |
            全件。**`by_category` の合計と一致しないことがある**（`status_key` が
            ワークフローに解決できないチケットはどのカテゴリにも入らない）。
          example: 66
        open:
          type: integer
          description: '`closed_at IS NULL` の件数。'
          example: 30
        overdue:
          type: integer
          description: '`due_date < CURRENT_DATE` かつ `closed_at IS NULL`。'
          example: 2
        stale:
          type: object
          description: |
            放置されているチケット。**閾値はサーバが持ち、応答に含めて返す**
            ——画面に「14日以上」と出すためで、文言をフロントで組み立てない。
          required: [count, threshold_days]
          properties:
            count:
              type: integer
              example: 3
            threshold_days:
              type: integer
              description: '**Phase 1 では 14 で固定**（プロジェクトごとの設定にしない）。'
              example: 14
        unassigned:
          type: integer
          description: '`assignee_id IS NULL` かつ `closed_at IS NULL` の件数。'
          example: 5

    Activity:
      description: |
        業務履歴の1件（ApiDesign.md 9.13.2、DbDesign.md 6.8 の `activity`）。
      type: object
      required:
        [id, entity_type, entity_id, entity_seq, entity_title, actor,
         action, field, old_value, new_value, occurred_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        entity_type:
          type: string
          description: '**Phase 1 は `ticket` だけ**（9.1.1）。'
          enum: [ticket]
        entity_id:
          type: string
          description: |
            チケットの ULID。**削除されても行に残る**ので、`entity_seq` /
            `entity_title` が `null` でもここは値を持つ。
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        entity_seq:
          type: integer
          nullable: true
          description: |
            **非正規化して返す**（9.13.2）。画面は「`my-app-31` を『進行中』に変更」と
            表示するため、行ごとにチケットを引くと N+1 になる。**削除されたチケットを
            指す行では `null`**（9.5.3 が物理削除であるため）。
          example: 31
        entity_title:
          type: string
          nullable: true
          description: '同上。削除されたチケットを指す行では `null`。'
          example: 認証APIの実装
        actor:
          allOf:
            - $ref: '#/components/schemas/ActorRef'
          nullable: true
          description: |
            **`null` になりうる**——`activity.actor_id` は `ON DELETE SET NULL` で
            あり（DbDesign.md 6.8）、ユーザーを消した後も履歴の行は残る。
        action:
          type: string
          enum: [create, update, delete, transition]
        field:
          type: string
          nullable: true
          description: |
            変更した項目。**`create` / `delete` では `null`。** Phase 1 の値域は
            `status_key`（遷移）／`type` `title` `body_md` `priority` `assignee_id`
            `parent_id` `estimate_point` `estimate_hours` `actual_hours`
            `start_date` `due_date`（本体の更新）／`comment` `dod` `link`
            `reference.code` `reference.doc`（子資源の更新）の17種類である。
            **`sprint_id` は pb-6 で外れた**——9.5.2 で書けなくなり、動くのは
            スプリントの開始・終了のときだけになった（あの2つは記録しない）。
          example: status_key
        old_value:
          type: string
          nullable: true
          description: |
            **`text` のまま返す**（9.13.2）。ステータスの表示名への変換は画面が行う
            ——ワークフローの定義は `GET /projects/:key`（5.4）で手元にある。
            **`assignee_id` の値は ULID がそのまま入る。**
            **`body_md` の行は値を載せない**（両方 `null`）。
          example: todo
        new_value:
          type: string
          nullable: true
          example: in_progress
        occurred_at:
          type: string
          format: date-time
          example: '2026-08-11T00:12:44Z'

    ActivityList:
      description: |
        業務履歴の一覧（ApiDesign.md 9.13.2）。並びは `occurred_at DESC, id DESC` で
        固定される。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    TicketCommentList:
      description: |
        コメントの一覧（ApiDesign.md 9.8）。**チケットの子資源で唯一 2.6 の
        ページネーションを持つ**——コメントは議論の量だけ増えるためである。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketComment'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
          description: |
            **削除済みも数える**（`items` に残す以上、外すとページの件数と合わない）。
            **9.5.1 の `comment_count` とは答えが違う**——あちらは
            `deleted_at IS NULL` で数え、「読めるコメントが何件あるか」を答える。
        total_pages:
          type: integer

    CreateTicketCommentRequest:
      description: コメントの投稿（ApiDesign.md 9.8）。
      type: object
      required: [body_md]
      properties:
        body_md:
          type: string
          minLength: 1
          maxLength: 20000
          description: 本文（Markdown ソース）。空白だけは 422 `required`。
        kind:
          type: string
          enum: [discussion, decision, artifact, caveat, reference, progress]
          default: discussion
        in_reply_to:
          type: string
          nullable: true
          description: |
            **同じチケットの、削除されていないコメントの ULID であること。**
            満たさない場合は 422 `validation_failed`、`details[].code` は `not_found`。

    PatchTicketCommentRequest:
      description: |
        コメントの部分更新（ApiDesign.md 9.8）。**送られたフィールドだけを更新する。**
        **`in_reply_to` を含めると 422 `immutable_field`。**
      type: object
      properties:
        body_md:
          type: string
          minLength: 1
          maxLength: 20000
        kind:
          type: string
          enum: [discussion, decision, artifact, caveat, reference, progress]

    TicketDoDItem:
      description: |
        チケットの完了条件（ApiDesign.md 9.9、DbDesign.md 6.11）。

        **`config` / `evidence` / `origin` は返さない**（列としては残る）。いずれも
        Phase 2 の型と AI提案のためのもので、**Phase 1 の API が受け付けない値を
        応答に並べると「使える」ように見える。**
      type: object
      required: [id, type, body, is_satisfied, satisfied_at, satisfied_by, sort_order, created_at, updated_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        type:
          type: string
          enum: [manual]
          description: |
            **Phase 1 は `manual` のみ。** `task_ref` / `assertion` / `artifact` /
            `review` は Phase 2（Requirements.md 10.5.2）で、`DbDesign.md` 6.11 の
            `CHECK` には既に含まれている。
        body:
          type: string
          maxLength: 500
          example: ユニットテストが通ること
        is_satisfied:
          type: boolean
        satisfied_at:
          type: string
          format: date-time
          nullable: true
          description: '`is_satisfied` を `true` にした時刻。`false` に戻すと `null`。'
        satisfied_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
          description: |
            チェックした人。**`ON DELETE SET NULL`** なので、その人を消した後は
            `null` になる——**条件を満たした事実は消えず、誰が満たしたかだけが
            分からなくなる。**
        sort_order:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TicketDoDList:
      description: |
        完了条件の一覧（ApiDesign.md 9.9）。**ページネーションも `ETag` も持たない**
        ——1チケットあたり数件に収まり、詳細応答（9.5.1）にも同じ一覧が入る。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketDoDItem'

    CreateTicketDoDRequest:
      description: 完了条件の追加（ApiDesign.md 9.9）。
      type: object
      required: [body]
      properties:
        type:
          type: string
          enum: [manual]
          default: manual
          description: |
            **Phase 2 の型を送ると 422 `phase_2_only`**、綴り違いは `invalid`。
        body:
          type: string
          minLength: 1
          maxLength: 500
        is_satisfied:
          type: boolean
          default: false
          description: |
            **`true` で作ると、満たした人（呼び出し元）も同時に記録する**
            ——「満たしたのに満たした人がいない」行を作らない。
        sort_order:
          type: integer
          format: int32
          description: 省略時は末尾（現在の最大値 + 10）。

    PatchTicketDoDRequest:
      description: |
        完了条件の部分更新（ApiDesign.md 9.9）。**`type` を含めると 422
        `immutable_field`。**
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 500
        is_satisfied:
          type: boolean
          description: |
            **`satisfied_at` と `satisfied_by` が同時に動く。** `true` でサーバが
            両方を設定し、`false` で両方 `null` へ戻す。
        sort_order:
          type: integer
          format: int32
          description: |
            **これだけを変えた場合、`activity` に記録しない**（`move`（9.4）を
            記録しないのと同じ理由）。

    TicketLinkTicketRef:
      description: |
        リンクの相手のチケット（ApiDesign.md 9.10.1）。**9.5.1 の `parent` と同じ形**
        で、`type` を持つのは画面が行の先頭に種別アイコンを出すためである
        （GuiDesign.md 5.4 / 5.5）。
      type: object
      required: [seq, title, type, status]
      properties:
        seq:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          enum: [epic, story, task]
        status:
          $ref: '#/components/schemas/TicketStatus'

    TicketLink:
      description: |
        チケット間リンク（ApiDesign.md 9.10.1、DbDesign.md 6.6）。
      type: object
      required: [id, direction, link_type, ticket, lag_days, origin, created_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        direction:
          type: string
          enum: [outgoing, incoming]
          description: |
            **「相手がどちら側か」を表す**——`outgoing` なら `ticket` が `target`、
            `incoming` なら `ticket` が `source`。どちらの場合も `ticket` に入るのは
            **相手**であり、自分は入らない。
        link_type:
          type: string
          enum: [FS, SS, FF, SF, relates, duplicates, blocks]
          description: |
            **`FS` / `SS` / `FF` / `SF` はガント用の依存**（Phase 2）。
            **Phase 1 の画面が出すのは `relates` / `duplicates` / `blocks` の3つだけ**
            である（GuiDesign.md 5.5）が、**API は7種すべて受ける**。
        ticket:
          $ref: '#/components/schemas/TicketLinkTicketRef'
        lag_days:
          type: integer
          format: int32
          description: '`FS`〜`SF` のときのみ意味を持つ。Phase 1 に読む画面は無い。'
        origin:
          type: string
          enum: [human, ai_suggested]
          description: |
            **Phase 1 は `human` のみ作られる**（AI提案の採用・却下は Phase 2）。
            **`comment.origin` とは値域が違う**——あちらは書き手の種別
            （`human` / `agent`）で、こちらは「AIが提案し人がまだ採用していない」
            という状態である。
        created_at:
          type: string
          format: date-time

    TicketLinkList:
      description: |
        関連チケットの一覧（ApiDesign.md 9.10.1）。**双方向を1本で返す。**
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketLink'

    CreateTicketLinkRequest:
      description: |
        関連チケットの追加（ApiDesign.md 9.10.1）。**当該チケットが常に `source`
        になる。**
      type: object
      required: [target_seq, link_type]
      properties:
        target_seq:
          type: integer
          format: int32
          minimum: 1
          description: |
            相手のチケットの `seq`。**同一プロジェクト内に存在すること**（無ければ
            422 `not_found`）。**自分自身は 422 `self_link`。**
        link_type:
          type: string
          enum: [FS, SS, FF, SF, relates, duplicates, blocks]
        lag_days:
          type: integer
          format: int32
          default: 0

    TicketReference:
      description: |
        チケットから PB の外を指す参照（ApiDesign.md 9.10.2、DbDesign.md 6.12）。

        **`kind` ごとに埋まる項目が違う。** `code` は `repository` が必須で `branch` /
        `commit_sha` を伴い、`doc` は `url` が必須である。1つの表にまとめてあるので、
        使わない項目は `null` になる。

        **`created_by` は返すが Phase 1 の画面は使わない**（GuiDesign.md 5.5）。この
        セクションが表すのは「チケットの成果物としてリポジトリ・ブランチ・コミットが
        紐づいている」という関係であって、行を登録したのが誰かではない。**コミットの
        committer でもない**——PB はリポジトリへ問い合わせない。それでも返して DB にも
        残すのは、将来エージェントの書いた行を区別したくなったときに遡れるようにするため。
      type: object
      required:
        [id, kind, repository, branch, commit_sha, url, label, note, sort_order,
         created_by, created_at, updated_at]
      properties:
        id:
          type: string
          description: ULID。
        kind:
          type: string
          enum: [code, doc]
          description: '`code` はリポジトリ・コミット、`doc` は仕様書などのURL。'
        repository:
          type: string
          nullable: true
          description: |
            リポジトリを識別する文字列（`kind='code'` では必須）。**FK ではない**
            ——リポジトリの定義は `project.settings` の `repositories` に jsonb で
            置かれており、参照できる主キーが無い。**プロジェクト設定に無い名前を
            書いても受け付ける**（DbDesign.md 6.12）。
        branch:
          type: string
          nullable: true
        commit_sha:
          type: string
          nullable: true
          description: '**短縮形を許す**——`git rev-parse --short` の出力をそのまま入れられる。'
        url:
          type: string
          nullable: true
          description: |
            `kind='doc'` では必須。**形式は検証しない**（空でないことのみ）。
            画面は `https://` または `http://` で始まるものだけをリンクにする
            （GuiDesign.md 5.5）。
        label:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        sort_order:
          type: integer
          format: int32
        created_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
          description: '書き手。`actor` の削除に `ON DELETE SET NULL` で追従するため `null` になりうる。'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TicketReferenceList:
      description: |
        外部参照の一覧（ApiDesign.md 9.10.2）。**ページネーションを持たない**
        ——1チケットあたり数件に収まる。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketReference'

    CreateTicketReferenceRequest:
      description: |
        外部参照の作成（ApiDesign.md 9.10.2）。**必須は `kind` と、`kind` に応じて
        `repository`（`code`）または `url`（`doc`）。**

        文字数の上限は `repository` 200 / `branch` 255 / `commit_sha` 64 /
        `url` 1000 / `label` 200 / `note` 500。**前後の空白は取り除いてから見る**。
        空文字は `null` と同じ「値なし」として扱う。
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [code, doc]
        repository:
          type: string
          nullable: true
          maxLength: 200
        branch:
          type: string
          nullable: true
          maxLength: 255
        commit_sha:
          type: string
          nullable: true
          maxLength: 64
        url:
          type: string
          nullable: true
          maxLength: 1000
        label:
          type: string
          nullable: true
          maxLength: 200
        note:
          type: string
          nullable: true
          maxLength: 500
        sort_order:
          type: integer
          format: int32
          description: 省略すると末尾（現在の最大値 + 10）。

    PatchTicketReferenceRequest:
      description: |
        外部参照の部分更新（ApiDesign.md 9.10.2）。**送られたフィールドだけを更新する。**

        **`null` は「その項目を空にする」を意味する**（キーごと送らないのとは区別する）。
        ただし**更新後の行が必須の条件を満たすこと**——`kind='doc'` の `url` や
        `kind='code'` の `repository` を空にする要求は 422 `required` になる。

        **`kind` は含められない**（送ると 422 `immutable_field`）。`additionalProperties`
        を `false` にしていないのは、`kind` を送ったときに 2.5 の形式で理由を返すためである
        （UpdateTicketRequest と同じ扱い）。
      type: object
      properties:
        repository:
          type: string
          nullable: true
          maxLength: 200
        branch:
          type: string
          nullable: true
          maxLength: 255
        commit_sha:
          type: string
          nullable: true
          maxLength: 64
        url:
          type: string
          nullable: true
          maxLength: 1000
        label:
          type: string
          nullable: true
          maxLength: 200
        note:
          type: string
          nullable: true
          maxLength: 500
        sort_order:
          type: integer
          format: int32

    UpdateTicketRequest:
      description: |
        チケットの部分更新（ApiDesign.md 9.5.2）。**送られたフィールドだけを更新する。**

        **`null` は「その項目を空にする」を意味する**（キーごと送らないのとは区別する）。
        `nullable: true` を付けてあるのはそのためで、担当を外す・親を外す・期限を消す
        といった操作はこの形でしか表せない。

        **`status_key` / `closed_at` / `sort_key` / `staged_at` / `id` / `seq` / `version` /
        `created_at` / `updated_at` / `reporter_id` は含められない。** 送ると 422 になる
        （`details[].code` はパスの説明にある3系統）。`additionalProperties: false` を
        付けていないのは、**サーバがそれらを「黙って無視」ではなく「明示的に弾く」ため**
        で、どの項目がなぜ書けないかを `details` で返す。
      type: object
      minProperties: 1
      properties:
        type:
          type: string
          enum: [epic, story, task]
          description: |
            **オンステージのチケットを `epic` にすると 422**（`not_stageable`）。
            エピックはどちらの段にも行として出ないため（9.4.1）。
        title:
          type: string
          minLength: 1
          maxLength: 200
        body_md:
          type: string
          nullable: true
          description: 本文（Markdown ソース）。`null` または空文字で消す。
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
          nullable: true
        assignee_id:
          type: string
          nullable: true
          description: |
            担当者の `actor.id`。**変更には `ticket.assign` 権限も要る**（9.5.2）。
            プロジェクトのメンバーでなければ 422（`not_a_member`）。`null` で担当を外す。
        working_agent_id:
          type: string
          nullable: true
          description: |
            実行者（エージェント）の `actor.id`。**変更には `ticket.assign` 権限も要る**
            （9.5.2。手順26b）。`null` で外す。

            **この経路は人が使う**——エージェント自身の宣言は 9.6 の遷移が副作用として
            立てる。**画面が出すのは「消す」だけである**（`GuiDesign.md` 5.5）。

            エージェントでなければ 422（`not_found`）。そのエージェントの**所有者**が
            プロジェクトのメンバーでなければ 422（`not_a_member`）——エージェントは
            `project_member` の行を持たないため、所有者で見る（`Design.md` 6.5）。
        parent_seq:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            親チケットの `seq`（同一プロジェクト内）。`null` で親を外す。
            **自分自身または自分の子孫を指定すると 422**（`parent_cycle`）。
            **オンステージのチケットをエピック以外の子にすると 422**（`not_stageable`）。
        tag_ids:
          type: array
          nullable: true
          items:
            type: string
          description: |
            **丸ごと置き換える**（部分更新ではない）。空配列または `null` で全て外す。
        estimate_point:
          type: number
          format: double
          minimum: 0
          nullable: true
        estimate_hours:
          type: number
          format: double
          minimum: 0
          nullable: true
        actual_hours:
          type: number
          format: double
          minimum: 0
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
          description: '`YYYY-MM-DD`。**時刻つきは受け付けない**（date 列であり、通すと
            タイムゾーンによって前日へずれる）。'
        due_date:
          type: string
          format: date
          nullable: true
          description: '`YYYY-MM-DD`。開始日より前だと 422。'
        execution_mode:
          type: string
          enum: [human_only, agent_only, agent_draft]
          description: |
            実行主体属性（Requirements.md 10.5.4）。**手順27 で開いた。**
            **`null` は受け付けない**（列が NOT NULL。422 の `invalid`）。
            **`ticket.assign` は要らない**——追加の権限が要るのは「誰がやるか」を
            決める操作だけで、これは「何をしてよいか」である（9.5.2）。
        readiness:
          type: string
          enum: [red, yellow, green]
          nullable: true
          description: |
            実行可能性の信号（Requirements.md 10.5.1）。**手順27 で開いた。**
            `null` で未判定へ戻す。
        readiness_note:
          type: string
          nullable: true
          description: |
            Readiness の理由。**手順27 で開いた。** `null` で消す。
            **長さの上限を置かない**（`body_md` と同じ扱い）。
        scope:
          type: object
          additionalProperties: true
          description: |
            スコープ境界（Requirements.md 10.5.3）。**手順27 で開いた。**
            **`null` は受け付けない**（列が NOT NULL DEFAULT `'{}'`）。`{}` で空に戻す。

            既知の4キー（`allow` / `deny` / `repositories` / `external_apis`）は
            **文字列の配列**であること。それ以外の型は 422（`invalid`）。
            **未知のキーは拒まずそのまま保存する**——境界の表し方はプロジェクトごとに
            育つため、形だけを見る（9.15 の完了レポートと同じ判断）。
      example:
        title: 認証APIの実装（改）
        priority: high
        assignee_id: null

    TransitionTicketRequest:
      description: |
        ステータスの遷移（ApiDesign.md 9.6）。
      type: object
      required: [to]
      properties:
        to:
          type: string
          description: |
            遷移先の `workflow_status.key`。プロジェクトのワークフローに無ければ 422
            （`unknown_status`）、定義が無い遷移なら 409（`invalid_transition`）。
          example: in_review
        comment:
          type: string
          description: |
            添えるコメント。**同じトランザクションで `kind='progress'` のコメントが作られる**
            （DbDesign.md 6.7）。**長さの上限は置いていない**——コメントAPI（9.8）は
            手順18 であり、先にここだけ決めると2か所で食い違う。
          example: レビューをお願いします

    TicketTransitionOption:
      description: |
        遷移先の候補1件（ApiDesign.md 9.7）。
      type: object
      required: [key, name, category, allowed]
      properties:
        key:
          type: string
        name:
          type: string
          description: 画面に出す日本語（`workflow_status.name`）。
        category:
          type: string
          enum: [todo, in_progress, review, done]
        allowed:
          type: boolean
          description: |
            9.6 の検証2〜5 をすべて通るか。**`false` でも項目は返る**——ステータスを
            存在ごと隠すと「なぜ完了にできないのか」が分からなくなる。
        reason:
          type: string
          description: |
            `allowed` が `false` のときだけ在る。**そのまま画面に出せる日本語**（2.5）。

    TicketTransitionList:
      description: |
        遷移先の一覧（ApiDesign.md 9.7）。**ページングを持たない**——ワークフローの
        ステータスは高々数件で、2.6 の枠組みに載せる意味がない。
      type: object
      required: [current, items]
      properties:
        current:
          allOf: [$ref: '#/components/schemas/TicketStatus']
          nullable: true
          description: |
            現在のステータス。**ワークフローに無いキーでも返す**——ワークフローを
            差し替えた後の孤立した `status_key` がありうるため。
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketTransitionOption'
          description: ワークフローの全ステータスから現在のものを除いたもの。

    CreateTicketRequest:
      description: |
        チケットの作成（ApiDesign.md 9.3）。**`status_key` / `sort_key` / `seq` /
        `reporter_id` / `version` は含められない**——いずれもサーバが決める。
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [epic, story, task]
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 前後の空白は取り除かれる。
        body_md:
          type: string
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
        assignee_id:
          type: string
          description: |
            **当該プロジェクトの `project_member` であること。** 違えば 422
            （`details[].code = "not_a_member"`）。
        parent_seq:
          type: integer
          format: int32
          minimum: 1
          description: 同一プロジェクトに存在すること（9.1）。
        tag_ids:
          type: array
          items:
            type: string
          description: すべて当該プロジェクトのタグであること。重複は畳まれる。
        estimate_point:
          type: number
          format: double
          minimum: 0
        estimate_hours:
          type: number
          format: double
          minimum: 0
        start_date:
          type: string
          format: date
          description: '`YYYY-MM-DD`。時刻つきの文字列は受け付けない。'
        due_date:
          type: string
          format: date
          description: |
            `start_date` と両方あるとき `start_date <= due_date`
            （DbDesign.md 6.6 の `ck_ticket_dates`）。

    MoveTicketRequest:
      description: |
        並べ替えの指定（ApiDesign.md 9.4）。

        | 指定 | 意味 |
        |---|---|
        | `{"after_seq": 44}` | 44 の直後へ |
        | `{"before_seq": 44}` | 44 の直前へ |
        | `{"after_seq": 44, "before_seq": 12}` | 44 と 12 の間へ |
        | `{"position": "first"}` | 段の先頭へ |
        | `{"position": "last"}` | 段の末尾へ |
        | `{"staged": true, "position": "first"}` | **オンステージ**へ上げ、その先頭に置く |
        | `{"staged": false, "after_seq": 44}` | **バックログ**へ戻し、44 の直後に置く |
        | `{"parent_seq": null, "after_seq": 44}` | **ルートにして**、44 の直後に置く（9.4.2） |

        `position` と `after_seq` / `before_seq` の同時指定は 422。いずれも無い場合も 422。
        **動かすチケット自身を基準にはできない**（422）。

        **`position` は段の中で解釈する**（9.4.1）。`"first"` は「オンステージの先頭」で
        あって「プロジェクト全体の先頭」ではない。**`after_seq` / `before_seq` は段を
        問わない**——`sort_key` はプロジェクト内で1本だからである。
      type: object
      properties:
        after_seq:
          type: integer
          format: int32
          minimum: 1
        before_seq:
          type: integer
          format: int32
          minimum: 1
        position:
          type: string
          enum: [first, last]
        staged:
          type: boolean
          description: |
            段を変える（9.4.1）。`true` でオンステージ、`false` でバックログへ戻す。
            **省略すると段は変わらない**（並べ替えだけを行う）。
            **段に置けるのは表示上のトップレベルだけ**——親を持たないもの、または
            親がエピックのもの。それ以外に `true` を送ると 422
            （`details[].code = "not_stageable"`）。**判定は `parent_seq` を
            適用した後の状態で行う**（9.4.2）。
        parent_seq:
          type: integer
          format: int32
          nullable: true
          description: |
            **ルートにする**（9.4.2）。**`null` だけを受け取る。** 省略すると親は
            変わらない。数値を送ると 422（`details[].code = "unsupported"`）
            ——「別の親の下の、この位置へ」を表すドロップが `GuiDesign.md` 5.4 に
            無いためで、その操作を作った日にここへ足す。

            **`move` が受け取るのは「位置と同時に決まるもの」だけである。**
            位置を伴わない親の変更（行の中央へ落として子にする）は `PATCH`
            （9.5.2）のままである。

    MoveTicketResult:
      description: 並べ替えの結果（ApiDesign.md 9.4）。
      type: object
      required: [seq, sort_key, staged_at, version, rebalanced]
      properties:
        seq:
          type: integer
          format: int32
        sort_key:
          type: string
          example: '0|hzzzr:'
        staged_at:
          type: string
          format: date-time
          nullable: true
          description: '移動後の段（9.4.1）。`null` がバックログ。'
        version:
          type: integer
          format: int32
          description: '**`If-Match` を要求しないが、`version` は +1 される**（9.4）。'
        rebalanced:
          type: boolean
          description: |
            隣接する2つのキーの間に新しいキーを作れず、プロジェクト全体の `sort_key` を
            振り直したことを示す。**`true` のとき、クライアントは一覧を取り直す**
            （手元の `sort_key` がすべて古くなっている）。
            **振り直しは他のチケットの `version` を上げない**——全行に触るので、
            上げると開いている詳細画面がすべて 409 になる。

    DocTreeList:
      description: |
        文書の目次（ApiDesign.md 10.2）。**ページャを持たない**——目次は木であり、
        途中で切ると子が親から外れる。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocTreeItem'

    DocTreeItem:
      description: |
        目次の1件（ApiDesign.md 10.2）。**`body_md` を持たない。**
        `children` は各階層で `sort_order` 昇順、同値は `slug` 昇順。
      type: object
      required: [id, path, slug, title, sort_order, version, updated_at, children]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        path:
          description: '`slug` を根から連ねたもの（10.1）。'
          type: string
          example: rules/naming
        slug:
          type: string
          example: naming
        title:
          type: string
          example: 命名
        sort_order:
          type: integer
          example: 10
        version:
          description: |
            楽観ロックの現在値（2.8）。**木のドラッグ&ドロップが `If-Match` に使う**
            （GuiDesign.md 5.10）。
          type: integer
          example: 3
        updated_at:
          type: string
          format: date-time
        outline:
          description: '`?outline=1` を付けたときだけ現れる（10.2）。見出しが無くても `[]` を返す。'
          type: array
          items:
            $ref: '#/components/schemas/DocOutlineItem'
        children:
          type: array
          items:
            $ref: '#/components/schemas/DocTreeItem'

    DocOutlineItem:
      description: |
        見出し1件（ApiDesign.md 10.2）。**エージェントが「どの章を読むか」を決めるために使う。**

        `section` は見出しテキストそのもので、スラッグ化も番号付けもしない。同じ文書に
        同名の見出しが2つあるときだけ、2つ目以降に `#2` が付く。**この値はどこにも
        保存されず、常に現在の本文から作られる**ため、見出しを改名しても壊れる参照が
        生まれない（DbDesign.md 8.1.3）。
      type: object
      required: [section, level]
      properties:
        section:
          type: string
          example: 命名
        level:
          description: Markdown の見出しレベル（`##` が 2）。
          type: integer
          minimum: 1
          maximum: 6
          example: 2

    Doc:
      description: |
        文書の本文（ApiDesign.md 10.3）。

        **`created_by` / `updated_by` は `null` になりうる**（`ON DELETE SET NULL`。
        DbDesign.md 8.1.1）。コメントの `author` が `null` にならないのと異なり、
        **文書は書いた人が退職しても内容が生き続ける。**

        `kind` が `agent` のとき、画面はアバターを角丸四角にする（GuiDesign.md 8.4.2）。
        **憲章に「エージェントが最後に更新した」と出ることは正常である。**
      type: object
      required:
        [id, path, slug, parent_path, title, body_md, outline, sort_order, version,
         created_by, updated_by, created_at, updated_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        path:
          type: string
          example: rules
        slug:
          type: string
          example: rules
        parent_path:
          description: 親のパス。トップレベルなら `null`。
          type: string
          nullable: true
          example: null
        title:
          type: string
          example: 規約
        body_md:
          type: string
        outline:
          type: array
          items:
            $ref: '#/components/schemas/DocOutlineItem'
        sort_order:
          type: integer
          example: 20
        version:
          type: integer
          example: 3
        created_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        updated_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocSection:
      description: |
        `?section=` を付けたときの応答（ApiDesign.md 10.3）。**章1つを読みに来た相手に
        文書全体の情報は要らない**ので、`outline` も `created_by` も含まない。

        `body_md` は見出し行から、同じか上のレベルの次の見出しの直前までを含む。
      type: object
      required: [id, path, title, section, body_md, version, updated_at]
      properties:
        id:
          type: string
        path:
          type: string
          example: rules
        title:
          type: string
          example: 規約
        section:
          type: string
          example: 命名
        body_md:
          type: string
          example: "## 命名\n\n- テーブルは単数形…"
        version:
          type: integer
        updated_at:
          type: string
          format: date-time

    CreateDocRequest:
      description: 文書の作成（ApiDesign.md 10.4）。
      type: object
      required: [slug, title]
      properties:
        slug:
          description: |
            `^[a-z0-9][a-z0-9-]{0,63}$`（DbDesign.md 8.1.1 の CHECK と同じ式）。
            **`_` を含められない**ことが、`_revisions` を予約語にできる根拠である（10.1）。
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
          example: naming
        title:
          description: 1〜200文字。前後の空白を取り除いてから検証する。
          type: string
          minLength: 1
          maxLength: 200
          example: 命名
        parent_path:
          description: 省略・`null` でトップレベル。存在しないパスは 422（`details[].code = "not_found"`）。
          type: string
          nullable: true
          example: rules
        body_md:
          description: 既定は空文字。
          type: string
        sort_order:
          description: 省略時は同じ親の中の末尾（現在の最大値 + 10）。
          type: integer

    PatchDocRequest:
      description: |
        文書の部分更新（ApiDesign.md 10.4）。**送られた項目だけを更新する。**

        **`parent_path` に `null` を送るとトップレベルへ移す。** 送らなければ親は変わらない
        ——「送られていない」と「`null` が送られた」を区別する。
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body_md:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        parent_path:
          type: string
          nullable: true
        sort_order:
          type: integer
        change_reason:
          description: |
            200文字以内。`document_revision.change_reason` に入る。**リビジョンを作らない
            更新で送っても捨てる**（422 にはしない）。
          type: string
          maxLength: 200
          example: ブランチ命名にチケット番号を入れる

    DocRevisionList:
      description: |
        リビジョンの一覧（ApiDesign.md 10.5）。2.6 のページネーションを持ち、
        **`revision_no` の降順に固定**。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocRevisionItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    DocRevisionItem:
      description: '履歴の1件（ApiDesign.md 10.5）。**`body_md` を含めない。**'
      type: object
      required: [revision_no, title, changed_by, change_reason, created_at]
      properties:
        revision_no:
          type: integer
          example: 3
        title:
          type: string
          example: 規約
        changed_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        change_reason:
          type: string
          nullable: true
          example: ブランチ命名にチケット番号を入れる
        created_at:
          type: string
          format: date-time

    DocRevision:
      description: |
        履歴の1件（本文つき。ApiDesign.md 10.5）。**`version` も `outline` も持たない**
        ——`version` は現在の文書の楽観ロック値であって過去の版に属さず、`outline` は
        現在の本文から作るものである。
      type: object
      required: [revision_no, title, body_md, changed_by, change_reason, created_at]
      properties:
        revision_no:
          type: integer
        title:
          type: string
        body_md:
          type: string
        changed_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        change_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ErrorCode:
      description: ApiDesign.md 2.5.1 の15コード。
      type: string
      enum:
        - bad_request
        - unauthenticated
        - invalid_credentials
        - forbidden
        - csrf_failed
        - not_found
        - method_not_allowed
        - conflict
        - already_exists
        - last_administrator
        - self_modification_forbidden
        - validation_failed
        - account_locked
        - rate_limited
        - internal_error

security:
  - cookieAuth: []
    csrfToken: []
  - bearerAuth: []
