# Project Backyard — 実装済みAPIの現状
#
# 本ファイルは設計の写しではなく **実装されているAPIの記述** である（ApiDesign.md 1.3）。
# 設計の正本は ApiDesign.md にあり、まだ実装されていないエンドポイントはここに書かない。
#
# - 生成器を通さずに保守する（Design.md 3.3）。コード生成は client の TypeScript 型のみ
# - APIを追加・変更したステップの成果物に本ファイルの更新を含める
# - 実装との食い違いは server/internal/httpapi/openapi_drift_test.go が検出する
#   （chi.Walk のルート一覧と本ファイルの paths を突き合わせる）
#
# info.version は /api/v1 の契約バージョンであり、リポジトリの VERSION とは連動させない。

openapi: 3.1.0

info:
  title: Project Backyard API
  version: 1.0.0
  description: |
    人間とAIエージェントが共同で使うプロジェクト管理ツールの REST API。

    実装済みの範囲のみを記述する。設計の正本は `docs/ApiDesign.md`。

servers:
  # /healthcheck は唯一 /api/v1 の外にあるため（ApiDesign.md 2.11）、
  # ベースをルートに置き、paths 側に完全なパスを書く。
  - url: /
    description: 同一オリジン

tags:
  - name: auth
    description: 認証（ApiDesign.md 3章）
  - name: me
    description: 自分自身（ApiDesign.md 4章）
  - name: projects
    description: プロジェクト（ApiDesign.md 5章）
  - name: admin
    description: ユーザー管理（ApiDesign.md 6章）。すべてアドミニストレータ専用
  - name: tickets
    description: チケットとその周辺（ApiDesign.md 9章）
  - name: docs
    description: プロジェクト文書（憲章。ApiDesign.md 10章）
  - name: ops
    description: 監視（ApiDesign.md 2.11）

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: ログイン
      operationId: login
      description: |
        メールアドレスとパスワードで認証し、セッションを発行する（ApiDesign.md 3.1）。

        応答本文は `GET /api/v1/me` と同じ内容を含む。ログイン直後に必ず権限が必要になるため、
        往復を1回減らしている。

        認証不要。IPあたり 10回/分のレート制限が掛かる（ApiDesign.md 2.9）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            認証成功。`pb_session` と `pb_csrf` の2つの Cookie を発行する。
            **両者の Max-Age は揃える**（ApiDesign.md 3.1）。
          headers:
            Set-Cookie:
              description: |
                ```
                pb_session=pb_sess_...; HttpOnly; SameSite=Lax; Path=/; Max-Age=1209600
                pb_csrf=...; SameSite=Lax; Path=/; Max-Age=1209600
                ```
                `Secure` は設定 `PB_COOKIE_SECURE` が true のときに付く。
              schema:
                type: string
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            認証失敗。**ユーザー不在・誤パスワード・アカウント無効を区別しない**
            （`invalid_credentials`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: |
            ログイン失敗が続いたことによるロック中（`account_locked`）。
            残り秒数を `error.retry_after_sec` と `Retry-After` ヘッダに入れる。
            **閾値に達した回から**この応答になる（ApiDesign.md 3.1）。
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: ログアウト
      operationId: logout
      description: |
        現在のセッショントークンを失効させ（`revoked_at` を設定）、Cookie を削除する
        （ApiDesign.md 3.2）。Cookie 認証のため `X-PB-CSRF` が必要（2.4）。
      responses:
        '204':
          description: |
            失効済み。`pb_session` と `pb_csrf` を削除する Set-Cookie を返す。
          headers:
            Set-Cookie:
              description: 2つの Cookie を `Max-Age=-1` で削除する。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me:
    get:
      tags: [me]
      summary: 自分自身と実効権限
      operationId: getMe
      description: |
        認証中のアクターと実効権限を返す（ApiDesign.md 4.1）。

        `permissions` はシステムロール由来の実効権限、`projects[].permissions` は
        当該プロジェクトでの実効権限（システムロール ∪ プロジェクトロール ∩ スコープ。
        Design.md 6.4.1）。`projects[]` にはアーカイブ済みのプロジェクトも含む。
      responses:
        '200':
          description: 認証中のアクター。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [me]
      summary: 自分のプロフィールを更新
      operationId: patchMe
      description: |
        認証中の本人のプロフィールと見た目の設定を更新する（ApiDesign.md 4.2）。
        必要権限は「本人」であり、権限キーを要求しない。

        **応答は `GET /me` と同一構造**（Session）。画面はこの応答で表示を
        差し替える（GuiDesign.md 6.4）。

        **`system_role` は変更できない。** 送られた場合は無視せず 422 で、
        `details[].code` が `not_allowed` になる。

        **`email` は変更できる。** この列はログインIDでもあるため、サーバは
        `user_identity.subject` を同じトランザクションで追随させる。他の
        ユーザーが使っているメールなら 409 `already_exists`。

        **`If-Match` は要求しない**（2.8）。自分の設定を同時に2箇所から編集する
        状況が実質無く、課すと `GET /me` に ETag が要る。`version` は加算され、
        管理者側（6.4）の楽観ロックは壊れない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 更新後の自分自身（4.1 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            メールアドレスが他のユーザーに使われている（`already_exists`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/password:
    post:
      tags: [me]
      summary: 自分のパスワードを変更
      operationId: changeMyPassword
      description: |
        現在のパスワードを検証したうえで、新しいパスワードに差し替える
        （ApiDesign.md 4.3）。必要権限は「本人」。

        **成功すると、現在のセッションを除く全セッションが失効する**
        （Design.md 6.3）。API トークン（token_type='api'）も対象に含む。

        **`must_change` を false にする。** 要パスワード変更で入った利用者が
        変更しても誘導が消えない状態を避けるためである。

        **現在のパスワードの検証に失敗しても `failed_attempts` は増えない。**
        既にセッションを持つ本人の操作であり、ここで数えると自分で自分を
        締め出せる。連打はアクター単位のレート制限（2.9）が抑える。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 変更した。本文を持たない。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            未認証（`unauthenticated`）、または現在のパスワードが正しくない
            （`invalid_credentials`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            パスワード認証を使っていないアカウント（`conflict`）。
            IdP のみのユーザー（Phase 3）が該当する。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/tokens:
    get:
      tags: [me]
      summary: 自分のアクセストークン一覧
      operationId: listMyTokens
      description: |
        CLI・スクリプト用の Bearer トークンを一覧する（ApiDesign.md 4.4.1）。
        必要権限は「本人」。

        **`token_type='api'` の行だけを返す。** ブラウザのセッションは現れない
        （本人が自分のセッションを見る画面を持たないため。GuiDesign.md 5.8）。

        **平文（`token`）は返さない。** 返すのは `token_prefix`（先頭8文字）だけで、
        再表示する経路は存在しない。

        **失効済みは返さない。期限切れは返す**（`status` が `expired`）——更新が要る
        ことに本人が気づく必要があり、上限5本を占めているためである。

        ページネーションも ETag も持たない（1人5本が上限）。
      responses:
        '200':
          description: 失効していないアクセストークン。`issued_at` の降順。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [me]
      summary: アクセストークンを発行
      operationId: createMyToken
      description: |
        自分のアクセストークンを発行する（ApiDesign.md 4.4.2）。必要権限は「本人」。

        **`token`（平文）はこの応答でのみ返る。** DB には SHA-256 のハッシュしか
        残らず、再表示する API は無い（DbDesign.md 6.2）。

        **`scopes` の語彙は権限カタログのキー**（`ticket.view` 等30件。Design.md
        6.4.2）。カタログに無い値は 422。空配列は「絞り込みなし」＝本人の実効権限
        そのままで、Phase 1 の画面は常にこれで発行する。

        **失効していないトークンが既に5本あると 409。** 期限切れも数える
        （`GET /me/tokens` が返す行と一致させるため）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: 発行したトークン。**`token` を返す唯一の応答**。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAccessToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '409':
          description: |
            失効していないトークンが既に5本ある（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenID'
    delete:
      tags: [me]
      summary: アクセストークンを失効
      operationId: deleteMyToken
      description: |
        自分のアクセストークンを失効させる（ApiDesign.md 4.4.3）。必要権限は「本人」。

        **行は消さず `revoked_at` を立てる。** 監査ログの `token_id` から辿れる先を
        残すためである。

        **冪等。** 既に失効済みでも 204 を返し、`revoked_at` を上書きしない。

        **他人のトークン・存在しない `id`・`token_type` が `api` でないものは 404**
        （403 にしない。存在を漏らさないため。Design.md 6.4.5）。現在のセッションは
        `token_type='session'` なので、この経路では切れない。
      responses:
        '204':
          description: 失効させた（既に失効済みでも同じ）。本文を持たない。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分の `api` トークンとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/agent-client-kinds:
    get:
      tags: [agents]
      summary: クライアント種別のカタログ
      operationId: listAgentClientKinds
      description: |
        エージェントのクライアント種別（ApiDesign.md 4.5.7、正本は
        DbDesign.md 8.2.1.1 の `agent_client_kind`）。

        **必要権限は不要**（認証済みであればよい）。消費者は GuiDesign.md 5.8.2 の
        画面で、そこの必要権限は「本人」である。カタログ自体は秘密ではない。

        **画面に対応表を持たせないために在る**——`GET /roles` が display_name を
        返すようになった時点で `lib/roles.ts` を廃止したのと同じ形。値域は今後も
        増えるので、写しを置くと必ず腐る。

        `items[]` は `sort_order` の昇順。**ページネーションも ETag も持たない。**
      responses:
        '200':
          description: クライアント種別のカタログ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentClientKindList'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me/agents:
    get:
      tags: [me]
      summary: 自分のエージェント一覧
      operationId: listMyAgents
      description: |
        自分の端末で動くクライアントを一覧する（ApiDesign.md 4.5.1）。
        必要権限は「本人」。

        **1件が表すのは「ある参加者の手元で動くクライアント1つ」である。** 人ではない。
        キーは（所有者・クライアント種別・プロジェクト）の3つ組で、同じ人が
        Claude Code と VS Code を使えば2件になる（Requirements.md 10.10.3）。

        **`token` は有効な1本だけを載せる。** 失効済みは返さず、期限切れは返す
        （`status` が `expired`）。有効なトークンが無ければ `null`。

        ページネーションも ETag も持たない（4.4.1 と同じ）。
      responses:
        '200':
          description: 自分のエージェント。`created_at` の降順。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAgentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [me]
      summary: エージェントを登録
      operationId: createMyAgent
      description: |
        自分のエージェントを登録する（ApiDesign.md 4.5.2）。必要権限は「本人」。

        **トークンは同時に発行しない**（応答の `token` は常に `null`）。登録と発行を
        分けるのは、再発行のときに同じ経路（`POST /me/agents/{id}/tokens`）を通す
        ためである。

        **`project_key` は自分がメンバーであるプロジェクトに限る。** それ以外は 422
        （`details[].code` は `not_found`）。エージェントの権限は所有者から導かれる
        ので、自分が入っていないプロジェクトのエージェントを作っても権限0件になる。

        **`trust_level` と `capabilities` は受け取らない**（Design.md 6.5）。
        昇格の材料が Phase 3 のため、既定値で作る。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: 登録したエージェント。`token` は `null`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAgent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '409':
          description: |
            同じ（プロジェクト・クライアント種別・表示名）の組が既にある
            （`already_exists`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    patch:
      tags: [me]
      summary: エージェントを更新・無効化
      operationId: updateMyAgent
      description: |
        自分のエージェントを更新する（ApiDesign.md 4.5.4）。必要権限は「本人」。
        送られた項目だけを更新する。

        **`project_key` と `client_kind` は変えられない**（本要求に含まれない）。
        その2つが「どのクライアントがどのプロジェクトにつないでいるか」という
        1件の同一性そのものであり、付け替えると過去の操作の文脈が後から変わる。

        **`is_active: false` が無効化である。** 行は消さない（`comment.author_id`
        などが参照するため）。**無効化すると、そのエージェントのトークンも失効する。**

        **他人のエージェント・存在しない `id` は 404**（403 にしない。Design.md 6.4.5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: 更新後のエージェント。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAgent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [me]
      summary: エージェントを削除
      operationId: deleteMyAgent
      description: |
        自分のエージェントを削除する（ApiDesign.md 4.5.4）。必要権限は「本人」。

        **物理削除である。** エージェントの `actor` 行を消すと、`agent` と
        `access_token` が `ON DELETE CASCADE` で追従し、**そのエージェントの
        資格情報は1本残らず消える。**

        **削除前に、そのエージェントが書いたコメントを付け替える**——
        付け替え先は `kind='agent'` の「削除されたエージェント」で、
        **アバターは角丸四角のまま残る**（GuiDesign.md 8.4.2）。
        `comment.author_id` は `NOT NULL` かつ `ON DELETE RESTRICT` なので、
        付け替えないと削除そのものが失敗する。

        **無効化（`is_active: false`）とは別の操作である。**
        「いま止めたいが記録は残したい」が無効化、「配った資格情報ごと
        消したい」が削除である。

        **他人のエージェント・存在しない `id` は 404**（403 にしない。Design.md 6.4.5）。

        **監査は `agent.delete`**（4.5.6）。`detail` に削除時点の表示名・
        クライアント種別・プロジェクトキーと、付け替えたコメントの件数が入る。
      responses:
        '204':
          description: 削除した。本文なし。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}/tokens:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    post:
      tags: [me]
      summary: エージェント用トークンを発行
      operationId: createMyAgentToken
      description: |
        エージェント用の Bearer トークンを発行する（ApiDesign.md 4.5.3）。
        必要権限は「本人」。

        **`token`（平文）はこの応答でのみ返る。** DB には SHA-256 のハッシュしか
        残らず、再表示する API は無い（DbDesign.md 6.2）。

        **有効なトークンは1件につき1本。** 再発行すると、それまでの有効なトークンを
        失効させたうえで発行する（応答は 201。失効は暗黙に行い、監査には残る）。

        **`scopes` は選ばせない。** Design.md 6.5 の既定を常に入れる——
        `ticket.close` と `doc.edit` を既定から外してあるのが要点で、選ばせると
        その禁止が画面の作りに依存してしまう。**トークンは所有者の権限との積に
        なる**ため、既定をそのまま載せても所有者が持たない権限は付かない。

        発行するトークンは `project_id` を持ち、他プロジェクトへのアクセスは 404 になる
        （Design.md 6.4.5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTokenRequest'
      responses:
        '201':
          description: 発行したトークン。**`token` を返す唯一の応答**。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAgentToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            無効化されたエージェントには発行できない（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}/tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/AgentID'
      - $ref: '#/components/parameters/AgentTokenID'
    delete:
      tags: [me]
      summary: エージェント用トークンを失効
      operationId: deleteMyAgentToken
      description: |
        エージェント用トークンを失効させる（ApiDesign.md 4.5.5）。必要権限は「本人」。

        **行は消さず `revoked_at` を立てる**（4.4.3 と同じ）。

        **冪等。** 既に失効済みでも 204 を返し、`revoked_at` を上書きしない。

        **他人のエージェント・存在しない `id` / `token_id`・`token_type` が `agent`
        でないものは 404**（Design.md 6.4.5）。
      responses:
        '204':
          description: 失効させた（既に失効済みでも同じ）。本文を持たない。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分のエージェントのトークンとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}/setup:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    get:
      tags: [me]
      summary: 自分の接続設定（系統B）
      operationId: getMyAgentSetup
      description: |
        そのエージェントが PB に繋がるために、本人が自分の端末へ置くものを返す
        （ApiDesign.md 4.5.8、Requirements.md 10.9.1 の系統B）。必要権限は「本人」。

        **`/projects/{key}/agent-setup`（系統A）と対になる。** あちらはリポジトリに
        コミットするファイル（1リポジトリに1回、管理者が）、こちらは**各人の手元にしか
        残らないもの**（人ごとに、何度でも）。

        **答えるのは「MCP が使える状態になるまで」だけである。** 作業の材料をどこから
        どう用意するかは PB が知らないので返さない——プロジェクトの文書に書かれ、
        人もエージェントもそこから読む（手順28c）。

        **平文のトークンは返さない。** `export_line` は変数名までで、値はプレースホルダ。
        **接続できたかどうかも返さない**——`GET /me/agents` の `token.last_used_at` が
        既にそれを表しており、同じ事実を2か所から出すと必ず食い違う。

        **`ETag` もページネーションも持たない。**
      responses:
        '200':
          description: |
            接続設定一式。**`files` は空配列になりうる**
            （`has_setup_template` が偽の種別。4.5.8.3）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConnect'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}/setup.zip:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    get:
      tags: [me]
      summary: 自分の接続設定（zip ダウンロード）
      operationId: getMyAgentSetupZip
      description: |
        `/setup` と同じ接続設定を zip で返す（ApiDesign.md 4.5.8.5）。

        - **`mode` は常に `merge`** なので、**zip には別名で入る**
          （`.mcp.json` → `.mcp.pb-block.json`）。**展開した瞬間に既存の接続設定を
          消す zip を配らない**——`.mcp.json` は履歴管理の対象外で、消すと git から戻せない
        - **`PB-README.md` が1枚入る。** 中身は**種別ごとに違う**（置き場も、改名の要否も、
          `.gitignore` の扱いも種別で変わる）。**JSON の `files[]` には含まれない**
          ——画面が同じ内容を節として描いており、`files[]` に入れると
          「これも置くファイルだ」と読まれる
        - **`README.md` という名前にしない。** プロジェクト直下で展開されたときに
          本物の `README.md` を消す
        - **ファイル名に種別を入れる**（`pb-connect-<key>-<client_kind>.zip`）。1人が同じ
          プロジェクトに2件持つことがあり、同じ名前の zip が並ぶと見分けられない
        - **別パスにしてあるのは、ブラウザの `<a download href>` で素直に落とすため**
      responses:
        '200':
          description: zip アーカイブ。
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="pb-connect-pb-claude_code.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects:
    get:
      tags: [projects]
      summary: プロジェクト一覧
      operationId: listProjects
      description: |
        自分がメンバーであるプロジェクトを返す。アドミニストレータは全件（ApiDesign.md 5.1）。

        **必要権限は `project.view`。** ただしこの権限は「どのプロジェクトが見えるか」を
        決めない（オペレータもシステムロールとして持つ）。可視範囲はメンバーシップで絞る。

        `ticket_count` / `closed_count` / `progress` を含めるのは、プロジェクトごとに
        件数を問い合わせる N+1 を避けるためである（5.1）。
      parameters:
        - name: status
          in: query
          description: 既定は `active`。
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, key, updated_at, ticket_count, progress]
            default: updated_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: 1ページ分のプロジェクト。
          headers:
            ETag:
              description: |
                弱い検証子 `W/"proj-<件数>-<MAX(updated_at) のナノ秒>"`（ApiDesign.md 2.7）。
                **Phase 1 では `If-None-Match` を解釈しない**（304 を返さない）。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [projects]
      summary: プロジェクトの作成
      operationId: createProject
      description: |
        プロジェクトを作成する（ApiDesign.md 5.3）。必要権限は `project.create`
        （Phase 1 = アドミニストレータのみ）。

        サーバ側は `project` 作成・`project_counter` 初期化・テンプレートからの
        ワークフロー複製・**テンプレートからの文書複製**・作成者の `project_admin` 登録・
        `audit_log` への記録を**単一トランザクション**で行う。

        文書テンプレートは `template_key = 'default'` 固定で、入力フィールドを持たない
        （`DbDesign.md` 8.1.2）。複製された文書はそれぞれ `revision_no = 1` を持ち、
        `created_by` は作成者になる。

        キー重複の検出はDBの `UNIQUE` 制約に委ねる（`check-key` の結果は信頼しない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 作成された。応答は `GET /projects/:key` と同形式（5.4）。
          headers:
            Location:
              description: '`/api/v1/projects/<key>`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            プロジェクトキーが既に使われている（`already_exists`。ApiDesign.md 5.3）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/check-key:
    get:
      tags: [projects]
      summary: プロジェクトキーの利用可否
      operationId: checkProjectKey
      description: |
        新規作成モーダルの即時検証に使う（ApiDesign.md 5.2）。

        判定の順は 形式 → 予約語 → 既存。**この結果は作成時の重複検出には使わない**
        （5.3。競合検出はDBの `UNIQUE` 制約に委ねる）。

        必要権限は作成と同じ `project.create`。
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          examples:
            available:
              value: my-app
      responses:
        '200':
          description: 判定結果。**使えない場合も 200 で返す**（エラーではない）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckKeyResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: プロジェクトの詳細
      operationId: getProject
      description: |
        1プロジェクトの本体・ワークフロー・メンバー・自分の実効権限を返す
        （ApiDesign.md 5.4）。必要権限は `project.view`。

        **メンバーでなければ 404**（403 ではない。Design.md 6.4.5）。403 で返すと
        「そのキーのプロジェクトは在る」と漏れ、キーを変えながら叩けば
        プロジェクトの一覧を復元できてしまう。アドミニストレータは全件に到達できる。

        `my_permissions` は認可ミドルウェアと同じ集合から作る
        （( システムロール ∪ プロジェクトロール ) ∩ スコープ。Design.md 6.4.1）。
      responses:
        '200':
          description: プロジェクトの詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            プロジェクトが存在しない、または到達できない（`not_found`）。
            **両者を区別しない**（Design.md 6.4.5）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [projects]
      summary: プロジェクトの更新
      operationId: updateProject
      description: |
        `name` / `description` / `settings` を更新する（ApiDesign.md 5.5）。
        必要権限は `project.edit`。

        **送られたフィールドだけを更新する**（部分更新）。`"description": null` は
        「説明を消す」であり、`description` を送らない（据え置く）とは区別する。

        **`key` は変更できない。** 送られた場合は 422 で、`details[].code` が
        `immutable_field` になる（`error.code` は `validation_failed`）。

        **`If-Match` は必須**（2.8）。省略すると 422（`details[].field` が
        `If-Match`）、現在の `version` と食い違えば 409。成功すると `version` が +1 される。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 更新後のプロジェクト（5.4 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `If-Match` が現在の `version` と一致しない（`conflict`。ApiDesign.md 2.8）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [projects]
      summary: プロジェクトのアーカイブ
      operationId: archiveProject
      description: |
        `status` を `archived` にし、`archived_at` に現在時刻を入れる
        （ApiDesign.md 5.6）。必要権限は `project.archive`。

        リクエスト本文は取らない。**`If-Match` は要求しない**（2.8）。冪等であり、
        競合しても失われる編集内容がないためである。ただし `version` は +1 する。

        **既にアーカイブ済みなら何も変えずに 200 を返す。** そのとき `version` は
        進まず、監査ログにも残さない（空振りで本当の切り替えが埋もれるため）。

        監査は `project.archive` として記録し、`detail.status` で unarchive と区別する。
      responses:
        '200':
          $ref: '#/components/responses/ProjectStatusChanged'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [projects]
      summary: プロジェクトのアーカイブ解除
      operationId: unarchiveProject
      description: |
        `status` を `active` に戻し、`archived_at` を `null` にする
        （ApiDesign.md 5.6）。archive と同じ経路を通り、渡す `status` だけが違う。

        必要権限・冪等性・監査の扱いは archive と同じ。
      responses:
        '200':
          $ref: '#/components/responses/ProjectStatusChanged'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/agent-setup:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: エージェント連携セットアップ（配置ファイルの生成）
      operationId: getAgentSetup
      description: |
        リポジトリにコミットする配置ファイルを組み立てて返す
        （ApiDesign.md 5.7.1、Requirements.md 10.9.1 の系統A）。
        **必要権限は `agent.register`**（`project.edit` ではない。GuiDesign.md 3.2）。

        **接続設定（`.mcp.json` / `.vscode/mcp.json` / `.codex/config.toml`）は
        含まない。** 10.8.1 が履歴管理の対象外と定めたので、リポジトリに置くものを
        作るこの口には置き場がない——各人が `/me/agents` から受け取る（手順28b）。

        **`base_url` はリクエストの `Host` から組み立てる**（暫定）。PB は自分の
        公開 URL を知らず、設定にあるのは `PB_BIND`（`0.0.0.0:8080`）だけで URL に
        使えない。スキームは `PB_COOKIE_SECURE` を見る——リバースプロキシで TLS を
        終端する構成では `r.TLS` が nil になるためで、同じ問題を同じ設定で解いている。

        **`ETag` もページネーションも持たない。** 件数は選んだ種別で決まる。
      parameters:
        - name: client
          in: query
          required: true
          description: |
            `agent_client_kind` の `key` のうち、**`has_setup_template` が真のもの**
            （4.5.7）。**繰り返し指定する**（`?client=claude_code&client=codex`）。
            偽の値・未知の値は 422。**重複は畳み、並びはカタログの順に揃える。**
          schema:
            type: array
            minItems: 1
            items:
              type: string
          style: form
          explode: true
          example: [claude_code, codex]
      responses:
        '200':
          description: 配置ファイル一式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSetup'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 権限不足（`forbidden`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `client` が無い、配置ファイルを持たない種別、未知の種別
            （`validation_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/agent-setup.zip:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: エージェント連携セットアップ（zip ダウンロード）
      operationId: getAgentSetupZip
      description: |
        `/agent-setup` と同じ内容を zip で返す（ApiDesign.md 5.7.2）。

        - **リポジトリ直下からの相対パスでフォルダを掘る**
        - **`mode` が `create` でないものは別名で入れる**
          （`CLAUDE.md` → `CLAUDE.pb-block.md`）。展開した瞬間に既存のファイルを
          消す zip を配らないため
        - **別パスにしてあるのは、ブラウザの `<a download href>` で素直に落とすため**
          である（`Accept` ヘッダでの切り替えにしない）
      parameters:
        - name: client
          in: query
          required: true
          description: '`/agent-setup` と同じ。'
          schema:
            type: array
            minItems: 1
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: zip アーカイブ。
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="pb-setup-pb.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 権限不足（`forbidden`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`client` の指定が不正（`validation_failed`）。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/stats:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: プロジェクトの集計
      operationId: getProjectStats
      description: |
        プロジェクトダッシュボードの4枚のカードと「要対応」ブロックのデータ源
        （ApiDesign.md 9.13.1、GuiDesign.md 5.3）。**必要権限は `project.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        **`status` ではなく `status_category` で集計する。** ワークフローが
        プロジェクトごとに違っても、4つのカードの意味が変わらないようにするため
        である。**`by_category` は常に4つのキーを持つ**——そのカテゴリのステータスが
        ワークフローに1つも無くても `0` を返す（`simple` テンプレートは `review` を
        持たない。DbDesign.md 7.4）。

        **`by_category` の合計は `total` と一致しないことがある。** `status_key` が
        ワークフローに解決できないチケットはどのカテゴリにも数えられない。合わせに
        行かないのは、「分類できないチケットがある」ことを 0 で塗り潰さないためである。

        `overdue` / `stale` / `unassigned` はいずれも `closed_at IS NULL` が掛かる。
        **「今日」は DB の `CURRENT_DATE`** で決める（9.2.1 の `due_within` と同じ）。
        `app_user.timezone` は混ぜない——混ぜると同じプロジェクトの集計が読み手ごとに
        変わる。

        **`ETag`（2.7）は返さない。** 一覧ではなくページャも持たず、ETag の材料を
        採る走査が本体の集計とほぼ同じなので、付けても DB の仕事は減らない。
      responses:
        '200':
          description: プロジェクトの集計。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStats'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: 業務履歴の一覧
      operationId: listProjectActivity
      description: |
        チケットの変更履歴（ApiDesign.md 9.13.2）。**必要権限は `project.view`**。
        消費者は2つとも「全件を時系列で読む」——ダッシュボードの「最近の動き」
        （GuiDesign.md 5.3）と、チケット詳細の「履歴」セクション（同 5.5）である。

        **`audit_log`（2.10）とは読み手が違う**（9.1.1）。あちらはインスタンス
        管理者が認証・権限・トークンを追うためのもので、ここはプロジェクトの
        メンバーがチケットの変更を読むためのものである。

        **並び順は `occurred_at DESC, id DESC` で固定**で、`sort` / `order` は
        指定できない（どちらも 422）。`occurred_at` だけでは足りないのは、
        **1回の `PATCH` が変更した項目ごとに複数行を書く**ためである（9.5.2）
        ——タイトルと期限を同時に変えると2行が同じ時刻になる。

        **`entity` は資源の指定ではなくフィルタである。** 書式違反は 422 だが、
        形が正しくてチケットが無いときは**空の一覧を 200 で返す**（404 にしない）。
        **同じ理由で、削除されたチケットの履歴には `entity` で到達できない**
        ——`seq` から ULID を引く経路が消えるためで、その行はプロジェクト全体の
        一覧にだけ現れる。

        Phase 1 は `If-None-Match` を解釈せず、ヘッダだけ出す（9.2.5 と同じ）。
      parameters:
        - name: entity
          in: query
          description: |
            `ticket:31` の形。省略時はプロジェクト全体。**Phase 1 に受け付ける
            `entity_type` はチケットだけである**（9.1.1）。
          schema: { type: string, pattern: '^ticket:[1-9][0-9]*$' }
          example: ticket:31
        - name: action
          in: query
          description: |
            **単一値のみ。** カンマ区切りの OR を受け付けない——9.2.1 のフィルタ群と
            違う扱いだが、複数選択を要する画面が Phase 1 に無い。
          schema:
            type: string
            enum: [create, update, delete, transition]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: 既定 20、上限 200（ApiDesign.md 9.13.2 / 2.6）。
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: 業務履歴の一覧。
          headers:
            ETag:
              description: |
                `W/"act-<フィルタ条件のハッシュ>-<件数>-<MAX(occurred_at) のナノ秒>"`。
                **`page` / `per_page` もハッシュに含める**——ETag は応答本文を指す
                検証子であり、2ページ目と1ページ目が同じ値になってはならない。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tags:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [tickets]
      summary: タグ一覧
      operationId: listTags
      description: |
        プロジェクトのタグを返す（ApiDesign.md 9.11）。**必要権限は `ticket.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        `items[]` は `sort_order` 昇順、同値は `name` 昇順。第2キーを置くのは、
        `sort_order` が重複したときに順序が実行ごとに揺れないようにするためである。

        **ページネーションも `ETag` も持たない。** バックログのグループ化は全タグを
        セクションの順序に使うため（GuiDesign.md 5.4.1）、ページングすると2ページ目の
        タグがグループ化に現れず、設計上そもそも使えない。

        `ticket_count` は削除確認ダイアログが出す「12件のチケットで使われています」
        （GuiDesign.md 6.3）。
      responses:
        '200':
          description: タグの一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: タグの作成
      operationId: createTag
      description: |
        タグを1件作る（ApiDesign.md 9.11）。**必要権限は `project.edit`**——タグの定義は
        「プロジェクトの分類軸を決める」行為であり、チケットへの付与（`ticket.edit`）とは
        別の権限で扱う。

        `name` は前後の空白を取り除いてから検証する。**同一プロジェクト内で一意**で、
        重複は 409 `already_exists`。**大文字と小文字は区別する**（`uq_tag_project_name` が
        `text` の一意制約であり `citext` ではない。DbDesign.md 6.10）。

        `sort_order` を省略すると末尾（現在の最大値 + 10）に置く。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: 作成されたタグ。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/tags/01K2F8QW3H7YRJ4M5N6P7Q8R9S
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/TagAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tags/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TagID'
    patch:
      tags: [tickets]
      summary: タグの更新
      operationId: patchTag
      description: |
        タグの `name` / `sort_order` を変える（ApiDesign.md 9.11）。必要権限は `project.edit`。

        **`If-Match` を要求しない。** 2.8 の楽観ロックの対象は `project` と `app_user` で、
        `tag` は `version` 列を持たない。

        **並べ替え（9.11.1）もこのエンドポイントで表現する。** クライアントはドロップの
        確定時に新しい並びへ `10, 20, 30, …` を割り当て直し、値が変わった行だけ送る。
        専用の move は設けていない——`sort_order` は単なる整数で、チケットの `sort_key`
        （LexoRank）のような生成規則を持たないためである。

        送られなかった項目は据え置く。何も送られていない場合は現在の値をそのまま返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTagRequest'
      responses:
        '200':
          description: 更新後のタグ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          $ref: '#/components/responses/TagAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: タグの削除
      operationId: deleteTag
      description: |
        タグを消す（ApiDesign.md 9.11）。必要権限は `project.edit`。

        `ticket_tag` の行は `CASCADE` で消える（DbDesign.md 6.10）。**チケットは消えず、
        タグが外れるだけである。**

        **使用中でも削除できる。** 禁止すると、要らなくなった分類を消すために全チケットから
        手で外すことになる。画面は確認ダイアログに使用中の件数を出す（GuiDesign.md 6.3）。
      responses:
        '204':
          description: 削除された（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/sprints:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [tickets]
      summary: スプリント一覧
      operationId: listSprints
      description: |
        プロジェクトのスプリントを返す（ApiDesign.md 9.12）。**必要権限は `ticket.view`**。

        `items[]` は `start_date` 降順（`null` は末尾）、同値は `created_at` 降順。
        新しいものが上に来る並びで、GuiDesign.md 5.9.5 の図と一致する。

        `ticket_count` は `ticket.sprint_id` が当該スプリントを指す行数、`closed_count` は
        そのうち `closed_at IS NOT NULL` の行数。**`status_category = 'done'` では数えない**
        ——9.13 の `open` / `overdue` が `closed_at` を基準にしており、そちらへ揃える。

        タグ（9.11）と同じくページネーションも `ETag` も持たない。
      responses:
        '200':
          description: スプリントの一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: スプリントの作成
      operationId: createSprint
      description: |
        スプリントを1件作る（ApiDesign.md 9.12）。**必要権限は `project.edit`**。

        **Phase 1 で開けるのは定義だけである。** バーンダウン・ベロシティを含む運用画面は
        Phase 2（GuiDesign.md 10章）。定義を Phase 1 に置くのは、作る手段が無いと
        チケット詳細のスプリント欄が常に空のドロップダウンになるためである。

        **`name` に一意制約は無い**（DbDesign.md 6.9）。同名のスプリントを作れる。
        `start_date` と `end_date` の両方があるとき `start_date <= end_date`
        （`ck_sprint_dates`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSprintRequest'
      responses:
        '201':
          description: 作成されたスプリント。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/sprints/01K2F8QW3H7YRJ4M5N6P7Q8R9S
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/sprints/start:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [tickets]
      summary: スプリントの開始
      operationId: startSprint
      description: |
        スプリントを新しく作り、`active` にし、**オンステージに載っているものを対象に
        入れる**（ApiDesign.md 9.12.1。pb-6）。必要権限は `project.edit`。
        3つを1つのトランザクションで行う。

        対象は **`staged_at IS NOT NULL` の行とその子孫**である。`staged_at` だけで
        決めてはならない——段を決めるのは親であり、子は `staged_at` が `null` のまま
        親と一緒にオンステージ段へ出る（GuiDesign.md 5.4）。**エピックは除く。**

        **進行中のスプリントが既にあれば 409。** `active` は同時に1本だけである
        ——オンステージは1つしかなく、「いまどの期間で消化しようとしているか」の
        答えが2つあると、開始のたびにどちらへ入れるかを選ぶことになる。

        **オンステージが空でも通す。** 期間を先に切ってから積む進め方があるため、
        開始できない理由にしない。

        **既にある `planned` のスプリントは開始の対象にならない**（常に新規作成）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSprintRequest'
      responses:
        '201':
          description: 開始したスプリント。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/sprints/01K2F8QW3H7YRJ4M5N6P7Q8R9S
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: 進行中のスプリントが既にある（`active_sprint_exists`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/sprints/{id}/finish:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/SprintID'
    post:
      tags: [tickets]
      summary: スプリントの終了
      operationId: finishSprint
      description: |
        スプリントを終える（ApiDesign.md 9.12.2。pb-6）。必要権限は `project.edit`。
        **本文を取らない。**

        `status` を `completed` にし、`end_date` が空なら今日を入れる。所属
        （`ticket_sprint`）すべてに `removed_at` を立て、**完了しているオンステージの
        根を段から降ろす**（`staged_at` を `null` に戻す）。**未完了のものは触らず、
        オンステージに残って次の開始でそちらへ入る。**

        **`ticket.sprint_id` は消さない。** 終わったあとも「最後に属したスプリント」を
        指し続ける——9.2.1 の「棚に戻ったか」の判定がこれを読む。

        降ろした行は 9.2.1 の3条件を満たすため、既定の一覧から外れて画面から消える。
        辿るには `?retired=true` を送る。

        **`status` が `active` でなければ 409**（`sprint_not_active`）。権限でも
        不在でもなく、盤面がその操作を許さないためである。
      responses:
        '200':
          description: 終了したスプリント。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SprintNotFound'
        '409':
          description: 進行中のスプリントではない（`sprint_not_active`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/sprints/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/SprintID'
    patch:
      tags: [tickets]
      summary: スプリントの更新
      operationId: patchSprint
      description: |
        スプリントの各項目を変える（ApiDesign.md 9.12）。必要権限は `project.edit`。
        タグと同じく **`If-Match` は要求しない**（`sprint` は `version` 列を持たない）。

        送られなかった項目は据え置く。**`goal` / `start_date` / `end_date` は `null` を
        送ると値を消す**（キーが無い場合の「据え置き」と区別する）。

        `ck_sprint_dates` は更新後の2列の関係を見る制約であり、片方だけを送る場合は
        送られなかった側の現在値と突き合わせて検証する。違反は 422 で返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSprintRequest'
      responses:
        '200':
          description: 更新後のスプリント。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SprintNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: スプリントの削除
      operationId: deleteSprint
      description: |
        スプリントを消す（ApiDesign.md 9.12）。必要権限は `project.edit`。

        **チケットは消えない。** `fk_ticket_sprint` の `ON DELETE SET NULL` により
        `ticket.sprint_id` が外れ、スプリント未設定に戻る（DbDesign.md 6.9）。
        画面は確認ダイアログにその旨を明記する（GuiDesign.md 6.3）。
      responses:
        '204':
          description: 削除された（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SprintNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [tickets]
      summary: チケット一覧
      operationId: listTickets
      description: |
        プロジェクトのチケットを返す（ApiDesign.md 9.2）。**必要権限は `ticket.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        バックログ画面（GuiDesign.md 5.4）の唯一のデータ源であり、Phase 2 のカンバン・
        ガントも同じエンドポイントから描く。

        **既定が他の一覧と2か所ちがう**（9.2.1）。

        - `per_page` の既定が **200**（他は 25）。この画面はページャを持たず、
          フィルタ後の全件を1回で取り切る（9.2.3）
        - `sort` の既定が **`sort_key`**（他は `updated_at`）。人が手で並べた順序（9.4）を
          既定の見え方にする

        **異なる種類の条件どうしは AND、同じ条件の複数指定は OR**
        （`?type=bug&priority=high,highest` は「バグ、かつ優先度が高以上」）。

        `items[]` は `tags[]` と `parent_seq` / `has_children` を含む。グループ化（タグ）と
        階層のインデント表示（親子）を追加のリクエストなしに描けるようにするためである。
        含めないと、バックログは1画面あたり `1 + タグ数 + 階層の深さ` 回の往復を要する。

        **`has_children` は「プロジェクト内に子がいるか」**であって「結果の中に子がいるか」
        ではない。フィルタは行単位で適用し、サーバは親を補完しない（9.2.4）ため、
        結果の中で数えると親が絞り込みで落ちた瞬間に子の有無まで消える。

        **`body_md` は含めない**（9.2.2）。一覧は本文を表示せず、200件分の Markdown は
        応答を数十倍にする。`execution_mode` / `readiness` / `scope` / `custom_fields` も
        同じ理由で含めない（GuiDesign.md 5.5 が「Phase 1 では非表示」と決めている）。

        **`q`（全文検索）は Phase 1 では受け付けない**（9.2.1）。専用画面
        `/p/:key/search`（Phase 2）と同時に開ける。

        `ETag` は「フィルタ条件を正規化した文字列のハッシュ・件数・`MAX(updated_at)`」から
        作る（9.2.5）。**`sort` / `order` / `page` / `per_page` も混ぜる**——ETag は応答本文を
        指す検証子であり、並び順やページが違えば本文も違う。
        **Phase 1 では `If-None-Match` を解釈しない**（304 を返さない）。
      parameters:
        - name: status
          in: query
          description: ワークフローのステータスキー。カンマ区切りで複数指定は OR。
          schema:
            type: string
          example: todo,in_progress
        - name: status_category
          in: query
          description: |
            `todo` / `in_progress` / `review` / `done`。カンマ区切りは OR。
            **ワークフローが違うプロジェクトを跨いでも意味が変わらない4値**であり、
            ダッシュボードの集計とカンバンの列が使う（9.2.1）。
          schema:
            type: string
          example: todo,in_progress
        - name: type
          in: query
          description: '`epic` / `story` / `task`。カンマ区切りは OR。'
          schema:
            type: string
          example: task,bug
        - name: assignee
          in: query
          description: |
            担当者の ULID。`me` で自分、`none` で未割当。カンマ区切りは OR。
          schema:
            type: string
          example: me,none
        - name: priority
          in: query
          description: '`lowest` 〜 `highest`。カンマ区切りは OR。'
          schema:
            type: string
          example: high,highest
        - name: tag
          in: query
          description: タグの ULID（9.11）。`none` で未分類。カンマ区切りは OR。
          schema:
            type: string
        - name: sprint
          in: query
          description: スプリントの ULID（9.12）。`none` で未割当。カンマ区切りは OR。
          schema:
            type: string
        - name: open
          in: query
          description: '`true` で `closed_at IS NULL` のもののみ。`false` で完了のみ。'
          schema:
            type: string
            enum: ['true', 'false']
        - name: retired
          in: query
          description: |
            **棚に戻ったものを返すかどうか**（ApiDesign.md 9.2.1。pb-5 / pb-6）。
            既定は `false`。

            次の3つをすべて満たす行が「棚に戻った」ものであり、既定で一覧から外れる。

            1. `closed_at IS NOT NULL`
            2. いま属しているスプリントが `completed`
            3. 未完了の祖先を持たない（根までたどる。直下の親だけでは歯抜けが起きる）

            **スプリントを終えた時点で、消化し終えたものがバックログから消える**
            ——これが「バックログ＝行うべき仕事すべての保管庫」を保つ手当てである。

            バックログの状態フィルタで完了を明示的に選んだときに画面が `true` を送る
            （GuiDesign.md 5.4）。**検索画面ができるまでの唯一の逃げ道である。**
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
        - name: due_within
          in: query
          description: |
            `7d` 形式。**今日から N 日以内に期限があるもの（期限超過を含む）**。
            `due_date IS NULL` は除外する。上限は `3650d`。
          schema:
            type: string
            pattern: '^[0-9]+d$'
          example: 7d
        - name: overdue
          in: query
          description: |
            `true` で**期限を過ぎた未完了のもの**（`due_date < 今日` かつ
            `closed_at IS NULL`）。9.13.1 の `overdue` と同じ条件で数える。

            **`due_within=0d` で代用しない**——あちらは「今日以前」で
            **今日が期限のもの**を含み、1日ぶんずれる。
          schema:
            type: string
            enum: ['true']
        - name: stale
          in: query
          description: |
            `14d` 形式。**その日数より前から更新されていない未完了のもの**
            （`updated_at < now() - N日` かつ `closed_at IS NULL`）。
            9.13.1 の `stale` と同じ条件で数える。上限は `3650d`。

            **日数を取るのは、閾値の正本がサーバにあるからである**
            （9.13.1 の `threshold_days`）。ダッシュボードは `stats` の応答に
            載る値をそのままリンクへ載せ、画面側に 14 を書かない。
          schema:
            type: string
            pattern: '^[0-9]+d$'
          example: 14d
        - name: parent
          in: query
          description: |
            `seq` を指定すると、そのチケットとその全子孫（部分木）に限る。
            **カンマ区切りで複数指定は OR**（いずれかの部分木に含まれるもの）。
            バックログのエピックフィルタがこれを使う（GuiDesign.md 5.4）。
          schema:
            type: string
          example: '12,30'
        - name: sort
          in: query
          description: |
            既定は `sort_key`。**`priority` と `status` は意味の順で並ぶ**——
            `priority` は `lowest`→`highest`、`status` はワークフローの `sort_order` で、
            キーの辞書順ではない（`high` が `lowest` より前に来ると「優先度で並べた」と
            読めないため）。
          schema:
            type: string
            enum: [sort_key, seq, title, status, priority, due_date, created_at, updated_at]
            default: sort_key
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        '200':
          description: チケットの一覧。
          headers:
            ETag:
              description: |
                弱い検証子（`W/"tkt-<ハッシュ>-<件数>-<最終更新>"`。ApiDesign.md 9.2.5）。
              schema:
                type: string
              example: W/"tkt-a3f19c2b-48-1723372992000000000"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: チケットの作成
      operationId: createTicket
      description: |
        チケットを1件作る（ApiDesign.md 9.3）。**必要権限は `ticket.create`**。

        **サーバが決めるものはリクエストに含められない。**

        | 項目 | 決め方 |
        |---|---|
        | `seq` | `project_counter` の1文 `UPDATE ... RETURNING`（DbDesign.md 6.4.1） |
        | `status_key` | ワークフローのうち `category='todo'` かつ `sort_order` 最小。該当が無ければ `sort_order` 最小 |
        | `sort_key` | 現在の末尾の次（9.4 の LexoRank） |
        | `reporter_id` | 呼び出し元のアクター |
        | `staged_at` | **常に `NULL`**（バックログへ入る）。オンステージへ上げるのは 9.4 の `move` である |
        | `execution_mode` | **常に `agent_draft`**（DbDesign.md 6.6 の列の既定。`INSERT` は値を送らない）。変えるのは 9.5.2 の `PATCH` |
        | `version` | `1` |

        **初期ステータスを指定させない。** ワークフローの入口は `workflow_transition` に
        定義されておらず（遷移元が無い）、任意のステータスで作成できると 9.6 の遷移検証を
        素通りできてしまう。作成後に遷移させれば同じ状態に到達でき、その経路は検証を通る。

        **採番・ワークフロー解決・タグ付与・`activity` 記録は単一トランザクションで行う。**

        検証に失敗したときの `details[].code` は次のとおり。

        | `code` | 意味 |
        |---|---|
        | `not_a_member` | `assignee_id` に指定したアクターがプロジェクトのメンバーでない（9.14） |
        | `not_found` | `parent_seq` / `tag_ids` の参照先がこのプロジェクトに無い |
        | `use_sprint_endpoint` | `sprint_id` を送った（スプリントの開始・終了が動かす。pb-6） |
        | `required` / `invalid` / `too_long` / `out_of_range` | 2.5 の一般の検証エラー |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: 作成されたチケット（9.5 の `GET` と同形式）。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/tickets/31
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: チケットの詳細
      operationId: getTicket
      description: |
        チケット詳細画面（GuiDesign.md 5.5）のデータ源（ApiDesign.md 9.5.1）。
        **必要権限は `ticket.view`**。

        **9.2 の `items[]` に6項目を加えたもの**を返す（`body_md` / `parent` / `children` /
        `dod` / `links` / `comment_count`）。一覧と同じ型を埋め込んでいるので、片方だけ
        項目が増えて JSON の形が割れることがない。

        **コメント本体と変更履歴は含めない。** コメントはページングを持ち（9.8）、履歴は
        既定で畳まれている。画面は起動時に本エンドポイントと `GET .../comments` の
        **2本**を呼ぶ。

        **`dod` / `links` は手順18 まで空の配列である。** `comment_count` は
        **手順17 から実数**——9.6 の遷移が `kind='progress'` のコメントを作るため、
        0 を固定で返すと事実と食い違う。

        **`ETag` を返さない。** 2.7 の `ETag` は一覧（9.2.5）のためのもので、1件の詳細は
        軽く、競合検出は 9.5.2 の楽観ロック（`version` + `If-Match`）が担う。同じ資源に
        2つの競合検出手段を置くと、どちらが正本か読めなくなる。
      responses:
        '200':
          description: チケット1件（9.5.1）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [tickets]
      summary: チケットの更新
      operationId: updateTicket
      description: |
        部分更新（ApiDesign.md 9.5.2）。**必要権限は `ticket.edit` または
        `ticket.self_edit`。ただし `assignee_id` / `working_agent_id` を変える場合は
        `ticket.assign` も必要**——この追加分だけはリクエスト本文の内容で決まるため、
        ルート定義の宣言ではなくハンドラ内で見ている。

        **`ticket.self_edit` では開ける項目が絞られる**（0029。pb-75）。
        エージェントに渡す権限であり、**自分の縛りを緩められては意味がない**
        （DbDesign.md 6.13）。次を送ると `403` になる。

        | `ticket.self_edit` で変えられる | 変えられない |
        |---|---|
        | `title` `body_md` `priority` `parent_seq` `assignee_id` `tag_ids` `estimate_point` `estimate_hours` `start_date` `due_date` | `type` `execution_mode` `readiness` `readiness_note` `scope` `working_agent_id` `actual_hours` |

        **`type` を外したのは、切り替えが盤面の見え方を変えるからである**
        ——タスクをエピックへ変えると、その行はバックログから消えてフィルタの
        選択肢になる（GuiDesign.md 5.4）。**`sprint_id` は 0028 以降どちらの権限でも
        書けない**（下記 `use_sprint_endpoint`）。

        **送られたフィールドだけを更新する。** `null` を送るとその項目を空にする
        （担当を外す・親を外す・期限を消す）。キーごと送らなければ据え置く。

        **`If-Match` は必須**（2.8）。省略すると 422（`details[].field` が `If-Match`）、
        現在の `version` と食い違えば 409。成功すると `version` が +1 される。

        **`tag_ids` は丸ごと置き換える**（部分更新ではない）。空配列でタグを全て外す。
        **タグだけを変えた場合も `version` と `updated_at` が動く**ので、一覧（9.2.5）の
        `ETag` が必ず変わる。

        **受け付けないフィールドは 422 で、`details[].code` が3系統に分かれる**
        （`error.code` はいずれも `validation_failed`）。**値が現在と同じでも弾く**
        ——「送れば通ることがある」という曖昧な仕様にしないため。

        | `details[].code` | 対象 | 代わりに使うもの |
        |---|---|---|
        | `immutable_field` | `id` `seq` `version` `created_at` `updated_at` `reporter_id` | — （サーバが決める） |
        | `use_move_endpoint` | `sort_key` `staged_at` | `POST .../move`（9.4） |
        | `use_transition_endpoint` | `status_key` `closed_at` | `POST .../transition`（9.6） |

        そのほかの `details[].code`。

        | `code` | 意味 |
        |---|---|
        | `parent_cycle` | 自分自身または自分の子孫を親に指定した |
        | `not_stageable` | **オンステージのチケットを、段に置けなくなる `type` / `parent_seq` へ変えようとした** |
        | `not_a_member` | 担当者に指定したアクターがプロジェクトのメンバーでない |
        | `not_found` | `parent_seq` / `tag_ids` の参照先がこのプロジェクトに無い |
        | `use_sprint_endpoint` | `sprint_id` を送った（スプリントの開始・終了が動かす。pb-6） |

        **`not_stageable` は 9.4.1 が `move` で弾いている条件と同じものである。**
        `staged_at` が入っている行を `epic` にする、またはエピック以外の子にすると、
        「段に置けるのは表示上のトップレベルだけ」という規則を `PATCH` から迂回できて
        しまう。**自動で段から降ろす方式は採らない**——種別や親を変えただけのつもりの
        利用者が、オンステージから消えたことに気づく手段がないためである。

        **`activity` は変更した項目ごとに1行**（`field` / `old_value` / `new_value`）。
        **`body_md` だけは値を載せず `field` のみ記録する**——9.13.2 は `per_page=20` の
        一覧APIで、20件ぶんの Markdown を載せると応答が重くなる。値が現在と同じだった
        項目は「変更が生じていない」ので記録しない（`version` は規約どおり +1 する）。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: 更新後のチケット（9.5.1 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
            **`assignee_id` / `working_agent_id` を送ったが `ticket.assign` を
            持たない場合もここへ来る。**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `If-Match` が現在の `version` と一致しない（`conflict`。ApiDesign.md 2.8）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: チケットの削除
      operationId: deleteTicket
      description: |
        物理削除（ApiDesign.md 9.5.3、DbDesign.md 4.6 の既定）。
        **必要権限は `ticket.delete`**。

        **Phase 1 で「持たない人」が実在する唯一のチケット権限である**——`operator`
        （システムロール）は `ticket.delete` を持たず、持つのは `administrator` と
        `project_admin` だけである（migration 0010）。

        **子チケットは削除しない。** `ticket.parent_id` は `ON DELETE SET NULL` であり、
        子は親を失って表示上のトップレベルへ上がる。**この挙動を確認ダイアログに明示する**
        （GuiDesign.md 6.3。件数は 9.5.1 の `children` から数える）。

        コメント・DoD・リンク・タグ付けは `ON DELETE CASCADE` で消える。

        **`activity` は消さず、`action='delete'` を1行足す。** `entity_id` は多相参照で
        FK を持てず（DbDesign.md 6.8）、9.13.2 は「削除されたチケットの行は `entity_seq` /
        `entity_title` が `null` になる」と定めている——**残る前提の設計**であり、消すと
        「誰がどのチケットを消したか」が追えなくなる。

        **`If-Match` は要求しない**（2.8 が求めるのは「編集内容が失われる更新」であり、
        削除には失われる編集内容が無い）。
      responses:
        '204':
          description: 削除した。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/transition:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    post:
      tags: [tickets]
      summary: ステータスの遷移
      operationId: transitionTicket
      description: |
        ワークフローに沿ってステータスを進める（ApiDesign.md 9.6）。
        **必要権限は `ticket.transition`。加えて `workflow_transition.required_permission`
        が設定されていればその権限も必要**（プロジェクトごとに変わる値なので、ルート定義の
        宣言ではなくDBから読む）。

        **検証の順序**（DbDesign.md 6.5）。

        | # | 検証 | 失敗時 |
        |---|---|---|
        | 1 | `to` がプロジェクトのワークフローに存在するか | 422（`details[].code = "unknown_status"`） |
        | 2 | 現在のステータスから `to` への遷移が定義されているか | 409 `invalid_transition` |
        | 3 | 呼び出し元の `actor.kind` が `allowed_actor_kinds` に含まれるか | 403 |
        | 4 | 遷移先の `is_agent_reachable` が `false` で、呼び出し元がエージェントか | 403 |
        | 5 | `required_permission` を呼び出し元が持つか | 403 |
        | 6 | 呼び出し元がエージェントのとき、`assignee_id` が自分の所有者か | 403 |

        **3〜6 が Requirements.md 10.10.4「承認ゲートをAPIレベルで強制する」の実体である。**
        画面側の制御に依存しない。

        **検証6 は手順26b で足した。** エージェントが状態を変えてよいのは、担当が自分の
        所有者であるチケットに限る（担当が未割当のものも進められない）。**呼び出し元が
        人のときは適用しない**——全員に掛けると `ticket.transition` を持つ人が他人の担当を
        進められなくなる。`Design.md` 6.5 の委譲（権限の根拠は所有者）に、作業の根拠も
        所有者だという規則が加わったものである。

        **遷移に成功すると、エージェントは自分を `working_agent_id` に立てる**（9.6）。
        「着手した」と「宣言した」が別々に起こる状態を作らないための副作用で、専用の
        操作を持たない。**別のエージェントが入っていれば上書きする**（排他ではない）。
        `version` は動かさず、`activity` にも記録しない——遷移の行が「誰が進めたか」を
        `actor_id` で既に持っている。

        **`closed_at` はこの経路だけが動かす。** 遷移先の `category` が `done` なら `now()`、
        それ以外なら `NULL` へ戻す。`PATCH` で直接書けないようにしてあるので（9.5.2）、
        9.2.1 の `?open=true`（`closed_at IS NULL`）が「完了していないもの」と一致することが
        保証される。

        `comment` が付いていれば、**同じトランザクションで `kind='progress'` のコメントを
        作る**（DbDesign.md 6.7）。`activity` には `action='transition'` で記録し、`field` は
        `status_key`、値はキーのまま入れる（表示名への変換は画面が行う。9.13.2）。

        **`If-Match` は要求しない**（9.6）。**遷移そのものが競合を検出する**——2人が同時に
        「進行中 → レビュー」を実行すると、後発は「レビュー → レビュー」を要求することに
        なり、定義が無いため検証2 で 409 になる。ただし `version` は +1 される。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionTicketRequest'
      responses:
        '200':
          description: 遷移後のチケット（9.5.1 と同形式）。**`version` は +1 されている。**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            検証3〜5 のいずれか、または CSRF トークンの不一致（`csrf_failed`）。
            `message` はそのまま画面に出せる日本語である（2.5）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            現在のステータスから要求された遷移が `workflow_transition` に定義されていない
            （`invalid_transition`。ApiDesign.md 9.14）。**`conflict` と分けてあるのは、
            利用者が取る行動が違うため**——競合は読み直せば済むが、こちらは順路そのものが
            存在しない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/references:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: 外部参照の一覧
      operationId: listTicketReferences
      description: |
        チケットから PB の外を指す参照（ApiDesign.md 9.10.2）。**必要権限は `ticket.view`**。

        `kind` は `code`（リポジトリ・ブランチ・コミット）と `doc`（仕様書などのURL）の
        2つで、**必須の項目が違う**。`ticket_link`（9.10.1）が同じプロジェクトの別の
        チケットを指すのに対し、こちらは PB の管理外にあるものを指す。

        **`items[]` は `kind` 昇順（`code` → `doc`）、同じ `kind` の中は `sort_order` →
        `created_at` の昇順。** 第2・第3キーを置くのは、順序が実行ごとに揺れない
        ようにするためである。

        **ページネーションも `ETag` も持たない。** 1チケットあたり数件に収まり、
        画面は開いた時点で全件を出す（GuiDesign.md 5.5）。**同じ内容が 9.5.1 の
        詳細応答の `references` にも入る**ので、詳細画面はこのエンドポイントを
        呼ばない。
      responses:
        '200':
          description: 外部参照の一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReferenceList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: 外部参照の追加
      operationId: createTicketReference
      description: |
        外部参照を1件足す（ApiDesign.md 9.10.2）。**必要権限は `ticket.reference.edit`**
        （0027 で `ticket.edit` から切り出した。読みは `ticket.view` のまま）。

        **`kind='code'` の主な書き手はエージェントである。** Phase 1 ではエージェント用の
        アクターも MCP も無い（Design.md 11章 手順24・25）ため、書き手は `/me/tokens` で
        発行した API トークンを持つクライアントになる。**画面は `code` の追加を持たず、
        表示と削除だけを行う**（GuiDesign.md 5.5）。`doc` は Phase 1 から人が画面で
        追加・編集できる。

        必須は `kind` と、`kind` に応じて `repository`（`code`）または `url`（`doc`）。
        **URL の形式は検証しない**（空でないことのみ）。`sort_order` を省くと末尾
        （現在の最大値 + 10）に置かれる。

        **親チケットの `version` も `updated_at` も動かさない**——参照の増減は `ticket` の
        列を変えないためで、`ticket_tag` を動かす 9.2.5 とはここが違う。

        **変更は `activity` に記録する**（9.1.1）。`action` は `update`、`field` は
        `reference.code` / `reference.doc` で、`new_value` に画面と同じ形の要約が入る。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketReferenceRequest'
      responses:
        '201':
          description: 作成した外部参照。
          headers:
            Location:
              description: 作成した参照の URL。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/references/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
      - $ref: '#/components/parameters/TicketReferenceID'
    patch:
      tags: [tickets]
      summary: 外部参照の更新
      operationId: patchTicketReference
      description: |
        外部参照を部分更新する（ApiDesign.md 9.10.2）。**必要権限は `ticket.reference.edit`**
        （0027）。

        **`kind` は作成後に変えられない。** 送ると 422 `validation_failed` で、
        `details[].code` は `immutable_field` である。

        **`null` は「その項目を空にする」を意味する**（キーごと送らないのとは区別する）。
        ただし**更新後の行が必須の条件を満たすこと**——`kind='doc'` の `url` や
        `kind='code'` の `repository` を空にする要求は 422 `required` で弾く
        （DbDesign.md 6.12 の `CHECK` と同じ条件をアプリ側でも持つ）。

        **`If-Match` は要らない**（`ticket_reference` は `version` 列を持たない。2.8）。

        **値が実際に変わったときだけ `activity` に記録する**（9.5.2 と同じ扱い）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTicketReferenceRequest'
      responses:
        '200':
          description: 更新後の外部参照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketReferenceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: 外部参照の削除
      operationId: deleteTicketReference
      description: |
        外部参照を1件消す（ApiDesign.md 9.10.2）。**必要権限は `ticket.reference.edit`**
        （0027）。

        **`code` にも削除を置く**（GuiDesign.md 5.5）。画面に追加の導線が無いぶん、
        誤って積まれた行を人が始末できないと詰むためである。

        削除も `activity` に記録する（`old_value` に要約、`new_value` は `null`）。
      responses:
        '204':
          description: 削除した（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketReferenceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: コメントの一覧
      operationId: listTicketComments
      description: |
        チケットのコメント（ApiDesign.md 9.8）。**必要権限は `ticket.view`**。

        **チケットの子資源で唯一 2.6 のページネーションと 2.7 の `ETag` を持つ。**
        DoD（9.9）・リンク（9.10.1）・外部参照（9.10.2）は1チケットあたり数件に
        収まるが、**コメントは議論の量だけ増える**。`ETag` は Phase 2 の
        エージェントが「新しいコメントが付いたか」を安く見る口になる。

        **許可する `sort` は `created_at` だけ**で、既定は `asc`・`per_page=50`。

        **削除済みも `items` に残る**（`body_md` が `null`、`deleted_at` に値）。
        画面は「削除されました」と表示する（GuiDesign.md 5.5）。**`total` にも数える**
        ——`items` に残す以上、外すとページの件数と合わない。**9.5.1 の
        `comment_count` だけは `deleted_at IS NULL` で数える**（読めるコメントの件数）。

        Phase 1 は `If-None-Match` を解釈せず、ヘッダだけ出す（9.2.5 と同じ）。
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: 既定 50、上限 200（ApiDesign.md 9.8 / 2.6）。
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: sort
          in: query
          description: '**`created_at` のみ**（9.8）。他の値は 422。'
          schema: { type: string, enum: [created_at], default: created_at }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: コメントの一覧。
          headers:
            ETag:
              description: |
                `W/"cmt-<page>-<per_page>-<order>-<件数>-<MAX(updated_at) のナノ秒>"`。
                **論理削除も `updated_at` を動かす**ので、削除が 304 に埋もれない。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: コメントの投稿
      operationId: createTicketComment
      description: |
        コメントを1件投稿する（ApiDesign.md 9.8）。**必要権限は `comment.create`**。

        **`origin` はリクエストで指定できない**——呼び出し元のアクター種別
        （`user` / `agent`）から決まる。人が `agent` を名乗れると、
        GuiDesign.md 5.5 の「エージェントのコメントを角丸四角で区別する」が
        意味を失う。

        **`in_reply_to` の相手は同じチケットの、削除されていないコメントであること。**
        満たさない場合は 422 `validation_failed`、`details[].code` は `not_found`。
        **存在しない ID・他チケットの ID・削除済みを区別しない**（Design.md 6.4.5）。

        **親チケットの `version` と `updated_at` は動かない**（9.10.2 と同じ）。

        投稿は `activity` に記録する（`action='update'` / `field='comment'`、
        `new_value` は `<kind の表示名>: <本文の先頭40字>`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketCommentRequest'
      responses:
        '201':
          description: 作成したコメント。
          headers:
            Location:
              description: 作成したコメントの URL。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/comments/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
      - $ref: '#/components/parameters/TicketCommentID'
    patch:
      tags: [tickets]
      summary: コメントの更新
      operationId: patchTicketComment
      description: |
        コメントを部分更新する（ApiDesign.md 9.8）。**必要権限は `comment.edit_own`
        で、自分が投稿したものだけ**——他人のものは 403 `forbidden`（404 に倒さない。
        同じコメント欄に並んで見えている行であり、存在を隠す意味がない）。

        **変えられるのは `body_md` と `kind` だけである。** `in_reply_to` を送ると
        422 `validation_failed`、`details[].code` は `immutable_field`——返信先を
        後から付け替えるとスレッドの形が変わり、既に読まれた並びが崩れる。

        **削除済みへの `PATCH` は 404**（論理削除でも「もう無い」として扱う）。

        **`If-Match` は要らない**（`comment` は `version` 列を持たない。2.8）。

        **値が実際に変わったときだけ `activity` に記録する**（9.5.2 と同じ扱い）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTicketCommentRequest'
      responses:
        '200':
          description: 更新後のコメント。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketCommentNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: コメントの削除
      operationId: deleteTicketComment
      description: |
        コメントを論理削除する（ApiDesign.md 9.8、DbDesign.md 4.6 / 6.7）。

        **必要権限は OR である**——`comment.delete_any`、**または** `comment.edit_own`
        かつ自分のもの。ルート定義には両方を並べ（`RequireAnyProjectPermission`）、
        どちらか一方でも持っていればミドルウェアを通す。**「自分のものか」は行を
        読まないと決まらない**ので、その判定だけをハンドラで行う——
        `comment.delete_any` を持たない呼び出し元が他人のコメントを消そうとした
        場合は 403 `forbidden`。

        **削除しても行は残る。** `GET` の `items` に `body_md: null` と
        `deleted_at` を持つ形で並び続ける。**二重削除は 404**——`204` で通ると
        `activity` に同じ削除が2行並んで履歴が読めなくなる。

        削除も `activity` に記録する（`old_value` に要約、`new_value` は `null`）。
      responses:
