        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tags:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [tickets]
      summary: タグ一覧
      operationId: listTags
      description: |
        プロジェクトのタグを返す（ApiDesign.md 9.11）。**必要権限は `ticket.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        `items[]` は `sort_order` 昇順、同値は `name` 昇順。第2キーを置くのは、
        `sort_order` が重複したときに順序が実行ごとに揺れないようにするためである。

        **ページネーションも `ETag` も持たない。** バックログのグループ化は全タグを
        セクションの順序に使うため（GuiDesign.md 5.4.1）、ページングすると2ページ目の
        タグがグループ化に現れず、設計上そもそも使えない。

        `ticket_count` は削除確認ダイアログが出す「12件のチケットで使われています」
        （GuiDesign.md 6.3）。
      responses:
        '200':
          description: タグの一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: タグの作成
      operationId: createTag
      description: |
        タグを1件作る（ApiDesign.md 9.11）。**必要権限は `project.edit`**——タグの定義は
        「プロジェクトの分類軸を決める」行為であり、チケットへの付与（`ticket.edit`）とは
        別の権限で扱う。

        `name` は前後の空白を取り除いてから検証する。**同一プロジェクト内で一意**で、
        重複は 409 `already_exists`。**大文字と小文字は区別する**（`uq_tag_project_name` が
        `text` の一意制約であり `citext` ではない。DbDesign.md 6.10）。

        `sort_order` を省略すると末尾（現在の最大値 + 10）に置く。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: 作成されたタグ。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/tags/01K2F8QW3H7YRJ4M5N6P7Q8R9S
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/TagAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tags/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TagID'
    patch:
      tags: [tickets]
      summary: タグの更新
      operationId: patchTag
      description: |
        タグの `name` / `sort_order` を変える（ApiDesign.md 9.11）。必要権限は `project.edit`。

        **`If-Match` を要求しない。** 2.8 の楽観ロックの対象は `project` と `app_user` で、
        `tag` は `version` 列を持たない。

        **並べ替え（9.11.1）もこのエンドポイントで表現する。** クライアントはドロップの
        確定時に新しい並びへ `10, 20, 30, …` を割り当て直し、値が変わった行だけ送る。
        専用の move は設けていない——`sort_order` は単なる整数で、チケットの `sort_key`
        （LexoRank）のような生成規則を持たないためである。

        送られなかった項目は据え置く。何も送られていない場合は現在の値をそのまま返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTagRequest'
      responses:
        '200':
          description: 更新後のタグ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          $ref: '#/components/responses/TagAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: タグの削除
      operationId: deleteTag
      description: |
        タグを消す（ApiDesign.md 9.11）。必要権限は `project.edit`。

        `ticket_tag` の行は `CASCADE` で消える（DbDesign.md 6.10）。**チケットは消えず、
        タグが外れるだけである。**

        **使用中でも削除できる。** 禁止すると、要らなくなった分類を消すために全チケットから
        手で外すことになる。画面は確認ダイアログに使用中の件数を出す（GuiDesign.md 6.3）。
      responses:
        '204':
          description: 削除された（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/sprints:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [tickets]
      summary: スプリント一覧
      operationId: listSprints
      description: |
        プロジェクトのスプリントを返す（ApiDesign.md 9.12）。**必要権限は `ticket.view`**。

        `items[]` は `start_date` 降順（`null` は末尾）、同値は `created_at` 降順。
        新しいものが上に来る並びで、GuiDesign.md 5.9.5 の図と一致する。

        `ticket_count` は `ticket.sprint_id` が当該スプリントを指す行数、`closed_count` は
        そのうち `closed_at IS NOT NULL` の行数。**`status_category = 'done'` では数えない**
        ——9.13 の `open` / `overdue` が `closed_at` を基準にしており、そちらへ揃える。

        タグ（9.11）と同じくページネーションも `ETag` も持たない。
      responses:
        '200':
          description: スプリントの一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: スプリントの作成
      operationId: createSprint
      description: |
        スプリントを1件作る（ApiDesign.md 9.12）。**必要権限は `project.edit`**。

        **Phase 1 で開けるのは定義だけである。** バーンダウン・ベロシティを含む運用画面は
        Phase 2（GuiDesign.md 10章）。定義を Phase 1 に置くのは、作る手段が無いと
        チケット詳細のスプリント欄が常に空のドロップダウンになるためである。

        **`name` に一意制約は無い**（DbDesign.md 6.9）。同名のスプリントを作れる。
        `start_date` と `end_date` の両方があるとき `start_date <= end_date`
        （`ck_sprint_dates`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSprintRequest'
      responses:
        '201':
          description: 作成されたスプリント。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/sprints/01K2F8QW3H7YRJ4M5N6P7Q8R9S
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/sprints/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/SprintID'
    patch:
      tags: [tickets]
      summary: スプリントの更新
      operationId: patchSprint
      description: |
        スプリントの各項目を変える（ApiDesign.md 9.12）。必要権限は `project.edit`。
        タグと同じく **`If-Match` は要求しない**（`sprint` は `version` 列を持たない）。

        送られなかった項目は据え置く。**`goal` / `start_date` / `end_date` は `null` を
        送ると値を消す**（キーが無い場合の「据え置き」と区別する）。

        `ck_sprint_dates` は更新後の2列の関係を見る制約であり、片方だけを送る場合は
        送られなかった側の現在値と突き合わせて検証する。違反は 422 で返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSprintRequest'
      responses:
        '200':
          description: 更新後のスプリント。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SprintNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: スプリントの削除
      operationId: deleteSprint
      description: |
        スプリントを消す（ApiDesign.md 9.12）。必要権限は `project.edit`。

        **チケットは消えない。** `fk_ticket_sprint` の `ON DELETE SET NULL` により
        `ticket.sprint_id` が外れ、スプリント未設定に戻る（DbDesign.md 6.9）。
        画面は確認ダイアログにその旨を明記する（GuiDesign.md 6.3）。
      responses:
        '204':
          description: 削除された（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SprintNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [tickets]
      summary: チケット一覧
      operationId: listTickets
      description: |
        プロジェクトのチケットを返す（ApiDesign.md 9.2）。**必要権限は `ticket.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        バックログ画面（GuiDesign.md 5.4）の唯一のデータ源であり、Phase 2 のカンバン・
        ガントも同じエンドポイントから描く。

        **既定が他の一覧と2か所ちがう**（9.2.1）。

        - `per_page` の既定が **200**（他は 25）。この画面はページャを持たず、
          フィルタ後の全件を1回で取り切る（9.2.3）
        - `sort` の既定が **`sort_key`**（他は `updated_at`）。人が手で並べた順序（9.4）を
          既定の見え方にする

        **異なる種類の条件どうしは AND、同じ条件の複数指定は OR**
        （`?type=bug&priority=high,highest` は「バグ、かつ優先度が高以上」）。

        `items[]` は `tags[]` と `parent_seq` / `has_children` を含む。グループ化（タグ）と
        階層のインデント表示（親子）を追加のリクエストなしに描けるようにするためである。
        含めないと、バックログは1画面あたり `1 + タグ数 + 階層の深さ` 回の往復を要する。

        **`has_children` は「プロジェクト内に子がいるか」**であって「結果の中に子がいるか」
        ではない。フィルタは行単位で適用し、サーバは親を補完しない（9.2.4）ため、
        結果の中で数えると親が絞り込みで落ちた瞬間に子の有無まで消える。

        **`body_md` は含めない**（9.2.2）。一覧は本文を表示せず、200件分の Markdown は
        応答を数十倍にする。`execution_mode` / `readiness` / `scope` / `custom_fields` も
        同じ理由で含めない（GuiDesign.md 5.5 が「Phase 1 では非表示」と決めている）。

        **`q`（全文検索）は Phase 1 では受け付けない**（9.2.1）。専用画面
        `/p/:key/search`（Phase 2）と同時に開ける。

        `ETag` は「フィルタ条件を正規化した文字列のハッシュ・件数・`MAX(updated_at)`」から
        作る（9.2.5）。**`sort` / `order` / `page` / `per_page` も混ぜる**——ETag は応答本文を
        指す検証子であり、並び順やページが違えば本文も違う。
        **Phase 1 では `If-None-Match` を解釈しない**（304 を返さない）。
      parameters:
        - name: status
          in: query
          description: ワークフローのステータスキー。カンマ区切りで複数指定は OR。
          schema:
            type: string
          example: todo,in_progress
        - name: status_category
          in: query
          description: |
            `todo` / `in_progress` / `review` / `done`。カンマ区切りは OR。
            **ワークフローが違うプロジェクトを跨いでも意味が変わらない4値**であり、
            ダッシュボードの集計とカンバンの列が使う（9.2.1）。
          schema:
            type: string
          example: todo,in_progress
        - name: type
          in: query
          description: '`epic` / `story` / `task`。カンマ区切りは OR。'
          schema:
            type: string
          example: task,bug
        - name: assignee
          in: query
          description: |
            担当者の ULID。`me` で自分、`none` で未割当。カンマ区切りは OR。
          schema:
            type: string
          example: me,none
        - name: priority
          in: query
          description: '`lowest` 〜 `highest`。カンマ区切りは OR。'
          schema:
            type: string
          example: high,highest
        - name: tag
          in: query
          description: タグの ULID（9.11）。`none` で未分類。カンマ区切りは OR。
          schema:
            type: string
        - name: sprint
          in: query
          description: スプリントの ULID（9.12）。`none` で未割当。カンマ区切りは OR。
          schema:
            type: string
        - name: open
          in: query
          description: '`true` で `closed_at IS NULL` のもののみ。`false` で完了のみ。'
          schema:
            type: string
            enum: ['true', 'false']
        - name: due_within
          in: query
          description: |
            `7d` 形式。**今日から N 日以内に期限があるもの（期限超過を含む）**。
            `due_date IS NULL` は除外する。上限は `3650d`。
          schema:
            type: string
            pattern: '^[0-9]+d$'
          example: 7d
        - name: parent
          in: query
          description: |
            `seq` を指定すると、そのチケットとその全子孫（部分木）に限る。
            **カンマ区切りで複数指定は OR**（いずれかの部分木に含まれるもの）。
            バックログのエピックフィルタがこれを使う（GuiDesign.md 5.4）。
          schema:
            type: string
          example: '12,30'
        - name: sort
          in: query
          description: |
            既定は `sort_key`。**`priority` と `status` は意味の順で並ぶ**——
            `priority` は `lowest`→`highest`、`status` はワークフローの `sort_order` で、
            キーの辞書順ではない（`high` が `lowest` より前に来ると「優先度で並べた」と
            読めないため）。
          schema:
            type: string
            enum: [sort_key, seq, title, status, priority, due_date, created_at, updated_at]
            default: sort_key
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        '200':
          description: チケットの一覧。
          headers:
            ETag:
              description: |
                弱い検証子（`W/"tkt-<ハッシュ>-<件数>-<最終更新>"`。ApiDesign.md 9.2.5）。
              schema:
                type: string
              example: W/"tkt-a3f19c2b-48-1723372992000000000"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: チケットの作成
      operationId: createTicket
      description: |
        チケットを1件作る（ApiDesign.md 9.3）。**必要権限は `ticket.create`**。

        **サーバが決めるものはリクエストに含められない。**

        | 項目 | 決め方 |
        |---|---|
        | `seq` | `project_counter` の1文 `UPDATE ... RETURNING`（DbDesign.md 6.4.1） |
        | `status_key` | ワークフローのうち `category='todo'` かつ `sort_order` 最小。該当が無ければ `sort_order` 最小 |
        | `sort_key` | 現在の末尾の次（9.4 の LexoRank） |
        | `reporter_id` | 呼び出し元のアクター |
        | `version` | `1` |

        **初期ステータスを指定させない。** ワークフローの入口は `workflow_transition` に
        定義されておらず（遷移元が無い）、任意のステータスで作成できると 9.6 の遷移検証を
        素通りできてしまう。作成後に遷移させれば同じ状態に到達でき、その経路は検証を通る。

        **採番・ワークフロー解決・タグ付与・`activity` 記録は単一トランザクションで行う。**

        検証に失敗したときの `details[].code` は次のとおり。

        | `code` | 意味 |
        |---|---|
        | `not_a_member` | `assignee_id` に指定したアクターがプロジェクトのメンバーでない（9.14） |
        | `not_found` | `parent_seq` / `tag_ids` / `sprint_id` の参照先がこのプロジェクトに無い |
        | `required` / `invalid` / `too_long` / `out_of_range` | 2.5 の一般の検証エラー |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: 作成されたチケット（9.5 の `GET` と同形式）。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/tickets/31
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/move:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    post:
      tags: [tickets]
      summary: チケットの並べ替え
      operationId: moveTicket
      description: |
        バックログのドラッグ&ドロップによる並べ替え（ApiDesign.md 9.4、GuiDesign.md 5.4）。
        **必要権限は `ticket.edit`**。

        **`PATCH` で `sort_key` を直接書かせない。** LexoRank の桁生成規則をクライアントに
        持たせると、Web・MCP・将来の CLI がそれぞれ同じ規則を実装することになり、1つでも
        ずれると順序が壊れる。**順序キーの生成はサーバに1つだけ置く。**

        **`If-Match` は要求しない**（9.4）。競合しても失われる編集内容が無い（`sort_key` は
        フォームで編集する項目ではない）。ただし **`version` は他の更新と同じく +1 する**。

        **並び順はプロジェクト内で1本である。** グループ化（親・タグ・スプリント）は表示上の
        区切りにすぎず、グループを切り替えても `sort_key` は変わらない。
        **二段（バックログ／オンステージ）も同じ1本を共有する**（9.4、DbDesign.md 6.6）。

        **`activity` には記録しない。** `sort_key` だけの更新であり、記録するとチケット詳細の
        変更履歴が並べ替えで埋まる（利用者の判断、2026-08-23）。

        `position` と `after_seq` / `before_seq` の同時指定は 422。いずれも無い場合も 422。

        **`staged` で段を出し入れする**（9.4.1）。段と位置を1回のリクエストで決めるのは、
        ドラッグ&ドロップの1操作で両方が同時に決まるためで、2本に分けると途中で失敗した
        ときに「段は移ったが位置は末尾」という中途半端な状態が残る。

        検証に失敗したときの `details[].code` は次のとおり。

        | `code` | 意味 |
        |---|---|
        | `not_stageable` | 表示上のトップレベルでないチケットを `staged: true` で上げようとした（9.4.1） |
        | `invalid` / `required` | `position` と `after_seq` / `before_seq` の指定の誤り |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTicketRequest'
      responses:
        '200':
          description: |
            動かした結果。**`rebalanced` が `true` のときはクライアントが一覧を取り直す**
            ——手元の `sort_key` がすべて古くなっている。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveTicketResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: ユーザー一覧
      operationId: listUsers
      description: |
        人間とエージェントを同じ一覧に返す（ApiDesign.md 6.1、DbDesign.md 6.2 の
        `actor` 統合設計）。**必要権限は `user.manage`**（Phase 1 = アドミニストレータのみ）。

        `kind` によって意味を持たないフィールドは `null` を返し、フィールド自体を
        省略しない。**`agent` は Phase 1 では常に `null`**（中身にあたる
        `agent` テーブルは Phase 2 で作られる）。

        `kind = 'system'` の actor は返さない。

        `project_count` は `project_member` の行数で、アーカイブ済みプロジェクトも数える。
      parameters:
        - name: kind
          in: query
          description: 既定は `all`。
          schema:
            type: string
            enum: [user, agent, all]
            default: all
        - name: is_active
          in: query
          description: 既定は `all`。**真偽値ではなく3値の文字列**（未指定と false を区別する）。
          schema:
            type: string
            enum: ['true', 'false', all]
            default: all
        - name: q
          in: query
          description: |
            表示名・メールアドレス・**ロールの表示名**の部分一致。ロールは `role.display_name`
            （「アドミニストレータ」「オペレータ」）と比べる。**画面に出ないキー
            （`administrator`）は対象にしない。** `%` と `_` はサーバ側でエスケープするため
            ワイルドカードとしては働かない。**画面は検索欄を常時表示する**（GuiDesign.md 5.6）。
          schema:
            type: string
        - name: sort
          in: query
          description: |
            `system_role` は `role.sort_order` の順（オペレータ → アドミニストレータ）で、
            表示名の五十音順ではない。**ロールを持たない行（エージェント）は昇順・降順とも末尾。**
            `is_active` の昇順は無効が先（`false < true`）。
          schema:
            type: string
            enum: [display_name, email, system_role, is_active, last_login_at, created_at]
            default: display_name
        - name: order
          in: query
          description: |
            既定は `asc`。名簿は昇順で読むためで、他の一覧（`GET /projects` は `desc`）とは
            既定が違う。
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: 1ページ分のユーザー。
          headers:
            ETag:
              description: |
                弱い検証子 `W/"user-<件数>-<MAX(updated_at) のナノ秒>"`（ApiDesign.md 2.7）。
                `updated_at` は `actor` と `app_user` の新しいほうを採る。
                **Phase 1 では `If-None-Match` を解釈しない**（304 を返さない）。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: ユーザーの作成
      operationId: createUser
      description: |
        ユーザーを作成する（ApiDesign.md 6.2）。必要権限は `user.manage`。

        サーバ側は `actor` → `app_user` → `user_identity`（`provider_key='local'`,
        `subject=email`）→ `local_credential` と `audit_log` への記録を
        **単一トランザクション**で行う（DbDesign.md 6.2）。

        メール重複の検出はDBの `UNIQUE` 制約に委ねる。

        **`generated_password` はこの応答でのみ返る。** 再表示できず、監査ログにも残さない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 作成された。
          headers:
            Location:
              description: '`/api/v1/admin/users/<id>`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            メールアドレスが既に使われている（`already_exists`。ApiDesign.md 6.2）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [admin]
      summary: ユーザーの詳細
      operationId: getUser
      description: |
        1ユーザーの本体・認証手段・プロジェクトごとの権限・有効なセッションを
        1回で返す（ApiDesign.md 6.3）。必要権限は `user.manage`。
        `GuiDesign.md` 5.6.2 の詳細画面が必要とする情報がここに揃う。

        **`kind='user'` のアクターだけを返す。** エージェント・システムアクターは
        404 になる（手順13a の判断）。応答の `version` は `app_user` の列であり、
        `app_user` の行を持たないアクターでは 6.4 の楽観ロックが成立しないため。
        エージェントの詳細は `agent` テーブル（DbDesign.md 8.1）ができる
        Phase 2 で、列構成ごと設計する。

        **一覧（6.1）と違い `ETag` は返さない。** 鮮度は本体の `version` が表す。
      responses:
        '200':
          description: ユーザーの詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            ユーザーが存在しない、または `kind` が `user` ではない（`not_found`）。
            **両者を区別しない**（ApiDesign.md 1.2-5）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [admin]
      summary: ユーザーの更新
      operationId: updateUser
      description: |
        `display_name` / `email` / `system_role` / `is_active` を更新する
        （ApiDesign.md 6.4）。必要権限は `user.manage`。

        **送られたフィールドだけを更新する**（部分更新）。

        **`If-Match` は必須**（2.8）。省略すると 422、現在の `version` と
        食い違えば 409。`display_name` や `is_active`（`actor` の列）だけを
        変えた場合も `version` は +1 される——**ユーザー1人につき `version` は1つ**
        という約束にしないと、直後に古い `version` でもう一度更新が通ってしまう。

        **`email` を変えると `user_identity.subject`（`provider_key='local'`）も
        追随する。** ログインは `subject = app_user.email` で突き合わせるため
        （Design.md 6.2.1 手順2〜3）、片方だけ変えると当人がログインできなくなる。

        `system_role` を変えたときは当該アクターの権限キャッシュを無効化する
        （Design.md 6.4.5）。監査には常に `user.update` を、ロールが変わったときは
        加えて `role.change` を記録する。

        **3つのガードは API 側にある**（6.4）。UIだけで防ぐと、直接APIを叩いた
        場合に誰もログインできないインスタンスが生まれうる。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新後のユーザー（6.3 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            次のいずれか（ApiDesign.md 6.4）。

            - `conflict` — `If-Match` が現在の `version` と一致しない（2.8）
            - `already_exists` — `email` が既に使われている
            - `self_modification_forbidden` — 自分自身のロール変更・無効化
            - `last_administrator` — 最後の有効なアドミニストレータの降格・無効化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: ユーザーの削除
      operationId: deleteUser
      description: |
        物理削除する（ApiDesign.md 6.5、DbDesign.md 4.6）。必要権限は `user.manage`。

        `actor` の削除により `app_user` / `user_identity` / `local_credential` /
        `access_token` / `project_member` が CASCADE で消える。
        `ticket.assignee_id` は `ON DELETE SET NULL` のため**チケットは残る**。

        `comment.author_id` は `NOT NULL` かつ `ON DELETE RESTRICT` のため、
        **削除前にシステムアクター（`kind='system'` の「削除されたユーザー」）へ
        付け替える**（DbDesign.md 6.7）。このアクターはシードに無く、**最初に
        必要になった削除で作る**（手順13a の判断。Phase 1 は `comment` を作る
        経路が無いため、実際には作られない）。

        削除前に `audit_log` へ `user.delete` を記録し、`detail` に削除時点の
        表示名・メール・ロールを保存する。

        **`If-Match` は要求しない**（2.8）。失われる編集内容が無く、競合しても
        「消えている」に収束するため。無効化のみ行いたい場合は 6.4 の
        `is_active: false` を使う。
      responses:
        '204':
          description: 削除された。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            自分自身（`self_modification_forbidden`）、または最後の有効な
            アドミニストレータ（`last_administrator`）。ApiDesign.md 6.5。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: パスワードのリセット
      operationId: resetUserPassword
      description: |
        当該ユーザーの `local_credential` を差し替える（ApiDesign.md 6.6）。
        必要権限は `user.manage`。

        `failed_attempts` と `locked_until` をリセットし、**全セッションを失効**する。
        ロックされた利用者を救うのがこの操作の主な用途であり、パスワードだけ
        変えてロックが残ると目的を果たさない。

        **`mode` は `generate` のみ受け付ける**（手順13a の判断）。応答が
        `generated_password` しか持たず、管理者が手で決めた値を返す意味が無いため。
        本文そのものを省略してもよい（`mode=generate` / `must_change_password=true`）。

        **`generated_password` はこの応答でのみ返る。** 監査ログにも残さない。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: リセットされた。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedPassword'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `local_credential` を持たないユーザー（IdP のみ、Phase 3）に対する
            リセット（`conflict`。ApiDesign.md 6.6）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/sessions/revoke:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: 全セッションの失効
      operationId: revokeUserSessions
      description: |
        当該アクターの全トークンを失効する（ApiDesign.md 6.7）。必要権限は `user.manage`。

        **`token_type` で絞らない。** 6.7 が「エージェントのトークンにも適用される」と
        定めており、セッションだけを消すとAPIトークンで入り続けられる。

        **冪等である。** 有効なトークンが1本も無くても 204 を返す。

        **個別のセッションを失効させる API は Phase 1 では持たない**
        （GuiDesign.md 5.6.2 の行ごとの `[失効]` は出さない。手順13a の判断）。
      responses:
        '204':
          description: 失効した。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/memberships/{key}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ProjectKey'
    put:
      tags: [admin]
      summary: プロジェクトメンバーシップの付与・変更
      operationId: putUserMembership
      description: |
        ユーザーにプロジェクトロールを与える（ApiDesign.md 6.8）。必要権限は `user.manage`。
        `GuiDesign.md` 5.6.2 の「プロジェクトごとの権限」ブロックに対応する。

        **追加と変更を兼ねる（冪等）。** 既にメンバーならロールを上書きし、
        `joined_at` は最初の1回のまま動かない。

        ロールの妥当性はDB（`role.scope='project'`）に問い合わせる。
        メンバーシップは実効権限の第2層であるため、変更後に権限キャッシュを
        無効化する（Design.md 6.4.1 / 6.4.5）。監査は `role.change`
        （`target_type='project_member'`）。

        **Phase 2 で `POST /projects/:key/members` が同じ状態を変えるようになる。**
        6.8 が定めるとおり、内部実装は共通の1関数に集約すること。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '200':
          description: 付与・変更後のメンバーシップ（6.3 の `project_memberships[]` と同形）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーまたはプロジェクトが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: プロジェクトメンバーシップの剥奪
      operationId: deleteUserMembership
      description: |
        ユーザーをプロジェクトから外す（ApiDesign.md 6.8）。必要権限は `user.manage`。

        **冪等である。** 元からメンバーでなくても 204 を返す。ただし監査
        （`role.change`）は実際に消えたときだけ書く——空振りを記録すると
        本当の剥奪が埋もれるため。
      responses:
        '204':
          description: 剥奪された（または元からメンバーではなかった）。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーまたはプロジェクトが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/roles:
    get:
      tags: [roles]
      summary: ロール一覧
      operationId: listRoles
      description: |
        組み込みロールのカタログ（ApiDesign.md 7.1、正本は DbDesign.md 7.3 のシード）。
        GuiDesign.md 5.6.3 の権限マトリクスと、画面がロールの表示名を引くために使う。

        **必要権限は `scope` によって変わる。**

        | 要求 | 返すもの | 必要権限 |
        |---|---|---|
        | `?scope=project` | `scope='project'` の3件 | **不要**（認証済みであればよい） |
        | `?scope=system` | `scope='system'` の2件 | `user.manage` |
        | 未指定 | 全5件 | `user.manage` |

        OpenAPI の `security` は操作単位でしか宣言できず、クエリの値ごとに分けられない。
        ここでは**認証必須**として宣言してある。`?scope=project` 以外で `user.manage` を
        持たない場合は `403` になる。

        `?scope=project` を開放しているのは、プロジェクト設定のメンバータブ
        （GuiDesign.md 5.9.2）がプロジェクト管理者の開く画面でありながら、
        ロールの表示名を必要とするためである。**これは暫定で、画面構成が固まった時点で
        権限の全体像を再整理する**（7.1）。

        `items[]` は `role.sort_order` 昇順、`permissions[]` は `permission.sort_order` 昇順。
        **ページネーションも ETag も持たない**（件数がシードで固定のため）。
      parameters:
        - name: scope
          in: query
          description: |
            未指定は全件。`role.scope` そのものであり、**プロジェクトIDやユーザIDは
            受け付けない**（`role` テーブルは `project_id` を持たない。7.1）。
            解釈できない値は `422`。
          schema:
            type: string
            enum: [system, project]
      responses:
        '200':
          description: ロールのカタログ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/permissions:
    get:
      tags: [roles]
      summary: 権限カタログ
      operationId: listPermissions
      description: |
        権限カタログの28件（ApiDesign.md 7.2、正本は DbDesign.md 7.2 のシード）。
        **必要権限は `user.manage`。**

        7.1 と違い開放しないのは、消費者が GuiDesign.md 5.6.3 の権限マトリクスだけで、
        そのタブが `user.manage` を要する画面（`/admin/users`）の中にあるためである。

        `items[]` は `permission.sort_order` 昇順。`category` は同じ番号帯で連続しており、
        画面はこれで行を区切る。**ページネーションも ETag も持たない。**
      responses:
        '200':
          description: 権限のカタログ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /healthcheck:
    get:
      tags: [ops]
      summary: ヘルスチェック
      operationId: healthcheck
      description: |
        監視・オーケストレータ用（ApiDesign.md 2.11）。**唯一 `/api/v1` の外にある。**
        認証・CSRF・レート制限・認可の対象外で、DBへは接続しない。
      security: []
      responses:
        '200':
          description: 常に `{"status":"OK"}`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pb_session
      description: |
        ブラウザ（Web UI）用。HttpOnly / SameSite=Lax（ApiDesign.md 2.3）。
        **状態変更系（POST/PATCH/PUT/DELETE）では `X-PB-CSRF` も必要**（2.4）。
    bearerAuth:
      type: http
      scheme: bearer
      description: 'CLI・スクリプト用（`Authorization: Bearer pb_api_...`。ApiDesign.md 2.3）。'

  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: |
        ULID（`actor.id`。ApiDesign.md 6.3）。**形式は検証しない**——不正な ID は
        単に行が見つからず 404 になる。存在しないものと形式が違うものを別の応答に
        分けると、ID の総当たりに手がかりを与えるため（1.2-5）。
      schema:
        type: string
      examples:
        demo:
          value: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
    TokenID:
      name: id
      in: path
      required: true
      description: |
        アクセストークンの ULID（`access_token.id`。ApiDesign.md 4.4.3）。
        **形式は検証しない**——不正な ID は単に行が見つからず 404 になる。
      schema:
        type: string
      examples:
        demo:
          value: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
    TagID:
      name: id
      in: path
      required: true
      description: |
        タグの ULID（ApiDesign.md 9.1「チケット以外の子資源は ULID で指す」）。
        タグは `seq` に相当する連番を持たない。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    SprintID:
      name: id
      in: path
      required: true
      description: |
        スプリントの ULID（ApiDesign.md 9.1）。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketSeq:
      name: seq
      in: path
      required: true
      description: |
        プロジェクト内連番（`ticket.seq`。ApiDesign.md 9.1）。**チケットを指すのは常に
        `seq` であり ULID ではない**——親もリンク先も同一プロジェクト内に限り（Phase 1）、
        プロジェクトが URL で決まっているため `seq` だけで一意に定まる。
        MCP 経由でエージェントが扱う識別子も `my-app-31` の形になる。
      schema:
        type: integer
        format: int32
        minimum: 1
      examples:
        demo:
          value: 31
    ProjectKey:
      name: key
      in: path
      required: true
      description: |
        プロジェクトキー（ULID ではない。ApiDesign.md 5.4）。URL・チケット番号と
        一致させ、開発時のデバッグを容易にするため。
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,19}$'
      examples:
        demo:
          value: my-app
    csrfToken:
      type: apiKey
      in: header
      name: X-PB-CSRF
      description: |
        `pb_csrf` Cookie と同じ値を送る（double submit。ApiDesign.md 2.4）。
        Cookie 認証の状態変更系でのみ要求する。Bearer 認証では不要。

  # 既定では Cookie か Bearer のいずれかを要求する。
  # 認証不要のエンドポイントは security: [] で個別に打ち消す。
  headers:
    RetryAfter:
      description: 再試行までの秒数。`error.retry_after_sec` と同じ値（ApiDesign.md 2.5）。
      schema:
        type: integer
    XRateLimitLimit:
      description: 窓あたりの上限回数（ApiDesign.md 2.9）。
      schema:
        type: integer
    XRateLimitRemaining:
      description: 窓の残り回数（ApiDesign.md 2.9）。
      schema:
        type: integer

  responses:
    BadRequest:
      description: 形式不正・パースエラー（`bad_request`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 未認証・トークン失効・アカウント無効（`unauthenticated`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        権限不足（`forbidden`）。`audit_log` に `permission.denied` が残る（Design.md 6.4.5）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CSRFFailed:
      description: |
        CSRF トークンの不一致（`csrf_failed`）。Cookie 欠落・ヘッダ欠落・不一致を区別しない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: 入力値の検証エラー（`validation_failed`）。`details` を伴う。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProjectStatusChanged:
      description: |
        切り替え後のプロジェクト（5.4 と同形式）。**既にその状態でも 200 を返す**
        （ApiDesign.md 5.6 の冪等）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectDetail'
    ProjectNotFound:
      description: |
        プロジェクトが存在しない、または到達できない（`not_found`）。
        **非メンバーには 403 ではなく 404 を返す**（Design.md 6.4.5「存在を隠す」）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TagNotFound:
      description: |
        タグが存在しない（`not_found`）。**他プロジェクトのタグ ID も同じ 404 に寄せる**
        ——クエリの `WHERE` が `project_id` を含むため区別が付かず、区別する必要もない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TagAlreadyExists:
      description: |
        同じ名前のタグが既にある（`already_exists`。`uq_tag_project_name`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SprintNotFound:
      description: |
        スプリントが存在しない（`not_found`）。TagNotFound と同じ扱い。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketNotFound:
      description: |
        チケットが存在しない（`not_found`）。**他プロジェクトの番号も同じ 404 に寄せる**
        ——クエリの `WHERE` が `project_id` を含むため区別が付かず、区別する必要もない
        （Design.md 6.4.5）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: レート制限（`rate_limited`。ApiDesign.md 2.9）。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: サーバ内部エラー（`internal_error`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          examples: ['tanaka@example.com']
        password:
          type: string
          format: password
      additionalProperties: false

    Session:
      description: |
        `POST /auth/login` と `GET /me` が返す共通の本体。**片方だけ形を変えない。**
      type: object
      required: [actor, permissions, projects, expires_at]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        permissions:
          description: システムロール由来の実効権限。権限0件は空配列で表す。
          type: array
          items:
            type: string
          examples: [['project.view', 'ticket.view']]
        projects:
          description: 所属プロジェクトと、そこでの実効権限。`key` の昇順。
          type: array
          items:
            $ref: '#/components/schemas/SessionProject'
        expires_at:
          description: 現在のトークンの有効期限。無期限の API トークンでは null。
          type: [string, 'null']
          format: date-time

    Actor:
      type: object
      required:
        [
          id,
          kind,
          display_name,
          email,
          system_role,
          locale,
          timezone,
          theme,
          hue,
          must_change_password,
        ]
      properties:
        id:
          description: ULID 26文字。
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        kind:
          type: string
          enum: [user, agent]
        display_name:
          type: string
        email:
          description: エージェントは null（ApiDesign.md 6.1。フィールド自体は省略しない）。
          type: [string, 'null']
        system_role:
          description: 同上。
          type: [string, 'null']
          enum: [administrator, operator, null]
        locale:
          type: [string, 'null']
          examples: ['ja']
        timezone:
          type: [string, 'null']
          examples: ['Asia/Tokyo']
        theme:
          description: |
            テーマ（GuiDesign.md 8.11）。エージェントは null。**サーバが返さないと
            別の端末で同じ見た目にならない**——8.11 が app_user と localStorage の
            両方に保存すると定めた目的がそれである。
          type: [string, 'null']
          enum: [light, dark, system, null]
        hue:
          description: ベース色相（GuiDesign.md 8.3）。エージェントは null。
          type: [string, 'null']
          enum: [blue, green, null]
        must_change_password:
          description: true のときフロントはパスワード変更画面へ誘導する（ApiDesign.md 3.1）。
          type: boolean

    UpdateMeRequest:
      type: object
      description: |
        ApiDesign.md 4.2。**送らなかった項目は変更しない**（部分更新）。
        すべて省略可だが、少なくとも1つを送ること自体は必須にしていない——
        空の `{}` は「何も変えない」として 200 を返す。

        `system_role` は**受け口としてだけ**定義してある。送られたら 422 で
        弾くためであり、黙って捨てると呼び出し側が権限が上がったと誤解する。
      properties:
        display_name:
          description: 1〜60文字。前後の空白は取り除かれる。
          type: string
          minLength: 1
          maxLength: 60
          examples: ['田中']
        email:
          description: |
            **ログインIDでもある**（ApiDesign.md 4.2）。画面では「ログインID」と
            「メールアドレス」の2行に分かれるが、Phase 1 ではどちらも本項目を指す。
          type: string
          format: email
          maxLength: 254
          examples: ['tanaka@example.com']
        locale:
          description: Phase 1 は `ja` のみ。
          type: string
          enum: [ja]
        timezone:
          description: |
            IANA のタイムゾーン名。サーバは `time.LoadLocation` で解決できるかを
            見る（値の一覧を持たない）。`Local` は弾く——誰のローカルかがサーバの
            設定に依存し、端末をまたぐと意味が変わるため。
          type: string
          maxLength: 64
          examples: ['Asia/Tokyo']
        theme:
          type: string
          enum: [light, dark, system]
        hue:
          type: string
          enum: [blue, green]
        system_role:
          description: |
            **変更できない。** 送られると 422（`details[].code` が `not_allowed`）。
          type: string
          enum: [administrator, operator]

    AccessTokenList:
      description: |
        ApiDesign.md 4.4.1。ページネーションも ETag も持たない（1人5本が上限で、
        絞り込みも差分取得も意味を持たないため。7.1 / 7.2 と同じ扱い）。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessToken'

    AccessToken:
      description: |
        `token_type='api'` の access_token 1行（ApiDesign.md 4.4.1）。
        **平文は含まない。**
      type: object
      required: [id, name, token_prefix, scopes, issued_at, status]
      properties:
        id:
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        name:
          description: 発行時に本人が付けた名前。どの端末・どの用途かの唯一の手がかり。
          type: string
          examples: ['CLI (MacBook)']
        token_prefix:
          description: 平文の先頭8文字（DbDesign.md 6.2）。行を見分けるためのもので、検索キーではない。
          type: string
          examples: ['pb_api_9']
        scopes:
          description: |
            権限カタログのキー（Design.md 6.4.2）。**空配列は「絞り込みなし」**であって
            「権限0件」ではない。
          type: array
          items:
            type: string
          examples: [[]]
        issued_at:
          type: string
          format: date-time
        last_used_at:
          description: 一度も使われていなければ null。更新は1分粒度（Design.md 6.2.2）。
          type: string
          format: date-time
          nullable: true
        expires_at:
          description: |
            Phase 1 は必ず入る（無期限を許さない。ApiDesign.md 4.4.2）。列としては
            NULL を許すため nullable にしてある。
          type: string
          format: date-time
          nullable: true
        status:
          description: '`active`（有効）／ `expired`（`expires_at` を過ぎた）。'
          type: string
          enum: [active, expired]
      additionalProperties: false

    IssuedAccessToken:
      description: |
        発行直後の応答（ApiDesign.md 4.4.2）。**`token` を持つ唯一の形**で、
        AccessToken に平文を1項目足したものである。
      type: object
      required: [id, name, token, token_prefix, scopes, issued_at, status]
      properties:
        id:
          type: string
        name:
          type: string
          examples: ['CLI (MacBook)']
        token:
          description: |
            **平文。この応答でしか得られない。** 画面は1回だけ全文を出す
            （GuiDesign.md 5.8.1）。
          type: string
          examples: ['pb_api_9f3c1d2e...']
        token_prefix:
          type: string
          examples: ['pb_api_9']
        scopes:
          type: array
          items:
            type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [active, expired]
      additionalProperties: false

    CreateTokenRequest:
      description: ApiDesign.md 4.4.2。
      type: object
      required: [name, expires_in_days]
      properties:
        name:
          description: |
            1〜100文字（`project.name` と同じ上限。`access_token.name` に DB の
            CHECK は無く、アプリ側が持つ）。前後の空白は取り除かれる。
          type: string
          minLength: 1
          maxLength: 100
          examples: ['CLI (MacBook)']
        expires_in_days:
          description: |
            1〜365。**無期限は許さない**——失効操作でしか消えないトークンが残り、
            置き忘れを検出できなくなるため（Design.md 6.5 がエージェントトークンに
            課す「有効期限必須」と揃える）。
          type: integer
          minimum: 1
          maximum: 365
          examples: [90]
        scopes:
          description: |
            権限カタログのキー（Design.md 6.4.2 の28件）。カタログに無い値は 422。
            省略時と空配列は「絞り込みなし」。**Phase 1 の画面は常に空で送る。**
          type: array
          items:
            type: string
          examples: [[]]
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      description: ApiDesign.md 4.3。
      required: [current_password, new_password]
      properties:
        current_password:
          description: |
            現在のパスワード。不一致は 401 `invalid_credentials`。
            **失敗しても `failed_attempts` は増えない**（4.3）。
          type: string
        new_password:
          description: 12文字以上（Design.md 6.3）。複雑性要件は課さない。
          type: string
          minLength: 12

    SessionProject:
      type: object
      required: [id, key, name, role, permissions]
      properties:
        id:
          type: string
        key:
          type: string
          examples: ['my-app']
        name:
          type: string
        role:
          description: プロジェクトロールのキー（DbDesign.md 7.3）。
          type: string
          examples: ['project_admin']
        permissions:
          description: 当該プロジェクトでの実効権限。
          type: array
          items:
            type: string

    RoleList:
      type: object
      required: [items]
      description: |
        ApiDesign.md 7.1。**2.6 のページネーション項目を持たない**——件数が
        シードで固定されており、page / per_page / total のいずれも意味を持たない。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    Role:
      type: object
      required: [key, scope, display_name, description, is_builtin, sort_order, permissions]
      properties:
        key:
          description: ロールのキー（DbDesign.md 7.3）。
          type: string
          examples: ['project_admin']
        scope:
          description: |
            権限の効く範囲（Design.md 6.4.1 の三層構造）。`system` はインスタンス全体、
            `project` は個別プロジェクトに対する役割。
          type: string
          enum: [system, project]
        display_name:
          description: |
            画面に出す名前。**画面ごとに略さない**（GuiDesign.md 5.6）。
          type: string
          examples: ['プロジェクト管理者']
        description:
          description: 選択肢の下に添える説明。`role.description` は NULL 許容。
          type: string
          nullable: true
        is_builtin:
          description: |
            組み込みロールか。Phase 1 は常に `true`。カスタムロール（`false`）の
            作成は Phase 3（ApiDesign.md 7.3）。
          type: boolean
        sort_order:
          description: 並び順。表示名の五十音順ではない（GuiDesign.md 5.6）。
          type: integer
        permissions:
          description: |
            割り当てられた権限キー。`permission.sort_order` の昇順。
            **権限を1件も持たないロールでも `[]` を返し、`null` にしない。**
          type: array
          items:
            type: string

    PermissionList:
      type: object
      required: [items]
      description: ApiDesign.md 7.2。RoleList と同じくページネーション項目を持たない。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Permission:
      type: object
      required: [key, category, description, sort_order]
      properties:
        key:
          description: 権限キー（Design.md 6.4.2 の権限カタログ）。
          type: string
          examples: ['ticket.close']
        category:
          description: |
            権限の分類。GuiDesign.md 5.6.3 のマトリクスはこれで行を区切る。
          type: string
          examples: ['ticket']
        description:
          description: 権限の説明。マトリクスではキーの下に副見出しとして出す。
          type: string
          examples: ['チケットのクローズ']
        sort_order:
          type: integer

    UserList:
      description: 一覧の共通エンベロープ（ApiDesign.md 2.6）。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          description: 切り上げ。総件数0のときは0。
          type: integer

    UserListItem:
      description: |
        一覧の1行（ApiDesign.md 6.1）。**`kind` によって意味を持たないフィールドは
        `null` を返し、フィールド自体を省略しない。** フロントの分岐を単純にするため。
      type: object
      required:
        [id, kind, display_name, email, system_role, agent, is_active,
         last_login_at, project_count, created_at]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          type: string
          enum: [user, agent]
        display_name:
          type: string
        email:
          description: エージェントは `null`。
          type: string
          nullable: true
        system_role:
          description: エージェントは `null`。
          type: string
          enum: [operator, administrator]
          nullable: true
        agent:
          description: |
            **Phase 1 では常に `null`。** 中身（`client_kind` / `model_name` /
            `project_key` / `trust_level`）は DbDesign.md 8.1 の `agent` テーブルの列で、
            そのテーブルは Phase 2 で作られる。
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentInfo'
        is_active:
          type: boolean
        last_login_at:
          description: 一度もログインしていなければ `null`。
          type: string
          format: date-time
          nullable: true
        project_count:
          description: |
            `project_member` の行数。**アーカイブ済みプロジェクトも数える**
            （詳細画面の memberships と食い違わせないため）。
          type: integer
        created_at:
          type: string
          format: date-time

    AgentInfo:
      description: |
        エージェントの付帯情報（ApiDesign.md 6.1）。**Phase 1 では返らない**
        （対応する `agent` テーブルが Phase 2 で作られるため）。
      type: object
      required: [client_kind, model_name, project_key, trust_level]
      properties:
        client_kind:
          type: string
        model_name:
          type: string
        project_key:
          type: string
        trust_level:
          type: integer

    CreateUserRequest:
      description: ユーザーの作成（ApiDesign.md 6.2）。
      type: object
      required: [display_name, email]
      properties:
        display_name:
          description: 1〜60文字（`actor.display_name` の CHECK 制約と同じ）。前後の空白は落とす。
          type: string
          minLength: 1
          maxLength: 60
        email:
          description: |
            254文字以内（RFC 5321 4.5.3.1.3）。表示名付き（`山田 <a@example.com>`）は受け付けない。
            既に使われていれば `409 already_exists`。
          type: string
          format: email
          maxLength: 254
        system_role:
          description: 省略時は `operator`。
          type: string
          enum: [operator, administrator]
          default: operator
        password_mode:
          description: 省略時は `generate`（GuiDesign.md 5.6.1 の初期選択）。
          type: string
          enum: [generate, manual]
          default: generate
        password:
          description: |
            `password_mode=manual` のときのみ必須。12文字以上（Design.md 6.3）。
            `generate` のときに送られても無視する（モード切替でフォームに残った値を弾かない）。
          type: string
          minLength: 12
          nullable: true
        must_change_password:
          description: 省略時は `true`（GuiDesign.md 5.6.1 のチェックボックスが既定でオン）。
          type: boolean
          default: true

    CreatedUser:
      description: |
        作成された利用者（ApiDesign.md 6.2 の 201）。一覧の要素（`UserListItem`）とは別で、
        作成直後に確定している値だけを返す。
      type: object
      required: [id, kind, display_name, email, system_role, is_active, generated_password]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          type: string
          enum: [user]
        display_name:
          type: string
        email:
          type: string
        system_role:
          type: string
          enum: [operator, administrator]
        is_active:
          type: boolean
        generated_password:
          description: |
            **この応答でのみ返る。** 再表示できず、監査ログにも残さない。
            形式は `<形容詞>-<名詞>-<4桁数字>`（例 `quiet-harbor-4172`）で、
            読み上げ・転記しやすい語句連結方式（ApiDesign.md 6.2）。
            `password_mode=manual` のときは `null`（呼び出し側が既に平文を持っているため）。
          type: string
          nullable: true

    UserDetail:
      description: |
        1ユーザーの詳細（ApiDesign.md 6.3）。**5.6.2 の詳細画面が必要とする情報を
        1回で返す。** 一覧の要素（`UserListItem`）とは別で、`project_count` を持たず
        代わりに `version` と3つの配列を持つ。
      type: object
      required:
        [id, kind, display_name, email, system_role, is_active, last_login_at,
         created_at, version, identities, project_memberships, sessions]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          description: '**Phase 1 は `user` のみ。** エージェントは 404 になる。'
          type: string
          enum: [user]
        display_name:
          type: string
        email:
          type: string
        system_role:
          type: string
          enum: [operator, administrator]
        is_active:
          type: boolean
        last_login_at:
          description: 一度もログインしていなければ `null`。
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        version:
          description: |
            楽観ロック用（`app_user.version`。ApiDesign.md 2.8）。`PATCH` の
            `If-Match` にこの値を入れる。**`display_name` や `is_active` を
            変えた場合も +1 される。**
          type: integer
        identities:
          description: |
            認証手段（`DbDesign.md` 6.2 の `user_identity`）。**この配列が Phase 3 の
            IdP 連携をそのまま受け入れる**——OIDC を追加しても要素が1つ増えるだけで、
            応答構造もUIも変わらない。
          type: array
          items:
            $ref: '#/components/schemas/UserIdentity'
        project_memberships:
          description: |
            プロジェクトごとの権限。**アーカイブ済みプロジェクトも含む**
            （6.1 の `project_count` と件数を食い違わせないため）。
          type: array
          items:
            $ref: '#/components/schemas/UserMembership'
        sessions:
          description: |
            有効なセッション（`access_token` の `token_type='session'` のうち、
            失効しておらず期限内のもの）。
          type: array
          items:
            $ref: '#/components/schemas/UserSession'

    UserIdentity:
      description: 認証手段1件（ApiDesign.md 6.3 の `identities[]`）。
      type: object
      required:
        [id, provider_key, provider_type, subject, linked_at, last_used_at,
         password_updated_at]
      properties:
        id:
          type: string
        provider_key:
          description: 'Phase 1 は `local` のみ（DbDesign.md 7.1 のシード）。'
          type: string
        provider_type:
          type: string
          enum: [local, oidc, saml]
        subject:
          description: |
            `local` では `app_user.email` と同じ文字列。**メールを変更すると
            この値も追随する**（そうしないとログインできなくなる）。
          type: string
        linked_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        password_updated_at:
          description: |
            `local_credential` の列。ローカル以外のプロバイダでは `null`。
            画面（5.6.2 の「認証手段」ブロック）が「最終更新」として出す。
          type: string
          format: date-time
          nullable: true

    UserMembership:
      description: |
        プロジェクトメンバーシップ1件（ApiDesign.md 6.3 の `project_memberships[]`）。
        6.8 の `PUT` もこの形を返す。
      type: object
      required: [project_id, project_key, project_name, role, joined_at]
      properties:
        project_id:
          type: string
        project_key:
          type: string
        project_name:
          type: string
        role:
          description: |
            プロジェクトロールのキー（`project_member.role_key`。
            `project_admin` / `project_member` / `project_viewer`。DbDesign.md 7.3）。
          type: string
        joined_at:
          description: '**ロールを変えても動かない。**'
          type: string
          format: date-time

    UserSession:
      description: |
        有効なセッション1件（ApiDesign.md 6.3 の `sessions[]`）。
        **平文のトークンも `token_hash` も載せない。**
      type: object
      required: [id, client_info, issued_at, last_used_at, expires_at]
      properties:
        id:
          type: string
        client_info:
          description: 発行時の User-Agent（`access_token.client_info`）。
          type: string
          nullable: true
        issued_at:
          type: string
          format: date-time
        last_used_at:
          description: 一度も使われていなければ `null`。**1分粒度で間引いて更新される**（Design.md 6.2.2）。
          type: string
          format: date-time
          nullable: true
        expires_at:
          description: 無期限なら `null`（Phase 1 のセッションは必ず入る）。
          type: string
          format: date-time
          nullable: true

    UpdateUserRequest:
      description: |
        ユーザーの更新（ApiDesign.md 6.4）。**送られたフィールドだけを更新する。**
        4項目とも `null` への更新は無い。
      type: object
      properties:
        display_name:
          description: 1〜60文字。前後の空白は落とす（作成時と同じ検証）。
          type: string
          minLength: 1
          maxLength: 60
        email:
          description: |
            254文字以内。既に使われていれば `409 already_exists`。
            **変更すると `user_identity.subject` も追随する。**
          type: string
          format: email
          maxLength: 254
        system_role:
          description: |
            変更すると権限キャッシュが無効化される（Design.md 6.4.5）。
            自分自身の変更は `409 self_modification_forbidden`、最後の有効な
            アドミニストレータの降格は `409 last_administrator`。
          type: string
          enum: [operator, administrator]
        is_active:
          description: |
            `false` にすると次のリクエストから認証を通れなくなる（`Authenticate` が
            `actor.is_active` を見る）。**セッションは失効させない**——必要なら
            6.7 を別に呼ぶ。自分自身の無効化は `409 self_modification_forbidden`。
          type: boolean

    PasswordResetRequest:
      description: |
        パスワードのリセット（ApiDesign.md 6.6）。**本文そのものを省略してもよい。**
      type: object
      properties:
        mode:
          description: '**`generate` のみ受け付ける。** 省略時も `generate`。'
          type: string
          enum: [generate]
          default: generate
        must_change_password:
          description: 省略時は `true`。
          type: boolean
          default: true

    GeneratedPassword:
      description: 生成された初期パスワード（ApiDesign.md 6.6 の 200）。
      type: object
      required: [generated_password]
      properties:
        generated_password:
          description: |
            **この応答でのみ返る。** 再表示できず、監査ログにも残さない。
            形式は `<形容詞>-<名詞>-<4桁数字>`（例 `quiet-harbor-4172`。
            ApiDesign.md 6.2.1）。
          type: string

    MembershipRequest:
      description: プロジェクトメンバーシップの付与・変更（ApiDesign.md 6.8）。
      type: object
      required: [role]
      properties:
        role:
          description: |
            プロジェクトロールのキー。妥当性はDB（`role.scope='project'`）に
            問い合わせるため、ここでは列挙しない——`enum` に書き写すと
            DbDesign.md 7.3 のシードと二重管理になる。
          type: string
          examples: ['project_admin']

    ProjectList:
      description: 一覧の共通エンベロープ（ApiDesign.md 2.6）。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          description: 切り上げ。総件数0のときは0。
          type: integer

    ProjectListItem:
      type: object
      required:
        [id, key, name, description, status, ticket_count, closed_count, progress,
         my_role, updated_at]
      properties:
        id:
          type: string
        key:
          type: string
          examples: ['my-app']
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, archived]
        ticket_count:
          type: integer
        closed_count:
          description: '`ticket.closed_at IS NOT NULL` の件数（DbDesign.md 6.6）。'
          type: integer
        progress:
          description: |
            `closed_count / ticket_count`。**サーバで計算する**（定義をフロントに散らさないため）。
            `ticket_count = 0` のときは `0`（null にしない。ApiDesign.md 5.1）。
          type: number
          examples: [0.75]
        my_role:
          description: |
            当該プロジェクトでのプロジェクトロール。
            **メンバーでないアドミニストレータでは null**（5.1 の「管理者は全件」で返る行）。
          type: [string, 'null']
          examples: ['project_admin']
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [key, name]
      properties:
        key:
          description: |
            `^[a-z0-9][a-z0-9-]{1,19}$`。予約語（`admin` `api` `mcp` `login` `logout`
            `me` `p` `new` `projects` `static` `assets` `check-key`）は使えない。
            **作成後は変更不可。**
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,19}$'
          examples: ['my-app']
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        workflow_template:
          description: 実体は DbDesign.md 7.4 のテンプレート。
          type: string
          enum: [simple, with_review, with_approval]
          default: simple

    UpdateProjectRequest:
      description: |
        `PATCH /projects/:key` の本文（ApiDesign.md 5.5）。**送られたフィールドだけを
        更新する**ため required は無い。`key` は受け付けず、送ると 422
        （`details[].code` が `immutable_field`）になる。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          description: |
            `null` を明示すると説明を消す。フィールドごと送らなければ据え置く。
            空文字は `null` と同じ扱い（`POST /projects` に合わせる）。
          type: [string, 'null']
          maxLength: 1000
        settings:
          description: |
            `project.settings`（jsonb）をそのまま置き換える。**部分更新ではない**ので、
            取得した値を保持し、変更するキーだけ差し替えて全体を送ること。

            サーバは JSON オブジェクトであることしか検証しない。Phase 1 の画面が
            使うキーは `repositories` のみで、構造の正本は DbDesign.md 6.4 にある。
          type: object
          additionalProperties: true

    ProjectDetail:
      description: |
        `POST /projects`・`GET /projects/:key`・`PATCH /projects/:key`・
        archive / unarchive が返す共通の本体（ApiDesign.md 5.4）。
        **どれか1つだけ形を変えない。**
      type: object
      required:
        [id, key, name, description, status, workflow, members, my_role,
         my_permissions, settings, version, created_at, updated_at]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, archived]
        workflow:
          description: '`project.workflow_id` が NULL のときは null。'
          oneOf:
            - $ref: '#/components/schemas/Workflow'
            - type: 'null'
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        my_role:
          description: メンバーでないアドミニストレータでは null。
          type: [string, 'null']
        my_permissions:
          description: |
            当該プロジェクトでの実効権限
            （システムロール ∪ プロジェクトロール ∩ スコープ。Design.md 6.4.1）。
          type: array
          items:
            type: string
        settings:
          description: |
            `project.settings`（jsonb）をそのまま返す。Phase 1 の画面が使うキーは
            `repositories` のみで、構造の正本は DbDesign.md 6.4 にある。
          type: object
          additionalProperties: true
        version:
          description: 楽観ロック用（ApiDesign.md 2.8）。作成直後は 1。
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Workflow:
      type: object
      required: [id, name, statuses]
      properties:
        id:
          type: string
        name:
          type: string
        statuses:
          description: '`sort_order` の昇順。'
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatus'

    WorkflowStatus:
      type: object
      required:
        [key, name, category, sort_order, requires_human_approval, is_agent_reachable]
      properties:
        key:
          type: string
          examples: ['todo']
        name:
          type: string
          examples: ['未着手']
        category:
          type: string
          enum: [todo, in_progress, review, done]
        sort_order:
          type: integer
        requires_human_approval:
          description: 人間の承認を要するステータス（Requirements.md 10.10.4）。
          type: boolean
        is_agent_reachable:
          description: エージェントが遷移させてよいか。
          type: boolean

    ProjectMember:
      type: object
      required: [actor_id, kind, display_name, email, role, joined_at]
      properties:
        actor_id:
          type: string
        kind:
          description: エージェントもプロジェクトのメンバーになれる（DbDesign.md 6.3）。
          type: string
          enum: [user, agent, system]
        display_name:
          type: string
        email:
          description: |
            `app_user.email`（DbDesign.md 6.2）。**エージェントとシステムアクターは
            `app_user` の行を持たないため null**。キーは常に返す。
          type: [string, 'null']
          examples: ['tanaka@example.com']
        role:
          type: string
          examples: ['project_admin']
        joined_at:
          type: string
          format: date-time

    CheckKeyResult:
      type: object
      required: [key, available]
      properties:
        key:
          type: string
        available:
          type: boolean
        reason:
          description: '`available: false` のときだけ現れる（ApiDesign.md 5.2）。'
          type: string
          enum: [reserved, already_exists, invalid_format]

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: OK
        version:
          description: '`PB_HEALTH_SHOW_VERSION=true` のときだけ出る（既定は出ない）。'
          type: string

    Error:
      description: |
        全エンドポイント共通のエラー形式（ApiDesign.md 2.5）。
        `message` はそのまま画面に出せる日本語。**フロントで文言を組み立てない。**
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              examples: ['メールアドレスまたはパスワードが正しくありません']
            details:
              description: フィールド単位のエラー。フォームの入力欄に紐づける。
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            retry_after_sec:
              description: |
                再試行までの秒数。`account_locked` と `rate_limited` で返す。
                同じ値が `Retry-After` ヘッダにも入る。
              type: integer
            request_id:
              description: |
                `audit_log.request_id`（DbDesign.md 6.8）および構造化ログ
                （Design.md 10.1）と突き合わせられる。
              type: string
              examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']

    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    Tag:
      description: |
        タグ1件（ApiDesign.md 9.11）。**色を持たない**——GuiDesign.md 8.6 が
        ラベルへの任意色を許さない（ユーザーごとに色の意味が食い違い、一覧が
        虹色になって輝度による階層が崩れるため）。
      type: object
      required: [id, name, sort_order, ticket_count]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          minLength: 1
          maxLength: 30
          example: 設計
        sort_order:
          type: integer
          format: int32
          description: バックログのグループ化セクションの順序（GuiDesign.md 5.9.4）。
          example: 10
        ticket_count:
          type: integer
          format: int64
          description: |
            このタグが付いているチケットの件数。削除確認ダイアログが
            「12件のチケットで使われています」を出すために使う（GuiDesign.md 6.3）。
          example: 12

    TagList:
      description: |
        タグの一覧（ApiDesign.md 9.11）。**`page` / `per_page` / `total` を持たない**
        ——バックログのグループ化が全件を必要とするため。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: 前後の空白は取り除かれる。同一プロジェクト内で一意。
          example: 設計
        sort_order:
          type: integer
          format: int32
          description: 省略時は末尾（現在の最大値 + 10）。
          nullable: false

    PatchTagRequest:
      description: |
        送られた項目だけを変える。何も送らない場合は現在の値をそのまま返す。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        sort_order:
          type: integer
          format: int32
          description: 並べ替え（ApiDesign.md 9.11.1）はこの項目で表現する。

    Sprint:
      description: スプリント1件（ApiDesign.md 9.12）。
      type: object
      required: [id, name, goal, start_date, end_date, status, ticket_count, closed_count]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Sprint 3
        goal:
          type: string
          nullable: true
          example: 認証を通す
        start_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-05'
        end_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-18'
        status:
          $ref: '#/components/schemas/SprintStatus'
        ticket_count:
          type: integer
          format: int64
          description: このスプリントに割り当てられたチケットの件数。
          example: 12
        closed_count:
          type: integer
          format: int64
          description: |
            そのうち `closed_at IS NOT NULL` の件数。**`status_category = 'done'` では
            数えない**（ApiDesign.md 9.12）。画面は `5/12` の形で出す。
          example: 5

    SprintStatus:
      description: DbDesign.md 6.9 の CHECK と同じ3値。
      type: string
      enum: [planned, active, completed]

    SprintList:
      description: |
        スプリントの一覧（ApiDesign.md 9.12）。タグと同じくページャを持たない。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sprint'

    CreateSprintRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 前後の空白は取り除かれる。**一意制約は無い**（同名を作れる）。
        goal:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
          description: '`start_date` があるとき `start_date <= end_date`。'
        status:
          $ref: '#/components/schemas/SprintStatus'

    PatchSprintRequest:
      description: |
        送られた項目だけを変える。**`goal` / `start_date` / `end_date` は `null` を
        送ると値を消す**（キーが無い場合の「据え置き」と区別する）。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        goal:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        status:
          $ref: '#/components/schemas/SprintStatus'

    ActorRef:
      description: |
        アクターの参照（担当者・報告者。ApiDesign.md 9.2.2）。**`kind` を必ず返す**
        ——画面はこれを見てエージェントに 🤖 バッジを付ける（GuiDesign.md 5.4、設計原則5）。
      type: object
      required: [id, kind, display_name]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        kind:
          type: string
          enum: [user, agent, system]
        display_name:
          type: string
          example: 田中

    TicketStatus:
      description: |
        チケットのステータス（ApiDesign.md 9.2.2）。`name` は画面に出す日本語、
        `category` はバッジの見た目を決める4値（GuiDesign.md 8.7）。
      type: object
      required: [key, name, category]
      properties:
        key:
          type: string
          example: in_progress
        name:
          type: string
          example: 進行中
        category:
          type: string
          enum: [todo, in_progress, review, done]

    TicketTagRef:
      description: チケットに付いているタグ（ApiDesign.md 9.2.2）。**色を持たない**（GuiDesign.md 8.6）。
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          example: 設計

    TicketSprintRef:
      description: チケットが属するスプリント（ApiDesign.md 9.2.2）。
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          example: Sprint 3

    Ticket:
      description: |
        チケット1件（ApiDesign.md 9.2.2 の `items[]`）。

        **`body_md` を持たない。** 一覧は本文を表示せず、200件分の Markdown は応答を
        数十倍にする。本文が要るのは詳細（9.5）だけである。
        **`execution_mode` / `readiness` / `readiness_note` / `scope` / `custom_fields` も
        持たない**——列は DbDesign.md 6.6 に先行定義されているが、GuiDesign.md 5.5 が
        「Phase 1 では非表示」と決めている。画面が使わない項目を応答に載せない
        （載せると、使われないまま形が固まる）。

        **完全形 `my-app-31` はサーバが組み立てない**（9.1）。プロジェクトキーは URL に
        含まれており、フロントが `${key}-${seq}` を組める。
      type: object
      required:
        [id, seq, type, title, status, priority, assignee, reporter, parent_seq,
         has_children, sort_key, staged_at, tags, sprint, estimate_point, estimate_hours,
         actual_hours, start_date, due_date, closed_at, version, created_at, updated_at]
      properties:
        id:
          type: string
          description: |
            ULID。**リクエストでチケットを指定する箇所はすべて `seq`** であり、この項目は
            `activity.entity_id` との突き合わせと Phase 2 のエージェント連携が使う（9.1）。
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        seq:
          type: integer
          format: int32
          example: 31
        type:
          type: string
          enum: [epic, story, task]
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: 認証APIの実装
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
          nullable: true
        assignee:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
          description: 担当者不在のとき null。
        reporter:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        parent_seq:
          type: integer
          format: int32
          nullable: true
          description: |
            親チケットの `seq`。**フィルタで親が結果から落ちても保たれる**（9.2.4）。
            画面は「親が結果に含まれていない子」をトップレベルに並べる。
        has_children:
          type: boolean
          description: |
            **プロジェクト内に子がいるか**であって「結果の中に子がいるか」ではない。
        sort_key:
          type: string
          nullable: true
          description: |
            LexoRank 方式の並び順（9.4）。**クライアントはこの値を作らない。**
            並べ替えは `POST /tickets/:seq/move` で行う。
          example: '0|hzzzzz:'
        staged_at:
          type: string
          format: date-time
          nullable: true
          description: |
            「オンステージ」（9.2.2、DbDesign.md 6.6）。`null` がバックログ、
            値が入っているものがオンステージで、値は**いつ上げたか**である。
            バックログ画面はこの1項目で上下二段に振り分ける（GuiDesign.md 5.4）。
            **進捗（`status`）とは独立した軸**で、「未着手だがオンステージ」を表せる。
            **段の出し入れは `POST /tickets/:seq/move`** で行う（9.4.1）。
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TicketTagRef'
        sprint:
          allOf: [$ref: '#/components/schemas/TicketSprintRef']
          nullable: true
        estimate_point:
          type: number
          format: double
          nullable: true
        estimate_hours:
          type: number
          format: double
          nullable: true
        actual_hours:
          type: number
          format: double
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
          description: |
            **`date` 列であって時刻を持たない**（DbDesign.md 6.6）。画面は
            `new Date()` を通さずに整形すること——UTC より西の地域で前日へずれる。
          example: '2026-08-09'
        due_date:
          type: string
          format: date
          nullable: true
          example: '2026-08-14'
        closed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            **ステータス遷移の副作用としてのみ動く**（DbDesign.md 6.6）。直接は更新できない。
        version:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: |
            **`ticket_tag` の付け外しでも動く**（9.2.5）。動かさないと、タグだけを
            変えた場合に一覧の `ETag` が変わらない。

    TicketList:
      description: |
        チケットの一覧（ApiDesign.md 9.2.2）。**`page` / `per_page` / `total` /
        `total_pages` は規約どおり返す**（2.6）。画面がページャを出さないだけである
        （9.2.3）。`total > per_page` になったとき、画面は件数とともに
        「フィルタで絞り込んでください」を表示する。**サーバは 200 件で打ち切るだけで、
        エラーにはしない。**
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    TicketBrief:
      description: 親チケットの要約（ApiDesign.md 9.5.1 の `parent`）。
      type: object
      required: [seq, title, type, status]
      properties:
        seq:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          enum: [epic, story, task]
        status:
          $ref: '#/components/schemas/TicketStatus'

    TicketChild:
      description: 直下の子の要約（ApiDesign.md 9.5.1 の `children`）。**孫は含めない。**
      type: object
      required: [seq, title, type, status, assignee]
      properties:
        seq:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          enum: [epic, story, task]
        status:
          $ref: '#/components/schemas/TicketStatus'
        assignee:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true

    TicketDetail:
      description: |
        チケット1件の詳細（ApiDesign.md 9.5.1）。**9.2 の `items[]` に6項目を加えたもの。**
        手順16b では `POST /tickets` の応答として返る（9.3 が「応答は 9.5 の `GET` と
        同形式」と定めるため）。`GET /tickets/:seq` そのものは手順17 で足す。

        **`dod` / `links` / `comment_count` は手順18 まで空・0 である。** 中身を作るのは
        9.9 / 9.10 / 9.8 だが、作りたてのチケットではいずれも空・0 が正しい値であり、
        手順18 で項目が生えたように見せないほうが消費者にとって安定する。
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [body_md, parent, children, dod, links, comment_count]
          properties:
            body_md:
              type: string
              nullable: true
              description: 本文（Markdown ソース）。
            parent:
              allOf: [$ref: '#/components/schemas/TicketBrief']
              nullable: true
            children:
              type: array
              items:
                $ref: '#/components/schemas/TicketChild'
            dod:
              type: array
              items: {}
              description: 完了条件（ApiDesign.md 9.9）。**要素の形は手順18 で決まる。**
            links:
              type: array
              items: {}
              description: 関連リンク（ApiDesign.md 9.10）。**要素の形は手順18 で決まる。**
            comment_count:
              type: integer
              format: int64
              description: コメント件数（本文は含めない。ApiDesign.md 9.8）。

    CreateTicketRequest:
      description: |
        チケットの作成（ApiDesign.md 9.3）。**`status_key` / `sort_key` / `seq` /
        `reporter_id` / `version` は含められない**——いずれもサーバが決める。
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [epic, story, task]
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 前後の空白は取り除かれる。
        body_md:
          type: string
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
        assignee_id:
          type: string
          description: |
            **当該プロジェクトの `project_member` であること。** 違えば 422
            （`details[].code = "not_a_member"`）。
        parent_seq:
          type: integer
          format: int32
          minimum: 1
          description: 同一プロジェクトに存在すること（9.1）。
        tag_ids:
          type: array
          items:
            type: string
          description: すべて当該プロジェクトのタグであること。重複は畳まれる。
        sprint_id:
          type: string
          description: 当該プロジェクトのスプリントであること。
        estimate_point:
          type: number
          format: double
          minimum: 0
        estimate_hours:
          type: number
          format: double
          minimum: 0
        start_date:
          type: string
          format: date
          description: '`YYYY-MM-DD`。時刻つきの文字列は受け付けない。'
        due_date:
          type: string
          format: date
          description: |
            `start_date` と両方あるとき `start_date <= due_date`
            （DbDesign.md 6.6 の `ck_ticket_dates`）。

    MoveTicketRequest:
      description: |
        並べ替えの指定（ApiDesign.md 9.4）。

        | 指定 | 意味 |
        |---|---|
        | `{"after_seq": 44}` | 44 の直後へ |
        | `{"before_seq": 44}` | 44 の直前へ |
        | `{"after_seq": 44, "before_seq": 12}` | 44 と 12 の間へ |
        | `{"position": "first"}` | 段の先頭へ |
        | `{"position": "last"}` | 段の末尾へ |
        | `{"staged": true, "position": "first"}` | **オンステージ**へ上げ、その先頭に置く |
        | `{"staged": false, "after_seq": 44}` | **バックログ**へ戻し、44 の直後に置く |

        `position` と `after_seq` / `before_seq` の同時指定は 422。いずれも無い場合も 422。
        **動かすチケット自身を基準にはできない**（422）。

        **`position` は段の中で解釈する**（9.4.1）。`"first"` は「オンステージの先頭」で
        あって「プロジェクト全体の先頭」ではない。**`after_seq` / `before_seq` は段を
        問わない**——`sort_key` はプロジェクト内で1本だからである。
      type: object
      properties:
        after_seq:
          type: integer
          format: int32
          minimum: 1
        before_seq:
          type: integer
          format: int32
          minimum: 1
        position:
          type: string
          enum: [first, last]
        staged:
          type: boolean
          description: |
            段を変える（9.4.1）。`true` でオンステージ、`false` でバックログへ戻す。
            **省略すると段は変わらない**（並べ替えだけを行う）。
            **段に置けるのは表示上のトップレベルだけ**——親を持たないもの、または
            親がエピックのもの。それ以外に `true` を送ると 422
            （`details[].code = "not_stageable"`）。

    MoveTicketResult:
      description: 並べ替えの結果（ApiDesign.md 9.4）。
      type: object
      required: [seq, sort_key, staged_at, version, rebalanced]
      properties:
        seq:
          type: integer
          format: int32
        sort_key:
          type: string
          example: '0|hzzzr:'
        staged_at:
          type: string
          format: date-time
          nullable: true
          description: '移動後の段（9.4.1）。`null` がバックログ。'
        version:
          type: integer
          format: int32
          description: '**`If-Match` を要求しないが、`version` は +1 される**（9.4）。'
        rebalanced:
          type: boolean
          description: |
            隣接する2つのキーの間に新しいキーを作れず、プロジェクト全体の `sort_key` を
            振り直したことを示す。**`true` のとき、クライアントは一覧を取り直す**
            （手元の `sort_key` がすべて古くなっている）。
            **振り直しは他のチケットの `version` を上げない**——全行に触るので、
            上げると開いている詳細画面がすべて 409 になる。

    ErrorCode:
      description: ApiDesign.md 2.5.1 の15コード。
      type: string
      enum:
        - bad_request
        - unauthenticated
        - invalid_credentials
        - forbidden
        - csrf_failed
        - not_found
        - method_not_allowed
        - conflict
        - already_exists
        - last_administrator
        - self_modification_forbidden
        - validation_failed
        - account_locked
        - rate_limited
        - internal_error

security:
  - cookieAuth: []
    csrfToken: []
  - bearerAuth: []
