# Project Backyard — 実装済みAPIの現状
#
# 本ファイルは設計の写しではなく **実装されているAPIの記述** である（ApiDesign.md 1.3）。
# 設計の正本は ApiDesign.md にあり、まだ実装されていないエンドポイントはここに書かない。
#
# - 生成器を通さずに保守する（Design.md 3.3）。コード生成は client の TypeScript 型のみ
# - APIを追加・変更したステップの成果物に本ファイルの更新を含める
# - 実装との食い違いは server/internal/httpapi/openapi_drift_test.go が検出する
#   （chi.Walk のルート一覧と本ファイルの paths を突き合わせる）
#
# info.version は /api/v1 の契約バージョンであり、リポジトリの VERSION とは連動させない。

openapi: 3.1.0

info:
  title: Project Backyard API
  version: 1.0.0
  description: |
    人間とAIエージェントが共同で使うプロジェクト管理ツールの REST API。

    実装済みの範囲のみを記述する。設計の正本は `docs/ApiDesign.md`。

servers:
  # /healthcheck は唯一 /api/v1 の外にあるため（ApiDesign.md 2.11）、
  # ベースをルートに置き、paths 側に完全なパスを書く。
  - url: /
    description: 同一オリジン

tags:
  - name: auth
    description: 認証（ApiDesign.md 3章）
  - name: me
    description: 自分自身（ApiDesign.md 4章）
  - name: projects
    description: プロジェクト（ApiDesign.md 5章）
  - name: admin
    description: ユーザー管理（ApiDesign.md 6章）。すべてアドミニストレータ専用
  - name: ops
    description: 監視（ApiDesign.md 2.11）

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: ログイン
      operationId: login
      description: |
        メールアドレスとパスワードで認証し、セッションを発行する（ApiDesign.md 3.1）。

        応答本文は `GET /api/v1/me` と同じ内容を含む。ログイン直後に必ず権限が必要になるため、
        往復を1回減らしている。

        認証不要。IPあたり 10回/分のレート制限が掛かる（ApiDesign.md 2.9）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            認証成功。`pb_session` と `pb_csrf` の2つの Cookie を発行する。
            **両者の Max-Age は揃える**（ApiDesign.md 3.1）。
          headers:
            Set-Cookie:
              description: |
                ```
                pb_session=pb_sess_...; HttpOnly; SameSite=Lax; Path=/; Max-Age=1209600
                pb_csrf=...; SameSite=Lax; Path=/; Max-Age=1209600
                ```
                `Secure` は設定 `PB_COOKIE_SECURE` が true のときに付く。
              schema:
                type: string
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            認証失敗。**ユーザー不在・誤パスワード・アカウント無効を区別しない**
            （`invalid_credentials`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: |
            ログイン失敗が続いたことによるロック中（`account_locked`）。
            残り秒数を `error.retry_after_sec` と `Retry-After` ヘッダに入れる。
            **閾値に達した回から**この応答になる（ApiDesign.md 3.1）。
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: ログアウト
      operationId: logout
      description: |
        現在のセッショントークンを失効させ（`revoked_at` を設定）、Cookie を削除する
        （ApiDesign.md 3.2）。Cookie 認証のため `X-PB-CSRF` が必要（2.4）。
      responses:
        '204':
          description: |
            失効済み。`pb_session` と `pb_csrf` を削除する Set-Cookie を返す。
          headers:
            Set-Cookie:
              description: 2つの Cookie を `Max-Age=-1` で削除する。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me:
    get:
      tags: [me]
      summary: 自分自身と実効権限
      operationId: getMe
      description: |
        認証中のアクターと実効権限を返す（ApiDesign.md 4.1）。

        `permissions` はシステムロール由来の実効権限、`projects[].permissions` は
        当該プロジェクトでの実効権限（システムロール ∪ プロジェクトロール ∩ スコープ。
        Design.md 6.4.1）。`projects[]` にはアーカイブ済みのプロジェクトも含む。
      responses:
        '200':
          description: 認証中のアクター。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects:
    get:
      tags: [projects]
      summary: プロジェクト一覧
      operationId: listProjects
      description: |
        自分がメンバーであるプロジェクトを返す。アドミニストレータは全件（ApiDesign.md 5.1）。

        **必要権限は `project.view`。** ただしこの権限は「どのプロジェクトが見えるか」を
        決めない（オペレータもシステムロールとして持つ）。可視範囲はメンバーシップで絞る。

        `ticket_count` / `closed_count` / `progress` を含めるのは、プロジェクトごとに
        件数を問い合わせる N+1 を避けるためである（5.1）。
      parameters:
        - name: status
          in: query
          description: 既定は `active`。
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, key, updated_at, ticket_count, progress]
            default: updated_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: 1ページ分のプロジェクト。
          headers:
            ETag:
              description: |
                弱い検証子 `W/"proj-<件数>-<MAX(updated_at) のナノ秒>"`（ApiDesign.md 2.7）。
                **Phase 1 では `If-None-Match` を解釈しない**（304 を返さない）。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [projects]
      summary: プロジェクトの作成
      operationId: createProject
      description: |
        プロジェクトを作成する（ApiDesign.md 5.3）。必要権限は `project.create`
        （Phase 1 = アドミニストレータのみ）。

        サーバ側は `project` 作成・`project_counter` 初期化・テンプレートからの
        ワークフロー複製・作成者の `project_admin` 登録・`audit_log` への記録を
        **単一トランザクション**で行う。

        キー重複の検出はDBの `UNIQUE` 制約に委ねる（`check-key` の結果は信頼しない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 作成された。応答は `GET /projects/:key` と同形式（5.4）。
          headers:
            Location:
              description: '`/api/v1/projects/<key>`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            プロジェクトキーが既に使われている（`already_exists`。ApiDesign.md 5.3）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/check-key:
    get:
      tags: [projects]
      summary: プロジェクトキーの利用可否
      operationId: checkProjectKey
      description: |
        新規作成モーダルの即時検証に使う（ApiDesign.md 5.2）。

        判定の順は 形式 → 予約語 → 既存。**この結果は作成時の重複検出には使わない**
        （5.3。競合検出はDBの `UNIQUE` 制約に委ねる）。

        必要権限は作成と同じ `project.create`。
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          examples:
            available:
              value: my-app
      responses:
        '200':
          description: 判定結果。**使えない場合も 200 で返す**（エラーではない）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckKeyResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: プロジェクトの詳細
      operationId: getProject
      description: |
        1プロジェクトの本体・ワークフロー・メンバー・自分の実効権限を返す
        （ApiDesign.md 5.4）。必要権限は `project.view`。

        **メンバーでなければ 404**（403 ではない。Design.md 6.4.5）。403 で返すと
        「そのキーのプロジェクトは在る」と漏れ、キーを変えながら叩けば
        プロジェクトの一覧を復元できてしまう。アドミニストレータは全件に到達できる。

        `my_permissions` は認可ミドルウェアと同じ集合から作る
        （( システムロール ∪ プロジェクトロール ) ∩ スコープ。Design.md 6.4.1）。
      responses:
        '200':
          description: プロジェクトの詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            プロジェクトが存在しない、または到達できない（`not_found`）。
            **両者を区別しない**（Design.md 6.4.5）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [projects]
      summary: プロジェクトの更新
      operationId: updateProject
      description: |
        `name` / `description` / `settings` を更新する（ApiDesign.md 5.5）。
        必要権限は `project.edit`。

        **送られたフィールドだけを更新する**（部分更新）。`"description": null` は
        「説明を消す」であり、`description` を送らない（据え置く）とは区別する。

        **`key` は変更できない。** 送られた場合は 422 で、`details[].code` が
        `immutable_field` になる（`error.code` は `validation_failed`）。

        **`If-Match` は必須**（2.8）。省略すると 422（`details[].field` が
        `If-Match`）、現在の `version` と食い違えば 409。成功すると `version` が +1 される。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 更新後のプロジェクト（5.4 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `If-Match` が現在の `version` と一致しない（`conflict`。ApiDesign.md 2.8）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [projects]
      summary: プロジェクトのアーカイブ
      operationId: archiveProject
      description: |
        `status` を `archived` にし、`archived_at` に現在時刻を入れる
        （ApiDesign.md 5.6）。必要権限は `project.archive`。

        リクエスト本文は取らない。**`If-Match` は要求しない**（2.8）。冪等であり、
        競合しても失われる編集内容がないためである。ただし `version` は +1 する。

        **既にアーカイブ済みなら何も変えずに 200 を返す。** そのとき `version` は
        進まず、監査ログにも残さない（空振りで本当の切り替えが埋もれるため）。

        監査は `project.archive` として記録し、`detail.status` で unarchive と区別する。
      responses:
        '200':
          $ref: '#/components/responses/ProjectStatusChanged'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [projects]
      summary: プロジェクトのアーカイブ解除
      operationId: unarchiveProject
      description: |
        `status` を `active` に戻し、`archived_at` を `null` にする
        （ApiDesign.md 5.6）。archive と同じ経路を通り、渡す `status` だけが違う。

        必要権限・冪等性・監査の扱いは archive と同じ。
      responses:
        '200':
          $ref: '#/components/responses/ProjectStatusChanged'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: ユーザー一覧
      operationId: listUsers
      description: |
        人間とエージェントを同じ一覧に返す（ApiDesign.md 6.1、DbDesign.md 6.2 の
        `actor` 統合設計）。**必要権限は `user.manage`**（Phase 1 = アドミニストレータのみ）。

        `kind` によって意味を持たないフィールドは `null` を返し、フィールド自体を
        省略しない。**`agent` は Phase 1 では常に `null`**（中身にあたる
        `agent` テーブルは Phase 2 で作られる）。

        `kind = 'system'` の actor は返さない。

        `project_count` は `project_member` の行数で、アーカイブ済みプロジェクトも数える。
      parameters:
        - name: kind
          in: query
          description: 既定は `all`。
          schema:
            type: string
            enum: [user, agent, all]
            default: all
        - name: is_active
          in: query
          description: 既定は `all`。**真偽値ではなく3値の文字列**（未指定と false を区別する）。
          schema:
            type: string
            enum: ['true', 'false', all]
            default: all
        - name: q
          in: query
          description: |
            表示名・メールアドレス・**ロールの表示名**の部分一致。ロールは `role.display_name`
            （「アドミニストレータ」「オペレータ」）と比べる。**画面に出ないキー
            （`administrator`）は対象にしない。** `%` と `_` はサーバ側でエスケープするため
            ワイルドカードとしては働かない。**画面は検索欄を常時表示する**（GuiDesign.md 5.6）。
          schema:
            type: string
        - name: sort
          in: query
          description: |
            `system_role` は `role.sort_order` の順（オペレータ → アドミニストレータ）で、
            表示名の五十音順ではない。**ロールを持たない行（エージェント）は昇順・降順とも末尾。**
            `is_active` の昇順は無効が先（`false < true`）。
          schema:
            type: string
            enum: [display_name, email, system_role, is_active, last_login_at, created_at]
            default: display_name
        - name: order
          in: query
          description: |
            既定は `asc`。名簿は昇順で読むためで、他の一覧（`GET /projects` は `desc`）とは
            既定が違う。
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: 1ページ分のユーザー。
          headers:
            ETag:
              description: |
                弱い検証子 `W/"user-<件数>-<MAX(updated_at) のナノ秒>"`（ApiDesign.md 2.7）。
                `updated_at` は `actor` と `app_user` の新しいほうを採る。
                **Phase 1 では `If-None-Match` を解釈しない**（304 を返さない）。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: ユーザーの作成
      operationId: createUser
      description: |
        ユーザーを作成する（ApiDesign.md 6.2）。必要権限は `user.manage`。

        サーバ側は `actor` → `app_user` → `user_identity`（`provider_key='local'`,
        `subject=email`）→ `local_credential` と `audit_log` への記録を
        **単一トランザクション**で行う（DbDesign.md 6.2）。

        メール重複の検出はDBの `UNIQUE` 制約に委ねる。

        **`generated_password` はこの応答でのみ返る。** 再表示できず、監査ログにも残さない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 作成された。
          headers:
            Location:
              description: '`/api/v1/admin/users/<id>`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            メールアドレスが既に使われている（`already_exists`。ApiDesign.md 6.2）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [admin]
      summary: ユーザーの詳細
      operationId: getUser
      description: |
        1ユーザーの本体・認証手段・プロジェクトごとの権限・有効なセッションを
        1回で返す（ApiDesign.md 6.3）。必要権限は `user.manage`。
        `GuiDesign.md` 5.6.2 の詳細画面が必要とする情報がここに揃う。

        **`kind='user'` のアクターだけを返す。** エージェント・システムアクターは
        404 になる（手順13a の判断）。応答の `version` は `app_user` の列であり、
        `app_user` の行を持たないアクターでは 6.4 の楽観ロックが成立しないため。
        エージェントの詳細は `agent` テーブル（DbDesign.md 8.1）ができる
        Phase 2 で、列構成ごと設計する。

        **一覧（6.1）と違い `ETag` は返さない。** 鮮度は本体の `version` が表す。
      responses:
        '200':
          description: ユーザーの詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            ユーザーが存在しない、または `kind` が `user` ではない（`not_found`）。
            **両者を区別しない**（ApiDesign.md 1.2-5）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [admin]
      summary: ユーザーの更新
      operationId: updateUser
      description: |
        `display_name` / `email` / `system_role` / `is_active` を更新する
        （ApiDesign.md 6.4）。必要権限は `user.manage`。

        **送られたフィールドだけを更新する**（部分更新）。

        **`If-Match` は必須**（2.8）。省略すると 422、現在の `version` と
        食い違えば 409。`display_name` や `is_active`（`actor` の列）だけを
        変えた場合も `version` は +1 される——**ユーザー1人につき `version` は1つ**
        という約束にしないと、直後に古い `version` でもう一度更新が通ってしまう。

        **`email` を変えると `user_identity.subject`（`provider_key='local'`）も
        追随する。** ログインは `subject = app_user.email` で突き合わせるため
        （Design.md 6.2.1 手順2〜3）、片方だけ変えると当人がログインできなくなる。

        `system_role` を変えたときは当該アクターの権限キャッシュを無効化する
        （Design.md 6.4.5）。監査には常に `user.update` を、ロールが変わったときは
        加えて `role.change` を記録する。

        **3つのガードは API 側にある**（6.4）。UIだけで防ぐと、直接APIを叩いた
        場合に誰もログインできないインスタンスが生まれうる。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新後のユーザー（6.3 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            次のいずれか（ApiDesign.md 6.4）。

            - `conflict` — `If-Match` が現在の `version` と一致しない（2.8）
            - `already_exists` — `email` が既に使われている
            - `self_modification_forbidden` — 自分自身のロール変更・無効化
            - `last_administrator` — 最後の有効なアドミニストレータの降格・無効化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: ユーザーの削除
      operationId: deleteUser
      description: |
        物理削除する（ApiDesign.md 6.5、DbDesign.md 4.6）。必要権限は `user.manage`。

        `actor` の削除により `app_user` / `user_identity` / `local_credential` /
        `access_token` / `project_member` が CASCADE で消える。
        `ticket.assignee_id` は `ON DELETE SET NULL` のため**チケットは残る**。

        `comment.author_id` は `NOT NULL` かつ `ON DELETE RESTRICT` のため、
        **削除前にシステムアクター（`kind='system'` の「削除されたユーザー」）へ
        付け替える**（DbDesign.md 6.7）。このアクターはシードに無く、**最初に
        必要になった削除で作る**（手順13a の判断。Phase 1 は `comment` を作る
        経路が無いため、実際には作られない）。

        削除前に `audit_log` へ `user.delete` を記録し、`detail` に削除時点の
        表示名・メール・ロールを保存する。

        **`If-Match` は要求しない**（2.8）。失われる編集内容が無く、競合しても
        「消えている」に収束するため。無効化のみ行いたい場合は 6.4 の
        `is_active: false` を使う。
      responses:
        '204':
          description: 削除された。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            自分自身（`self_modification_forbidden`）、または最後の有効な
            アドミニストレータ（`last_administrator`）。ApiDesign.md 6.5。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: パスワードのリセット
      operationId: resetUserPassword
      description: |
        当該ユーザーの `local_credential` を差し替える（ApiDesign.md 6.6）。
        必要権限は `user.manage`。

        `failed_attempts` と `locked_until` をリセットし、**全セッションを失効**する。
        ロックされた利用者を救うのがこの操作の主な用途であり、パスワードだけ
        変えてロックが残ると目的を果たさない。

        **`mode` は `generate` のみ受け付ける**（手順13a の判断）。応答が
        `generated_password` しか持たず、管理者が手で決めた値を返す意味が無いため。
        本文そのものを省略してもよい（`mode=generate` / `must_change_password=true`）。

        **`generated_password` はこの応答でのみ返る。** 監査ログにも残さない。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: リセットされた。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedPassword'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `local_credential` を持たないユーザー（IdP のみ、Phase 3）に対する
            リセット（`conflict`。ApiDesign.md 6.6）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/sessions/revoke:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: 全セッションの失効
      operationId: revokeUserSessions
      description: |
        当該アクターの全トークンを失効する（ApiDesign.md 6.7）。必要権限は `user.manage`。

        **`token_type` で絞らない。** 6.7 が「エージェントのトークンにも適用される」と
        定めており、セッションだけを消すとAPIトークンで入り続けられる。

        **冪等である。** 有効なトークンが1本も無くても 204 を返す。

        **個別のセッションを失効させる API は Phase 1 では持たない**
        （GuiDesign.md 5.6.2 の行ごとの `[失効]` は出さない。手順13a の判断）。
      responses:
        '204':
          description: 失効した。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/memberships/{key}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ProjectKey'
    put:
      tags: [admin]
      summary: プロジェクトメンバーシップの付与・変更
      operationId: putUserMembership
      description: |
        ユーザーにプロジェクトロールを与える（ApiDesign.md 6.8）。必要権限は `user.manage`。
        `GuiDesign.md` 5.6.2 の「プロジェクトごとの権限」ブロックに対応する。

        **追加と変更を兼ねる（冪等）。** 既にメンバーならロールを上書きし、
        `joined_at` は最初の1回のまま動かない。

        ロールの妥当性はDB（`role.scope='project'`）に問い合わせる。
        メンバーシップは実効権限の第2層であるため、変更後に権限キャッシュを
        無効化する（Design.md 6.4.1 / 6.4.5）。監査は `role.change`
        （`target_type='project_member'`）。

        **Phase 2 で `POST /projects/:key/members` が同じ状態を変えるようになる。**
        6.8 が定めるとおり、内部実装は共通の1関数に集約すること。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '200':
          description: 付与・変更後のメンバーシップ（6.3 の `project_memberships[]` と同形）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーまたはプロジェクトが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: プロジェクトメンバーシップの剥奪
      operationId: deleteUserMembership
      description: |
        ユーザーをプロジェクトから外す（ApiDesign.md 6.8）。必要権限は `user.manage`。

        **冪等である。** 元からメンバーでなくても 204 を返す。ただし監査
        （`role.change`）は実際に消えたときだけ書く——空振りを記録すると
        本当の剥奪が埋もれるため。
      responses:
        '204':
          description: 剥奪された（または元からメンバーではなかった）。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーまたはプロジェクトが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /healthcheck:
    get:
      tags: [ops]
      summary: ヘルスチェック
      operationId: healthcheck
      description: |
        監視・オーケストレータ用（ApiDesign.md 2.11）。**唯一 `/api/v1` の外にある。**
        認証・CSRF・レート制限・認可の対象外で、DBへは接続しない。
      security: []
      responses:
        '200':
          description: 常に `{"status":"OK"}`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pb_session
      description: |
        ブラウザ（Web UI）用。HttpOnly / SameSite=Lax（ApiDesign.md 2.3）。
        **状態変更系（POST/PATCH/PUT/DELETE）では `X-PB-CSRF` も必要**（2.4）。
    bearerAuth:
      type: http
      scheme: bearer
      description: 'CLI・スクリプト用（`Authorization: Bearer pb_api_...`。ApiDesign.md 2.3）。'

  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: |
        ULID（`actor.id`。ApiDesign.md 6.3）。**形式は検証しない**——不正な ID は
        単に行が見つからず 404 になる。存在しないものと形式が違うものを別の応答に
        分けると、ID の総当たりに手がかりを与えるため（1.2-5）。
      schema:
        type: string
      examples:
        demo:
          value: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
    ProjectKey:
      name: key
      in: path
      required: true
      description: |
        プロジェクトキー（ULID ではない。ApiDesign.md 5.4）。URL・チケット番号と
        一致させ、開発時のデバッグを容易にするため。
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,19}$'
      examples:
        demo:
          value: my-app
    csrfToken:
      type: apiKey
      in: header
      name: X-PB-CSRF
      description: |
        `pb_csrf` Cookie と同じ値を送る（double submit。ApiDesign.md 2.4）。
        Cookie 認証の状態変更系でのみ要求する。Bearer 認証では不要。

  # 既定では Cookie か Bearer のいずれかを要求する。
  # 認証不要のエンドポイントは security: [] で個別に打ち消す。
  headers:
    RetryAfter:
      description: 再試行までの秒数。`error.retry_after_sec` と同じ値（ApiDesign.md 2.5）。
      schema:
        type: integer
    XRateLimitLimit:
      description: 窓あたりの上限回数（ApiDesign.md 2.9）。
      schema:
        type: integer
    XRateLimitRemaining:
      description: 窓の残り回数（ApiDesign.md 2.9）。
      schema:
        type: integer

  responses:
    BadRequest:
      description: 形式不正・パースエラー（`bad_request`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 未認証・トークン失効・アカウント無効（`unauthenticated`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        権限不足（`forbidden`）。`audit_log` に `permission.denied` が残る（Design.md 6.4.5）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CSRFFailed:
      description: |
        CSRF トークンの不一致（`csrf_failed`）。Cookie 欠落・ヘッダ欠落・不一致を区別しない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: 入力値の検証エラー（`validation_failed`）。`details` を伴う。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProjectStatusChanged:
      description: |
        切り替え後のプロジェクト（5.4 と同形式）。**既にその状態でも 200 を返す**
        （ApiDesign.md 5.6 の冪等）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectDetail'
    RateLimited:
      description: レート制限（`rate_limited`。ApiDesign.md 2.9）。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: サーバ内部エラー（`internal_error`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          examples: ['tanaka@example.com']
        password:
          type: string
          format: password
      additionalProperties: false

    Session:
      description: |
        `POST /auth/login` と `GET /me` が返す共通の本体。**片方だけ形を変えない。**
      type: object
      required: [actor, permissions, projects, expires_at]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        permissions:
          description: システムロール由来の実効権限。権限0件は空配列で表す。
          type: array
          items:
            type: string
          examples: [['project.view', 'ticket.view']]
        projects:
          description: 所属プロジェクトと、そこでの実効権限。`key` の昇順。
          type: array
          items:
            $ref: '#/components/schemas/SessionProject'
        expires_at:
          description: 現在のトークンの有効期限。無期限の API トークンでは null。
          type: [string, 'null']
          format: date-time

    Actor:
      type: object
      required:
        [id, kind, display_name, email, system_role, locale, timezone, must_change_password]
      properties:
        id:
          description: ULID 26文字。
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        kind:
          type: string
          enum: [user, agent]
        display_name:
          type: string
        email:
          description: エージェントは null（ApiDesign.md 6.1。フィールド自体は省略しない）。
          type: [string, 'null']
        system_role:
          description: 同上。
          type: [string, 'null']
          enum: [administrator, operator, null]
        locale:
          type: [string, 'null']
          examples: ['ja']
        timezone:
          type: [string, 'null']
          examples: ['Asia/Tokyo']
        must_change_password:
          description: true のときフロントはパスワード変更画面へ誘導する（ApiDesign.md 3.1）。
          type: boolean

    SessionProject:
      type: object
      required: [id, key, name, role, permissions]
      properties:
        id:
          type: string
        key:
          type: string
          examples: ['my-app']
        name:
          type: string
        role:
          description: プロジェクトロールのキー（DbDesign.md 7.3）。
          type: string
          examples: ['project_admin']
        permissions:
          description: 当該プロジェクトでの実効権限。
          type: array
          items:
            type: string

    UserList:
      description: 一覧の共通エンベロープ（ApiDesign.md 2.6）。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          description: 切り上げ。総件数0のときは0。
          type: integer

    UserListItem:
      description: |
        一覧の1行（ApiDesign.md 6.1）。**`kind` によって意味を持たないフィールドは
        `null` を返し、フィールド自体を省略しない。** フロントの分岐を単純にするため。
      type: object
      required:
        [id, kind, display_name, email, system_role, agent, is_active,
         last_login_at, project_count, created_at]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          type: string
          enum: [user, agent]
        display_name:
          type: string
        email:
          description: エージェントは `null`。
          type: string
          nullable: true
        system_role:
          description: エージェントは `null`。
          type: string
          enum: [operator, administrator]
          nullable: true
        agent:
          description: |
            **Phase 1 では常に `null`。** 中身（`client_kind` / `model_name` /
            `project_key` / `trust_level`）は DbDesign.md 8.1 の `agent` テーブルの列で、
            そのテーブルは Phase 2 で作られる。
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentInfo'
        is_active:
          type: boolean
        last_login_at:
          description: 一度もログインしていなければ `null`。
          type: string
          format: date-time
          nullable: true
        project_count:
          description: |
            `project_member` の行数。**アーカイブ済みプロジェクトも数える**
            （詳細画面の memberships と食い違わせないため）。
          type: integer
        created_at:
          type: string
          format: date-time

    AgentInfo:
      description: |
        エージェントの付帯情報（ApiDesign.md 6.1）。**Phase 1 では返らない**
        （対応する `agent` テーブルが Phase 2 で作られるため）。
      type: object
      required: [client_kind, model_name, project_key, trust_level]
      properties:
        client_kind:
          type: string
        model_name:
          type: string
        project_key:
          type: string
        trust_level:
          type: integer

    CreateUserRequest:
      description: ユーザーの作成（ApiDesign.md 6.2）。
      type: object
      required: [display_name, email]
      properties:
        display_name:
          description: 1〜60文字（`actor.display_name` の CHECK 制約と同じ）。前後の空白は落とす。
          type: string
          minLength: 1
          maxLength: 60
        email:
          description: |
            254文字以内（RFC 5321 4.5.3.1.3）。表示名付き（`山田 <a@example.com>`）は受け付けない。
            既に使われていれば `409 already_exists`。
          type: string
          format: email
          maxLength: 254
        system_role:
          description: 省略時は `operator`。
          type: string
          enum: [operator, administrator]
          default: operator
        password_mode:
          description: 省略時は `generate`（GuiDesign.md 5.6.1 の初期選択）。
          type: string
          enum: [generate, manual]
          default: generate
        password:
          description: |
            `password_mode=manual` のときのみ必須。12文字以上（Design.md 6.3）。
            `generate` のときに送られても無視する（モード切替でフォームに残った値を弾かない）。
          type: string
          minLength: 12
          nullable: true
        must_change_password:
          description: 省略時は `true`（GuiDesign.md 5.6.1 のチェックボックスが既定でオン）。
          type: boolean
          default: true

    CreatedUser:
      description: |
        作成された利用者（ApiDesign.md 6.2 の 201）。一覧の要素（`UserListItem`）とは別で、
        作成直後に確定している値だけを返す。
      type: object
      required: [id, kind, display_name, email, system_role, is_active, generated_password]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          type: string
          enum: [user]
        display_name:
          type: string
        email:
          type: string
        system_role:
          type: string
          enum: [operator, administrator]
        is_active:
          type: boolean
        generated_password:
          description: |
            **この応答でのみ返る。** 再表示できず、監査ログにも残さない。
            形式は `<形容詞>-<名詞>-<4桁数字>`（例 `quiet-harbor-4172`）で、
            読み上げ・転記しやすい語句連結方式（ApiDesign.md 6.2）。
            `password_mode=manual` のときは `null`（呼び出し側が既に平文を持っているため）。
          type: string
          nullable: true

    UserDetail:
      description: |
        1ユーザーの詳細（ApiDesign.md 6.3）。**5.6.2 の詳細画面が必要とする情報を
        1回で返す。** 一覧の要素（`UserListItem`）とは別で、`project_count` を持たず
        代わりに `version` と3つの配列を持つ。
      type: object
      required:
        [id, kind, display_name, email, system_role, is_active, last_login_at,
         created_at, version, identities, project_memberships, sessions]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          description: '**Phase 1 は `user` のみ。** エージェントは 404 になる。'
          type: string
          enum: [user]
        display_name:
          type: string
        email:
          type: string
        system_role:
          type: string
          enum: [operator, administrator]
        is_active:
          type: boolean
        last_login_at:
          description: 一度もログインしていなければ `null`。
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        version:
          description: |
            楽観ロック用（`app_user.version`。ApiDesign.md 2.8）。`PATCH` の
            `If-Match` にこの値を入れる。**`display_name` や `is_active` を
            変えた場合も +1 される。**
          type: integer
        identities:
          description: |
            認証手段（`DbDesign.md` 6.2 の `user_identity`）。**この配列が Phase 3 の
            IdP 連携をそのまま受け入れる**——OIDC を追加しても要素が1つ増えるだけで、
            応答構造もUIも変わらない。
          type: array
          items:
            $ref: '#/components/schemas/UserIdentity'
        project_memberships:
          description: |
            プロジェクトごとの権限。**アーカイブ済みプロジェクトも含む**
            （6.1 の `project_count` と件数を食い違わせないため）。
          type: array
          items:
            $ref: '#/components/schemas/UserMembership'
        sessions:
          description: |
            有効なセッション（`access_token` の `token_type='session'` のうち、
            失効しておらず期限内のもの）。
          type: array
          items:
            $ref: '#/components/schemas/UserSession'

    UserIdentity:
      description: 認証手段1件（ApiDesign.md 6.3 の `identities[]`）。
      type: object
      required:
        [id, provider_key, provider_type, subject, linked_at, last_used_at,
         password_updated_at]
      properties:
        id:
          type: string
        provider_key:
          description: 'Phase 1 は `local` のみ（DbDesign.md 7.1 のシード）。'
          type: string
        provider_type:
          type: string
          enum: [local, oidc, saml]
        subject:
          description: |
            `local` では `app_user.email` と同じ文字列。**メールを変更すると
            この値も追随する**（そうしないとログインできなくなる）。
          type: string
        linked_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        password_updated_at:
          description: |
            `local_credential` の列。ローカル以外のプロバイダでは `null`。
            画面（5.6.2 の「認証手段」ブロック）が「最終更新」として出す。
          type: string
          format: date-time
          nullable: true

    UserMembership:
      description: |
        プロジェクトメンバーシップ1件（ApiDesign.md 6.3 の `project_memberships[]`）。
        6.8 の `PUT` もこの形を返す。
      type: object
      required: [project_id, project_key, project_name, role, joined_at]
      properties:
        project_id:
          type: string
        project_key:
          type: string
        project_name:
          type: string
        role:
          description: |
            プロジェクトロールのキー（`project_member.role_key`。
            `project_admin` / `project_member` / `project_viewer`。DbDesign.md 7.3）。
          type: string
        joined_at:
          description: '**ロールを変えても動かない。**'
          type: string
          format: date-time

    UserSession:
      description: |
        有効なセッション1件（ApiDesign.md 6.3 の `sessions[]`）。
        **平文のトークンも `token_hash` も載せない。**
      type: object
      required: [id, client_info, issued_at, last_used_at, expires_at]
      properties:
        id:
          type: string
        client_info:
          description: 発行時の User-Agent（`access_token.client_info`）。
          type: string
          nullable: true
        issued_at:
          type: string
          format: date-time
        last_used_at:
          description: 一度も使われていなければ `null`。**1分粒度で間引いて更新される**（Design.md 6.2.2）。
          type: string
          format: date-time
          nullable: true
        expires_at:
          description: 無期限なら `null`（Phase 1 のセッションは必ず入る）。
          type: string
          format: date-time
          nullable: true

    UpdateUserRequest:
      description: |
        ユーザーの更新（ApiDesign.md 6.4）。**送られたフィールドだけを更新する。**
        4項目とも `null` への更新は無い。
      type: object
      properties:
        display_name:
          description: 1〜60文字。前後の空白は落とす（作成時と同じ検証）。
          type: string
          minLength: 1
          maxLength: 60
        email:
          description: |
            254文字以内。既に使われていれば `409 already_exists`。
            **変更すると `user_identity.subject` も追随する。**
          type: string
          format: email
          maxLength: 254
        system_role:
          description: |
            変更すると権限キャッシュが無効化される（Design.md 6.4.5）。
            自分自身の変更は `409 self_modification_forbidden`、最後の有効な
            アドミニストレータの降格は `409 last_administrator`。
          type: string
          enum: [operator, administrator]
        is_active:
          description: |
            `false` にすると次のリクエストから認証を通れなくなる（`Authenticate` が
            `actor.is_active` を見る）。**セッションは失効させない**——必要なら
            6.7 を別に呼ぶ。自分自身の無効化は `409 self_modification_forbidden`。
          type: boolean

    PasswordResetRequest:
      description: |
        パスワードのリセット（ApiDesign.md 6.6）。**本文そのものを省略してもよい。**
      type: object
      properties:
        mode:
          description: '**`generate` のみ受け付ける。** 省略時も `generate`。'
          type: string
          enum: [generate]
          default: generate
        must_change_password:
          description: 省略時は `true`。
          type: boolean
          default: true

    GeneratedPassword:
      description: 生成された初期パスワード（ApiDesign.md 6.6 の 200）。
      type: object
      required: [generated_password]
      properties:
        generated_password:
          description: |
            **この応答でのみ返る。** 再表示できず、監査ログにも残さない。
            形式は `<形容詞>-<名詞>-<4桁数字>`（例 `quiet-harbor-4172`。
            ApiDesign.md 6.2.1）。
          type: string

    MembershipRequest:
      description: プロジェクトメンバーシップの付与・変更（ApiDesign.md 6.8）。
      type: object
      required: [role]
      properties:
        role:
          description: |
            プロジェクトロールのキー。妥当性はDB（`role.scope='project'`）に
            問い合わせるため、ここでは列挙しない——`enum` に書き写すと
            DbDesign.md 7.3 のシードと二重管理になる。
          type: string
          examples: ['project_admin']

    ProjectList:
      description: 一覧の共通エンベロープ（ApiDesign.md 2.6）。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          description: 切り上げ。総件数0のときは0。
          type: integer

    ProjectListItem:
      type: object
      required:
        [id, key, name, description, status, ticket_count, closed_count, progress,
         my_role, updated_at]
      properties:
        id:
          type: string
        key:
          type: string
          examples: ['my-app']
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, archived]
        ticket_count:
          type: integer
        closed_count:
          description: '`ticket.closed_at IS NOT NULL` の件数（DbDesign.md 6.6）。'
          type: integer
        progress:
          description: |
            `closed_count / ticket_count`。**サーバで計算する**（定義をフロントに散らさないため）。
            `ticket_count = 0` のときは `0`（null にしない。ApiDesign.md 5.1）。
          type: number
          examples: [0.75]
        my_role:
          description: |
            当該プロジェクトでのプロジェクトロール。
            **メンバーでないアドミニストレータでは null**（5.1 の「管理者は全件」で返る行）。
          type: [string, 'null']
          examples: ['project_admin']
        updated_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [key, name]
      properties:
        key:
          description: |
            `^[a-z0-9][a-z0-9-]{1,19}$`。予約語（`admin` `api` `mcp` `login` `logout`
            `me` `p` `new` `projects` `static` `assets` `check-key`）は使えない。
            **作成後は変更不可。**
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,19}$'
          examples: ['my-app']
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        workflow_template:
          description: 実体は DbDesign.md 7.4 のテンプレート。
          type: string
          enum: [simple, with_review, with_approval]
          default: simple

    UpdateProjectRequest:
      description: |
        `PATCH /projects/:key` の本文（ApiDesign.md 5.5）。**送られたフィールドだけを
        更新する**ため required は無い。`key` は受け付けず、送ると 422
        （`details[].code` が `immutable_field`）になる。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          description: |
            `null` を明示すると説明を消す。フィールドごと送らなければ据え置く。
            空文字は `null` と同じ扱い（`POST /projects` に合わせる）。
          type: [string, 'null']
          maxLength: 1000
        settings:
          description: |
            `project.settings`（jsonb）をそのまま置き換える。**部分更新ではない**ので、
            取得した値を保持し、変更するキーだけ差し替えて全体を送ること。

            サーバは JSON オブジェクトであることしか検証しない。Phase 1 の画面が
            使うキーは `repositories` のみで、構造の正本は DbDesign.md 6.4 にある。
          type: object
          additionalProperties: true

    ProjectDetail:
      description: |
        `POST /projects`・`GET /projects/:key`・`PATCH /projects/:key`・
        archive / unarchive が返す共通の本体（ApiDesign.md 5.4）。
        **どれか1つだけ形を変えない。**
      type: object
      required:
        [id, key, name, description, status, workflow, members, my_role,
         my_permissions, settings, version, created_at, updated_at]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, archived]
        workflow:
          description: '`project.workflow_id` が NULL のときは null。'
          oneOf:
            - $ref: '#/components/schemas/Workflow'
            - type: 'null'
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        my_role:
          description: メンバーでないアドミニストレータでは null。
          type: [string, 'null']
        my_permissions:
          description: |
            当該プロジェクトでの実効権限
            （システムロール ∪ プロジェクトロール ∩ スコープ。Design.md 6.4.1）。
          type: array
          items:
            type: string
        settings:
          description: |
            `project.settings`（jsonb）をそのまま返す。Phase 1 の画面が使うキーは
            `repositories` のみで、構造の正本は DbDesign.md 6.4 にある。
          type: object
          additionalProperties: true
        version:
          description: 楽観ロック用（ApiDesign.md 2.8）。作成直後は 1。
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Workflow:
      type: object
      required: [id, name, statuses]
      properties:
        id:
          type: string
        name:
          type: string
        statuses:
          description: '`sort_order` の昇順。'
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatus'

    WorkflowStatus:
      type: object
      required:
        [key, name, category, sort_order, requires_human_approval, is_agent_reachable]
      properties:
        key:
          type: string
          examples: ['todo']
        name:
          type: string
          examples: ['未着手']
        category:
          type: string
          enum: [todo, in_progress, review, done]
        sort_order:
          type: integer
        requires_human_approval:
          description: 人間の承認を要するステータス（Requirements.md 10.10.4）。
          type: boolean
        is_agent_reachable:
          description: エージェントが遷移させてよいか。
          type: boolean

    ProjectMember:
      type: object
      required: [actor_id, kind, display_name, email, role, joined_at]
      properties:
        actor_id:
          type: string
        kind:
          description: エージェントもプロジェクトのメンバーになれる（DbDesign.md 6.3）。
          type: string
          enum: [user, agent, system]
        display_name:
          type: string
        email:
          description: |
            `app_user.email`（DbDesign.md 6.2）。**エージェントとシステムアクターは
            `app_user` の行を持たないため null**。キーは常に返す。
          type: [string, 'null']
          examples: ['tanaka@example.com']
        role:
          type: string
          examples: ['project_admin']
        joined_at:
          type: string
          format: date-time

    CheckKeyResult:
      type: object
      required: [key, available]
      properties:
        key:
          type: string
        available:
          type: boolean
        reason:
          description: '`available: false` のときだけ現れる（ApiDesign.md 5.2）。'
          type: string
          enum: [reserved, already_exists, invalid_format]

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: OK
        version:
          description: '`PB_HEALTH_SHOW_VERSION=true` のときだけ出る（既定は出ない）。'
          type: string

    Error:
      description: |
        全エンドポイント共通のエラー形式（ApiDesign.md 2.5）。
        `message` はそのまま画面に出せる日本語。**フロントで文言を組み立てない。**
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              examples: ['メールアドレスまたはパスワードが正しくありません']
            details:
              description: フィールド単位のエラー。フォームの入力欄に紐づける。
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            retry_after_sec:
              description: |
                再試行までの秒数。`account_locked` と `rate_limited` で返す。
                同じ値が `Retry-After` ヘッダにも入る。
              type: integer
            request_id:
              description: |
                `audit_log.request_id`（DbDesign.md 6.8）および構造化ログ
                （Design.md 10.1）と突き合わせられる。
              type: string
              examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']

    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    ErrorCode:
      description: ApiDesign.md 2.5.1 の15コード。
      type: string
      enum:
        - bad_request
        - unauthenticated
        - invalid_credentials
        - forbidden
        - csrf_failed
        - not_found
        - method_not_allowed
        - conflict
        - already_exists
        - last_administrator
        - self_modification_forbidden
        - validation_failed
        - account_locked
        - rate_limited
        - internal_error

security:
  - cookieAuth: []
    csrfToken: []
  - bearerAuth: []
