      operationId: listTicketDoD
      description: |
        チケットの完了条件（ApiDesign.md 9.9、DbDesign.md 6.11）。**必要権限は
        `ticket.view`**。

        **このチケットを「終わった」と言うための条件の一覧である。** 人が列挙して
        チェックし、Phase 2 でエージェントが `assertion` / `artifact` により自動
        判定する土台になる（Requirements.md 10.5.2）。

        **`items[]` は `sort_order` → `created_at` の昇順。**

        **ページネーションも `ETag` も持たない。** 1チケットあたり数件に収まり、
        **同じ内容が 9.5.1 の詳細応答の `dod` にも入る**ので、詳細画面はこの
        エンドポイントを呼ばない。
      responses:
        '200':
          description: 完了条件の一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDoDList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: 完了条件の追加
      operationId: createDoDItem
      description: |
        完了条件を1件足す（ApiDesign.md 9.9）。**必要権限は `ticket.edit` または
        `ticket.self_edit`。ただし `ticket.self_edit` では `is_satisfied` を送れない**
        （0029。pb-75）——送ると `403`。`pb_submit_result` が「盤面を動かさない」と
        決めた判断と正面からぶつかるためで、**完了の判定は人が行う**。

        **Phase 1 が受け付ける `type` は `manual` だけである**（省略時も `manual`）。
        `task_ref` / `assertion` / `artifact` / `review` は 422 `validation_failed`、
        `details[].code` は `phase_2_only`。**綴り違いは `invalid`** で返し分ける
        ——「今後使える」と「正しくない」は、呼び出し元が取る行動が違う。

        **`sort_order` を省略すると末尾**（現在の最大値 + 10。9.10.2 と同じ採番）。

        **`is_satisfied` を `true` で作ると、満たした人も同時に記録する**
        ——「満たしたのに満たした人がいない」行を作らない。
      requestBody:
