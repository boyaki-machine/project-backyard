        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketDoDNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: 完了条件の削除
      operationId: deleteDoDItem
      description: |
        完了条件を1件消す（ApiDesign.md 9.9）。**必要権限は `ticket.edit` または
        `ticket.self_edit`**（0029。pb-75）。

        削除も `activity` に記録する（`old_value` に要約、`new_value` は `null`）。
      responses:
        '204':
          description: 削除した（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketDoDNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
