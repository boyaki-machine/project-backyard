  /api/v1/projects/{key}/sprints:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [tickets]
      summary: スプリント一覧
      operationId: listSprints
      description: |
        プロジェクトのスプリントを返す（ApiDesign.md 9.12）。**必要権限は `ticket.view`**。

        `items[]` は `start_at` 降順（`null` は末尾）、同値は `created_at` 降順。
        新しいものが上に来る並びで、GuiDesign.md 5.9.5 の図と一致する。

        `ticket_count` は `ticket.sprint_id` が当該スプリントを指す行数、`closed_count` は
        そのうち `closed_at IS NOT NULL` の行数。**`status_category = 'done'` では数えない**
        ——9.13 の `open` / `overdue` が `closed_at` を基準にしており、そちらへ揃える。

        タグ（9.11）と同じくページネーションも `ETag` も持たない。
      responses:
        '200':
          description: スプリントの一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: スプリントの作成
      operationId: createSprint
      description: |
        スプリントを1件作る（ApiDesign.md 9.12）。**必要権限は `project.edit`**。

        **スプリントの定義を扱う。** 開始・終了は 9.12.1 / 9.12.2、バーンダウン・ベロシティは
        進捗分析（構想。GuiDesign.md 10章）が持つ。定義を作る口が要るのは、作る手段が無いと
        チケット詳細のスプリント欄が常に空のドロップダウンになるためである。

        **`name` に一意制約は無い**（DbDesign.md 6.9）。同名のスプリントを作れる。
        `start_at` と `end_at` の両方があるとき `start_at <= end_at`
        （`ck_sprint_dates`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSprintRequest'
      responses:
        '201':
          description: 作成されたスプリント。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/sprints/01K2F8QW3H7YRJ4M5N6P7Q8R9S
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/sprints/start:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [tickets]
      summary: スプリントの開始
      operationId: startSprint
      description: |
        スプリントを新しく作り、`active` にし、**オンステージに載っているものを対象に
        入れる**（ApiDesign.md 9.12.1）。必要権限は `project.edit`。
        3つを1つのトランザクションで行う。

        対象は **`staged_at IS NOT NULL` の行とその子孫**である。`staged_at` だけで
        決めてはならない——段を決めるのは親であり、子は `staged_at` が `null` のまま
        親と一緒にオンステージ段へ出る（GuiDesign.md 5.4）。**エピックは除く。**

        **進行中のスプリントが既にあれば 409。** `active` は同時に1本だけである
        ——オンステージは1つしかなく、「いまどの期間で消化しようとしているか」の
        答えが2つあると、開始のたびにどちらへ入れるかを選ぶことになる。

        **オンステージが空でも通す。** 期間を先に切ってから積む進め方があるため、
        開始できない理由にしない。

        **既にある `planned` のスプリントは開始の対象にならない**（常に新規作成）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSprintRequest'
      responses:
        '201':
          description: 開始したスプリント。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/sprints/01K2F8QW3H7YRJ4M5N6P7Q8R9S
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          description: 進行中のスプリントが既にある（`active_sprint_exists`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/sprints/{id}/finish:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/SprintID'
    post:
      tags: [tickets]
      summary: スプリントの終了
      operationId: finishSprint
      description: |
        スプリントを終える（ApiDesign.md 9.12.2）。必要権限は `project.edit`。
        **本文を取らない。**

        `status` を `completed` にし、`end_at` が空なら終わった時点（終日は基準タイムゾーンの翌日の0時）を入れる。所属
        （`ticket_sprint`）すべてに `removed_at` を立て、**完了しているオンステージの
        根を段から降ろす**（`staged_at` を `null` に戻す）。**未完了のものは触らず、
        オンステージに残って次の開始でそちらへ入る。**

        **`ticket.sprint_id` は消さない。** 終わったあとも「最後に属したスプリント」を
        指し続ける——9.2.1 の「棚に戻ったか」の判定がこれを読む。

        降ろした行は 9.2.1 の3条件を満たすため、既定の一覧から外れて画面から消える。
        辿るには `?retired=true` を送る。

        **`status` が `active` でなければ 409**（`sprint_not_active`）。権限でも
        不在でもなく、盤面がその操作を許さないためである。
      responses:
        '200':
          description: 終了したスプリント。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SprintNotFound'
        '409':
          description: 進行中のスプリントではない（`sprint_not_active`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/sprints/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/SprintID'
    patch:
      tags: [tickets]
      summary: スプリントの更新
      operationId: patchSprint
      description: |
        スプリントの各項目を変える（ApiDesign.md 9.12）。必要権限は `project.edit`。
        タグと同じく **`If-Match` は要求しない**（`sprint` は `version` 列を持たない）。

        送られなかった項目は据え置く。**`goal` / `start_at` / `end_at` は `null` を
        送ると値を消す**（キーが無い場合の「据え置き」と区別する）。

        `ck_sprint_dates` は更新後の2列の関係を見る制約であり、片方だけを送る場合は
        送られなかった側の現在値と突き合わせて検証する。違反は 422 で返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSprintRequest'
      responses:
        '200':
          description: 更新後のスプリント。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sprint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SprintNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: スプリントの削除
      operationId: deleteSprint
      description: |
        スプリントを消す（ApiDesign.md 9.12）。必要権限は `project.edit`。

        **チケットは消えない。** `fk_ticket_sprint` の `ON DELETE SET NULL` により
        `ticket.sprint_id` が外れ、スプリント未設定に戻る（DbDesign.md 6.9）。
        画面は確認ダイアログにその旨を明記する（GuiDesign.md 6.3）。
      responses:
        '204':
          description: 削除された（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/SprintNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [tickets]
      summary: チケット一覧
      operationId: listTickets
      description: |
        プロジェクトのチケットを返す（ApiDesign.md 9.2）。**必要権限は `ticket.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        バックログ画面（GuiDesign.md 5.4）とチケット検索（GuiDesign.md 5.13）のデータ源であり、
        未実装のカンバン・ガントも同じエンドポイントから描く。

        **既定が他の一覧と2か所ちがう**（9.2.1）。

        - `per_page` の既定が **200**（他は 25）。この画面はページャを持たず、
          フィルタ後の全件を1回で取り切る（9.2.3）
        - `sort` の既定が **`sort_key`**（他は `updated_at`）。人が手で並べた順序（9.4）を
          既定の見え方にする

        **異なる種類の条件どうしは AND、同じ条件の複数指定は OR**
        （`?type=bug&priority=high,highest` は「バグ、かつ優先度が高以上」）。

        `items[]` は `tags[]` と `parent_seq` / `has_children` を含む。グループ化（タグ）と
        階層のインデント表示（親子）を追加のリクエストなしに描けるようにするためである。
        含めないと、バックログは1画面あたり `1 + タグ数 + 階層の深さ` 回の往復を要する。

        **`has_children` は「プロジェクト内に子がいるか」**であって「結果の中に子がいるか」
        ではない。フィルタは行単位で適用し、サーバは親を補完しない（9.2.4）ため、
        結果の中で数えると親が絞り込みで落ちた瞬間に子の有無まで消える。

        **`body_md` は含めない**（9.2.2）。一覧は本文を表示せず、200件分の Markdown は
        応答を数十倍にする。`execution_mode` / `readiness` / `scope` / `custom_fields` も
        同じ理由で含めない（GuiDesign.md 5.5 が非表示と決めている）。

        **検索の条件**（9.2.1「検索の条件」）：`q`・`seq_from` / `seq_to`・
        `started_since` / `started_before`・`closed_since` / `closed_before`。
        **範囲の前後が逆なら 422** を返す（黙って空の結果を返さない）。

        `ETag` は「フィルタ条件を正規化した文字列のハッシュ・件数・`MAX(updated_at)`」から
        作る（9.2.5）。**`sort` / `order` / `page` / `per_page` も混ぜる**——ETag は応答本文を
        指す検証子であり、並び順やページが違えば本文も違う。
        **`If-None-Match` は解釈しない**（304 を返さない）。
      parameters:
        - name: status
          in: query
          description: ワークフローのステータスキー。カンマ区切りで複数指定は OR。
          schema:
            type: string
          example: todo,in_progress
        - name: status_category
          in: query
          description: |
            `todo` / `in_progress` / `review` / `done`。カンマ区切りは OR。
            **ワークフローが違うプロジェクトを跨いでも意味が変わらない4値**であり、
            ダッシュボードの集計とカンバンの列が使う（9.2.1）。
          schema:
            type: string
          example: todo,in_progress
        - name: type
          in: query
          description: '`epic` / `story` / `task`。カンマ区切りは OR。'
          schema:
            type: string
          example: task,bug
        - name: assignee
          in: query
          description: |
            担当者の ULID。`me` で自分、`none` で未割当。カンマ区切りは OR。
          schema:
            type: string
          example: me,none
        - name: priority
          in: query
          description: '`lowest` 〜 `highest`。カンマ区切りは OR。'
          schema:
            type: string
          example: high,highest
        - name: tag
          in: query
          description: タグの ULID（9.11）。`none` で未分類。カンマ区切りは OR。
          schema:
            type: string
        - name: sprint
          in: query
          description: スプリントの ULID（9.12）。`none` で未割当。カンマ区切りは OR。
          schema:
            type: string
        - name: open
          in: query
          description: '`true` で `closed_at IS NULL` のもののみ。`false` で完了のみ。'
          schema:
            type: string
            enum: ['true', 'false']
        - name: retired
          in: query
          description: |
            **棚に戻ったものを返すかどうか**（ApiDesign.md 9.2.1）。
            既定は `false`。

            次の3つをすべて満たす行が「棚に戻った」ものであり、既定で一覧から外れる。

            1. `closed_at IS NOT NULL`
            2. いま属しているスプリントが `completed`
            3. 未完了の祖先を持たない（根までたどる。直下の親だけでは歯抜けが起きる）

            **スプリントを終えた時点で、消化し終えたものがバックログから消える**
            ——これが「バックログ＝行うべき仕事すべての保管庫」を保つ手当てである。

            バックログの状態フィルタで完了を明示的に選んだときに画面が `true` を送る
            （GuiDesign.md 5.4）。**チケット検索（5.13）は常に `true` を送る。**
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
        - name: due_within
          in: query
          description: |
            `7d` 形式。**今日から N 日以内に期限があるもの（期限超過を含む）**。
            「今日」はプロジェクトの基準タイムゾーンで区切る。`due_at IS NULL` は除外する。上限は `3650d`。
          schema:
            type: string
            pattern: '^[0-9]+d$'
          example: 7d
        - name: staged
          in: query
          description: |
            `true` で**オンステージの行とその全子孫**に限る（ApiDesign.md 9.2.1「オンステージで絞る」）。
            エピックは除く。棚に戻ったものは `retired` の既定どおり外れる。

            **バックログ画面は使わない**（全件を1回で取り、二段を手元で分ける）。MCP の `pb_list_tasks` のための条件である。
          schema:
            type: string
            enum: ['true']
        - name: overdue
          in: query
          description: |
            `true` で**期限を過ぎた未完了のもの**（`due_at <= now()` かつ
            `closed_at IS NULL`）。9.13.1 の `overdue` と同じ条件で数える。

            **`due_within=0d` で代用しない**——あちらは「今日の終わりまで」で
            **今日が期限でまだ過ぎていないもの**を含み、ずれる。
          schema:
            type: string
            enum: ['true']
        - name: planned_from
          in: query
          description: |
            予定期間の下限（エポックミリ秒、含む）。チケットの予定（`start_at`〜`due_at`）と
            少しでも重なるものを返す。期限だけのチケットは期限の直前の瞬間、開始だけのものは
            開始の瞬間として扱い、両方が未設定のチケットは除外する（ApiDesign.md 9.2.1）。
          schema:
            type: integer
            format: int64
        - name: planned_to
          in: query
          description: |
            予定期間の上限（エポックミリ秒、**含まない**）。`planned_from` と両方あるとき、
            `planned_from` より後でなければ 422。
          schema:
            type: integer
            format: int64
        - name: stale
          in: query
          description: |
            `14d` 形式。**その日数より前から更新されていない未完了のもの**
            （`updated_at < now() - N日` かつ `closed_at IS NULL`）。
            9.13.1 の `stale` と同じ条件で数える。上限は `3650d`。

            **日数を取るのは、閾値の正本がサーバにあるからである**
            （9.13.1 の `threshold_days`）。ダッシュボードは `stats` の応答に
            載る値をそのままリンクへ載せ、画面側に 14 を書かない。
          schema:
            type: string
            pattern: '^[0-9]+d$'
          example: 14d
        - name: parent
          in: query
          description: |
            `seq` を指定すると、そのチケットとその全子孫（部分木）に限る。
            **カンマ区切りで複数指定は OR**（いずれかの部分木に含まれるもの）。
            バックログのエピックフィルタがこれを使う（GuiDesign.md 5.4）。
          schema:
            type: string
          example: '12,30'
        - name: q
          in: query
          description: |
            **キーワード**（ApiDesign.md 9.2.1「検索の条件」）。空白で区切った語を
            **すべて含む**もの。各語はタイトル・本文・コメント（削除済みを除く）のいずれかに
            部分一致すればよい。大文字小文字を区別しない。`%` と `_` は文字として扱う。
          schema:
            type: string
            maxLength: 200
          example: 認証 API
        - name: search_mode
          in: query
          description: |
            qの検索対象。backlogは番号・タイトル・本文・祖先エピック名・タグ名を全件検索し、
            既存フィルタを満たす一致チケットの祖先も補完する。親を含めてtotalを数え、ページングする。
            qが空なら通常の一覧と同じ。fulltextはタイトル・本文・コメントを検索する。
          schema:
            type: string
            enum: [fulltext, backlog]
            default: fulltext
        - name: seq_from
          in: query
          description: チケット番号の範囲の下限（**含む**）。`seq_to` と片方だけでもよい。
          schema:
            type: integer
            minimum: 1
        - name: seq_to
          in: query
          description: チケット番号の範囲の上限（**含む**）。`seq_from` より小さいと 422。
          schema:
            type: integer
            minimum: 1
        - name: started_since
          in: query
          description: |
            **実際に着手した日時**がこの瞬間**以上**のもの（9.2.1「着手日時を導く」）。
            着手は、状態が `todo` 区分から初めて出た遷移の日時。着手していないものは外れる。
          schema:
            type: integer
            format: int64
        - name: started_before
          in: query
          description: 着手した日時がこの瞬間**未満**のもの。`started_since` 以下なら 422。
          schema:
            type: integer
            format: int64
        - name: closed_since
          in: query
          description: '`closed_at` がこの瞬間**以上**のもの。未完了は外れる。'
          schema:
            type: integer
            format: int64
        - name: closed_before
          in: query
          description: '`closed_at` がこの瞬間**未満**のもの。`closed_since` 以下なら 422。'
          schema:
            type: integer
            format: int64
        - name: sort
          in: query
          description: |
            既定は `sort_key`。**`priority` と `status` は意味の順で並ぶ**——
            `priority` は `lowest`→`highest`、`status` はワークフローの `sort_order` で、
            キーの辞書順ではない（`high` が `lowest` より前に来ると「優先度で並べた」と
            読めないため）。`closed_at` は未完了が末尾に来る。
          schema:
            type: string
            enum: [sort_key, seq, title, status, priority, due_at, created_at, updated_at, closed_at]
            default: sort_key
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        '200':
          description: チケットの一覧。
          headers:
            ETag:
              description: |
                弱い検証子（`W/"tkt-<ハッシュ>-<件数>-<最終更新>"`。ApiDesign.md 9.2.5）。
              schema:
                type: string
              example: W/"tkt-a3f19c2b-48-1723372992000000000"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: チケットの作成
      operationId: createTicket
      description: |
        チケットを1件作る（ApiDesign.md 9.3）。**必要権限は `ticket.create`**。

        **サーバが決めるものはリクエストに含められない。**

        | 項目 | 決め方 |
        |---|---|
        | `seq` | `project_counter` の1文 `UPDATE ... RETURNING`（DbDesign.md 6.4.1） |
        | `status_key` | ワークフローのうち `category='todo'` かつ `sort_order` 最小。該当が無ければ `sort_order` 最小 |
        | `sort_key` | 現在の末尾の次（9.4 の LexoRank） |
        | `reporter_id` | 呼び出し元のアクター |
        | `staged_at` | **常に `NULL`**（バックログへ入る）。オンステージへ上げるのは 9.4 の `move` である |
        | `execution_mode` | **常に `agent_draft`**（DbDesign.md 6.6 の列の既定。`INSERT` は値を送らない）。変えるのは 9.5.2 の `PATCH` |
        | `version` | `1` |

        **初期ステータスを指定させない。** ワークフローの入口は `workflow_transition` に
        定義されておらず（遷移元が無い）、任意のステータスで作成できると 9.6 の遷移検証を
        素通りできてしまう。作成後に遷移させれば同じ状態に到達でき、その経路は検証を通る。

        **採番・ワークフロー解決・タグ付与・`activity` 記録は単一トランザクションで行う。**

        検証に失敗したときの `details[].code` は次のとおり。

        | `code` | 意味 |
        |---|---|
        | `not_a_member` | `assignee_id` に指定したアクターがプロジェクトのメンバーでない（9.14） |
        | `not_found` | `parent_seq` / `tag_ids` の参照先がこのプロジェクトに無い |
        | `use_sprint_endpoint` | `sprint_id` を送った（スプリントの開始・終了が動かす） |
        | `required` / `invalid` / `too_long` / `out_of_range` | 2.5 の一般の検証エラー |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: 作成されたチケット（9.5 の `GET` と同形式）。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/tickets/31
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: チケットの詳細
      operationId: getTicket
      description: |
        チケット詳細画面（GuiDesign.md 5.5）のデータ源（ApiDesign.md 9.5.1）。
        **必要権限は `ticket.view`**。

        **9.2 の `items[]` に6項目を加えたもの**を返す（`body_md` / `parent` / `children` /
        `dod` / `links` / `comment_count`）。一覧と同じ型を埋め込んでいるので、片方だけ
        項目が増えて JSON の形が割れることがない。

        **コメント本体と変更履歴は含めない。** コメントはページングを持ち（9.8）、履歴は
        既定で畳まれている。画面は起動時に本エンドポイントと `GET .../comments` の
        **2本**を呼ぶ。

        **`comment_count` は実数である**——9.6 の遷移が `kind='progress'` のコメントを
        作るため、0 を固定で返すと事実と食い違う。

        **`ETag` を返さない。** 2.7 の `ETag` は一覧（9.2.5）のためのもので、1件の詳細は
        軽く、競合検出は 9.5.2 の楽観ロック（`version` + `If-Match`）が担う。同じ資源に
        2つの競合検出手段を置くと、どちらが正本か読めなくなる。
      responses:
        '200':
          description: チケット1件（9.5.1）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [tickets]
      summary: チケットの更新
      operationId: updateTicket
      description: |
        部分更新（ApiDesign.md 9.5.2）。**必要権限は `ticket.edit` または
        `ticket.self_edit`。ただし `assignee_id` / `working_agent_id` を変える場合は
        `ticket.assign` も必要**——この追加分だけはリクエスト本文の内容で決まるため、
        ルート定義の宣言ではなくハンドラ内で見ている。

        **`ticket.self_edit` では開ける項目が絞られる**（0029）。
        エージェントに渡す権限であり、**自分の縛りを緩められては意味がない**
        （DbDesign.md 6.13）。次を送ると `403` になる。

        | `ticket.self_edit` で変えられる | 変えられない |
        |---|---|
        | `title` `body_md` `priority` `parent_seq` `assignee_id` `tag_ids` `estimate_point` `estimate_hours` `start_at` `due_at` `all_day` | `type` `execution_mode` `readiness` `readiness_note` `scope` `working_agent_id` `actual_hours` |

        `actual_point` と `actual_point_version` は対で更新する。`ticket.actual_point.edit` が追加で必要であり、PM のエージェントにはトークン発行時にこの scope を指定できる。

        **`type` を外したのは、切り替えが盤面の見え方を変えるからである**
        ——タスクをエピックへ変えると、その行はバックログから消えてフィルタの
        選択肢になる（GuiDesign.md 5.4）。**`sprint_id` は 0028 以降どちらの権限でも
        書けない**（下記 `use_sprint_endpoint`）。

        **送られたフィールドだけを更新する。** `null` を送るとその項目を空にする
        （担当を外す・親を外す・期限を消す）。キーごと送らなければ据え置く。

        **`If-Match` は必須**（2.8）。省略すると 422（`details[].field` が `If-Match`）、
        現在の `version` と食い違えば 409。成功すると `version` が +1 される。

        **`tag_ids` は丸ごと置き換える**（部分更新ではない）。空配列でタグを全て外す。
        **タグだけを変えた場合も `version` と `updated_at` が動く**ので、一覧（9.2.5）の
        `ETag` が必ず変わる。

        **受け付けないフィールドは 422 で、`details[].code` が3系統に分かれる**
        （`error.code` はいずれも `validation_failed`）。**値が現在と同じでも弾く**
        ——「送れば通ることがある」という曖昧な仕様にしないため。

        | `details[].code` | 対象 | 代わりに使うもの |
        |---|---|---|
        | `immutable_field` | `id` `seq` `version` `created_at` `updated_at` `reporter_id` | — （サーバが決める） |
        | `use_move_endpoint` | `sort_key` `staged_at` | `POST .../move`（9.4） |
        | `use_transition_endpoint` | `status_key` `closed_at` | `POST .../transition`（9.6） |

        そのほかの `details[].code`。

        | `code` | 意味 |
        |---|---|
        | `parent_cycle` | 自分自身または自分の子孫を親に指定した |
        | `not_stageable` | **オンステージのチケットを、段に置けなくなる `type` / `parent_seq` へ変えようとした** |
        | `not_a_member` | 担当者に指定したアクターがプロジェクトのメンバーでない |
        | `not_found` | `parent_seq` / `tag_ids` の参照先がこのプロジェクトに無い |
        | `use_sprint_endpoint` | `sprint_id` を送った（スプリントの開始・終了が動かす） |

        **`not_stageable` は 9.4.1 が `move` で弾いている条件と同じものである。**
        `staged_at` が入っている行を `epic` にする、またはエピック以外の子にすると、
        「段に置けるのは表示上のトップレベルだけ」という規則を `PATCH` から迂回できて
        しまう。**自動で段から降ろす方式は採らない**——種別や親を変えただけのつもりの
        利用者が、オンステージから消えたことに気づく手段がないためである。

        **`activity` は変更した項目ごとに1行**（`field` / `old_value` / `new_value`）。
        **`body_md` だけは値を載せず `field` のみ記録する**——9.13.2 は `per_page=20` の
        一覧APIで、20件ぶんの Markdown を載せると応答が重くなる。値が現在と同じだった
        項目は「変更が生じていない」ので記録しない（`version` は規約どおり +1 する）。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: 更新後のチケット（9.5.1 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
            **`assignee_id` / `working_agent_id` を送ったが `ticket.assign` を
            持たない場合もここへ来る。**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            `If-Match` が現在の `version` と一致しない（`conflict`。ApiDesign.md 2.8）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: チケットの削除
      operationId: deleteTicket
      description: |
        物理削除（ApiDesign.md 9.5.3、DbDesign.md 4.6 の既定）。
        **必要権限は `ticket.delete`**。

        **「持たない人」が実在する唯一のチケット権限である**——`operator`
        （システムロール）は `ticket.delete` を持たず、持つのは `administrator` と
        `project_admin` だけである（migration 0010）。

        **子チケットは削除しない。** `ticket.parent_id` は `ON DELETE SET NULL` であり、
        子は親を失って表示上のトップレベルへ上がる。**この挙動を確認ダイアログに明示する**
        （GuiDesign.md 6.3。件数は 9.5.1 の `children` から数える）。

        コメント・DoD・リンク・タグ付けは `ON DELETE CASCADE` で消える。

        **`activity` は消さず、`action='delete'` を1行足す。** `entity_id` は多相参照で
        FK を持てず（DbDesign.md 6.8）、9.13.2 は「削除されたチケットの行は `entity_seq` /
        `entity_title` が `null` になる」と定めている——**残る前提の設計**であり、消すと
        「誰がどのチケットを消したか」が追えなくなる。

        **`If-Match` は要求しない**（2.8 が求めるのは「編集内容が失われる更新」であり、
        削除には失われる編集内容が無い）。
      responses:
        '204':
          description: 削除した。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/transition:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    post:
      tags: [tickets]
      summary: ステータスの遷移
      operationId: transitionTicket
      description: |
        ワークフローに沿ってステータスを進める（ApiDesign.md 9.6）。
        **必要権限は `ticket.transition`。加えて `workflow_transition.required_permission`
        が設定されていればその権限も必要**（プロジェクトごとに変わる値なので、ルート定義の
        宣言ではなくDBから読む）。

        **検証の順序**（DbDesign.md 6.5）。

        | # | 検証 | 失敗時 |
        |---|---|---|
        | 1 | `to` がプロジェクトのワークフローに存在するか | 422（`details[].code = "unknown_status"`） |
        | 2 | 現在のステータスから `to` への遷移が定義されているか | 409 `invalid_transition` |
        | 3 | 呼び出し元の `actor.kind` が `allowed_actor_kinds` に含まれるか | 403 |
        | 4 | 遷移先の `is_agent_reachable` が `false` で、呼び出し元がエージェントか | 403 |
        | 5 | `required_permission` を呼び出し元が持つか | 403 |
        | 6 | 呼び出し元がエージェントのとき、`assignee_id` が自分の所有者か | 403 |

        **3〜6 が Requirements.md 10.10.4「承認ゲートをAPIレベルで強制する」の実体である。**
        画面側の制御に依存しない。

        **検証6 はエージェントにだけ掛かる。** エージェントが状態を変えてよいのは、担当が自分の
        所有者であるチケットに限る（担当が未割当のものも進められない）。**呼び出し元が
        人のときは適用しない**——全員に掛けると `ticket.transition` を持つ人が他人の担当を
        進められなくなる。`Design.md` 6.5 の委譲（権限の根拠は所有者）に、作業の根拠も
        所有者だという規則が加わったものである。

        **遷移に成功すると、エージェントは自分を `working_agent_id` に立てる**（9.6）。
        「着手した」と「宣言した」が別々に起こる状態を作らないための副作用で、専用の
        操作を持たない。**別のエージェントが入っていれば上書きする**（排他ではない）。
        `version` は動かさず、`activity` にも記録しない——遷移の行が「誰が進めたか」を
        `actor_id` で既に持っている。

        **`closed_at` はこの経路だけが動かす。** 遷移先の `category` が `done` なら `now()`、
        それ以外なら `NULL` へ戻す。`PATCH` で直接書けないようにしてあるので（9.5.2）、
        9.2.1 の `?open=true`（`closed_at IS NULL`）が「完了していないもの」と一致することが
        保証される。

        `comment` が付いていれば、**同じトランザクションで `kind='progress'` のコメントを
        作る**（DbDesign.md 6.7）。`activity` には `action='transition'` で記録し、`field` は
        `status_key`、値はキーのまま入れる（表示名への変換は画面が行う。9.13.2）。

        **`If-Match` は要求しない**（9.6）。**遷移そのものが競合を検出する**——2人が同時に
        「進行中 → レビュー」を実行すると、後発は「レビュー → レビュー」を要求することに
        なり、定義が無いため検証2 で 409 になる。ただし `version` は +1 される。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionTicketRequest'
      responses:
        '200':
          description: 遷移後のチケット（9.5.1 と同形式）。**`version` は +1 されている。**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            検証3〜5 のいずれか、または CSRF トークンの不一致（`csrf_failed`）。
            `message` はそのまま画面に出せる日本語である（2.5）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          description: |
            現在のステータスから要求された遷移が `workflow_transition` に定義されていない
            （`invalid_transition`。ApiDesign.md 9.14）。**`conflict` と分けてあるのは、
            利用者が取る行動が違うため**——競合は読み直せば済むが、こちらは順路そのものが
            存在しない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/references:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: 外部参照の一覧
      operationId: listTicketReferences
      description: |
        チケットから PB の外を指す参照（ApiDesign.md 9.10.2）。**必要権限は `ticket.view`**。

        `kind` は `code`（リポジトリ・ブランチ・コミット）と `doc`（仕様書などのURL）の
        2つで、**必須の項目が違う**。`ticket_link`（9.10.1）が同じプロジェクトの別の
        チケットを指すのに対し、こちらは PB の管理外にあるものを指す。

        **`items[]` は `kind` 昇順（`code` → `doc`）、同じ `kind` の中は `sort_order` →
        `created_at` の昇順。** 第2・第3キーを置くのは、順序が実行ごとに揺れない
        ようにするためである。

        **ページネーションも `ETag` も持たない。** 1チケットあたり数件に収まり、
        画面は開いた時点で全件を出す（GuiDesign.md 5.5）。**同じ内容が 9.5.1 の
        詳細応答の `references` にも入る**ので、詳細画面はこのエンドポイントを
        呼ばない。
      responses:
        '200':
          description: 外部参照の一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReferenceList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: 外部参照の追加
      operationId: createTicketReference
      description: |
        外部参照を1件足す（ApiDesign.md 9.10.2）。**必要権限は `ticket.reference.edit`**
        （0027 で `ticket.edit` から切り出した。読みは `ticket.view` のまま）。

        **`kind='code'` の主な書き手はエージェントである**（MCP の `pb_add_reference`）。
        `/me/tokens` で発行した API トークンを持つクライアントも書ける。**画面は `code` の追加を持たず、
        表示と削除だけを行う**（GuiDesign.md 5.5）。`doc` は人が画面で
        追加・編集できる。

        必須は `kind` と、`kind` に応じて `repository`（`code`）または `url`（`doc`）。
        **URL の形式は検証しない**（空でないことのみ）。`sort_order` を省くと末尾
        （現在の最大値 + 10）に置かれる。

        **親チケットの `version` も `updated_at` も動かさない**——参照の増減は `ticket` の
        列を変えないためで、`ticket_tag` を動かす 9.2.5 とはここが違う。

        **変更は `activity` に記録する**（9.1.1）。`action` は `update`、`field` は
        `reference.code` / `reference.doc` で、`new_value` に画面と同じ形の要約が入る。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketReferenceRequest'
      responses:
        '201':
          description: 作成した外部参照。
          headers:
            Location:
              description: 作成した参照の URL。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/references/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
      - $ref: '#/components/parameters/TicketReferenceID'
    patch:
      tags: [tickets]
      summary: 外部参照の更新
      operationId: patchTicketReference
      description: |
        外部参照を部分更新する（ApiDesign.md 9.10.2）。**必要権限は `ticket.reference.edit`**
        （0027）。

        **`kind` は作成後に変えられない。** 送ると 422 `validation_failed` で、
        `details[].code` は `immutable_field` である。

        **`null` は「その項目を空にする」を意味する**（キーごと送らないのとは区別する）。
        ただし**更新後の行が必須の条件を満たすこと**——`kind='doc'` の `url` や
        `kind='code'` の `repository` を空にする要求は 422 `required` で弾く
        （DbDesign.md 6.12 の `CHECK` と同じ条件をアプリ側でも持つ）。

        **`If-Match` は要らない**（`ticket_reference` は `version` 列を持たない。2.8）。

        **値が実際に変わったときだけ `activity` に記録する**（9.5.2 と同じ扱い）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTicketReferenceRequest'
      responses:
        '200':
          description: 更新後の外部参照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReference'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketReferenceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: 外部参照の削除
      operationId: deleteTicketReference
      description: |
        外部参照を1件消す（ApiDesign.md 9.10.2）。**必要権限は `ticket.reference.edit`**
        （0027）。

        **`code` にも削除を置く**（GuiDesign.md 5.5）。画面に追加の導線が無いぶん、
        誤って積まれた行を人が始末できないと詰むためである。

        削除も `activity` に記録する（`old_value` に要約、`new_value` は `null`）。
      responses:
        '204':
          description: 削除した（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketReferenceNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: コメントの一覧
      operationId: listTicketComments
      description: |
        チケットのコメント（ApiDesign.md 9.8）。**必要権限は `ticket.view`**。

        **チケットの子資源で唯一 2.6 のページネーションと 2.7 の `ETag` を持つ。**
        DoD（9.9）・リンク（9.10.1）・外部参照（9.10.2）は1チケットあたり数件に
        収まるが、**コメントは議論の量だけ増える**。`ETag` は
        エージェントが「新しいコメントが付いたか」を安く見る口になる。

        **許可する `sort` は `created_at` だけ**で、既定は `asc`・`per_page=50`。

        **削除済みも `items` に残る**（`body_md` が `null`、`deleted_at` に値）。
        画面は「削除されました」と表示する（GuiDesign.md 5.5）。**`total` にも数える**
        ——`items` に残す以上、外すとページの件数と合わない。**9.5.1 の
        `comment_count` だけは `deleted_at IS NULL` で数える**（読めるコメントの件数）。

        `If-None-Match` は解釈せず、ヘッダだけ出す（9.2.5 と同じ）。
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: 既定 50、上限 200（ApiDesign.md 9.8 / 2.6）。
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: sort
          in: query
          description: '**`created_at` のみ**（9.8）。他の値は 422。'
          schema: { type: string, enum: [created_at], default: created_at }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: コメントの一覧。
          headers:
            ETag:
              description: |
                `W/"cmt-<page>-<per_page>-<order>-<件数>-<MAX(updated_at) のナノ秒>"`。
                **論理削除も `updated_at` を動かす**ので、削除が 304 に埋もれない。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCommentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: コメントの投稿
      operationId: createTicketComment
      description: |
        コメントを1件投稿する（ApiDesign.md 9.8）。**必要権限は `comment.create`**。

        **`origin` はリクエストで指定できない**——呼び出し元のアクター種別
        （`user` / `agent`）から決まる。人が `agent` を名乗れると、
        GuiDesign.md 5.5 の「エージェントのコメントを角丸四角で区別する」が
        意味を失う。

        **`in_reply_to` の相手は同じチケットの、削除されていないコメントであること。**
        満たさない場合は 422 `validation_failed`、`details[].code` は `not_found`。
        **存在しない ID・他チケットの ID・削除済みを区別しない**（Design.md 6.4.5）。

        **親チケットの `version` と `updated_at` は動かない**（9.10.2 と同じ）。

        投稿は `activity` に記録する（`action='update'` / `field='comment'`、
        `new_value` は `<kind の表示名>: <本文の先頭40字>`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketCommentRequest'
      responses:
        '201':
          description: 作成したコメント。
          headers:
            Location:
              description: 作成したコメントの URL。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/comments/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
      - $ref: '#/components/parameters/TicketCommentID'
    patch:
      tags: [tickets]
      summary: コメントの更新
      operationId: patchTicketComment
      description: |
        コメントを部分更新する（ApiDesign.md 9.8）。**必要権限は `comment.edit_own`
        で、自分が投稿したものだけ**——他人のものは 403 `forbidden`（404 に倒さない。
        同じコメント欄に並んで見えている行であり、存在を隠す意味がない）。

        **変えられるのは `body_md` と `kind` だけである。** `in_reply_to` を送ると
        422 `validation_failed`、`details[].code` は `immutable_field`——返信先を
        後から付け替えるとスレッドの形が変わり、既に読まれた並びが崩れる。

        **削除済みへの `PATCH` は 404**（論理削除でも「もう無い」として扱う）。

        **`If-Match` は要らない**（`comment` は `version` 列を持たない。2.8）。

        **値が実際に変わったときだけ `activity` に記録する**（9.5.2 と同じ扱い）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTicketCommentRequest'
      responses:
        '200':
          description: 更新後のコメント。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketComment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketCommentNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: コメントの削除
      operationId: deleteTicketComment
      description: |
        コメントを論理削除する（ApiDesign.md 9.8、DbDesign.md 4.6 / 6.7）。

        **必要権限は OR である**——`comment.delete_any`、**または** `comment.edit_own`
        かつ自分のもの。ルート定義には両方を並べ（`RequireAnyProjectPermission`）、
        どちらか一方でも持っていればミドルウェアを通す。**「自分のものか」は行を
        読まないと決まらない**ので、その判定だけをハンドラで行う——
        `comment.delete_any` を持たない呼び出し元が他人のコメントを消そうとした
        場合は 403 `forbidden`。

        **削除しても行は残る。** `GET` の `items` に `body_md: null` と
        `deleted_at` を持つ形で並び続ける。**二重削除は 404**——`204` で通ると
        `activity` に同じ削除が2行並んで履歴が読めなくなる。

        削除も `activity` に記録する（`old_value` に要約、`new_value` は `null`）。
      responses:
        '204':
          description: 削除した（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketCommentNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/dod:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: 完了条件（DoD）の一覧
      operationId: listTicketDoD
      description: |
        チケットの完了条件（ApiDesign.md 9.9、DbDesign.md 6.11）。**必要権限は
        `ticket.view`**。

        **このチケットを「終わった」と言うための条件の一覧である。** 人が列挙して
        チェックし、将来エージェントが `assertion` / `artifact` により自動
        判定する土台になる（Requirements.md 10.5.2）。

        **`items[]` は `sort_order` → `created_at` の昇順。**

        **ページネーションも `ETag` も持たない。** 1チケットあたり数件に収まり、
        **同じ内容が 9.5.1 の詳細応答の `dod` にも入る**ので、詳細画面はこの
        エンドポイントを呼ばない。
      responses:
        '200':
          description: 完了条件の一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDoDList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: 完了条件の追加
      operationId: createDoDItem
      description: |
        完了条件を1件足す（ApiDesign.md 9.9）。**必要権限は `ticket.edit` または
        `ticket.self_edit`。ただし `ticket.self_edit` では `is_satisfied` を送れない**
        （0029）——送ると `403`。`pb_submit_result` が「盤面を動かさない」と
        決めた判断と正面からぶつかるためで、**完了の判定は人が行う**。

        **受け付ける `type` は `manual` だけである**（省略時も `manual`）。
        `task_ref` / `assertion` / `artifact` / `review` は 422 `validation_failed`、
        `details[].code` は `unsupported_type`。**綴り違いは `invalid`** で返し分ける
        ——「今後使える」と「正しくない」は、呼び出し元が取る行動が違う。

        **`sort_order` を省略すると末尾**（現在の最大値 + 10。9.10.2 と同じ採番）。

        **`is_satisfied` を `true` で作ると、満たした人も同時に記録する**
        ——「満たしたのに満たした人がいない」行を作らない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketDoDRequest'
      responses:
        '201':
          description: 作成した完了条件。
          headers:
            Location:
              description: 作成した完了条件の URL。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDoDItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/dod/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
      - $ref: '#/components/parameters/TicketDoDID'
    patch:
      tags: [tickets]
      summary: 完了条件の更新
      operationId: patchDoDItem
      description: |
        完了条件を部分更新する（ApiDesign.md 9.9）。**必要権限は `ticket.edit` または
        `ticket.self_edit`。ただし `ticket.self_edit` では `is_satisfied` を送れない**
        （0029）——送ると `403`。**`sort_order` は開ける**（並べ替えは記述の
        整理であって、盤面の判定ではない）。

        **`is_satisfied` を `true` にすると、サーバが `satisfied_at` と
        `satisfied_by`（呼び出し元）を設定する。`false` に戻すと両方 `null` へ戻る。**
        3つは同時に動き、別々には送れない。

        **`type` は作成後に変えられない**（422 `immutable_field`）。
        取りうる値が1つしかない以上、変更を受け付けても何も起こせない。

        **`If-Match` は要らない**（`dod_item` は `version` 列を持たない。2.8）。

        **並び順だけの変更は `activity` に記録しない**（`move`（9.4）を記録しない
        のと同じ理由）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTicketDoDRequest'
      responses:
        '200':
          description: 更新後の完了条件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDoDItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketDoDNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: 完了条件の削除
      operationId: deleteDoDItem
      description: |
        完了条件を1件消す（ApiDesign.md 9.9）。**必要権限は `ticket.edit` または
        `ticket.self_edit`**（0029）。

        削除も `activity` に記録する（`old_value` に要約、`new_value` は `null`）。
      responses:
        '204':
          description: 削除した（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketDoDNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/links:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: 関連チケットの一覧
      operationId: listTicketLinks
      description: |
        チケット間リンク（ApiDesign.md 9.10.1、DbDesign.md 6.6）。**必要権限は
        `ticket.view`**。

        **双方向を1本で返す**——当該チケットが `source` である行（`outgoing`）と
        `target` である行（`incoming`）の両方。GuiDesign.md 5.5 の「関連チケット」は
        「ブロック元」と「ブロック先」を同じリストに並べるため、2回問い合わせると
        N+1 になる（設計方針3）。

        **`ticket` に入るのは常に相手であって自分ではない。**

        **`items[]` は `direction`（`outgoing` → `incoming`）、同じ向きの中は
        `link_type` → 相手の `seq` の昇順。**

        **ページネーションも `ETag` も持たない。** **同じ内容が 9.5.1 の詳細応答の
        `links` にも入る**ので、詳細画面はこのエンドポイントを呼ばない。
      responses:
        '200':
          description: 関連チケットの一覧（双方向）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketLinkList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: 関連チケットの追加
      operationId: createTicketLink
      description: |
        リンクを1件足す（ApiDesign.md 9.10.1）。**必要権限は `ticket.edit`**。

        **当該チケットが常に `source` になる。** `incoming` の行を直接作る手段は
        置かない——相手側のチケットから `outgoing` として作れば同じ行になる。

        **`target_seq` は同一プロジェクト内に存在すること**（無ければ 422、
        `details[].code` は `not_found`）。**自分自身は 422 `self_link`**。

        **同じ `(source, target, link_type)` が既にあれば 409 `already_exists`**
        （`uq_ticket_link`）。`conflict` は使わない——あちらは `If-Match` 不一致の
        ような**状態**の競合で、こちらは**値**が既存の行と衝突している。

        **`link_type` は7種すべて受ける。** ただし**画面が出すのは
        `relates` / `duplicates` / `blocks` の3つだけ**である（GuiDesign.md 5.5）
        ——`FS` / `SS` / `FF` / `SF` と `lag_days` はガントの依存線のためのもので、
        ガントは未実装。**API を絞らないのは、MCP とエージェントがガント用の
        依存を先に積むことを妨げないためである。**

        **親チケットの `version` と `updated_at` は動かない。相手側も動かない。**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketLinkRequest'
      responses:
        '201':
          description: 作成したリンク。
          headers:
            Location:
              description: 作成したリンクの URL。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketLink'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '409':
          $ref: '#/components/responses/TicketLinkAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/links/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
      - $ref: '#/components/parameters/TicketLinkID'
    delete:
      tags: [tickets]
      summary: 関連チケットの削除
      operationId: deleteTicketLink
      description: |
        リンクを1件消す（ApiDesign.md 9.10.1）。**必要権限は `ticket.edit`**。

        **`direction` を問わない。** `incoming` の行——相手のチケットが `source` で
        ある行——もここから消せる。GuiDesign.md 5.5 が両方を同じリストに並べる
        以上、**片方だけ消せないと画面に「消せない行」が混ざる。**

        削除も `activity` に記録する（`old_value` は `<link_type> <相手の完全形ID>`、
        `new_value` は `null`）。**相手のチケットの履歴には書かない**——1回の操作で
        2行増えると、同じ出来事が二重に見える。

        **`PATCH` は無い。** 一意制約が `(source, target, link_type)` である以上、
        `link_type` の変更は別の行になるのと同じである。
      responses:
        '204':
          description: 削除した（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketLinkNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/projects/{key}/tickets/{seq}/reports:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    post:
      tags: [tickets]
      summary: 完了レポートの提出
      operationId: submitTicketReport
      description: |
        エージェントが1回の作業の結果を構造化して提出する（ApiDesign.md 9.15、
        Requirements.md 10.6.1）。**必要権限は `ticket.transition`**。

        `agent_run` と `agent_report` に1行ずつ書き、**同じトランザクションで
        完了レポートのコメントを1件作る**（`kind='progress'`）。**そのコメントが、
        人がレポートを読む面である**（GuiDesign.md 5.5）。

        **状態を進めない。** 26b で遷移が 9.6 として独立したので、完了レポートの
        提出と状態遷移を1つの操作に混ぜない。**チケットもクローズしない**——
        `done` への遷移は `is_agent_reachable=false` かつ
        `allowed_actor_kinds=["user"]` で、DB とワークフローが拒む。

        **完了条件（`dod_item.is_satisfied`）を書き換えない。** いま API が開けて
        いる DoD の型は `manual` だけで、その定義は「人間がチェックを入れる」で
        ある（Requirements.md 10.5.2）。**エージェントが立てると型の定義に反する。**

        **`unsatisfied_dod` は「レポートの `dod_results` に `passed: true` として
        現れなかった完了条件」である。** `is_satisfied = false` のものではない
        ——この API は `is_satisfied` を動かさないので、それを返すと作業直後は
        必ず全件になり、`/pb-implement` の手順7 が終わらなくなる。

        **検証は「列に出す値」だけ厳しい。** `status` と `knowledge_impact`、
        `cost.tokens` / `cost.turns` は列へ展開されるので値域を見る。
        **それ以外の知らないキーは拒まず、`report` jsonb にそのまま保存する。**

        **9.6 の検証6（エージェントは所有者の担当だけ）は適用しない**——あの規則は
        ボードの状態を動かすことへの制約であり、レポートは状態を動かさない。

        **`GET` を置かない。** 人が読むのは完了レポートのコメントで
        あり、`agent_report` の行そのものを読む面が無い。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTicketReportRequest'
      responses:
        '201':
          description: 受理した完了レポート。
          headers:
            Location:
              description: 受理した完了レポートの URL（`GET` は実装していない）。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/transitions:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    get:
      tags: [tickets]
      summary: 遷移先の一覧
      operationId: listTicketTransitions
      description: |
        詳細画面のステータスドロップダウン（GuiDesign.md 5.5）に出す選択肢
        （ApiDesign.md 9.7）。**必要権限は `ticket.view`**。

        **`items[]` はワークフローの全ステータス（現在のものを除く）である。**
        遷移が定義されている先だけに絞らない。

        **遷移できない先も `allowed: false` と `reason` を付けて返す。** 設計原則4
        「権限で見えないを作る」は**メニュー項目**についての規則であり、ここでは適用しない。
        ステータスは業務上の到達点であり、存在ごと隠すと「なぜ完了にできないのか」が
        分からなくなる。**この理由は定義が無い先にこそ強く効く**——`with_review` では
        `in_progress → done` の定義が無く、隠すとレビューを通す必要があること自体が
        画面から読めない。

        `reason` は 9.6 の検証2〜6 に対応する（検証1 は `items[]` をワークフローから
        組み立てるため起こらない）。**複数に当たる場合は先の検証の理由を返す**——
        利用者が最初に取り除くべき障害がそれだからである。

        | 9.6 の検証 | `reason` |
        |---|---|
        | 2（定義が無い） | `<現在の名前>から<遷移先の名前>へは直接進められません` |
        | 3（`allowed_actor_kinds`） | `この状態への変更は<種別>からは行えません` |
        | 4（`is_agent_reachable`） | `この状態へはエージェントから変更できません` |
        | 5（`required_permission`） | `<権限キー> 権限が必要です` |
        | 6（担当が所有者でない） | `このチケットの担当者があなたの所有者ではないため、エージェントからは変更できません` |

        **検証6 はチケット単位の条件なので、当たると `items[]` の全行が同時に
        `allowed: false` になる**（手順26b）。遷移先ごとに違う理由が並ぶ他の検証とは
        性質が異なるが、行ごとに理由を付ける形は変えない。

        **このエンドポイントを 9.5.1 の詳細応答に埋めないのは、`PATCH` のたびに再計算が
        要るためである。** ドロップダウンを開いたときにだけ呼べばよい。

        ワークフローを持たないプロジェクト（`project.workflow_id` が `NULL`）では
        `items` が空になる。
      responses:
        '200':
          description: 現在のステータスと遷移先の候補（9.7）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketTransitionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tickets/{seq}/move:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TicketSeq'
    post:
      tags: [tickets]
      summary: チケットの並べ替え
      operationId: moveTicket
      description: |
        バックログのドラッグ&ドロップによる並べ替え（ApiDesign.md 9.4、GuiDesign.md 5.4）。
        **必要権限は `ticket.edit`**。

        **`PATCH` で `sort_key` を直接書かせない。** LexoRank の桁生成規則をクライアントに
        持たせると、Web・MCP・将来の CLI がそれぞれ同じ規則を実装することになり、1つでも
        ずれると順序が壊れる。**順序キーの生成はサーバに1つだけ置く。**

        **`If-Match` は要求しない**（9.4）。競合しても失われる編集内容が無い（`sort_key` は
        フォームで編集する項目ではない）。ただし **`version` は他の更新と同じく +1 する**。

        **並び順はプロジェクト内で1本である。** グループ化（親・タグ・スプリント）は表示上の
        区切りにすぎず、グループを切り替えても `sort_key` は変わらない。
        **二段（バックログ／オンステージ）も同じ1本を共有する**（9.4、DbDesign.md 6.6）。

        **`activity` には記録しない。** `sort_key` だけの更新であり、記録するとチケット詳細の
        変更履歴が並べ替えで埋まる。

        `position` と `after_seq` / `before_seq` の同時指定は 422。いずれも無い場合も 422。

        **`staged` で段を出し入れする**（9.4.1）。段と位置を1回のリクエストで決めるのは、
        ドラッグ&ドロップの1操作で両方が同時に決まるためで、2本に分けると途中で失敗した
        ときに「段は移ったが位置は末尾」という中途半端な状態が残る。

        検証に失敗したときの `details[].code` は次のとおり。

        | `code` | 意味 |
        |---|---|
        | `not_stageable` | 表示上のトップレベルでないチケットを `staged: true` で上げようとした（9.4.1） |
        | `invalid` / `required` | `position` と `after_seq` / `before_seq` の指定の誤り |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTicketRequest'
      responses:
        '200':
          description: |
            動かした結果。**`rebalanced` が `true` のときはクライアントが一覧を取り直す**
            ——手元の `sort_key` がすべて古くなっている。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveTicketResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TicketNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/docs:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [docs]
      summary: 文書の目次
      operationId: listDocs
      description: |
        プロジェクト文書（憲章）の目次を返す（ApiDesign.md 10.2）。**必要権限は `doc.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        **`body_md` を含めない。** 目次は「どこに何があるか」を答えるものであり、本文は
        `GET .../docs/{path}` が返す。全文を一度に返す設計にすると、リポジトリの md ファイルより
        劣る（ファイルなら部分読みができる）。

        `items[]` は各階層で `sort_order` 昇順、同値は `slug` 昇順。**ページネーションを
        持たない**——目次は木であり、途中で切ると子が親から外れる。

        **`version` を含める。** 木のドラッグ&ドロップ（GuiDesign.md 5.10）は目次だけを持って
        複数行を `PATCH` するため、`If-Match` の材料がここに要る。
      responses:
        '200':
          description: 文書の木。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocTreeList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [docs]
      summary: 文書の作成
      operationId: createDoc
      description: |
        文書を1件作る（ApiDesign.md 10.4）。**必要権限は `doc.edit`**——**`operator` と
        `project_member` はこれを持たない**（DbDesign.md 8.1.4）。憲章は全参加者を縛るため、
        更新できる人を絞る。

        `slug` は同じ親の下で一意で、重複は 409 `already_exists`。`parent_path` を省略・`null`
        にするとトップレベル。存在しないパスは 422（`details[].code = "not_found"`）。

        `sort_order` を省略すると同じ親の中の末尾（現在の最大値 + 10）に置く。

        **`revision_no = 1` を同時に作る。** リビジョンは「その変更のあとの本文」を持つので、
        作成時の1件が無いと最初の編集で「作ったときの本文」がどの版にも残らない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocRequest'
      responses:
        '201':
          description: 作成された文書。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/docs/rules/naming
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doc'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/DocAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/docs/{path}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/DocPath'
    get:
      tags: [docs]
      summary: 文書の本文
      operationId: getDoc
      description: |
        文書1件を返す（ApiDesign.md 10.3）。必要権限は `doc.view`。

        `created_by` / `updated_by` は `null` になりうる（`ON DELETE SET NULL`。
        DbDesign.md 8.1.1）。コメントの `author` が `null` にならないのと異なり、
        **文書は書いた人が退職しても内容が生き続ける。**

        **`?section=` を付けるとその章だけを返す**（応答は `DocSection`）。`body_md` は
        見出し行から、同じか上のレベルの次の見出しの直前までを含む。見つからないときは
        404 で、本体に `available_sections` が付く——呼び出し側（多くはエージェント）が、
        もう一度目次を取りに行かずに次の一手を選べるようにするため。
      parameters:
        - name: section
          in: query
          required: false
          description: |
            返す章の見出しテキスト。**スラッグ化も番号付けもしない**（10.2）。同じ文書に
            同名の見出しが2つあるときだけ、2つ目以降に `#2` が付く（URL では `%23`）。
          schema:
            type: string
          examples:
            heading:
              value: 命名
      responses:
        '200':
          description: |
            文書の本文。`?section=` を付けた場合は `DocSection`（章だけ）になる。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Doc'
                  - $ref: '#/components/schemas/DocSection'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [docs]
      summary: 文書の更新（移動・改名を含む）
      operationId: patchDoc
      description: |
        文書を部分更新する（ApiDesign.md 10.4）。必要権限は `doc.edit`。

        **`If-Match` は必須**（2.8）。省略すると 422（`details[].field` が `If-Match`）、
        現在の `version` と食い違えば 409 `conflict`。**人とエージェントが同じ文書を触るため、
        プロジェクト設定より競合が起きやすい。**

        **`parent_path` と `slug` の変更が移動・改名である。** 部分木ごと移動する（`path` は
        子孫の分も付け替わる）。自分自身または自分の子孫を `parent_path` に指定すると 422
        （`details[].code = "cycle"`）。移動先に同じ `slug` があれば 409 `already_exists`。

        **リビジョンは `title` か `body_md` が実際に変わったときだけ積む。** `sort_order` の
        変更や同じ本文の送り直しでは作らない——並べ替えのたびに履歴が伸びると「いつ内容が
        変わったか」が読めなくなる。**`version` はどの更新でも +1 する。**

        `change_reason` はリビジョンを作らない更新では捨てる（422 にはしない）。

        **末尾が `_revisions` のパスへ送ると 405。** 履歴は読み取り専用である（10.1）。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDocRequest'
      responses:
        '200':
          description: 更新後の文書。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doc'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '405':
          $ref: '#/components/responses/DocMethodNotAllowed'
        '409':
          description: |
            `If-Match` が現在の `version` と一致しない（`conflict`）、または移動先の階層に
            同じ `slug` の文書がある（`already_exists`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [docs]
      summary: 文書の削除
      operationId: deleteDoc
      description: |
        文書を消す（ApiDesign.md 10.4）。必要権限は `doc.edit`。

        **物理削除で、部分木ごと消える**（`parent_id` の `CASCADE`。DbDesign.md 8.1.1）。
        `document_revision` も一緒に消える。

        **子を持っていても API は止めない。** 件数を示して確認するのは画面の仕事である
        （GuiDesign.md 6.3）——使用中のタグを消せるようにしたのと同じ判断で、消せないと
        構造を直せなくなる。

        **末尾が `_revisions` のパスへ送ると 405。**
      responses:
        '204':
          description: 削除された（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '405':
          $ref: '#/components/responses/DocMethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/docs/{path}/_revisions:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/DocPath'
    get:
      tags: [docs]
      summary: 文書の履歴
      operationId: listDocRevisions
      description: |
        文書のリビジョン一覧を返す（ApiDesign.md 10.5）。必要権限は `doc.view`。

        **`_revisions` はサブ資源の予約語である。** `slug` の検証が `_` を含められないため
        （DbDesign.md 8.1.1）、`.../docs/a/b/_revisions` が「`a/b` のリビジョン一覧」なのか
        「`a/b/_revisions` という文書」なのかで迷うことがない（10.1）。

        **一覧に `body_md` を含めない。** 20件ぶんの Markdown を載せると応答が重くなる。
        本文が要るときは `.../_revisions/{revision_no}` を呼ぶ。

        **`revision_no` の降順に固定**（`sort` を受け付けない）。`per_page` の既定は 20、
        上限は 100。
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: 既定 20、上限 100（ApiDesign.md 10.5 / 2.6）。
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: リビジョンの一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocRevisionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/docs/{path}/_revisions/{revision_no}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/DocPath'
      - $ref: '#/components/parameters/DocRevisionNo'
    get:
      tags: [docs]
      summary: 文書の履歴1件（本文つき）
      operationId: getDocRevision
      description: |
        リビジョン1件を本文つきで返す（ApiDesign.md 10.5）。必要権限は `doc.view`。

        **一覧の1件に `body_md` を足した形である。** `version` も `outline` も持たない——
        `version` は現在の文書の楽観ロック値であって過去の版に属さず、`outline` は現在の
        本文から作るものである。

        **「前の版に戻す」は、取得した `body_md` を `PATCH` で書き戻して行う。** 専用の
        エンドポイントを置かない。**履歴は消さない**——書き戻しも新しいリビジョンとして積む。
      responses:
        '200':
          description: リビジョン1件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocRevision'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DocNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: ユーザー一覧
      operationId: listUsers
      description: |
        人間とエージェントを同じ一覧に返す（ApiDesign.md 6.1、DbDesign.md 6.2 の
        `actor` 統合設計）。**必要権限は `user.manage`**（アドミニストレータのみ）。

        `kind` によって意味を持たないフィールドは `null` を返し、フィールド自体を
        省略しない。**`agent` は `kind='agent'` の行にだけ入る**（人間の行では `null`）。

        `kind = 'system'` の actor は返さない。

        `project_count` は `project_member` の行数で、アーカイブ済みプロジェクトも数える。
      parameters:
        - name: kind
          in: query
          description: 既定は `all`。
          schema:
            type: string
            enum: [user, agent, all]
            default: all
        - name: is_active
          in: query
          description: 既定は `all`。**真偽値ではなく3値の文字列**（未指定と false を区別する）。
          schema:
            type: string
            enum: ['true', 'false', all]
            default: all
        - name: q
          in: query
          description: |
            表示名・メールアドレス・**ロールの表示名**の部分一致。ロールは `role.display_name`
            （「アドミニストレータ」「オペレータ」）と比べる。**画面に出ないキー
            （`administrator`）は対象にしない。** `%` と `_` はサーバ側でエスケープするため
            ワイルドカードとしては働かない。**画面は検索欄を常時表示する**（GuiDesign.md 5.6）。
          schema:
            type: string
        - name: sort
          in: query
          description: |
            `system_role` は `role.sort_order` の順（オペレータ → アドミニストレータ）で、
            表示名の五十音順ではない。**ロールを持たない行（エージェント）は昇順・降順とも末尾。**
            `is_active` の昇順は無効が先（`false < true`）。
          schema:
            type: string
            enum: [display_name, email, system_role, is_active, last_login_at, created_at]
            default: display_name
        - name: order
          in: query
          description: |
            既定は `asc`。名簿は昇順で読むためで、他の一覧（`GET /projects` は `desc`）とは
            既定が違う。
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: 1ページ分のユーザー。
          headers:
            ETag:
              description: |
                弱い検証子 `W/"user-<件数>-<MAX(updated_at) のナノ秒>"`（ApiDesign.md 2.7）。
                `updated_at` は `actor` と `app_user` の新しいほうを採る。
                **`If-None-Match` は解釈しない**（304 を返さない）。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [admin]
      summary: ユーザーの作成
      operationId: createUser
      description: |
        ユーザーを作成する（ApiDesign.md 6.2）。必要権限は `user.manage`。

        サーバ側は `actor` → `app_user` → `user_identity`（`provider_key='local'`,
        `subject=email`）→ `local_credential` と `audit_log` への記録を
        **単一トランザクション**で行う（DbDesign.md 6.2）。

        メール重複の検出はDBの `UNIQUE` 制約に委ねる。

        **`generated_password` はこの応答でのみ返る。** 再表示できず、監査ログにも残さない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 作成された。
          headers:
            Location:
              description: '`/api/v1/admin/users/<id>`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            メールアドレスが既に使われている（`already_exists`。ApiDesign.md 6.2）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [admin]
      summary: ユーザーの詳細
      operationId: getUser
      description: |
        1ユーザーの本体・認証手段・プロジェクトごとの権限・有効なセッションを
        1回で返す（ApiDesign.md 6.3）。必要権限は `user.manage`。
        `GuiDesign.md` 5.6.2 の詳細画面が必要とする情報がここに揃う。

        **`kind='user'` のアクターだけを返す。** エージェント・システムアクターは
        404 になる（手順13a の判断）。応答の `version` は `app_user` の列であり、
        `app_user` の行を持たないアクターでは 6.4 の楽観ロックが成立しないため。
        エージェントの詳細は未実装で、列構成ごと設計する（DbDesign.md 8.2.1）。

        **一覧（6.1）と違い `ETag` は返さない。** 鮮度は本体の `version` が表す。
      responses:
        '200':
          description: ユーザーの詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            ユーザーが存在しない、または `kind` が `user` ではない（`not_found`）。
            **両者を区別しない**（ApiDesign.md 1.2-5）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [admin]
      summary: ユーザーの更新
      operationId: updateUser
      description: |
        `display_name` / `email` / `system_role` / `is_active` を更新する
        （ApiDesign.md 6.4）。必要権限は `user.manage`。

        **送られたフィールドだけを更新する**（部分更新）。

        **`If-Match` は必須**（2.8）。省略すると 422、現在の `version` と
        食い違えば 409。`display_name` や `is_active`（`actor` の列）だけを
        変えた場合も `version` は +1 される——**ユーザー1人につき `version` は1つ**
        という約束にしないと、直後に古い `version` でもう一度更新が通ってしまう。

        **`email` を変えると `user_identity.subject`（`provider_key='local'`）も
        追随する。** ログインは `subject = app_user.email` で突き合わせるため
        （Design.md 6.2.1 手順2〜3）、片方だけ変えると当人がログインできなくなる。

        `system_role` を変えたときは当該アクターの権限キャッシュを無効化する
        （Design.md 6.4.5）。監査には常に `user.update` を、ロールが変わったときは
        加えて `role.change` を記録する。

        **3つのガードは API 側にある**（6.4）。UIだけで防ぐと、直接APIを叩いた
        場合に誰もログインできないインスタンスが生まれうる。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新後のユーザー（6.3 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            次のいずれか（ApiDesign.md 6.4）。

            - `conflict` — `If-Match` が現在の `version` と一致しない（2.8）
            - `already_exists` — `email` が既に使われている
            - `self_modification_forbidden` — 自分自身のロール変更・無効化
            - `last_administrator` — 最後の有効なアドミニストレータの降格・無効化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: ユーザーの削除
      operationId: deleteUser
      description: |
        物理削除する（ApiDesign.md 6.5、DbDesign.md 4.6）。必要権限は `user.manage`。

        `actor` の削除により `app_user` / `user_identity` / `local_credential` /
        `access_token` / `project_member` が CASCADE で消える。
        `ticket.assignee_id` は `ON DELETE SET NULL` のため**チケットは残る**。

        `comment.author_id` は `NOT NULL` かつ `ON DELETE RESTRICT` のため、
        **削除前にシステムアクター（`kind='system'` の「削除されたユーザー」）へ
        付け替える**（DbDesign.md 6.7）。このアクターはシードに無く、**最初に
        必要になった削除で作る**（手順13a の判断。コメントを持たない環境では
        作られない）。

        削除前に `audit_log` へ `user.delete` を記録し、`detail` に削除時点の
        表示名・メール・ロールを保存する。

        **`If-Match` は要求しない**（2.8）。失われる編集内容が無く、競合しても
        「消えている」に収束するため。無効化のみ行いたい場合は 6.4 の
        `is_active: false` を使う。
      responses:
        '204':
          description: 削除された。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            自分自身（`self_modification_forbidden`）、または最後の有効な
            アドミニストレータ（`last_administrator`）。ApiDesign.md 6.5。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: パスワードのリセット
      operationId: resetUserPassword
      description: |
        当該ユーザーの `local_credential` を差し替える（ApiDesign.md 6.6）。
        必要権限は `user.manage`。

        `failed_attempts` と `locked_until` をリセットし、**全セッションを失効**する。
        ロックされた利用者を救うのがこの操作の主な用途であり、パスワードだけ
        変えてロックが残ると目的を果たさない。

        **`mode` は `generate` のみ受け付ける**（手順13a の判断）。応答が
        `generated_password` しか持たず、管理者が手で決めた値を返す意味が無いため。
        本文そのものを省略してもよい（`mode=generate` / `must_change_password=true`）。

        **`generated_password` はこの応答でのみ返る。** 監査ログにも残さない。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: リセットされた。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedPassword'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `local_credential` を持たないユーザー（IdP のみ。構想）に対する
            リセット（`conflict`。ApiDesign.md 6.6）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/sessions/revoke:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: 全セッションの失効
      operationId: revokeUserSessions
      description: |
        当該アクターの全トークンを失効する（ApiDesign.md 6.7）。必要権限は `user.manage`。

        **`token_type` で絞らない。** 6.7 が「エージェントのトークンにも適用される」と
        定めており、セッションだけを消すとAPIトークンで入り続けられる。

        **冪等である。** 有効なトークンが1本も無くても 204 を返す。

        **個別のセッションを失効させる API は持たない**
        （GuiDesign.md 5.6.2 の行ごとの `[失効]` は出さない。手順13a の判断）。
      responses:
        '204':
          description: 失効した。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/mfa/reset:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: 第2要素の解除
      operationId: resetUserMfa
      description: |
        対象ユーザーの認証器・リカバリコード・未消費の挑戦をすべて消す
        （ApiDesign.md 6.9）。必要権限は `user.manage`。

        **本人がリカバリコードまで失ったときの口である**（Design.md 6.7.5）。
        対象は次のログインからパスワードだけで入れるようになる。

        **パスワードには触らず、セッションも切らない。** 締め出しの原因は
        「パスワードを忘れた」と「認証アプリを失った」の2つで別物であり、
        まとめて直すと必要のない資格情報まで作り替える。

        **冪等である。** 1件も登録が無くても 204 を返す。

        **自分自身に対しても許す**（`self_modification_forbidden` の対象にしない）。
        自分の認証器は `/me` から外せるので、この口を自分へ向ける理由は壊れた状態の
        復旧だけであり、そこを塞ぐ意味が無い。

        **管理者が1人しかいない構成ではこの口は成立しない**（締め出された本人が
        呼べない）。その場合は `pb admin mfa-reset --email` を端末から実行する。
      responses:
        '204':
          description: 解除した（登録が0件でも同じ）。本文を持たない。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/passkeys/reset:
    parameters:
      - $ref: '#/components/parameters/UserID'
    post:
      tags: [admin]
      summary: パスキーの全削除
      operationId: resetUserPasskeys
      description: |
        対象ユーザーのパスキーと未消費の登録の挑戦をすべて消す（ApiDesign.md 6.10）。
        必要権限は `user.manage`。

        **乗っ取りの疑いがあるときの口である**（Design.md 6.8.6）。パスキーはパスワード無しで
        入れる鍵なので、乗っ取った人が登録した1本は、パスワードのリセットも第2要素の解除も消さない。

        **パスワードには触らず、セッションも切らない。** 乗っ取りを直すなら、パスワードの
        リセットとセッションの失効を組み合わせて使う。

        **冪等である。** 1件も無くても 204 を返す。自分自身に対しても許す。
      responses:
        '204':
          description: 消した（登録が0件でも同じ）。本文を持たない。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/users/{id}/memberships/{key}:
    parameters:
      - $ref: '#/components/parameters/UserID'
      - $ref: '#/components/parameters/ProjectKey'
    put:
      tags: [admin]
      summary: プロジェクトメンバーシップの付与・変更
      operationId: putUserMembership
      description: |
        ユーザーにプロジェクトロールを与える（ApiDesign.md 6.8）。必要権限は `user.manage`。
        `GuiDesign.md` 5.6.2 の「プロジェクトごとの権限」ブロックに対応する。

        **追加と変更を兼ねる（冪等）。** 既にメンバーならロールを上書きし、
        `joined_at` は最初の1回のまま動かない。

        ロールの妥当性はDB（`role.scope='project'`）に問い合わせる。
        メンバーシップは実効権限の第2層であるため、変更後に権限キャッシュを
        無効化する（Design.md 6.4.1 / 6.4.5）。監査は `role.change`
        （`target_type='project_member'`）。

        **未実装の `POST /projects/:key/members` も同じ状態を変える。**
        6.8 が定めるとおり、内部実装は共通の1関数に集約すること。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipRequest'
      responses:
        '200':
          description: 付与・変更後のメンバーシップ（6.3 の `project_memberships[]` と同形）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーまたはプロジェクトが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [admin]
      summary: プロジェクトメンバーシップの剥奪
      operationId: deleteUserMembership
      description: |
        ユーザーをプロジェクトから外す（ApiDesign.md 6.8）。必要権限は `user.manage`。

        **冪等である。** 元からメンバーでなくても 204 を返す。ただし監査
        （`role.change`）は実際に消えたときだけ書く——空振りを記録すると
        本当の剥奪が埋もれるため。
      responses:
        '204':
          description: 剥奪された（または元からメンバーではなかった）。本文は無い。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ユーザーまたはプロジェクトが存在しない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/roles:
    get:
      tags: [roles]
      summary: ロール一覧
      operationId: listRoles
      description: |
        組み込みロールのカタログ（ApiDesign.md 7.1、正本は DbDesign.md 7.3 のシード）。
        GuiDesign.md 5.6.3 の権限マトリクスと、画面がロールの表示名を引くために使う。

        **必要権限は `scope` によって変わる。**

        | 要求 | 返すもの | 必要権限 |
        |---|---|---|
        | `?scope=project` | `scope='project'` の3件 | **不要**（認証済みであればよい） |
        | `?scope=system` | `scope='system'` の2件 | `user.manage` |
        | 未指定 | 全5件 | `user.manage` |

        OpenAPI の `security` は操作単位でしか宣言できず、クエリの値ごとに分けられない。
        ここでは**認証必須**として宣言してある。`?scope=project` 以外で `user.manage` を
        持たない場合は `403` になる。

        `?scope=project` を開放しているのは、プロジェクト設定のメンバータブ
        （GuiDesign.md 5.9.2）がプロジェクト管理者の開く画面でありながら、
        ロールの表示名を必要とするためである。**これは暫定で、画面構成が固まった時点で
        権限の全体像を再整理する**（7.1）。

        `items[]` は `role.sort_order` 昇順、`permissions[]` は `permission.sort_order` 昇順。
        **ページネーションも ETag も持たない**（件数がシードで固定のため）。
      parameters:
        - name: scope
          in: query
          description: |
            未指定は全件。`role.scope` そのものであり、**プロジェクトIDやユーザIDは
            受け付けない**（`role` テーブルは `project_id` を持たない。7.1）。
            解釈できない値は `422`。
          schema:
            type: string
            enum: [system, project]
      responses:
        '200':
          description: ロールのカタログ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/permissions:
    get:
      tags: [roles]
      summary: 権限カタログ
      operationId: listPermissions
      description: |
        権限カタログの32件（ApiDesign.md 7.2、正本は DbDesign.md 7.2 のシード28件と
        8.1.4 の doc 権限2件、6.12.1 の `ticket.reference.edit`、6.13 の `ticket.self_edit`）。
        **必要権限は不要**（認証済みであればよい。`user.manage` を求めない）。

        消費者が2つあるため開放している——GuiDesign.md 5.6.3 の権限マトリクス
        （`/admin/users` の中）と、5.8.2 のエージェント用トークンの発行結果
        （`/me/agents`。必要権限は「本人」）である。カタログ自体は Design.md 6.4.2 に
        全文があり、本人の実効権限は `GET /me` が既に返しているので、開放しても
        渡る情報は増えない。

        `items[]` は `permission.sort_order` 昇順。`category` は同じ番号帯で連続しており、
        画面はこれで行を区切る。**ページネーションも ETag も持たない。**
      responses:
        '200':
          description: 権限のカタログ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/settings/pending:
    get:
      tags: [settings]
      summary: 確認を待っている設定変更
      operationId: getPendingSettings
      description: |
        確認を待っている変更だけを返す（ApiDesign.md 11.9）。
        **必要権限は `system.settings`。**

        **設定一覧と分けた軽い口である。** 画面はこれを定期的に引いて、
        **どの画面にいても未確認を出す**（GuiDesign.md 2.6）。全設定の一覧を
        ポーリングで運ぶのは無駄である。

        **一般利用者には見せない。** 「いま管理者が設定を変えている」を見せる
        必要はなく、確認を押す権限も無い。
      responses:
        '200':
          description: 未確認の変更（無ければ `pending_confirmation` は `null`）。
          content:
            application/json:
              schema:
                type: object
                required: [pending_confirmation]
                properties:
                  pending_confirmation:
                    oneOf:
                      - $ref: '#/components/schemas/PendingConfirmation'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/settings/confirm:
    post:
      tags: [settings]
      summary: 締め出されうる設定変更の確定
      operationId: confirmSettings
      description: |
        未確認の設定変更を確定する（ApiDesign.md 11.8、Design.md 10.3）。
        **必要権限は `system.settings`。**

        **確定すると以後は元へ戻らない。** 押されなければ期限で元の値へ戻る。

        **確認の条件はキーごとに違う。** `tls_enabled` は**接続が設定どおりで
        あること**を見る（平文で届いた確認を受け取ると、切り替えが失敗していても
        確定してしまう）。`cookie_secure` は**この口に届いたこと自体で足りる**
        ——認証が要る口であり、有効なのに Cookie が届いているなら、ブラウザは
        HTTPS で繋いでいる。**前段にプロキシを置く構成でも成立する。**
      responses:
        '204':
          description: 確定した。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 確認を待っている変更が無い（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            新しい設定を通って届いていない、または期限と競合して既に戻っていた
            （`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/settings:
    get:
      tags: [settings]
      summary: アプリケーション設定の一覧
      operationId: listSettings
      description: |
        サーバ全体の設定と、**各設定の実効値がどこから来たか**を返す
        （ApiDesign.md 11.1）。**必要権限は `system.settings`。**

        設定は3層に分かれる（Design.md 10.3）。優先順は
        `<KEY>_FILE` ＞ `PB_CONFIG_FILE` の YAML ＞ 環境変数 ＞ `app_setting` の行 ＞ 既定値で、
        `source` がどの層から来たかを示す。**`editable` が真になるのは第2層で、
        かつファイルも環境変数も与えていないときだけである。**

        `items[]` は設定レジストリの並び順（層の昇順、層の中は定義順）。
        **ページネーションも ETag も持たない**——件数はレジストリで固定されている。
      responses:
        '200':
          description: 設定の一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [settings]
      summary: アプリケーション設定の保存
      operationId: updateSettings
      description: |
        変更のある設定をまとめて書く（ApiDesign.md 11.2）。**必要権限は `system.settings`。**

        **配列で受けるのは、設定画面の保存ボタンが1回だからである。** 1件ずつにすると
        3件変えたときに3回の往復と3行の監査ログが出て、途中で失敗したときに画面と DB が
        ずれる。**1トランザクションで書き、監査ログも1行**（`setting.update`）にする。

        **`value` を `null` にすると行を消し、既定値へ戻す。** 「既定に戻す」ための別の
        エンドポイントを作らない——設定を消すことと既定へ戻すことは同じ状態である。

        **`PUT` は追加と変更を兼ねる（冪等）。** 本文に現れないキーは触らない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingUpdateRequest'
      responses:
        '200':
          description: 保存後の設定の一覧（11.1 と同じ形）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            その設定はファイルか環境変数で固定されている、または第1層のため
            画面から変更できない（`conflict`）。`message` に環境変数名または
            設定ファイルのキーを含める。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/tls/certificates:
    get:
      tags: [settings]
      summary: TLS証明書の一覧
      operationId: listTLSCertificates
      description: |
        登録済みの TLS 証明書を返す（ApiDesign.md 11.4、Design.md 6.6.1）。
        **必要権限は `system.settings`。**

        **`private_key` は返さない。** 暗号化して保持しており、この応答にも他のどの応答にも
        現れない。設計方針6「秘密は一度しか返さない」より強く、**一度も返さない。**

        **`status` はサーバが決める。** 選定の規則（有効なもののうち `not_before` が
        最も新しいもの）は Design.md 6.6.1 の1か所に置き、画面が日付から組み立てない。
        `active` は必ず1枚以下である。

        `items[]` は `not_before` の降順。**ページネーションも ETag も持たない。**
      responses:
        '200':
          description: 証明書の一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TLSCertificateList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [settings]
      summary: TLS証明書の登録
      operationId: uploadTLSCertificate
      description: |
        証明書と秘密鍵を PEM で登録する（ApiDesign.md 11.5）。**必要権限は `system.settings`。**

        **証明書と鍵が対応することを登録時に確かめる。** ここで弾かないとハンドシェイクの
        時刻まで誤りが見つからず、そのときにはもう画面も API も TLS の向こう側にあり、
        直す手段が無い。

        **期限切れの証明書は受けない**（422）。受けても `active` になれず、利用者は
        「登録したのに効かない」としか読めない。一方で `not_before` が未来のものは受ける
        ——**新旧2枚を並べる**という目的そのものである。

        **パスフレーズ付きの秘密鍵は受けない**（422）。パスフレーズの置き場という問いが増え、
        第1層の鍵が2つになる。復号してから貼る。

        **`multipart/form-data` ではなく JSON で受ける。** PEM はテキストであり、鍵を
        ファイルとして持っていない利用者（発行元の画面からコピーしただけ）が詰まる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TLSCertificateUploadRequest'
      responses:
        '201':
          description: 登録した証明書1件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TLSCertificate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            同じ指紋の証明書が既にある（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/tls/certificates/{id}/certificate.zip:
    get:
      tags: [settings]
      summary: TLS証明書の取り出し（zip ダウンロード）
      operationId: downloadTLSCertificate
      description: |
        証明書を zip に包んで返す（ApiDesign.md 11.7）。**必要権限は `system.settings`。**
        **中身は `<common_name>.crt` 1枚だけ。**

        **秘密鍵は返さない。** 返すのは証明書だけで、**鍵はどの応答にも現れない。**

        **この口は循環を断つためにある**——自己署名証明書では、その証明書を持って
        いないクライアントが PB へ繋げない。**証明書は PB の DB にあるので、
        繋げない相手から取ってこなければならない。**
        **HTTPS にする前に取っておける。**

        **zip で包むのは、`.crt` をそのまま返すとブラウザが拒むためである**。
        **PB は 200 を返しているので、失敗が画面にもログにも残らない。**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 証明書の ID（ULID）。
      responses:
        '200':
          description: |
            証明書1枚を収めた zip。`Content-Disposition` でファイル名が付く。
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="pb-cert-pb.example.com.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: その ID の証明書が無い（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/tls/certificates/{id}:
    delete:
      tags: [settings]
      summary: TLS証明書の削除
      operationId: deleteTLSCertificate
      description: |
        証明書1件を消す（ApiDesign.md 11.6）。**必要権限は `system.settings`。**

        **最後の有効な証明書は消せない**（409）。消せてしまうとその瞬間から TLS
        ハンドシェイクが失敗し、**画面から復旧できなくなる。** 平文へ戻したいなら、
        先に `tls_enabled` を無効にする。

        **`expired` と `superseded` はいつでも消せる。** どちらも出していないので、
        消しても振る舞いが変わらない。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 証明書の ID（ULID）。
      responses:
        '204':
          description: 消した。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: その ID の証明書が無い（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            これを消すと有効な証明書が無くなり、HTTPS で待ち受けられなくなる（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/database:
    get:
      tags: [settings]
      summary: DB の接続状態と統計
      operationId: getDatabaseStatus
      description: |
        PB が繋いでいる DB の接続状態と統計を返す（ApiDesign.md 11.10、GuiDesign.md 5.12.2）。
        **必要権限は `system.settings`。** **読み取り専用で、変更の口は持たない。**

        **パスワードは応答のどこにも入らない。**

        **件数は推定値ではなく `count(*)` の正確な数である。** 全表を1つの文で数えるので、
        表どうしの件数が同じ時点のものになる。代償は行数に比例する時間で、
        `statement_timeout`（15秒）を超えれば 500 になる。

        **ページネーションも ETag も持たない**——表は数十である。
      responses:
        '200':
          description: DB の接続状態と統計。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/admin/backup.tar.gz:
    get:
      tags: [settings]
      summary: PB 全体の書き出し（tar.gz ダウンロード）
      operationId: downloadBackup
      description: |
        PB 全体を1つの書庫に書き出して返す（ApiDesign.md 11.11、DbDesign.md 9.1.1）。
        **必要権限は `system.settings`。**

        **全表を `REPEATABLE READ` の1トランザクションで読む。** 表ごとに別の
        トランザクションにすると、**読んでいる途中の書き込みが表のあいだで食い違い**、
        戻したときに外部キーが通らない書庫ができる。

        **このトランザクションのあいだだけ `statement_timeout` を外す**
        （`SET LOCAL statement_timeout = 0`）。書き出しは行数に比例して長くなる。

        **保守モードには入らない**——読むだけなので、書き込みを止める必要が無い。

        **書庫そのものを秘密として扱う。** `app_secret` の鍵と、それで暗号化した
        暗号文の両方が入る（DbDesign.md 6.16 の「代償を隠さない」）。

        **`Content-Length` は返せない**（gzip した大きさが書き終わるまで分からない）。
      responses:
        '200':
          description: |
            PB 全体を収めた tar.gz。`Content-Disposition` でファイル名が付く。
            中身は `meta.json` と `data/<表名>.jsonl`（DbDesign.md 9.1.1）。
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="pb-backup-20260918-150405.tar.gz"
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Maintenance'

  /api/v1/admin/restore:
    post:
      tags: [settings]
      summary: PB 全体の取り込み（復元）
      operationId: restoreBackup
      description: |
        書庫を取り込み、PB 全体をその時点へ戻す（ApiDesign.md 11.12、DbDesign.md 9.1.1）。
        **必要権限は `system.settings`。**

        **段取りは「保守モードに入る → 書庫を検査 → 表を落とす → 書庫の版まで
        マイグレーション → `TRUNCATE` で払う → 外部キーを遅延させて行を入れる →
        数えて突き合わせる → 最新までマイグレーション → 操作者のセッションを
        入れ直す → 保守モードを出る」。**

        **`TRUNCATE` が要るのは、マイグレーションがスキーマだけでなく行も入れるから**
        である（0010 の権限カタログ、0037・0038 のテンプレート本文）。払わないと、
        書庫の同じ行と主キーで衝突する。

        **外部キーを遅延させるのは、行ごとの検査がその場で走るからである。**
        `ticket.parent_id` のような自己参照では、子を親より先に入れた時点で落ちる。
        遅延した検査は `COMMIT` でまとめて走るので、**整合していない書庫はそこで弾かれる。**

        **`multipart/form-data` で受ける。** 書庫は流しながら読む必要がある
        （K8s の Pod は `readOnlyRootFilesystem: true` で一時ファイルを書けない）。
        **パートはこの順で送る**——`archive` が最後でないと、資格情報を読む前に
        書庫が流れ込む。

        **PB は `pb_owner` の資格情報を持たない**（DbDesign.md 3.4）。取り込みの
        あいだだけ接続を張り、終わったら捨てる。**保存せず、応答にもログにも残さない。**

        **権限は資格情報を読む前に確かめる**——持っていない人に入力させない。

        **`422` までは DB を触っていない。** 書庫の検査と資格情報の確認は、
        表を落とす前に済ませる。**`500` のときは DB が中途半端なまま残る**ので、
        `message` にそう書き、同じ書庫でのやり直しを案内する（段取りは表を落とす
        ところから始まるので回復する）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
            encoding:
              archive:
                contentType: application/gzip
      responses:
        '200':
          description: |
            取り込みの結果と、件数の突き合わせ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            書庫のマイグレーション番号が、いまの PB より新しい（`backup_too_new`）。
            **知らない列を推測して埋めることになるので取り込まない。**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            書庫が壊れている・`format_version` が読めない、または
            `owner_password` が違う（`validation_failed`）。
            **後者は `details[].field` が `owner_password` になる。**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Maintenance'

  /healthcheck:
    get:
      tags: [ops]
      summary: ヘルスチェック
      operationId: healthcheck
      description: |
        監視・オーケストレータ用（ApiDesign.md 2.11）。**唯一 `/api/v1` の外にある。**
        認証・CSRF・レート制限・認可の対象外で、DBへは接続しない。
      security: []
      responses:
        '200':
          description: 常に `{"status":"OK"}`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pb_session
      description: |
        ブラウザ（Web UI）用。HttpOnly / SameSite=Lax（ApiDesign.md 2.3）。
        **状態変更系（POST/PATCH/PUT/DELETE）では `X-PB-CSRF` も必要**（2.4）。
    bearerAuth:
      type: http
      scheme: bearer
      description: 'CLI・スクリプト用（`Authorization: Bearer pb_api_...`。ApiDesign.md 2.3）。'

  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: |
        ULID（`actor.id`。ApiDesign.md 6.3）。**形式は検証しない**——不正な ID は
        単に行が見つからず 404 になる。存在しないものと形式が違うものを別の応答に
        分けると、ID の総当たりに手がかりを与えるため（1.2-5）。
      schema:
        type: string
      examples:
        demo:
          value: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
    AgentID:
      name: id
      in: path
      required: true
      description: |
        エージェントの ULID（`agent.actor_id`。ApiDesign.md 4.5）。
        **形式は検証しない**——不正な ID は単に行が見つからず 404 になる。
      schema:
        type: string

    ConnectTransport:
      name: transport
      in: query
      description: Codex の接続方式。既定は direct。
      schema:
        type: string
        enum: [direct, bridge]
        default: direct
    BridgeOS:
      name: os
      in: query
      description: transport=bridge のとき必須。direct では指定しない。macOS は arm64 のみ対応。
      schema:
        type: string
        enum: [darwin, windows, linux]
    BridgeArch:
      name: arch
      in: query
      description: transport=bridge のとき必須。direct では指定しない。
      schema:
        type: string
        enum: [amd64, arm64]

    AgentTokenID:
      name: token_id
      in: path
      required: true
      description: |
        エージェント用トークンの ULID（`access_token.id`。ApiDesign.md 4.5.5）。
      schema:
        type: string

    TokenID:
      name: id
      in: path
      required: true
      description: |
        アクセストークンの ULID（`access_token.id`。ApiDesign.md 4.4.3）。
        **形式は検証しない**——不正な ID は単に行が見つからず 404 になる。
      schema:
        type: string
      examples:
        demo:
          value: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
    MfaCredentialID:
      name: id
      in: path
      required: true
      description: |
        認証器の ULID（`user_mfa_credential.id`。ApiDesign.md 4.6）。
        **形式は検証しない**——不正な ID は単に行が見つからず 404 になる。
      schema:
        type: string
      examples:
        demo:
          value: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
    PasskeyID:
      name: id
      in: path
      required: true
      description: |
        パスキーの ULID（`user_passkey.id`。ApiDesign.md 4.7）。
        **形式は検証しない**——不正な ID は単に行が見つからず 404 になる。
      schema:
        type: string
      examples:
        demo:
          value: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
    TagID:
      name: id
      in: path
      required: true
      description: |
        タグの ULID（ApiDesign.md 9.1「チケット以外の子資源は ULID で指す」）。
        タグは `seq` に相当する連番を持たない。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    SprintID:
      name: id
      in: path
      required: true
      description: |
        スプリントの ULID（ApiDesign.md 9.1）。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketReferenceID:
      name: id
      in: path
      required: true
      description: |
        外部参照の ULID（ApiDesign.md 9.1「チケット以外の子資源は ULID で指す」）。
        外部参照は `seq` に相当する連番を持たない。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketCommentID:
      name: id
      in: path
      required: true
      description: |
        コメントの ULID（ApiDesign.md 9.1「チケット以外の子資源は ULID で指す」）。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketDoDID:
      name: id
      in: path
      required: true
      description: |
        完了条件の ULID（ApiDesign.md 9.1）。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketLinkID:
      name: id
      in: path
      required: true
      description: |
        チケット間リンクの ULID（ApiDesign.md 9.1）。**`direction` を問わない**
        ——`incoming` の行の id もここへ渡せる（9.10.1）。
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    TicketSeq:
      name: seq
      in: path
      required: true
      description: |
        プロジェクト内連番（`ticket.seq`。ApiDesign.md 9.1）。**チケットを指すのは常に
        `seq` であり ULID ではない**——親もリンク先も同一プロジェクト内に限り、
        プロジェクトが URL で決まっているため `seq` だけで一意に定まる。
        MCP 経由でエージェントが扱う識別子も `my-app-31` の形になる。
      schema:
        type: integer
        format: int32
        minimum: 1
      examples:
        demo:
          value: 31
    ProjectKey:
      name: key
      in: path
      required: true
      description: |
        プロジェクトキー（ULID ではない。ApiDesign.md 5.4）。URL・チケット番号と
        一致させ、開発時のデバッグを容易にするため。
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{1,19}$'
      examples:
        demo:
          value: my-app
    DocPath:
      name: path
      in: path
      required: true
      description: |
        文書のパス（ApiDesign.md 10.1）。`slug` を根から連ねたもので、`vision`、
        `rules/naming` のようになる。**スラッシュを含む**——実装は chi の
        ワイルドカード（`/docs/*`）1本で受け、末尾のセグメントで `_revisions` を
        切り分ける。

        **ULID も返すが、指定には使わない。** チケットが `seq` を使うのと同じ理由で、
        共有できる URL になり、画面の URL（`/p/:key/docs/rules/naming`）とそのまま一致する。
      schema:
        type: string
      examples:
        top:
          value: vision
        nested:
          value: rules/naming
    DocRevisionNo:
      name: revision_no
      in: path
      required: true
      description: リビジョン番号（1始まり。ApiDesign.md 10.5）。
      schema:
        type: integer
        minimum: 1
      examples:
        second:
          value: 2
    csrfToken:
      type: apiKey
      in: header
      name: X-PB-CSRF
      description: |
        `pb_csrf` Cookie と同じ値を送る（double submit。ApiDesign.md 2.4）。
        Cookie 認証の状態変更系でのみ要求する。Bearer 認証では不要。

  # 既定では Cookie か Bearer のいずれかを要求する。
  # 認証不要のエンドポイントは security: [] で個別に打ち消す。
  headers:
    RetryAfter:
      description: 再試行までの秒数。`error.retry_after_sec` と同じ値（ApiDesign.md 2.5）。
      schema:
        type: integer
    XRateLimitLimit:
      description: 窓あたりの上限回数（ApiDesign.md 2.9）。
      schema:
        type: integer
    XRateLimitRemaining:
      description: 窓の残り回数（ApiDesign.md 2.9）。
      schema:
        type: integer

  responses:
    BadRequest:
      description: 形式不正・パースエラー（`bad_request`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 未認証・トークン失効・アカウント無効（`unauthenticated`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        権限不足（`forbidden`）。`audit_log` に `permission.denied` が残る（Design.md 6.4.5）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CSRFFailed:
      description: |
        CSRF トークンの不一致（`csrf_failed`）。Cookie 欠落・ヘッダ欠落・不一致を区別しない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Maintenance:
      description: |
        保守モード中（`maintenance`。ApiDesign.md 11.13、2.5.1）。書庫の取り込み
        （11.12）のあいだ、`/api` と `/mcp` はこれを返す。**`Retry-After` は
        伴わない**——かかる時間は書庫の大きさで決まり、PB は見積もれない。

        **ブラウザが開くパスには、単一の静的な HTML を同じ 503 で返す**——
        SPA を返すと、画面は動き出してから API で失敗する。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: 入力値の検証エラー（`validation_failed`）。`details` を伴う。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProjectStatusChanged:
      description: |
        切り替え後のプロジェクト（5.4 と同形式）。**既にその状態でも 200 を返す**
        （ApiDesign.md 5.6 の冪等）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectDetail'
    ProjectNotFound:
      description: |
        プロジェクトが存在しない、または到達できない（`not_found`）。
        **非メンバーには 403 ではなく 404 を返す**（Design.md 6.4.5「存在を隠す」）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TagNotFound:
      description: |
        タグが存在しない（`not_found`）。**他プロジェクトのタグ ID も同じ 404 に寄せる**
        ——クエリの `WHERE` が `project_id` を含むため区別が付かず、区別する必要もない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TagAlreadyExists:
      description: |
        同じ名前のタグが既にある（`already_exists`。`uq_tag_project_name`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SprintNotFound:
      description: |
        スプリントが存在しない（`not_found`）。TagNotFound と同じ扱い。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketReferenceNotFound:
      description: |
        外部参照が存在しない（`not_found`）。**他チケットの参照も同じ 404 に寄せる**
        ——クエリの `WHERE` が `ticket_id` を含むため区別が付かず、区別する必要も
        ない（Design.md 6.4.5）。チケットそのものが無い場合は TicketNotFound になる。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketCommentNotFound:
      description: |
        コメントが存在しない（`not_found`）。**削除済みもここへ合流する**
        （ApiDesign.md 9.8）——論理削除でも「もう無い」として扱い、二重削除が
        204 で通らないようにする。他チケットのコメントも同じ 404 に寄せる。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketDoDNotFound:
      description: |
        完了条件が存在しない（`not_found`）。他チケットの完了条件も同じ 404 に
        寄せる（Design.md 6.4.5）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketLinkNotFound:
      description: |
        関連チケットのリンクが存在しない（`not_found`）。**このチケットが
        `source` でも `target` でもない行も同じ 404 に寄せる**（ApiDesign.md 9.10.1）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketLinkAlreadyExists:
      description: |
        同じ `(source, target, link_type)` のリンクが既にある（`already_exists`。
        `uq_ticket_link`）。**`conflict` ではない**——あちらは `If-Match` 不一致の
        ような状態の競合で、こちらは値が既存の行と衝突している（ApiDesign.md 9.10.1）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TicketNotFound:
      description: |
        チケットが存在しない（`not_found`）。**他プロジェクトの番号も同じ 404 に寄せる**
        ——クエリの `WHERE` が `project_id` を含むため区別が付かず、区別する必要もない
        （Design.md 6.4.5）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocNotFound:
      description: |
        文書が存在しない、`?section=` の章が無い、`_revisions/{revision_no}` の版が無い、
        または閲覧権限が無い（`not_found`。ApiDesign.md 10.6）。**閲覧権限が無い場合も
        同じ応答になる**——到達できないものの存在を漏らさないため（Design.md 6.4.5）。

        **章が見つからなかった場合だけ、本体に `available_sections` が付く**（10.3）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocAlreadyExists:
      description: |
        同じ親の下に同じ `slug` の文書がある（`already_exists`。ApiDesign.md 10.6）。
        **`conflict` ではない**——`conflict` は `If-Match` 不一致のような状態の競合を指し、
        こちらは一意なキーの重複である（2.5.1）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DocMethodNotAllowed:
      description: |
        `.../_revisions` を `GET` 以外で叩いた（`method_not_allowed`。ApiDesign.md 10.1）。
        `slug` の検証が `_` を弾く以上「`_revisions` という名の文書」は存在しえないので、
        **実在するサブ資源に対する未定義のメソッド**として扱う。「文書が無い」（404）に
        寄せると、書き込み先を間違えた呼び出し側が原因に辿り着けない。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: レート制限（`rate_limited`。ApiDesign.md 2.9）。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: サーバ内部エラー（`internal_error`）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          examples: ['tanaka@example.com']
        password:
          type: string
          format: password
      additionalProperties: false

    Session:
      description: |
        `POST /auth/login` と `GET /me` が返す共通の本体。**片方だけ形を変えない。**
      type: object
      required: [actor, permissions, projects, expires_at]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        permissions:
          description: システムロール由来の実効権限。権限0件は空配列で表す。
          type: array
          items:
            type: string
          examples: [['project.view', 'ticket.view']]
        projects:
          description: 所属プロジェクトと、そこでの実効権限。`key` の昇順。
          type: array
          items:
            $ref: '#/components/schemas/SessionProject'
        expires_at:
          description: 現在のトークンの有効期限。無期限の API トークンでは null。
          type: [integer, 'null']
          format: int64

    Actor:
      type: object
      required:
        [
          id,
          kind,
          display_name,
          avatar_url,
          email,
          system_role,
          locale,
          timezone,
          theme,
          hue,
          must_change_password,
        ]
      properties:
        id:
          description: ULID 26文字。
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        kind:
          type: string
          enum: [user, agent]
        display_name:
          type: string
        avatar_url:
          type: [string, 'null']
          description: 登録画像の取得 URL。未登録時は null。
        email:
          description: エージェントは null（ApiDesign.md 6.1。フィールド自体は省略しない）。
          type: [string, 'null']
        system_role:
          description: 同上。
          type: [string, 'null']
          enum: [administrator, operator, null]
        locale:
          type: [string, 'null']
          enum: [ja, en, null]
          examples: ['ja']
        timezone:
          type: [string, 'null']
          examples: ['Asia/Tokyo']
        theme:
          description: |
            テーマ（GuiDesign.md 8.11）。エージェントは null。**サーバが返さないと
            別の端末で同じ見た目にならない**——8.11 が app_user と localStorage の
            両方に保存すると定めた目的がそれである。
          type: [string, 'null']
          enum: [light, dark, system, null]
        hue:
          description: ベース色相（GuiDesign.md 8.3）。エージェントは null。
          type: [string, 'null']
          enum: [blue, green, null]
        must_change_password:
          description: true のときフロントはパスワード変更画面へ誘導する（ApiDesign.md 3.1）。
          type: boolean

    UpdateMeRequest:
      type: object
      description: |
        ApiDesign.md 4.2。**送らなかった項目は変更しない**（部分更新）。
        すべて省略可だが、少なくとも1つを送ること自体は必須にしていない——
        空の `{}` は「何も変えない」として 200 を返す。

        `system_role` は**受け口としてだけ**定義してある。送られたら 422 で
        弾くためであり、黙って捨てると呼び出し側が権限が上がったと誤解する。
      properties:
        display_name:
          description: 1〜60文字。前後の空白は取り除かれる。
          type: string
          minLength: 1
          maxLength: 60
          examples: ['田中']
        email:
          description: |
            **ログインIDでもある**（ApiDesign.md 4.2）。画面では「ログインID」と
            「メールアドレス」の2行に分かれるが、どちらも本項目を指す。
          type: string
          format: email
          maxLength: 254
          examples: ['tanaka@example.com']
        locale:
          description: 表示言語。`ja`（日本語）または `en`（英語）。
          type: string
          enum: [ja, en]
        timezone:
          description: |
            IANA のタイムゾーン名。サーバは `time.LoadLocation` で解決できるかを
            見る（値の一覧を持たない）。`Local` は弾く——誰のローカルかがサーバの
            設定に依存し、端末をまたぐと意味が変わるため。
          type: string
          maxLength: 64
          examples: ['Asia/Tokyo']
        theme:
          type: string
          enum: [light, dark, system]
        hue:
          type: string
          enum: [blue, green]
        system_role:
          description: |
            **変更できない。** 送られると 422（`details[].code` が `not_allowed`）。
          type: string
          enum: [administrator, operator]

    AgentClientKindList:
      description: ApiDesign.md 4.5.7。ページネーションも ETag も持たない。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentClientKind'

    AgentScopes:
      description: ApiDesign.md 4.5.9。ページネーションも ETag も持たない。
      type: object
      required: [default, grantable]
      properties:
        default:
          type: array
          description: |
            `scopes` を省略したときに入る既定（Design.md 6.5）。昇順。
          items: { type: string }
          example: [agent.run, comment.create, doc.view, project.view, ticket.assign, ticket.create, ticket.reference.edit, ticket.self_edit, ticket.transition, ticket.view]
        grantable:
          type: array
          description: 既定に足せる権限。
          items: { type: string }
          example: [doc.edit]

    AgentSetup:
      description: |
        ApiDesign.md 5.7.1。リポジトリにコミットする配置ファイル一式。
      type: object
      required: [project, base_url, workflow_version, clients, files]
      properties:
        project:
          $ref: '#/components/schemas/ProjectRef'
        base_url:
          type: string
          description: |
            PB の公開 URL。**リクエストの `Host` から組み立てた暫定値**である。
            画面が「エージェントはこの URL へ接続します」と出すために返す。
          example: http://localhost:8081
        workflow_version:
          type: integer
          description: |
            生成した手順ファイルに埋まる版番号（Requirements.md 10.9.3）。
            **手順ファイルの本文を変えたら上がる。** 「PB 側が古いと判断して警告を返す」
            経路は無く、手順ファイルに埋めるだけである。
          example: 5
        clients:
          type: array
          description: 実際に組み立てた種別（重複を畳み、カタログの順に並べたもの）。
          items:
            type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/AgentSetupFile'

    AgentConnect:
      description: |
        ApiDesign.md 4.5.8。**そのエージェント1件のための接続設定一式**（系統B）。
        **`AgentSetup`（系統A）とは別物である**——あちらはリポジトリにコミットする
        ファイル、こちらは各人の手元にしか残らないもの。
      type: object
      required: [agent, project, base_url, mcp_url, transport, export_line, files, ca_trust]
      properties:
        agent:
          type: object
          required: [id, display_name, client_kind, client_display_name, token_env_name]
          properties:
            id:
              type: string
            display_name:
              type: string
            client_kind:
              type: string
            client_display_name:
              type: string
              description: |
                カタログの表示名（4.5.7）。**画面が対応表を持たないために返す**
                ——値域は今後も増えるので、写しを置くと必ず腐る。
                **カタログに無い種別ではキーをそのまま返す。**
            token_env_name:
              type: string
              description: |
                接頭 `PB_TOKEN_` を付けた実際の変数名。**組み立てはサーバの1か所**
                （4.5.1）。**`export_line` が null の種別でも値は返す。**
        project:
          $ref: '#/components/schemas/ProjectRef'
        base_url:
          type: string
          description: |
            PB の公開 URL。**リクエストの `Host` から組み立てた暫定値**
            （5.7.1 と同じ規則。スキームは `PB_COOKIE_SECURE`）。
          example: http://localhost:8081
        mcp_url:
          type: string
          description: |
            `base_url` ＋ `/mcp/<project_key>`（Design.md 8.3）。
            **`files[]` の中に埋まっているものと同じ文字列である。**
          example: http://localhost:8081/mcp/pb
        transport:
          type: string
          enum: [direct, bridge]
          description: Codex の接続方式。`direct` は HTTPS、`bridge` はローカル stdio bridge。
        export_line:
          type: string
          nullable: true
          description: |
            トークンを環境変数へ置く行。**`null` になる種別が2つある**（4.5.8.2）
            ——Copilot は `${input:pb-token}` を使って環境変数を読まず、
            Claude Desktop は **GUI アプリなのでシェルの環境が届かない**
            （トークンは設定ファイルの `env` に書く）。
            **画面は `null` のとき節ごと出さないが、続く指示は種別で違う。**
          example: export PB_TOKEN_MY_LAPTOP='ここに発行したトークンを貼る'
        files:
          type: array
          description: |
            接続設定。**1枚だけか、空である**——PB が書式を持たない種別
            （`gemini` / `other`）では空配列を返し、**エラーにしない**（4.5.8.3）。
            **`has_setup_template` では判定しない**——あれは系統A の有無であり、
            `claude_desktop` は偽のまま接続設定を持つ。
            **`mode` は常に `merge`**（4.5.8.4）。
            **zip に入る `PB-README.md` はここに含まれない**（4.5.8.5）。
          items:
            $ref: '#/components/schemas/AgentSetupFile'
        ca_trust:
          type: object
          description: |
            「HTTPS の証明書を信頼させる」手順（4.5.8.1b）。**種別ごとに違い、Codex は
            `transport` でも変わる。** **`null` にしない**——接続先が http でも返す
            （後から HTTPS にする人が先に読めるように、画面は常に畳んで出す）。
          required: [verification, body_md]
          properties:
            verification:
              type: string
              enum: [verified, partial, unverified]
              description: |
                実機で確かめたか。`verified`＝そのクライアントで繋がるところまで、
                `partial`＝下の層（Node 単体・Go の既定のクライアント）だけ、
                `unverified`＝確かめていない。
            body_md:
              type: string
              description: |
                本文（Markdown。見出しを持たない）。**zip の `PB-README.md` の同じ節と同じ文である。**

    AgentSetupFile:
      description: |
        ApiDesign.md 5.7.1 の `files[]`。**`mode` が要点である**——これが無いと、
        画面が「上書きしてよいファイル」と「壊してはいけないファイル」を同じ見た目で
        並べる。
      type: object
      required: [path, client_kind, mode, language, content]
      properties:
        path:
          type: string
          description: リポジトリ直下からの相対パス。
          example: .claude/commands/pb-onboard.md
        client_kind:
          type: string
          description: |
            どのクライアント向けか。**共通のもの（`.gitignore`）は空文字**。
        mode:
          type: string
          enum: [create, append, merge]
          description: |
            - `create`：そのまま置く
            - `append`：既存の末尾へ追記する（マーカーの内側だけが PB の管理範囲）
            - `merge`：既存の構造へ該当キーだけを足す。**JSON は追記できないので
              `append` と分けている**（`.claude/settings.json` を丸ごと置き換えると
              既存の許可設定が消える）
        language:
          type: string
          description: 画面がハイライトに使う（`markdown` / `json` / `text`）。
        marker_begin:
          type: string
          description: '`append` のときだけ入る（Requirements.md 10.8.8）。'
          example: '<!-- PB:BEGIN v2'
        marker_end:
          type: string
          description: '`append` のときだけ入る。'
          example: '<!-- PB:END -->'
        content:
          type: string
          description: ファイルの中身。

    AgentClientKind:
      description: |
        エージェントのクライアント種別1件（DbDesign.md 8.2.1.1）。
        **値が決めるのは設定ファイルの置き場であって、エディタではない**
        ——同じ VS Code でも Claude 拡張と GitHub Copilot で分かれる。
      type: object
      required: [key, display_name, has_setup_template]
      properties:
        key:
          type: string
          example: claude_code
        display_name:
          type: string
          example: Claude Code
        has_setup_template:
          type: boolean
          description: |
            PB がこの種別の配置ファイルを出せるか（0023。手順28a）。
            **絞り込みは画面が行う**——`/me/agents` の登録モーダルは全種別を出し
            （テンプレートが無くてもエージェントは登録できる）、
            `/p/:key/settings/agents` は真のものだけを出す。

    MyAgentList:
      description: |
        ApiDesign.md 4.5.1。ページネーションも ETag も持たない（4.4.1 と同じく、
        件数が少なく絞り込みも差分取得も意味を持たないため）。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MyAgent'

    MyAgent:
      description: |
        ApiDesign.md 4.5.1 / 4.5.2 / 4.5.4。自分のエージェント1件。

        **`/admin/users` の `agent` オブジェクト（6.1）とは別物である。** あちらは
        管理者の一覧が返す形で、所有者を持つ代わりに名前と状態を親が持つ。
      type: object
      required:
        [id, display_name, client_kind, model_name, model_version,
         project, token_env_suffix, token_env_name,
         trust_level, is_active, created_at, token]
      properties:
        id:
          type: string
          description: エージェントの ULID（`agent.actor_id`）。
        display_name:
          type: string
          description: |
            本人が付けた名前。**どの端末のどのクライアントかを思い出すための
            手がかり**であり、一意ではない。
        client_kind:
          type: string
          description: |
            `agent_client_kind` の `key`（DbDesign.md 8.2.1.1）。
            **値域を固定しない**——正本は `GET /api/v1/agent-client-kinds`（4.5.7）で、
            今後も増える。0019 までは CHECK の3値だった。
        model_name:
          type: string
          nullable: true
        model_version:
          type: string
          nullable: true
        project:
          allOf:
            - $ref: '#/components/schemas/ProjectRef'
          description: 参加プロジェクト。登録時に必須なので `null` にならない。
        token_env_suffix:
          type: string
          nullable: true
          description: |
            接続設定ファイルが読む環境変数の**接尾**（`DbDesign.md` 8.2.1）。本人が決める。
            **未設定なら `null`**（0023 より前に登録された行）。
        token_env_name:
          type: string
          description: |
            接頭 `PB_TOKEN_` を付けた**実際の変数名**。
            **`token_env_suffix` が `null` のときは `PB_TOKEN_<エージェントの id>`。**
            **組み立てはサーバの1か所に閉じてある**——画面と生成器が各々
            フォールバックを計算すると、設定ファイルの名前と `export` 行がずれる。
          example: PB_TOKEN_MY_LAPTOP
        trust_level:
          type: integer
          description: |
            0〜3（既定 1）。**使わない**——段階的な権限昇格の材料
            （`agent_run` の実績）が構想のため、既定値のまま置く。
        is_active:
          type: boolean
          description: '`false` は無効化されたエージェント。行は残る。'
        created_at:
          type: integer
          format: int64
        token:
          allOf:
            - $ref: '#/components/schemas/AgentToken'
          nullable: true
          description: 有効なトークン1本。無ければ `null`。

    ProjectRef:
      description: プロジェクトの最小の参照（ApiDesign.md 4.5.1）。
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string

    AgentToken:
      description: |
        ApiDesign.md 4.5.1 の `token`。**平文を持たない。**
      type: object
      required: [id, token_prefix, issued_at, last_used_at, expires_at, status]
      properties:
        id:
          type: string
        token_prefix:
          type: string
          description: 先頭8文字（`pb_agt_` + 1文字）。検索キーではない。
        issued_at:
          type: integer
          format: int64
        last_used_at:
          type: integer
          format: int64
          nullable: true
          description: 一度も使われていなければ `null`。更新は1分粒度。
        expires_at:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [active, expired]

    IssuedAgentToken:
      description: |
        ApiDesign.md 4.5.3。**`token`（平文）を持つ唯一の形**である。
        DB には SHA-256 のハッシュしか残らず、再表示する経路は存在しない。
      type: object
      required: [id, token, token_prefix, scopes, issued_at, expires_at, status]
      properties:
        id:
          type: string
        token:
          type: string
          description: '**この応答でのみ返る平文。** 接頭辞は `pb_agt_`。'
        token_prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
          description: |
            **このトークンが持つ権限キーの全部。** 要求で `scopes` を省けば
            Design.md 6.5 の既定10件、送ればその並びがそのまま入る。
            `ticket.close` は許可リストの外なので
            決して含まれない。

            **発行時のスコープを読めるのはこの応答だけである。** `AgentToken`
            （`GET /me/agents` が返す形）は `scopes` を持たない。後から
            確かめたいときは、そのトークンで `GET /me` を叩いて `permissions`
            を見る——ただしあれは**所有者のロールとの積**であって、
            発行時のスコープそのものではない。
        issued_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [active, expired]

    CreateAgentRequest:
      description: ApiDesign.md 4.5.2。
      type: object
      required: [display_name, project_key, client_kind]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 60
          description: '`actor.display_name` の CHECK（1〜60）に揃える。'
        project_key:
          type: string
          description: |
            **自分がメンバーであるプロジェクトに限る。** それ以外は 422
            （`details[].code` は `not_found`）。
        client_kind:
          type: string
          description: |
            `agent_client_kind` の `key`（DbDesign.md 8.2.1.1）。
            **値域を固定しない**——正本は `GET /api/v1/agent-client-kinds`（4.5.7）で、
            今後も増える。0019 までは CHECK の3値だった。
        model_name:
          type: string
          maxLength: 100
        model_version:
          type: string
          maxLength: 100
        token_env_suffix:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,40}$'
          description: |
            トークンを載せる環境変数の接尾（手順28a）。省略・空は「未設定」で、
            `token_env_name` が id へ倒れる。**同じ所有者の中で一意**
            （重複は 409 `already_exists`）。

    UpdateAgentRequest:
      description: |
        ApiDesign.md 4.5.4。**送られた項目だけを更新する。**
        `project_key` は変えられない（そのエージェントが行った仕事は
        プロジェクトに属するため）。**`client_kind` は 0020 から変えられる**
        ——値域が今後も増えるので、`other` で登録した人が、PB がその種別に
        対応した日に移れる必要がある。
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        client_kind:
          type: string
          description: |
            `agent_client_kind` の `key`（4.5.7 が正本）。変更すると
            （所有者・プロジェクト・クライアント種別・表示名）の4つ組が
            ぶつかりうるので、**重複すれば 409 `already_exists`** になる。
        model_name:
          type: string
          maxLength: 100
        model_version:
          type: string
          maxLength: 100
        token_env_suffix:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,40}$'
          description: |
            **変えられる**（手順28a）。端末を替えたときに直せる必要があるのは
            `display_name` と同じ理由である。**変えたら接続設定を取り直す**
            ——設定ファイルに古い変数名が残っていると繋がらない。
        is_active:
          type: boolean
          description: |
            `false` で無効化する。**そのエージェントのトークンも失効する。**

    CreateAgentTokenRequest:
      description: ApiDesign.md 4.5.3。
      type: object
      required: [expires_in_days]
      properties:
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          description: |
            **必須。無期限は許さない**（Design.md 6.5「有効期限必須」）。
            値域は `/me/tokens`（4.4.2）と同じ。
        scopes:
          type: array
          items:
            type: string
          minItems: 1
          description: |
            省略可。**省略すると Design.md 6.5 の既定10件**
            （`agent.run` `comment.create` `doc.view` `project.view`
            `ticket.assign` `ticket.create` `ticket.reference.edit`
            `ticket.self_edit` `ticket.transition` `ticket.view`）。

            渡すときは**許可リストの中だけ**——既定10件に `doc.edit` を加えた
            11件である。それ以外のキーは 422。`ticket.close` は許可リストにも
            入れない（Design.md 6.5 の禁止。ワークフローの
            `is_agent_reachable=false` でも担保される）。

            **`scopes` は絶対指定であって、足すものの並びではない。** 送ると
            そのトークンが持つ権限の全部になるので、**既定に1件足したいときも
            既定の全件を並べて送る**。既定より短い並びを送ると、**その差は
            黙って落ちる**。

            **`doc.edit` を足せるのは `pb_put_doc` のためである**（Design.md 8.2）。
            載せるかは「そのエージェントが誰に付いているか」で決まる——
            PM のエージェントは持ち、実装だけを行うエージェントは持たない。

            **空配列 `[]` は 422 である。** `/me/tokens`（4.4.2）は `[]` を
            「絞り込みなし」と定めており、同じ意味に取ると**既定より広い
            トークンが黙って出る**。語彙が同じで意味が逆になる欄は作らない。

            **所有者の権限との積になる**ので、許可リストの中でも所有者が
            持たない権限は付かない（`doc.edit` を持つのは `project_admin` だけ）。

    MfaChallenge:
      description: |
        パスワードは通ったが、第2要素がまだという状態（ApiDesign.md 3.1）。
        **`Session` とは `mfa_required` の有無で見分ける**——こちらに `actor` は無い。
        **Cookie は発行されていない。**
      type: object
      required: [mfa_required, mfa_token, methods, expires_at]
      properties:
        mfa_required:
          description: 常に true。この鍵の存在そのものが分岐の目印である。
          type: boolean
          examples: [true]
        mfa_token:
          description: |
            挑戦の平文トークン。**DB には SHA-256 しか残らない**（DbDesign.md 6.18）。
            画面はメモリに置くだけで、保存しない（GuiDesign.md 5.1.1）。
          type: string
          examples: ['pb_mfa_9f3c1d...']
        methods:
          description: |
            この挑戦で使える手段。**挑戦ごとに組む**——未使用のリカバリコードが
            1本も無ければ `recovery_code` は入らない。
          type: array
          items:
            type: string
            enum: [totp, recovery_code]
          examples: [['totp', 'recovery_code']]
        expires_at:
          description: 挑戦の期限（5分）。**セッションの期限ではない。**
          type: integer
          format: int64

    LoginMfaRequest:
      description: |
        ApiDesign.md 3.4。**`code` と `recovery_code` はどちらか一方だけを送る**
        （両方・どちらも無しは 422）。
      type: object
      required: [mfa_token]
      properties:
        mfa_token:
          type: string
          examples: ['pb_mfa_9f3c1d...']
        code:
          description: 認証アプリに表示されている6桁。
          type: string
          examples: ['123456']
        recovery_code:
          description: |
            リカバリコード1本（Base32 の10文字）。**空白とハイフンは無視し、
            小文字も受ける**——紙から写す値なので、見た目の差で落とさない。
          type: string
          examples: ['K7M2QX9B4T']

    MfaOverview:
      description: |
        ApiDesign.md 4.6.1。ページネーションも ETag も持たない（上限5件）。
      type: object
      required: [totp]
      properties:
        totp:
          description: 確定済みの認証器。**未確定の行は含まない。**
          type: array
          items:
            $ref: '#/components/schemas/TotpCredential'
        recovery_codes:
          description: |
            **1本も持たないときは null。** `remaining: 0` は「作って全部使った」で
            あり、別の状態である（画面は前者に「作成」、後者に「作り直す」を出す）。
          allOf:
            - $ref: '#/components/schemas/RecoveryCodeStatus'
          nullable: true

    TotpCredential:
      description: |
        確定済みの認証器1件（ApiDesign.md 4.6.1）。**共有秘密は含まない。**
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        name:
          description: 登録時に本人が付けた名前。どの端末かを思い出すための手がかり。
          type: string
          examples: ['iPhone']
        created_at:
          type: integer
          format: int64
        last_used_at:
          description: 一度も使われていなければ null。
          type: integer
          format: int64
          nullable: true

    RecoveryCodeStatus:
      description: リカバリコードの残数（ApiDesign.md 4.6.1）。**平文は含まない。**
      type: object
      required: [remaining, generated_at]
      properties:
        remaining:
          description: 未使用の本数。**行を数えた値**で、列に持っていない。
          type: integer
          examples: [8]
        generated_at:
          description: 10本を作った時刻。
          type: integer
          format: int64

    StartTotpRequest:
      description: ApiDesign.md 4.6.2。
      type: object
      required: [name]
      properties:
        name:
          description: 1〜60文字（`user_mfa_credential.name` の CHECK と同じ）。
          type: string
          examples: ['iPhone']

    StartedTotpRegistration:
      description: |
        登録の途中の認証器（ApiDesign.md 4.6.2）。**`secret` と `otpauth_uri` が
        出る唯一の応答**であり、どちらも同じ共有秘密の別の表現である。
      type: object
      required: [id, name, secret, otpauth_uri, digits, period_sec]
      properties:
        id:
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        name:
          type: string
          examples: ['iPhone']
        secret:
          description: |
            Base32（パディング無し）。**手入力用**で、QR を読めない環境のために返す。
          type: string
          examples: ['JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP']
        otpauth_uri:
          description: |
            QR にする文字列（RFC 6238 の慣例。`otpauth://totp/...`）。
            **画像はクライアントが描く**（GuiDesign.md 5.8）。
          type: string
          examples: ['otpauth://totp/Project%20Backyard:tanaka%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=Project+Backyard&algorithm=SHA1&digits=6&period=30']
        digits:
          description: 6。**列に持たず定数である**（Design.md 6.7.2）。画面の案内文に使う。
          type: integer
          examples: [6]
        period_sec:
          description: 30。同じく定数。
          type: integer
          examples: [30]

    ConfirmTotpRequest:
      description: ApiDesign.md 4.6.3。
      type: object
      required: [code]
      properties:
        code:
          description: いまアプリに出ている6桁。**前後1刻みまで許容する**（Design.md 6.7.2）。
          type: string
          examples: ['123456']

    ConfirmedTotp:
      description: |
        確定した認証器（ApiDesign.md 4.6.3）。**MFA を最初に有効にしたときだけ
        `recovery_codes` が入る。**
      type: object
      required: [credential]
      properties:
        credential:
          $ref: '#/components/schemas/TotpCredential'
        recovery_codes:
          description: |
            10本の平文。**2件目以降の認証器では返らない**——既に持っているコードが
            無効になると読めてしまうため。
          type: array
          items:
            type: string
          examples: [['K7M2QX9B4T', '9FRD3HJ5PW']]

    RecoveryCodeList:
      description: |
        作り直した10本（ApiDesign.md 4.6.5）。**再表示はできない。**
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items:
            type: string
          examples: [['K7M2QX9B4T', '9FRD3HJ5PW']]

    PasskeyOptions:
      description: |
        WebAuthn の options（ApiDesign.md 3.5・4.7.2）。**`options` は WebAuthn Level 3 の
        JSON 表現そのままで、PB の命名規約（snake_case）に変換しない**——画面は
        `options.publicKey` を `PublicKeyCredential.parseRequestOptionsFromJSON()`（ログイン）か
        `parseCreationOptionsFromJSON()`（登録）に渡す。
      type: object
      required: [options, expires_at]
      properties:
        options:
          description: |
            ログインでは `publicKey` に `PublicKeyCredentialRequestOptionsJSON`、
            登録では `PublicKeyCredentialCreationOptionsJSON` が入る。
          type: object
          required: [publicKey]
          properties:
            publicKey:
              type: object
              additionalProperties: true
            mediation:
              type: string
        expires_at:
          description: 挑戦の期限（5分）。
          type: integer
          format: int64

    LoginPasskeyRequest:
      description: ApiDesign.md 3.6。
      type: object
      required: [credential]
      properties:
        credential:
          description: |
            `PublicKeyCredential.toJSON()` の結果をそのまま入れる（WebAuthn Level 3 の
            `AuthenticationResponseJSON`）。
          type: object
          additionalProperties: true

    RegisterPasskeyRequest:
      description: ApiDesign.md 4.7.3。
      type: object
      required: [name, credential]
      properties:
        name:
          description: 1〜60文字（`user_passkey.name` の CHECK と同じ）。1人の中で一意。
          type: string
          examples: ['MacBook']
        credential:
          description: |
            `PublicKeyCredential.toJSON()` の結果をそのまま入れる（WebAuthn Level 3 の
            `RegistrationResponseJSON`）。
          type: object
          additionalProperties: true

    PasskeyList:
      description: ApiDesign.md 4.7.1。ページネーションも ETag も持たない（上限5件）。
      type: object
      required: [items]
      properties:
        items:
          description: '`created_at` の昇順。'
          type: array
          items:
            $ref: '#/components/schemas/Passkey'

    Passkey:
      description: |
        登録済みのパスキー1件（ApiDesign.md 4.7.1）。**公開鍵も credential_id も含まない。**
      type: object
      required: [id, name, rp_id, backed_up, created_at, last_used_at]
      properties:
        id:
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        name:
          description: 登録時に本人が付けた名前。
          type: string
          examples: ['MacBook']
        rp_id:
          description: |
            登録したときのホスト名（Design.md 6.8.3）。**いま開いているホスト名と違えば、
            そのパスキーはこの画面では使えない。**
          type: string
          examples: ['localhost']
        backed_up:
          description: 端末をまたいで同期されているか（`backup_state`）。
          type: boolean
        created_at:
          type: integer
          format: int64
        last_used_at:
          description: 一度も使われていなければ null。
          type: integer
          format: int64
          nullable: true

    AccessTokenList:
      description: |
        ApiDesign.md 4.4.1。ページネーションも ETag も持たない（1人5本が上限で、
        絞り込みも差分取得も意味を持たないため。7.1 / 7.2 と同じ扱い）。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessToken'

    AccessToken:
      description: |
        `token_type='api'` の access_token 1行（ApiDesign.md 4.4.1）。
        **平文は含まない。**
      type: object
      required: [id, name, token_prefix, scopes, issued_at, status]
      properties:
        id:
          type: string
          examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']
        name:
          description: 発行時に本人が付けた名前。どの端末・どの用途かの唯一の手がかり。
          type: string
          examples: ['CLI (MacBook)']
        token_prefix:
          description: 平文の先頭8文字（DbDesign.md 6.2）。行を見分けるためのもので、検索キーではない。
          type: string
          examples: ['pb_api_9']
        scopes:
          description: |
            権限カタログのキー（Design.md 6.4.2）。**空配列は「絞り込みなし」**であって
            「権限0件」ではない。
          type: array
          items:
            type: string
          examples: [[]]
        issued_at:
          type: integer
          format: int64
        last_used_at:
          description: 一度も使われていなければ null。更新は1分粒度（Design.md 6.2.2）。
          type: integer
          format: int64
          nullable: true
        expires_at:
          description: |
            必ず入る（無期限を許さない。ApiDesign.md 4.4.2）。列としては
            NULL を許すため nullable にしてある。
          type: integer
          format: int64
          nullable: true
        status:
          description: '`active`（有効）／ `expired`（`expires_at` を過ぎた）。'
          type: string
          enum: [active, expired]
      additionalProperties: false

    IssuedAccessToken:
      description: |
        発行直後の応答（ApiDesign.md 4.4.2）。**`token` を持つ唯一の形**で、
        AccessToken に平文を1項目足したものである。
      type: object
      required: [id, name, token, token_prefix, scopes, issued_at, status]
      properties:
        id:
          type: string
        name:
          type: string
          examples: ['CLI (MacBook)']
        token:
          description: |
            **平文。この応答でしか得られない。** 画面は1回だけ全文を出す
            （GuiDesign.md 5.8.1）。
          type: string
          examples: ['pb_api_9f3c1d2e...']
        token_prefix:
          type: string
          examples: ['pb_api_9']
        scopes:
          type: array
          items:
            type: string
        issued_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
          nullable: true
        status:
          type: string
          enum: [active, expired]
      additionalProperties: false

    CreateTokenRequest:
      description: ApiDesign.md 4.4.2。
      type: object
      required: [name, expires_in_days]
      properties:
        name:
          description: |
            1〜100文字（`project.name` と同じ上限。`access_token.name` に DB の
            CHECK は無く、アプリ側が持つ）。前後の空白は取り除かれる。
          type: string
          minLength: 1
          maxLength: 100
          examples: ['CLI (MacBook)']
        expires_in_days:
          description: |
            1〜365。**無期限は許さない**——失効操作でしか消えないトークンが残り、
            置き忘れを検出できなくなるため（Design.md 6.5 がエージェントトークンに
            課す「有効期限必須」と揃える）。
          type: integer
          minimum: 1
          maximum: 365
          examples: [90]
        scopes:
          description: |
            権限カタログのキー（Design.md 6.4.2 の32件）。カタログに無い値は 422。
            省略時と空配列は「絞り込みなし」。**画面は常に空で送る。**
          type: array
          items:
            type: string
          examples: [[]]
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      description: ApiDesign.md 4.3。
      required: [current_password, new_password]
      properties:
        current_password:
          description: |
            現在のパスワード。不一致は 401 `invalid_credentials`。
            **失敗しても `failed_attempts` は増えない**（4.3）。
          type: string
        new_password:
          description: 12文字以上（Design.md 6.3）。複雑性要件は課さない。
          type: string
          minLength: 12

    SessionProject:
      type: object
      required: [id, key, name, role, permissions]
      properties:
        id:
          type: string
        key:
          type: string
          examples: ['my-app']
        name:
          type: string
        role:
          description: プロジェクトロールのキー（DbDesign.md 7.3）。
          type: string
          examples: ['project_admin']
        permissions:
          description: 当該プロジェクトでの実効権限。
          type: array
          items:
            type: string

    RoleList:
      type: object
      required: [items]
      description: |
        ApiDesign.md 7.1。**2.6 のページネーション項目を持たない**——件数が
        シードで固定されており、page / per_page / total のいずれも意味を持たない。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    Role:
      type: object
      required: [key, scope, display_name, description, is_builtin, sort_order, permissions]
      properties:
        key:
          description: ロールのキー（DbDesign.md 7.3）。
          type: string
          examples: ['project_admin']
        scope:
          description: |
            権限の効く範囲（Design.md 6.4.1 の三層構造）。`system` はインスタンス全体、
            `project` は個別プロジェクトに対する役割。
          type: string
          enum: [system, project]
        display_name:
          description: |
            画面に出す名前。**画面ごとに略さない**（GuiDesign.md 5.6）。
          type: string
          examples: ['プロジェクト管理者']
        description:
          description: 選択肢の下に添える説明。`role.description` は NULL 許容。
          type: string
          nullable: true
        is_builtin:
          description: |
            組み込みロールか。常に `true`。カスタムロール（`false`）の
            作成は構想である（ApiDesign.md 7.3）。
          type: boolean
        sort_order:
          description: 並び順。表示名の五十音順ではない（GuiDesign.md 5.6）。
          type: integer
        permissions:
          description: |
            割り当てられた権限キー。`permission.sort_order` の昇順。
            **権限を1件も持たないロールでも `[]` を返し、`null` にしない。**
          type: array
          items:
            type: string

    PermissionList:
      type: object
      required: [items]
      description: ApiDesign.md 7.2。RoleList と同じくページネーション項目を持たない。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Permission:
      type: object
      required: [key, category, description, sort_order]
      properties:
        key:
          description: 権限キー（Design.md 6.4.2 の権限カタログ）。
          type: string
          examples: ['ticket.close']
        category:
          description: |
            権限の分類。GuiDesign.md 5.6.3 のマトリクスはこれで行を区切る。
          type: string
          examples: ['ticket']
        description:
          description: 権限の説明。マトリクスではキーの下に副見出しとして出す。
          type: string
          examples: ['チケットのクローズ']
        sort_order:
          type: integer

    UserList:
      description: 一覧の共通エンベロープ（ApiDesign.md 2.6）。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          description: 切り上げ。総件数0のときは0。
          type: integer

    UserListItem:
      description: |
        一覧の1行（ApiDesign.md 6.1）。**`kind` によって意味を持たないフィールドは
        `null` を返し、フィールド自体を省略しない。** フロントの分岐を単純にするため。
      type: object
      required:
        [id, kind, display_name, email, system_role, agent, is_active,
         last_login_at, project_count, created_at]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          type: string
          enum: [user, agent]
        display_name:
          type: string
        email:
          description: エージェントは `null`。
          type: string
          nullable: true
        system_role:
          description: エージェントは `null`。
          type: string
          enum: [operator, administrator]
          nullable: true
        agent:
          description: |
            **`kind='agent'` の行にだけ入る**（人間の行では `null`）。中身（`client_kind` /
            `model_name` / `project_key` / `trust_level`）は DbDesign.md 8.2.1 の
            `agent` テーブルの列である。
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AgentInfo'
        is_active:
          type: boolean
        last_login_at:
          description: 一度もログインしていなければ `null`。
          type: integer
          format: int64
          nullable: true
        project_count:
          description: |
            `project_member` の行数。**アーカイブ済みプロジェクトも数える**
            （詳細画面の memberships と食い違わせないため）。
          type: integer
        created_at:
          type: integer
          format: int64

    AgentInfo:
      description: |
        エージェントの付帯情報（ApiDesign.md 6.1）。`kind='agent'` の行にだけ返る。
      type: object
      required: [client_kind, model_name, project_key, trust_level, owner]
      properties:
        client_kind:
          type: string
        model_name:
          type: string
        project_key:
          type: string
        trust_level:
          type: integer
        owner:
          description: |
            このエージェントが付いている人（`agent.owner_actor_id`。ApiDesign.md 6.1）。
            **実効権限はこの人から導かれる**（Design.md 6.5 の委譲）。登録した人ではない。
            所有者を引けなければ `null`。
          type: object
          nullable: true
          required: [id, display_name]
          properties:
            id:
              type: string
              example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
            display_name:
              type: string
              example: 田中

    CreateUserRequest:
      description: ユーザーの作成（ApiDesign.md 6.2）。
      type: object
      required: [display_name, email]
      properties:
        display_name:
          description: 1〜60文字（`actor.display_name` の CHECK 制約と同じ）。前後の空白は落とす。
          type: string
          minLength: 1
          maxLength: 60
        email:
          description: |
            254文字以内（RFC 5321 4.5.3.1.3）。表示名付き（`山田 <a@example.com>`）は受け付けない。
            既に使われていれば `409 already_exists`。
          type: string
          format: email
          maxLength: 254
        system_role:
          description: 省略時は `operator`。
          type: string
          enum: [operator, administrator]
          default: operator
        password_mode:
          description: 省略時は `generate`（GuiDesign.md 5.6.1 の初期選択）。
          type: string
          enum: [generate, manual]
          default: generate
        password:
          description: |
            `password_mode=manual` のときのみ必須。12文字以上（Design.md 6.3）。
            `generate` のときに送られても無視する（モード切替でフォームに残った値を弾かない）。
          type: string
          minLength: 12
          nullable: true
        must_change_password:
          description: 省略時は `true`（GuiDesign.md 5.6.1 のチェックボックスが既定でオン）。
          type: boolean
          default: true

    CreatedUser:
      description: |
        作成された利用者（ApiDesign.md 6.2 の 201）。一覧の要素（`UserListItem`）とは別で、
        作成直後に確定している値だけを返す。
      type: object
      required: [id, kind, display_name, email, system_role, is_active, generated_password]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          type: string
          enum: [user]
        display_name:
          type: string
        email:
          type: string
        system_role:
          type: string
          enum: [operator, administrator]
        is_active:
          type: boolean
        generated_password:
          description: |
            **この応答でのみ返る。** 再表示できず、監査ログにも残さない。
            形式は `<形容詞>-<名詞>-<4桁数字>-<名詞>`（例 `quiet-harbor-4172-mint`）で、
            読み上げ・転記しやすい語句連結方式（ApiDesign.md 6.2）。
            `password_mode=manual` のときは `null`（呼び出し側が既に平文を持っているため）。
          type: string
          nullable: true

    UserDetail:
      description: |
        1ユーザーの詳細（ApiDesign.md 6.3）。**5.6.2 の詳細画面が必要とする情報を
        1回で返す。** 一覧の要素（`UserListItem`）とは別で、`project_count` を持たず
        代わりに `version` と3つの配列を持つ。
      type: object
      required:
        [id, kind, display_name, email, system_role, is_active, last_login_at,
         created_at, version, identities, project_memberships, sessions,
         mfa_credential_count, passkey_count]
      properties:
        id:
          description: ULID（`actor.id`）。
          type: string
        kind:
          description: '**`user` のみ。** エージェントは 404 になる。'
          type: string
          enum: [user]
        display_name:
          type: string
        email:
          type: string
        system_role:
          type: string
          enum: [operator, administrator]
        is_active:
          type: boolean
        last_login_at:
          description: 一度もログインしていなければ `null`。
          type: integer
          format: int64
          nullable: true
        created_at:
          type: integer
          format: int64
        version:
          description: |
            楽観ロック用（`app_user.version`。ApiDesign.md 2.8）。`PATCH` の
            `If-Match` にこの値を入れる。**`display_name` や `is_active` を
            変えた場合も +1 される。**
          type: integer
        identities:
          description: |
            認証手段（`DbDesign.md` 6.2 の `user_identity`）。**この配列が
            IdP 連携（構想）をそのまま受け入れる**——OIDC を追加しても要素が1つ増えるだけで、
            応答構造もUIも変わらない。
          type: array
          items:
            $ref: '#/components/schemas/UserIdentity'
        project_memberships:
          description: |
            プロジェクトごとの権限。**アーカイブ済みプロジェクトも含む**
            （6.1 の `project_count` と件数を食い違わせないため）。
          type: array
          items:
            $ref: '#/components/schemas/UserMembership'
        sessions:
          description: |
            有効なセッション（`access_token` の `token_type='session'` のうち、
            失効しておらず期限内のもの）。
          type: array
          items:
            $ref: '#/components/schemas/UserSession'
        mfa_credential_count:
          description: |
            確定済みの第2要素の件数（DbDesign.md 6.18）。**配列ではなく
            件数だけを返す**——画面（GuiDesign.md 5.6.2）が出すのも件数で、
            他人の端末の名前は管理に要らない。**未確定の登録は数えない。**
            0 なら第2要素の解除（6.9）を disabled にする根拠になる。
          type: integer
        passkey_count:
          description: |
            登録済みのパスキーの件数（DbDesign.md 6.19）。`mfa_credential_count` と
            同じ理由で件数だけを返す。0 ならパスキーの全削除（6.10）を disabled にする根拠になる。
          type: integer

    UserIdentity:
      description: 認証手段1件（ApiDesign.md 6.3 の `identities[]`）。
      type: object
      required:
        [id, provider_key, provider_type, subject, linked_at, last_used_at,
         password_updated_at]
      properties:
        id:
          type: string
        provider_key:
          description: '`local` のみ（DbDesign.md 7.1 のシード）。'
          type: string
        provider_type:
          type: string
          enum: [local, oidc, saml]
        subject:
          description: |
            `local` では `app_user.email` と同じ文字列。**メールを変更すると
            この値も追随する**（そうしないとログインできなくなる）。
          type: string
        linked_at:
          type: integer
          format: int64
        last_used_at:
          type: integer
          format: int64
          nullable: true
        password_updated_at:
          description: |
            `local_credential` の列。ローカル以外のプロバイダでは `null`。
            画面（5.6.2 の「認証手段」ブロック）が「最終更新」として出す。
          type: integer
          format: int64
          nullable: true

    UserMembership:
      description: |
        プロジェクトメンバーシップ1件（ApiDesign.md 6.3 の `project_memberships[]`）。
        6.8 の `PUT` もこの形を返す。
      type: object
      required: [project_id, project_key, project_name, role, joined_at]
      properties:
        project_id:
          type: string
        project_key:
          type: string
        project_name:
          type: string
        role:
          description: |
            プロジェクトロールのキー（`project_member.role_key`。
            `project_admin` / `project_member` / `project_viewer`。DbDesign.md 7.3）。
          type: string
        joined_at:
          description: '**ロールを変えても動かない。**'
          type: integer
          format: int64

    UserSession:
      description: |
        有効なセッション1件（ApiDesign.md 6.3 の `sessions[]`）。
        **平文のトークンも `token_hash` も載せない。**
      type: object
      required: [id, client_info, issued_at, last_used_at, expires_at]
      properties:
        id:
          type: string
        client_info:
          description: 発行時の User-Agent（`access_token.client_info`）。
          type: string
          nullable: true
        issued_at:
          type: integer
          format: int64
        last_used_at:
          description: 一度も使われていなければ `null`。**1分粒度で間引いて更新される**（Design.md 6.2.2）。
          type: integer
          format: int64
          nullable: true
        expires_at:
          description: 無期限なら `null`（セッションは必ず入る）。
          type: integer
          format: int64
          nullable: true

    UpdateUserRequest:
      description: |
        ユーザーの更新（ApiDesign.md 6.4）。**送られたフィールドだけを更新する。**
        4項目とも `null` への更新は無い。
      type: object
      properties:
        display_name:
          description: 1〜60文字。前後の空白は落とす（作成時と同じ検証）。
          type: string
          minLength: 1
          maxLength: 60
        email:
          description: |
            254文字以内。既に使われていれば `409 already_exists`。
            **変更すると `user_identity.subject` も追随する。**
          type: string
          format: email
          maxLength: 254
        system_role:
          description: |
            変更すると権限キャッシュが無効化される（Design.md 6.4.5）。
            自分自身の変更は `409 self_modification_forbidden`、最後の有効な
            アドミニストレータの降格は `409 last_administrator`。
          type: string
          enum: [operator, administrator]
        is_active:
          description: |
            `false` にすると次のリクエストから認証を通れなくなる（`Authenticate` が
            `actor.is_active` を見る）。**セッションは失効させない**——必要なら
            6.7 を別に呼ぶ。自分自身の無効化は `409 self_modification_forbidden`。
          type: boolean

    PasswordResetRequest:
      description: |
        パスワードのリセット（ApiDesign.md 6.6）。**本文そのものを省略してもよい。**
      type: object
      properties:
        mode:
          description: '**`generate` のみ受け付ける。** 省略時も `generate`。'
          type: string
          enum: [generate]
          default: generate
        must_change_password:
          description: 省略時は `true`。
          type: boolean
          default: true

    GeneratedPassword:
      description: 生成された初期パスワード（ApiDesign.md 6.6 の 200）。
      type: object
      required: [generated_password]
      properties:
        generated_password:
          description: |
            **この応答でのみ返る。** 再表示できず、監査ログにも残さない。
            形式は `<形容詞>-<名詞>-<4桁数字>-<名詞>`（例 `quiet-harbor-4172-mint`。
            ApiDesign.md 6.2.1）。
          type: string

    MembershipRequest:
      description: プロジェクトメンバーシップの付与・変更（ApiDesign.md 6.8）。
      type: object
      required: [role]
      properties:
        role:
          description: |
            プロジェクトロールのキー。妥当性はDB（`role.scope='project'`）に
            問い合わせるため、ここでは列挙しない——`enum` に書き写すと
            DbDesign.md 7.3 のシードと二重管理になる。
          type: string
          examples: ['project_admin']

    ProjectList:
      description: 一覧の共通エンベロープ（ApiDesign.md 2.6）。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectListItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          description: 切り上げ。総件数0のときは0。
          type: integer

    ProjectListItem:
      type: object
      required:
        [id, key, name, description, status, ticket_count, closed_count, progress,
         my_role, updated_at]
      properties:
        id:
          type: string
        key:
          type: string
          examples: ['my-app']
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, archived]
        ticket_count:
          type: integer
        closed_count:
          description: '`ticket.closed_at IS NOT NULL` の件数（DbDesign.md 6.6）。'
          type: integer
        progress:
          description: |
            `closed_count / ticket_count`。**サーバで計算する**（定義をフロントに散らさないため）。
            `ticket_count = 0` のときは `0`（null にしない。ApiDesign.md 5.1）。
          type: number
          examples: [0.75]
        my_role:
          description: |
            当該プロジェクトでのプロジェクトロール。
            **メンバーでないアドミニストレータでは null**（5.1 の「管理者は全件」で返る行）。
          type: [string, 'null']
          examples: ['project_admin']
        updated_at:
          type: integer
          format: int64

    CreateProjectRequest:
      type: object
      required: [key, name]
      properties:
        key:
          description: |
            `^[a-z0-9][a-z0-9-]{1,19}$`。予約語（`admin` `api` `mcp` `login` `logout`
            `me` `p` `new` `projects` `static` `assets` `check-key`）は使えない。
            **作成後は変更不可。**
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,19}$'
          examples: ['my-app']
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        workflow_template:
          description: 実体は DbDesign.md 7.4 のテンプレート。
          type: string
          enum: [simple, with_review, with_approval]
          default: simple

    UpdateProjectRequest:
      description: |
        `PATCH /projects/:key` の本文（ApiDesign.md 5.5）。**送られたフィールドだけを
        更新する**ため required は無い。`key` は受け付けず、送ると 422
        （`details[].code` が `immutable_field`）になる。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          description: |
            `null` を明示すると説明を消す。フィールドごと送らなければ据え置く。
            空文字は `null` と同じ扱い（`POST /projects` に合わせる）。
          type: [string, 'null']
          maxLength: 1000
        settings:
          description: |
            `project.settings`（jsonb）をそのまま置き換える。**部分更新ではない**ので、
            取得した値を保持し、変更するキーだけ差し替えて全体を送ること。

            サーバは JSON オブジェクトであることしか検証しない。画面が
            使うキーは `repositories` のみで、構造の正本は DbDesign.md 6.4 にある。
          type: object
          additionalProperties: true
        timezone:
          description: |
            基準タイムゾーン（IANA 名）。サーバと DB の両方が知っている名前だけを受ける。
            **変えても既存の日時は動かさない**（ApiDesign.md 5.5）。
          type: string
          maxLength: 64

    ProjectDetail:
      description: |
        `POST /projects`・`GET /projects/:key`・`PATCH /projects/:key`・
        archive / unarchive が返す共通の本体（ApiDesign.md 5.4）。
        **どれか1つだけ形を変えない。**
      type: object
      required:
        [id, key, name, description, status, timezone, workflow, members, my_role,
         my_permissions, settings, version, created_at, updated_at]
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, archived]
        timezone:
          description: プロジェクトの基準タイムゾーン（IANA 名。DbDesign.md 6.23）。
          type: string
        workflow:
          description: '`project.workflow_id` が NULL のときは null。'
          oneOf:
            - $ref: '#/components/schemas/Workflow'
            - type: 'null'
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        my_role:
          description: |
            メンバーでないアドミニストレータでは null。
            **エージェントのトークンでは所有者のロールが出る**（委譲。Design.md 6.5）。
          type: [string, 'null']
        my_permissions:
          description: |
            当該プロジェクトでの実効権限
            （システムロール ∪ プロジェクトロール ∩ スコープ。Design.md 6.4.1）。
            **エージェントのトークンでは所有者のロールから導く**（同 6.5）。
          type: array
          items:
            type: string
        settings:
          description: |
            `project.settings`（jsonb）をそのまま返す。画面が使うキーは
            `repositories` のみで、構造の正本は DbDesign.md 6.4 にある。
          type: object
          additionalProperties: true
        version:
          description: 楽観ロック用（ApiDesign.md 2.8）。作成直後は 1。
          type: integer
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    ProjectCalendar:
      description: 暦の取得元と取得の状態（ApiDesign.md 5.8.1）。
      type: object
      required: [source]
      properties:
        source:
          oneOf:
            - $ref: '#/components/schemas/ProjectCalendarSource'
            - type: 'null'
        imported:
          description: '`POST /calendar/import` の応答にだけ付く。'
          type: object
          required: [days, skipped]
          properties:
            days:
              type: integer
            skipped:
              type: integer

    ProjectCalendarSource:
      type: object
      required:
        [kind, google_id, name, holiday_count, observance_count, fetched_at,
         last_attempt_at, last_error, next_fetch_at]
      properties:
        kind:
          type: string
          enum: [google, file]
        google_id:
          description: Google の暦の識別子（`ja.japanese` など）。`file` では null。
          type: [string, 'null']
        name:
          description: 暦の名前（iCal の `X-WR-CALNAME`、無ければ取り込んだファイル名）。
          type: [string, 'null']
        holiday_count:
          type: integer
        observance_count:
          type: integer
        fetched_at:
          description: 最後に取り込めた時刻。一度も取れていなければ null。
          type: [integer, 'null']
          format: int64
        last_attempt_at:
          type: [integer, 'null']
          format: int64
        last_error:
          description: 最後の取得の失敗。画面にそのまま出せる日本語。成功で null に戻る。
          type: [string, 'null']
        next_fetch_at:
          description: 次に取得できる時刻。いま取得できるなら null。`file` では常に null。
          type: [integer, 'null']
          format: int64

    PutProjectCalendarSourceRequest:
      type: object
      required: [google_id]
      properties:
        google_id:
          description: '`^[a-z]{2}\.[a-z_]+$`。null で取得元を外す。'
          type: [string, 'null']

    ImportProjectCalendarRequest:
      type: object
      required: [ics]
      properties:
        filename:
          description: 暦に名前が無いとき、これを名前にする。
          type: string
        ics:
          description: iCal の本文。1MiB まで。
          type: string

    ProjectCalendarDays:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCalendarDay'

    ProjectCalendarDay:
      type: object
      required: [day, is_holiday, reason, events, override]
      properties:
        day:
          type: string
          format: date
        is_holiday:
          type: boolean
        reason:
          description: 決め手になった段（DbDesign.md 6.23 の表）。`none` は行事だけの平日。
          type: string
          enum: [override, holiday, weekend, none]
        events:
          description: 取得元にあるその日の祝日・行事（上書きされていても返す）。
          type: array
          items:
            type: object
            required: [kind, name]
            properties:
              kind:
                type: string
                enum: [holiday, observance]
              name:
                type: string
        override:
          oneOf:
            - type: object
              required: [is_holiday, name]
              properties:
                is_holiday:
                  type: boolean
                name:
                  type: [string, 'null']
            - type: 'null'

    PutProjectCalendarDayRequest:
      type: object
      required: [is_holiday]
      properties:
        is_holiday:
          type: boolean
        name:
          type: string
          maxLength: 200

    Workflow:
      type: object
      required: [id, name, statuses]
      properties:
        id:
          type: string
        name:
          type: string
        statuses:
          description: '`sort_order` の昇順。'
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatus'

    WorkflowStatus:
      type: object
      required:
        [key, name, category, sort_order, requires_human_approval, is_agent_reachable]
      properties:
        key:
          type: string
          examples: ['todo']
        name:
          type: string
          examples: ['未着手']
        category:
          type: string
          enum: [todo, in_progress, review, done]
        sort_order:
          type: integer
        requires_human_approval:
          description: 人間の承認を要するステータス（Requirements.md 10.10.4）。
          type: boolean
        is_agent_reachable:
          description: エージェントが遷移させてよいか。
          type: boolean

    ProjectMember:
      type: object
      required: [actor_id, kind, display_name, email, role, joined_at]
      properties:
        actor_id:
          type: string
        kind:
          description: エージェントもプロジェクトのメンバーになれる（DbDesign.md 6.3）。
          type: string
          enum: [user, agent, system]
        display_name:
          type: string
        email:
          description: |
            `app_user.email`（DbDesign.md 6.2）。**エージェントとシステムアクターは
            `app_user` の行を持たないため null**。キーは常に返す。
          type: [string, 'null']
          examples: ['tanaka@example.com']
        role:
          type: string
          examples: ['project_admin']
        joined_at:
          type: integer
          format: int64

    CheckKeyResult:
      type: object
      required: [key, available]
      properties:
        key:
          type: string
        available:
          type: boolean
        reason:
          description: '`available: false` のときだけ現れる（ApiDesign.md 5.2）。'
          type: string
          enum: [reserved, already_exists, invalid_format]

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: OK
        version:
          description: '`PB_HEALTH_SHOW_VERSION=true` のときだけ出る（既定は出ない）。'
          type: string

    Error:
      description: |
        全エンドポイント共通のエラー形式（ApiDesign.md 2.5）。
        `message` はそのまま画面に出せる日本語。**フロントで文言を組み立てない。**
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              examples: ['メールアドレスまたはパスワードが正しくありません']
            details:
              description: フィールド単位のエラー。フォームの入力欄に紐づける。
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            retry_after_sec:
              description: |
                再試行までの秒数。`account_locked` と `rate_limited` で返す。
                同じ値が `Retry-After` ヘッダにも入る。
              type: integer
            available_sections:
              description: |
                `GET .../docs/{path}?section=` が命中しなかったときの見出し一覧
                （ApiDesign.md 10.3）。`retry_after_sec` と同じ理由で `details` では
                なく本体に置く——`details` は `{field, code, message}` の配列であり、
                入力欄に紐づかない配列を載せる場所が無い。**呼び出し側（多くは
                エージェント）が、もう一度目次を取りに行かずに次の一手を選べる。**
              type: array
              items:
                type: string
              examples: [['命名', 'ブランチ', '接頭辞']]
            request_id:
              description: |
                `audit_log.request_id`（DbDesign.md 6.8）および構造化ログ
                （Design.md 10.1）と突き合わせられる。
              type: string
              examples: ['01K2F8QW3H7YRJ4M5N6P7Q8R9S']

    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string

    Tag:
      description: |
        タグ1件（ApiDesign.md 9.11）。**色を持たない**——GuiDesign.md 8.6 が
        ラベルへの任意色を許さない（ユーザーごとに色の意味が食い違い、一覧が
        虹色になって輝度による階層が崩れるため）。
      type: object
      required: [id, name, sort_order, ticket_count]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          minLength: 1
          maxLength: 30
          example: 設計
        sort_order:
          type: integer
          format: int32
          description: バックログのグループ化セクションの順序（GuiDesign.md 5.9.4）。
          example: 10
        ticket_count:
          type: integer
          format: int64
          description: |
            このタグが付いているチケットの件数。削除確認ダイアログが
            「12件のチケットで使われています」を出すために使う（GuiDesign.md 6.3）。
          example: 12

    TagList:
      description: |
        タグの一覧（ApiDesign.md 9.11）。**`page` / `per_page` / `total` を持たない**
        ——バックログのグループ化が全件を必要とするため。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    CreateTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: 前後の空白は取り除かれる。同一プロジェクト内で一意。
          example: 設計
        sort_order:
          type: integer
          format: int32
          description: 省略時は末尾（現在の最大値 + 10）。
          nullable: false

    PatchTagRequest:
      description: |
        送られた項目だけを変える。何も送らない場合は現在の値をそのまま返す。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        sort_order:
          type: integer
          format: int32
          description: 並べ替え（ApiDesign.md 9.11.1）はこの項目で表現する。

    Sprint:
      description: スプリント1件（ApiDesign.md 9.12）。
      type: object
      required: [id, name, goal, start_at, end_at, all_day, status, ticket_count, closed_count]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Sprint 3
        goal:
          type: string
          nullable: true
          example: 認証を通す
        start_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の開始（エポックミリ秒。ApiDesign.md 9.3.1）。
          example: 1785855600000
        end_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の終わり（**含まない**。終日なら締切日の翌日の0時）。
          example: 1787065200000
        all_day:
          type: boolean
        status:
          $ref: '#/components/schemas/SprintStatus'
        ticket_count:
          type: integer
          format: int64
          description: このスプリントに割り当てられたチケットの件数。
          example: 12
        closed_count:
          type: integer
          format: int64
          description: |
            そのうち `closed_at IS NOT NULL` の件数。**`status_category = 'done'` では
            数えない**（ApiDesign.md 9.12）。画面は `5/12` の形で出す。
          example: 5

    SprintStatus:
      description: DbDesign.md 6.9 の CHECK と同じ3値。
      type: string
      enum: [planned, active, completed]

    SprintList:
      description: |
        スプリントの一覧（ApiDesign.md 9.12）。タグと同じくページャを持たない。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Sprint'

    CreateSprintRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 前後の空白は取り除かれる。**一意制約は無い**（同名を作れる）。
        goal:
          type: string
          nullable: true
        start_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の開始（エポックミリ秒。ApiDesign.md 9.3.1）。
        end_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の終わり（**含まない**。終日なら締切日の翌日の0時）。`start_at` 以上。終日なら両端は基準タイムゾーンの0時（違えば 422 `not_midnight`）。
        all_day:
          type: boolean
          description: 省略時は true（終日）。
        status:
          $ref: '#/components/schemas/SprintStatus'

    StartSprintRequest:
      description: |
        スプリントを始めるときに決めるもの（ApiDesign.md 9.12.1）。

        **`status` を受け取らない。** 開始は必ず `active` であり、選ばせる意味がない。
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 前後の空白は取り除かれる。**一意制約は無い**（同名を作れる）。
        goal:
          type: string
          nullable: true
        start_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の開始（エポックミリ秒。ApiDesign.md 9.3.1）。
        end_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の終わり（**含まない**。終日なら締切日の翌日の0時）。`start_at` 以上。終日なら両端は基準タイムゾーンの0時（違えば 422 `not_midnight`）。
        all_day:
          type: boolean
          description: 省略時は true（終日）。

    PatchSprintRequest:
      description: |
        送られた項目だけを変える。**`goal` / `start_at` / `end_at` は `null` を
        送ると値を消す**（キーが無い場合の「据え置き」と区別する）。
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        goal:
          type: string
          nullable: true
        start_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の開始（エポックミリ秒。ApiDesign.md 9.3.1）。
        end_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の終わり（**含まない**。終日なら締切日の翌日の0時）。終日なら両端は基準タイムゾーンの0時（違えば 422 `not_midnight`）。
        all_day:
          type: boolean
        status:
          $ref: '#/components/schemas/SprintStatus'

    SubmitTicketReportRequest:
      description: |
        完了レポートの本文（ApiDesign.md 9.15、Requirements.md 10.6.1）。
        **`task_id` を持たない**——チケットは URL が指す（9.1）。

        **ここに書かれていないキーも受け付け、`report` jsonb にそのまま保存する。**
        検証するのは列へ展開される値と、**整形したコメント本文の長さ**である——
        整形後が20000字（9.8 のコメントと同じ上限）を超えると 422
        （`details[].field = "report"`、`code = "too_long"`）で、何も作らない。
      type: object
      required: [status]
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [completed, blocked, partial]
          description: 作業の結果。
        knowledge_impact:
          type: string
          enum: [none, minor, major]
          nullable: true
          description: 得た知見がプロジェクトの規約や設計にどれだけ効くか。
        cost:
          type: object
          description: この作業に掛かったもの。`tokens` と `turns` は `agent_run` の列へ展開される。
          properties:
            tokens: { type: integer, format: int64, minimum: 0 }
            turns: { type: integer, minimum: 0 }
            wall_clock_min:
              type: integer
              minimum: 0
              description: 掛かった時間（分）。**`agent_run.started_at` はこれから逆算する。**
        dod_results:
          type: array
          description: 完了条件ごとの自己検証の結果。**`id` はこのチケットの完了条件のものに限る**（他は 422 `not_found`）。
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S }
              passed: { type: boolean }
              evidence: { type: string }
              note: { type: string }
        artifacts:
          type: array
          description: 作った成果物。
          items:
            type: object
            properties:
              type: { type: string, example: pull_request }
              url: { type: string }
              path: { type: string }
        findings:
          type: array
          description: 判明したこと。`kind` は Requirements.md 6.5 の情報類型。
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [decision, discussion, artifact, caveat, reference]
              body: { type: string }
        failures:
          type: array
          description: |
            **試して駄目だったこと。** 10.6.2 が「失敗の記録を第一級の資産とする」と
            定めている——エージェントは同じ失敗を平然と繰り返すため効果が大きい。
          items:
            type: object
            properties:
              approach: { type: string }
              reason: { type: string }
        proposed_subtasks:
          type: array
          description: |
            分割の提案。**チケットにはならない**——承認キュー（`proposal`）は構想で
            あり、人が読んで要ると判断すれば `pb_create_ticket` を呼ばせれば済む。
          items:
            type: object
            properties:
              title: { type: string }
              rationale: { type: string }

    TicketReport:
      description: |
        受理した完了レポート（ApiDesign.md 9.15）。
      type: object
      required: [id, agent_run_id, seq, status, submitted_at, submitted_by, comment_id, unsatisfied_dod]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        agent_run_id:
          type: string
          description: この提出で作られた実行記録（`agent_run`）の id。
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        seq:
          type: integer
          description: チケット番号。
        status:
          type: string
          enum: [completed, blocked, partial]
        knowledge_impact:
          type: string
          enum: [none, minor, major]
          nullable: true
        submitted_at:
          type: integer
          format: int64
        submitted_by:
          $ref: '#/components/schemas/ActorRef'
        comment_id:
          type: string
          description: 同じトランザクションで作った完了レポートのコメントの id。
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        unsatisfied_dod:
          type: array
          description: |
            **レポートの `dod_results` に `passed: true` として現れなかった完了条件。**
            `is_satisfied = false` のものではない——この API は `is_satisfied` を
            動かさないので、それを返すと作業直後は必ず全件になる。
          items:
            type: object
            required: [id, type, body]
            properties:
              id: { type: string }
              type: { type: string, example: manual }
              body: { type: string }

    SettingList:
      type: object
      required: [items, config_file_path, pending_confirmation]
      description: |
        ApiDesign.md 11.1。**PermissionList と同じくページネーション項目を持たない。**
        `config_file_path` は効いている設定ファイルの位置で、使っていなければ `null`。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Setting'
        config_file_path:
          type: [string, 'null']
          description: PB_CONFIG_FILE が指すファイルの位置。
          example: /etc/pb/pb.yaml
        pending_confirmation:
          oneOf:
            - $ref: '#/components/schemas/PendingConfirmation'
            - type: 'null'
          description: |
            確認を待っている設定変更（無ければ `null`）。

            **期限までに確認されないと元の値へ戻る**（ApiDesign.md 11.8、
            Design.md 10.3）。画面は残り時間をここから出す。

    PendingConfirmation:
      type: object
      required: [keys, expires_at, changed_by]
      description: |
        締め出されうる設定の未確認の変更（ApiDesign.md 11.8、DbDesign.md 6.17）。

        **1回の保存が1件である。** 確認すれば全部確定し、期限が切れれば全部戻る。
      properties:
        keys:
          type: array
          items:
            type: string
          description: 確認を待っているキー。
          example: ['tls_enabled']
        expires_at:
          type: integer
          format: int64
          description: これを過ぎると元の値へ戻る。
        changed_by:
          oneOf:
            - $ref: '#/components/schemas/ActorRef'
            - type: 'null'
          description: |
            変えた人（分からなければ `null`）。

            **画面が文言を分けるために要る**——「あなたが変えました」と
            「田中 が変えました」では、押す前に確かめることが違う。

    Setting:
      type: object
      required:
        [key, display_name, description, layer, value, value_type, allowed,
         default_value, source, editable, restart_required, secret, env_key,
         config_file_key, updated_at, updated_by]
      description: |
        設定1件（ApiDesign.md 11.1）。**`value` は型によらず常に文字列**で、
        `value_type` と対で読む——真偽値を JSON の `true` にすると `value` の型が
        設定ごとに変わり、生成した型が共用体になる。
      properties:
        key:
          type: string
          description: '**`PB_` の無い平らな名前。** `app_setting.key` と `pb.yaml` のキー。'
          example: log_level
        display_name:
          type: string
          example: ログレベル
        description:
          type: string
          description: そのまま画面に出せる日本語。
        layer:
          type: integer
          enum: [1, 2, 3]
          description: |
            1=起動前（ファイルと環境変数にしか置けない）／2=実行時の共有設定（DB）／
            3=共有される秘密。Design.md 10.3。**この一覧には現れない**——TLS 証明書と
            秘密鍵は専用の口（ApiDesign.md 11.4〜11.6）で扱う。
        value:
          type: [string, 'null']
          description: '**`secret` が真のものは常に `null`。**'
        value_type:
          type: string
          enum: [string, bool, enum]
        allowed:
          type: [array, 'null']
          items:
            type: string
          description: '`value_type` が `enum` のときの値域。それ以外は `null`。**キーは常に返す。**'
        default_value:
          type: [string, 'null']
          description: レジストリが持つ既定値。**必須の設定は `null`。**
        source:
          type: string
          enum: [secret_file, config_file, env, database, default]
          description: |
            実効値がどこから来たか。**並びは優先順と同じ**（Design.md 10.3）。
        editable:
          type: boolean
          description: |
            **`layer` が 2 で、かつ `source` が `database` か `default` のときだけ真。**
            ファイルや環境変数で与えられている項目は、書いても効かないので編集させない。
        restart_required:
          type: boolean
        secret:
          type: boolean
        env_key:
          type: string
          description: |
            環境変数の名前。**`source` が何であっても必ず返す**——いま与えられていない
            設定にも、上書きする道を画面が示せるようにする。K8s では ConfigMap /
            Secret に書くキーである。
          example: PB_LOG_LEVEL
        config_file_key:
          type: string
          description: '`pb.yaml` に書くときのキー。`key` と同じ値。'
        updated_at:
          type: [integer, 'null']
          format: int64
          description: '**`source` が `database` のときだけ埋まる。**'
        updated_by:
          oneOf:
            - $ref: '#/components/schemas/ActorRef'
            - type: 'null'
          description: '**`source` が `database` のときだけ埋まる。** 値の履歴は持たない（audit_log を見る）。'

    SettingUpdateRequest:
      type: object
      required: [items]
      description: |
        ApiDesign.md 11.2。**空配列は 422。** 本文に現れないキーは触らない
        ——全件を送らせると、画面が古い値を握ったまま保存したときに他人の変更を巻き戻す。
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
                example: log_level
              value:
                type: [string, 'null']
                description: '**`null` は行を消して既定値へ戻す。**'

    TLSCertificateList:
      type: object
      required:
        [items, tls_enabled, listen_url, listen_host, listen_host_match,
         secret_key_present, secret_key_origin]
      description: |
        ApiDesign.md 11.4。**ページネーションも ETag も持たない**——証明書は数枚である。
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TLSCertificate'
        tls_enabled:
          type: boolean
          description: |
            いま TLS で待ち受けているか。**設定 `tls_enabled` の実効値ではなく、
            実際の待受の状態である**——設定を変えても再起動までは待受が変わらない。
        listen_url:
          type: string
          description: |
            **いま待ち受けているスキームとアドレス。** 画面の先頭にそのまま出す。
            **画面が `bind` の設定値から組み立てない**——待受の変更には再起動が要るので、
            設定の値と実際の待受は再起動をまたぐとずれる。
          example: https://0.0.0.0:8443
        listen_host:
          type: [string, 'null']
          description: |
            **接続に使うホスト名**（`listen_url` のホスト部）。**`0.0.0.0` と `::` では
            `null` である**——あれらは待受の表記であって接続先のホスト名ではなく、
            **`0.0.0.0` を SAN に入れた証明書はどのクライアントからも一致しない**。
          example: 127.0.0.1
        listen_host_match:
          type: string
          enum: [covered, uncovered, unspecific, no_certificate]
          description: |
            いま出す証明書が `listen_host` を覆っているか（ApiDesign.md 11.4）。
            **判定はサーバが行う**——画面が `dns_names` と照合すると、
            **IP の SAN が抜け落ちる**。

            `unspecific` は `listen_host` が `null` のとき、`no_certificate` は
            いま出す1枚が無いときである。
        secret_key_present:
          type: boolean
          description: |
            鍵が使える状態か。**PB が無ければ作るので通常は真である**（Design.md 6.6.1）。
        secret_key_origin:
          type: string
          enum: [env, generated]
          description: |
            `env`（PB_SECRET_KEY で与えられた）／ `generated`（PB が作って DB に保存した）。
            **鍵そのものは返さない。** 画面が代償を出すために要る——**生成した鍵は DB に
            あるので、`pg_dump` に鍵と暗号文の両方が入る。**

    DatabaseStatus:
      type: object
      required:
        [fetched_at, connection, server, migration_version, sessions, pool, size_bytes, tables]
      description: |
        ApiDesign.md 11.10。**読み取り専用の状態であって、設定ではない。**
      properties:
        fetched_at:
          type: integer
          format: int64
          description: サーバが値を取得した時刻。**画面は定期的に引かないので、表示がいつの値かを示すために出す。**
        connection:
          type: object
          required: [host, port, database, user, tls]
          properties:
            host:
              type: string
              description: |
                **PB に与えられた接続先のホスト**（`PB_DATABASE_URL`）。Unix ソケットならディレクトリのパス。
            port:
              type: integer
            database:
              type: string
              description: 実際に繋いでいる DB（`current_database()`）。
            user:
              type: string
              description: 実際に繋いでいるロール（`current_user`）。
            tls:
              type: boolean
              description: |
                この要求が使った接続が TLS か。**`pg_stat_ssl` ではなく接続そのもの（ドライバが
                握っているソケット）を見て決める**——問い合わせが要らず、view の見え方にも依らない。
        server:
          type: object
          required: [version, started_at, max_connections]
          properties:
            version:
              type: string
              description: '`server_version` の値をそのまま返す。'
            started_at:
              type: integer
              format: int64
              description: '`pg_postmaster_start_time()`。'
            max_connections:
              type: integer
              description: '**サーバ全体の上限である**（DB ごとではない）。'
        migration_version:
          type: integer
          format: int64
          description: '`goose_db_version` で適用済みの最大の番号。'
        sessions:
          type: object
          required: [database, pb]
          properties:
            database:
              type: integer
              description: '`pg_stat_activity` のうち、この DB に繋いでいるものの数。'
            pb:
              type: integer
              description: |
                そのうち `application_name` が PB の値（既定 `pb`）のもの。**PB のプロセスが複数あれば全部を含む。**
        pool:
          type: object
          required: [total, acquired, idle, max]
          description: |
            **この要求を受けたプロセスの接続プール。** 問い合わせを始める前の値で、この要求自身の接続を含まない。
          properties:
            total:
              type: integer
            acquired:
              type: integer
            idle:
              type: integer
            max:
              type: integer
        size_bytes:
          type: integer
          format: int64
          description: '`pg_database_size(current_database())`。'
        tables:
          type: array
          description: '`public` スキーマの表。**大きさの降順、同じなら名前の昇順。**'
          items:
            $ref: '#/components/schemas/DatabaseTable'

    DatabaseTable:
      type: object
      required: [name, rows, size_bytes]
      properties:
        name:
          type: string
        rows:
          type: [integer, 'null']
          format: int64
          description: |
            `count(*)` の正確な数。**`pb_app` が `SELECT` できない表では `null`**——
            数えられない表で応答全体を 500 にせず、一覧から黙って落とすこともしない。
        size_bytes:
          type: integer
          format: int64
          description: 索引と TOAST を含む大きさ（`pg_total_relation_size`）。

    RestoreRequest:
      type: object
      required: [owner_user, owner_password, archive]
      description: |
        ApiDesign.md 11.12。**この順で送る**——`archive` が最後でないと、
        資格情報を読む前に書庫が流れ込む。
      properties:
        owner_user:
          type: string
          description: '`pb_owner` にあたるロール名（既定 `pb_owner`）。'
          example: pb_owner
        owner_password:
          type: string
          format: password
          description: |
            そのロールのパスワード。**PB は保存せず、取り込みのあいだだけ
            接続に使って捨てる。** 応答にも構造化ログにも監査ログにも残さない。
        archive:
          type: string
          format: binary
          description: '書き出した書庫（tar.gz。DbDesign.md 9.1.1）。'

    RestoreResult:
      type: object
      required:
        [restored_at, backup, migration_version, session_kept, tables, mismatched]
      description: |
        ApiDesign.md 11.12。**`expected` と `rows` を両方返す**——片方だけでは、
        戻せたのか戻したつもりなのかが分からない。
      properties:
        restored_at:
          type: integer
          format: int64
        backup:
          $ref: '#/components/schemas/BackupMeta'
        migration_version:
          type: integer
          description: |
            取り込みが終わったあとの版。**`backup.migration_version` より
            進んでいることがある**（古い書庫を取り込んでから最新まで進めるため）。
        session_kept:
          type: boolean
          description: |
            操作者のセッションを維持できたか。**復元後のデータに本人の `actor` 行が
            無ければ `false`** になり、画面はログイン画面へ送る。
        tables:
          type: array
          description: '全表。**一致した表も落とさない。**'
          items:
            $ref: '#/components/schemas/RestoreTable'
        mismatched:
          type: array
          description: |
            `expected` と `rows` が食い違った表の名前。**空なら全表が一致した。**
            **`access_token` の +1 はここに入れない**（下記）。
          items:
            type: string

    BackupMeta:
      type: object
      required: [format_version, migration_version, created_at, pb_version]
      description: '書庫の `meta.json`（DbDesign.md 9.1.1）をそのまま返す。'
      properties:
        format_version:
          type: integer
          description: |
            書庫の形式の版。**後から形式を変えると、既に取ったバックアップを
            戻せなくなる**ので、読めない版を黙って読もうとしない。
        migration_version:
          type: integer
          description: '書き出した時点で適用済みだった最大のマイグレーション番号。'
        created_at:
          type: integer
          format: int64
        pb_version:
          type: string
          example: 2.43.140

    RestoreTable:
      type: object
      required: [name, expected, rows]
      properties:
        name:
          type: string
        expected:
          type: integer
          format: int64
          description: '書庫の `meta.json` が持つ件数。'
        rows:
          type: integer
          format: int64
          description: |
            **行を入れた直後に数えた `count(*)`**（DbDesign.md 9.1.1 の⑦）。
            **最新の版へ進める前に数える**——あとから走るマイグレーションが行を
            足す表は、遅らせると `meta.json` より多くなり、正しく入ったものまで
            食い違いとして出る。**操作者のセッション1行も、数えたあとに足す。**

    TLSCertificate:
      type: object
      required:
        [id, common_name, dns_names, ip_addresses, not_before, not_after,
         serial_number, fingerprint, is_self_signed, status, decryptable,
         uploaded_at, uploaded_by]
      description: |
        証明書1件（ApiDesign.md 11.4）。**`private_key` は含まれない。**
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        common_name:
          type: string
          example: pb.example.com
        dns_names:
          type: array
          items:
            type: string
          description: SAN の DNS 名。**キーは常に返す**（無ければ空配列）。
        ip_addresses:
          type: array
          items:
            type: string
          description: |
            SAN の IP アドレス。**キーは常に返す**（無ければ空配列）。

            **列には無く、`cert_pem` を解析して返す**。`dns_names` は
            `DNS:` の SAN しか持たないので、**画面がこちらを並べて出さないと
            「SAN: localhost」と「127.0.0.1 を覆っています」が並んで見える。**
          example: ['127.0.0.1']
        decryptable:
          type: boolean
          description: |
            **いまの鍵で秘密鍵を復号できるか**。偽なら**その証明書は出せない**
            ——暗号鍵の出どころが登録時から変わっている。

            **`key_id` の突き合わせでは検出できない**（行の `key_id` は常に `v1` で、
            鍵の出どころを記録していない）ので、**行ごとに復号を試して決める。**

            **`status` とは別の軸である。** `status` は日付で決まり、こちらは鍵で決まる。
            **`active` なのに復号できない**という状態がありうる。
        not_before:
          type: integer
          format: int64
        not_after:
          type: integer
          format: int64
        serial_number:
          type: string
          description: 16進。
        fingerprint:
          type: string
          description: SHA-256 を `ab:cd:…` の形で。openssl の出力に揃えてある。
        is_self_signed:
          type: boolean
          description: |
            **表示のためだけに持つ。** PB は検証の連鎖を辿らないので、
            フォーマル証明書と自己署名証明書の扱いは同じである。
        status:
          type: string
          enum: [active, pending, expired, superseded]
          description: |
            `active`（**いま出している1枚。必ず1枚以下**）／ `pending`（`not_before` が未来）／
            `expired`（`not_after` を過ぎた）／ `superseded`（有効だが、より新しい有効なものがある）。
        uploaded_at:
          type: integer
          format: int64
        uploaded_by:
          oneOf:
            - $ref: '#/components/schemas/ActorRef'
            - type: 'null'

    TLSCertificateUploadRequest:
      type: object
      required: [cert_pem, key_pem]
      description: |
        ApiDesign.md 11.5。**秘密鍵は暗号化して保存され、以後どの応答にも現れない。**
      properties:
        cert_pem:
          type: string
          description: 証明書の PEM。中間証明書を続けて貼ってもよい。
          example: "-----BEGIN CERTIFICATE-----\n…\n-----END CERTIFICATE-----\n"
        key_pem:
          type: string
          description: |
            秘密鍵の PEM。PKCS#8 / PKCS#1 / SEC1 を受ける。
            **パスフレーズ付きは受けない**（422）。
          example: "-----BEGIN PRIVATE KEY-----\n…\n-----END PRIVATE KEY-----\n"

    ActorRef:
      description: |
        アクターの参照（担当者・報告者。ApiDesign.md 9.2.2）。**`kind` を必ず返す**
        ——画面はこれを見てエージェントに 🤖 バッジを付ける（GuiDesign.md 5.4、設計原則5）。
      type: object
      required: [id, kind, display_name]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        kind:
          type: string
          enum: [user, agent, system]
        display_name:
          type: string
          example: 田中

    TicketStatus:
      description: |
        チケットのステータス（ApiDesign.md 9.2.2）。`name` は画面に出す日本語、
        `category` はバッジの見た目を決める4値（GuiDesign.md 8.7）。
      type: object
      required: [key, name, category]
      properties:
        key:
          type: string
          example: in_progress
        name:
          type: string
          example: 進行中
        category:
          type: string
          enum: [todo, in_progress, review, done]

    TicketTagRef:
      description: チケットに付いているタグ（ApiDesign.md 9.2.2）。**色を持たない**（GuiDesign.md 8.6）。
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          example: 設計

    TicketSprintRef:
      description: チケットが属するスプリント（ApiDesign.md 9.2.2）。
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        name:
          type: string
          example: Sprint 3

    Ticket:
      description: |
        チケット1件（ApiDesign.md 9.2.2 の `items[]`）。

        **`body_md` を持たない。** 一覧は本文を表示せず、200件分の Markdown は応答を
        数十倍にする。本文が要るのは詳細（9.5）だけである。
        **`execution_mode` / `readiness` / `readiness_note` / `scope` / `custom_fields` も
        持たない**——列は DbDesign.md 6.6 に先行定義されているが、GuiDesign.md 5.5 が
        非表示と決めている。画面が使わない項目を応答に載せない
        （載せると、使われないまま形が固まる）。

        **完全形 `my-app-31` はサーバが組み立てない**（9.1）。プロジェクトキーは URL に
        含まれており、フロントが `${key}-${seq}` を組める。
      type: object
      required:
        [id, seq, type, title, status, priority, assignee, reporter, working_agent,
         parent_seq, has_children, sort_key, staged_at, tags, sprint, estimate_point,
         estimate_hours, actual_hours, actual_point, actual_point_version, start_at, due_at, all_day, closed_at, version,
         created_at, updated_at]
      properties:
        id:
          type: string
          description: |
            ULID。**リクエストでチケットを指定する箇所はすべて `seq`** であり、この項目は
            `activity.entity_id` との突き合わせとエージェント連携が使う（9.1）。
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        seq:
          type: integer
          format: int32
          example: 31
        type:
          type: string
          enum: [epic, story, task]
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: 認証APIの実装
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
          nullable: true
        assignee:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
          description: 担当者不在のとき null。
        reporter:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        working_agent:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
          description: |
            **誰が実際に処理しているか**（実行者。9.2.2、`DbDesign.md` 6.6。手順26b）。
            `assignee` が「誰の仕事か」を表すのに対し、こちらは実行者を表す。

            **エージェントが遷移したときに自分で立てる**（9.6）ので、人が手で埋める
            必要はない。**チケットを消化しても消えない**——「誰が処理したか」は完了後に
            こそ読みたい情報である。人が `PATCH`（9.5.2）で消すか差し替える。
            `kind` は常に `agent`。
        parent_seq:
          type: integer
          format: int32
          nullable: true
          description: |
            親チケットの `seq`。**フィルタで親が結果から落ちても保たれる**（9.2.4）。
            画面は「親が結果に含まれていない子」をトップレベルに並べる。
        has_children:
          type: boolean
          description: |
            **プロジェクト内に子がいるか**であって「結果の中に子がいるか」ではない。
        sort_key:
          type: string
          nullable: true
          description: |
            LexoRank 方式の並び順（9.4）。**クライアントはこの値を作らない。**
            並べ替えは `POST /tickets/:seq/move` で行う。
          example: '0|hzzzzz:'
        staged_at:
          type: integer
          format: int64
          nullable: true
          description: |
            「オンステージ」（9.2.2、DbDesign.md 6.6）。`null` がバックログ、
            値が入っているものがオンステージで、値は**いつ上げたか**である。
            バックログ画面はこの1項目で上下二段に振り分ける（GuiDesign.md 5.4）。
            **進捗（`status`）とは独立した軸**で、「未着手だがオンステージ」を表せる。
            **段の出し入れは `POST /tickets/:seq/move`** で行う（9.4.1）。
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TicketTagRef'
        sprint:
          allOf: [$ref: '#/components/schemas/TicketSprintRef']
          nullable: true
        estimate_point:
          type: number
          format: double
          nullable: true
        estimate_hours:
          type: number
          format: double
          nullable: true
        actual_hours:
          type: number
          format: double
          nullable: true
        actual_point:
          type: number
          format: double
          nullable: true
          description: 実績ポイント。時間とは別の相対尺度。
        actual_point_version:
          type: string
          nullable: true
          description: 算出式の版。例：actual-v0。
        start_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の開始（エポックミリ秒。ApiDesign.md 9.3.1）。
          example: 1786201200000
        due_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の終わり（**含まない**。終日なら締切日の翌日の0時）。
          example: 1786719600000
        all_day:
          type: boolean
        closed_at:
          type: integer
          format: int64
          nullable: true
          description: |
            **ステータス遷移の副作用としてのみ動く**（DbDesign.md 6.6）。直接は更新できない。
        version:
          type: integer
          format: int32
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
          description: |
            **`ticket_tag` の付け外しでも動く**（9.2.5）。動かさないと、タグだけを
            変えた場合に一覧の `ETag` が変わらない。

    TicketList:
      description: |
        チケットの一覧（ApiDesign.md 9.2.2）。**`page` / `per_page` / `total` /
        `total_pages` は規約どおり返す**（2.6）。画面がページャを出さないだけである
        （9.2.3）。`total > per_page` になったとき、画面は件数とともに
        「フィルタで絞り込んでください」を表示する。**サーバは 200 件で打ち切るだけで、
        エラーにはしない。**
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    TicketBrief:
      description: チケットの要約（ApiDesign.md 9.5.1 の `parent` と `epic`）。
      type: object
      required: [seq, title, type, status]
      properties:
        seq:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          enum: [epic, story, task]
        status:
          $ref: '#/components/schemas/TicketStatus'

    TicketChild:
      description: 直下の子の要約（ApiDesign.md 9.5.1 の `children`）。**孫は含めない。**
      type: object
      required: [seq, title, type, status, assignee]
      properties:
        seq:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          enum: [epic, story, task]
        status:
          $ref: '#/components/schemas/TicketStatus'
        assignee:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true

    TicketDetail:
      description: |
        チケット1件の詳細（ApiDesign.md 9.5.1）。**9.2 の `items[]` に項目を加えたもの。**
        `POST /tickets` の応答もこの形である（9.3 が「応答は 9.5 の `GET` と
        同形式」と定めるため）。

        **`execution_mode` / `readiness` / `readiness_note` / `scope` は一覧には含めない**
        （`pb_get_task` と `pb_get_context` はどちらもチケット1件を指して呼ぶ）。
      allOf:
        - $ref: '#/components/schemas/Ticket'
        - type: object
          required: [body_md, parent, epic, children, dod, links, references, comment_count,
                     execution_mode, readiness, readiness_note, scope]
          properties:
            body_md:
              type: string
              nullable: true
              description: 本文（Markdown ソース）。
            parent:
              allOf: [$ref: '#/components/schemas/TicketBrief']
              nullable: true
            epic:
              allOf: [$ref: '#/components/schemas/TicketBrief']
              nullable: true
              description: |
                祖先をたどって最初に見つかるエピック（ApiDesign.md 9.5.1）。
                親がエピックなら親そのもの。**自分自身は数えない。** 無ければ `null`。
            children:
              type: array
              items:
                $ref: '#/components/schemas/TicketChild'
            dod:
              type: array
              items:
                $ref: '#/components/schemas/TicketDoDItem'
              description: |
                完了条件（ApiDesign.md 9.9）。
                `sort_order` → `created_at` の昇順。
            links:
              type: array
              items:
                $ref: '#/components/schemas/TicketLink'
              description: |
                関連チケット（ApiDesign.md 9.10.1）。
                **双方向**（`outgoing` → `incoming`）で、`ticket` に入るのは相手である。
            references:
              type: array
              items:
                $ref: '#/components/schemas/TicketReference'
              description: |
                外部参照（ApiDesign.md 9.10.2）。
                `kind` 昇順、同じ `kind` の中は `sort_order` → `created_at` の昇順。

                **別の `GET` に切らず詳細応答へ入れる**のは、画面を開いた時点で
                見えているものだからである（GuiDesign.md 5.5）。遷移先の一覧（9.7）の
                ように「開いたときだけ要るもの」ではない。
            comment_count:
              type: integer
              format: int64
              description: コメント件数（本文は含めない。ApiDesign.md 9.8）。
            execution_mode:
              type: string
              enum: [human_only, agent_only, agent_draft]
              description: |
                実行主体属性（Requirements.md 10.5.4、DbDesign.md 6.6）。
                `/pb-implement` は `human_only` のとき実装せず利用者へ返す
                （Requirements.md 10.8.6）。
            readiness:
              type: string
              enum: [red, yellow, green]
              nullable: true
              description: |
                実行可能性の信号（Requirements.md 10.5.1）。未判定は null。
            readiness_note:
              type: string
              nullable: true
              description: Readiness の理由。未設定は null。
            scope:
              type: object
              additionalProperties: true
              description: |
                スコープ境界（Requirements.md 10.5.3）。未設定は `{}`。
                既知の4キー（allow / deny / repositories / external_apis）は文字列の配列で、
                **未知のキーはそのまま保存する**（ApiDesign.md 9.5.2）。
                コンテキストパックの最優先項目として渡る（Design.md 8.5.5）。

    TicketComment:
      description: |
        チケットのコメント（ApiDesign.md 9.8、DbDesign.md 6.7）。**人とエージェントが
        読み書きする一次資料である**（Requirements.md 6.5 / 10章）。
      type: object
      required: [id, body_md, kind, in_reply_to, origin, author, created_at, updated_at, deleted_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        body_md:
          type: string
          nullable: true
          description: |
            本文（Markdown ソース）。**削除済みは `null`**——行は `items` に残り、
            画面は「削除されました」と表示する（GuiDesign.md 5.5）。
            **DB には本文が残っている**（列が NOT NULL のため）。
          example: レビューをお願いします
        kind:
          type: string
          enum: [discussion, decision, artifact, caveat, reference, progress]
          description: |
            情報の類型（Requirements.md 6.5）。LLM による分類・要約（構想）がこの列を
            土台にする。**`progress` は 9.6 の遷移コメントが使う。**
        in_reply_to:
          type: string
          nullable: true
          description: |
            返信先のコメントの ULID。**作成後は変えられない**（`PATCH` で送ると
            422 `immutable_field`）。
        origin:
          type: string
          enum: [human, agent]
          description: |
            **呼び出し元のアクター種別から決まる**（リクエストでは指定できない）。
            画面はエージェントのコメントをアバターの形（角丸四角）で人間と区別する
            （GuiDesign.md 5.5）。
        author:
          allOf: [$ref: '#/components/schemas/ActorRef']
          description: |
            投稿者。**`null` にならない**——`comment.author_id` は NOT NULL かつ
            `ON DELETE RESTRICT` で、投稿者不在のコメントを DB が許さない
            （DbDesign.md 6.7）。
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: 論理削除の時刻（DbDesign.md 4.6 / 6.7）。未削除なら `null`。

    ProjectStats:
      description: |
        プロジェクトの集計（ApiDesign.md 9.13.1）。ダッシュボード（GuiDesign.md 5.3）の
        4枚のカードと「要対応」ブロックが読む。

        **エピック（`type='epic'`）はどの項目にも数えない。**
        エピックはグルーピング専用であり（DbDesign.md 6.10）、バックログも行として
        出さない。**4枚のカードは押すとバックログをそのカテゴリで絞って開く**ので、
        除かないとカードの数と押した先の件数が一致しない。
      type: object
      required: [by_category, total, open, overdue, stale, unassigned]
      properties:
        by_category:
          description: |
            `status_category` ごとの件数。**常に4つのキーを持つ**——そのカテゴリの
            ステータスがワークフローに無くても `0` を返す。
          type: object
          required: [todo, in_progress, review, done]
          properties:
            todo: { type: integer, example: 18 }
            in_progress: { type: integer, example: 8 }
            review: { type: integer, example: 4 }
            done: { type: integer, example: 36 }
        total:
          type: integer
          description: |
            全件。**`by_category` の合計と一致しないことがある**（`status_key` が
            ワークフローに解決できないチケットはどのカテゴリにも入らない）。
          example: 66
        open:
          type: integer
          description: '`closed_at IS NULL` の件数。'
          example: 30
        overdue:
          type: integer
          description: '`due_at <= now()` かつ `closed_at IS NULL`。'
          example: 2
        stale:
          type: object
          description: |
            放置されているチケット。**閾値はサーバが持ち、応答に含めて返す**
            ——画面に「14日以上」と出すためで、文言をフロントで組み立てない。
          required: [count, threshold_days]
          properties:
            count:
              type: integer
              example: 3
            threshold_days:
              type: integer
              description: '**14 で固定**（プロジェクトごとの設定にしない）。'
              example: 14
        unassigned:
          type: integer
          description: '`assignee_id IS NULL` かつ `closed_at IS NULL` の件数。'
          example: 5

    Activity:
      description: |
        業務履歴の1件（ApiDesign.md 9.13.2、DbDesign.md 6.8 の `activity`）。
      type: object
      required:
        [id, entity_type, entity_id, entity_seq, entity_title, actor,
         action, field, old_value, new_value, occurred_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        entity_type:
          type: string
          description: '**`ticket` だけ**（9.1.1）。'
          enum: [ticket]
        entity_id:
          type: string
          description: |
            チケットの ULID。**削除されても行に残る**ので、`entity_seq` /
            `entity_title` が `null` でもここは値を持つ。
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        entity_seq:
          type: integer
          nullable: true
          description: |
            **非正規化して返す**（9.13.2）。画面は「`my-app-31` を『進行中』に変更」と
            表示するため、行ごとにチケットを引くと N+1 になる。**削除されたチケットを
            指す行では `null`**（9.5.3 が物理削除であるため）。
          example: 31
        entity_title:
          type: string
          nullable: true
          description: '同上。削除されたチケットを指す行では `null`。'
          example: 認証APIの実装
        actor:
          allOf:
            - $ref: '#/components/schemas/ActorRef'
          nullable: true
          description: |
            **`null` になりうる**——`activity.actor_id` は `ON DELETE SET NULL` で
            あり（DbDesign.md 6.8）、ユーザーを消した後も履歴の行は残る。
        action:
          type: string
          enum: [create, update, delete, transition]
        field:
          type: string
          nullable: true
          description: |
            変更した項目。**`create` / `delete` では `null`。** 値域は
            `status_key`（遷移）／`type` `title` `body_md` `priority` `assignee_id`
            `parent_id` `estimate_point` `estimate_hours` `actual_hours`
            `start_at` `due_at` `all_day`（本体の更新。pb-217 より前は `start_date` `due_date`）／`comment` `dod` `link`
            `reference.code` `reference.doc`（子資源の更新）の17種類である。
            **`sprint_id` は含まない**——9.5.2 で書けず、動くのは
            スプリントの開始・終了のときだけである（あの2つは記録しない）。
          example: status_key
        old_value:
          type: string
          nullable: true
          description: |
            **`text` のまま返す**（9.13.2）。ステータスの表示名への変換は画面が行う
            ——ワークフローの定義は `GET /projects/:key`（5.4）で手元にある。
            **`assignee_id` の値は ULID がそのまま入る。**
            **`body_md` の行は値を載せない**（両方 `null`）。
          example: todo
        new_value:
          type: string
          nullable: true
          example: in_progress
        occurred_at:
          type: integer
          format: int64
          example: 1786407164000

    ActivityList:
      description: |
        業務履歴の一覧（ApiDesign.md 9.13.2）。並びは `occurred_at DESC, id DESC` で
        固定される。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    TicketCommentList:
      description: |
        コメントの一覧（ApiDesign.md 9.8）。**チケットの子資源で唯一 2.6 の
        ページネーションを持つ**——コメントは議論の量だけ増えるためである。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketComment'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
          description: |
            **削除済みも数える**（`items` に残す以上、外すとページの件数と合わない）。
            **9.5.1 の `comment_count` とは答えが違う**——あちらは
            `deleted_at IS NULL` で数え、「読めるコメントが何件あるか」を答える。
        total_pages:
          type: integer

    CreateTicketCommentRequest:
      description: コメントの投稿（ApiDesign.md 9.8）。
      type: object
      required: [body_md]
      properties:
        body_md:
          type: string
          minLength: 1
          maxLength: 20000
          description: 本文（Markdown ソース）。空白だけは 422 `required`。
        kind:
          type: string
          enum: [discussion, decision, artifact, caveat, reference, progress]
          default: discussion
        in_reply_to:
          type: string
          nullable: true
          description: |
            **同じチケットの、削除されていないコメントの ULID であること。**
            満たさない場合は 422 `validation_failed`、`details[].code` は `not_found`。

    PatchTicketCommentRequest:
      description: |
        コメントの部分更新（ApiDesign.md 9.8）。**送られたフィールドだけを更新する。**
        **`in_reply_to` を含めると 422 `immutable_field`。**
      type: object
      properties:
        body_md:
          type: string
          minLength: 1
          maxLength: 20000
        kind:
          type: string
          enum: [discussion, decision, artifact, caveat, reference, progress]

    TicketDoDItem:
      description: |
        チケットの完了条件（ApiDesign.md 9.9、DbDesign.md 6.11）。

        **`config` / `evidence` / `origin` は返さない**（列としては残る）。いずれも
        `manual` 以外の型と AI提案のためのもので、**API が受け付けない値を
        応答に並べると「使える」ように見える。**
      type: object
      required: [id, type, body, is_satisfied, satisfied_at, satisfied_by, sort_order, created_at, updated_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        type:
          type: string
          enum: [manual]
          description: |
            **`manual` のみ。** `task_ref` / `assertion` / `artifact` /
            `review` は未実装（Requirements.md 10.5.2）で、`DbDesign.md` 6.11 の
            `CHECK` には既に含まれている。
        body:
          type: string
          maxLength: 500
          example: ユニットテストが通ること
        is_satisfied:
          type: boolean
        satisfied_at:
          type: integer
          format: int64
          nullable: true
          description: '`is_satisfied` を `true` にした時刻。`false` に戻すと `null`。'
        satisfied_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
          description: |
            チェックした人。**`ON DELETE SET NULL`** なので、その人を消した後は
            `null` になる——**条件を満たした事実は消えず、誰が満たしたかだけが
            分からなくなる。**
        sort_order:
          type: integer
          format: int32
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    TicketDoDList:
      description: |
        完了条件の一覧（ApiDesign.md 9.9）。**ページネーションも `ETag` も持たない**
        ——1チケットあたり数件に収まり、詳細応答（9.5.1）にも同じ一覧が入る。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketDoDItem'

    CreateTicketDoDRequest:
      description: 完了条件の追加（ApiDesign.md 9.9）。
      type: object
      required: [body]
      properties:
        type:
          type: string
          enum: [manual]
          default: manual
          description: |
            **`manual` 以外の型を送ると 422 `unsupported_type`**、綴り違いは `invalid`。
        body:
          type: string
          minLength: 1
          maxLength: 500
        is_satisfied:
          type: boolean
          default: false
          description: |
            **`true` で作ると、満たした人（呼び出し元）も同時に記録する**
            ——「満たしたのに満たした人がいない」行を作らない。
        sort_order:
          type: integer
          format: int32
          description: 省略時は末尾（現在の最大値 + 10）。

    PatchTicketDoDRequest:
      description: |
        完了条件の部分更新（ApiDesign.md 9.9）。**`type` を含めると 422
        `immutable_field`。**
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 500
        is_satisfied:
          type: boolean
          description: |
            **`satisfied_at` と `satisfied_by` が同時に動く。** `true` でサーバが
            両方を設定し、`false` で両方 `null` へ戻す。
        sort_order:
          type: integer
          format: int32
          description: |
            **これだけを変えた場合、`activity` に記録しない**（`move`（9.4）を
            記録しないのと同じ理由）。

    TicketLinkTicketRef:
      description: |
        リンクの相手のチケット（ApiDesign.md 9.10.1）。**9.5.1 の `parent` と同じ形**
        で、`type` を持つのは画面が行の先頭に種別アイコンを出すためである
        （GuiDesign.md 5.4 / 5.5）。
      type: object
      required: [seq, title, type, status]
      properties:
        seq:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          enum: [epic, story, task]
        status:
          $ref: '#/components/schemas/TicketStatus'

    TicketLink:
      description: |
        チケット間リンク（ApiDesign.md 9.10.1、DbDesign.md 6.6）。
      type: object
      required: [id, direction, link_type, ticket, lag_days, origin, created_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        direction:
          type: string
          enum: [outgoing, incoming]
          description: |
            **「相手がどちら側か」を表す**——`outgoing` なら `ticket` が `target`、
            `incoming` なら `ticket` が `source`。どちらの場合も `ticket` に入るのは
            **相手**であり、自分は入らない。
        link_type:
          type: string
          enum: [FS, SS, FF, SF, relates, duplicates, blocks]
          description: |
            **`FS` / `SS` / `FF` / `SF` はガント用の依存**（ガントは未実装）。
            **画面が出すのは `relates` / `duplicates` / `blocks` の3つだけ**
            である（GuiDesign.md 5.5）が、**API は7種すべて受ける**。
        ticket:
          $ref: '#/components/schemas/TicketLinkTicketRef'
        lag_days:
          type: integer
          format: int32
          description: '`FS`〜`SF` のときのみ意味を持つ。読む画面は無い。'
        origin:
          type: string
          enum: [human, ai_suggested]
          description: |
            **`human` のみ作られる**（AI提案の採用・却下は未実装）。
            **`comment.origin` とは値域が違う**——あちらは書き手の種別
            （`human` / `agent`）で、こちらは「AIが提案し人がまだ採用していない」
            という状態である。
        created_at:
          type: integer
          format: int64

    TicketLinkList:
      description: |
        関連チケットの一覧（ApiDesign.md 9.10.1）。**双方向を1本で返す。**
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketLink'

    CreateTicketLinkRequest:
      description: |
        関連チケットの追加（ApiDesign.md 9.10.1）。**当該チケットが常に `source`
        になる。**
      type: object
      required: [target_seq, link_type]
      properties:
        target_seq:
          type: integer
          format: int32
          minimum: 1
          description: |
            相手のチケットの `seq`。**同一プロジェクト内に存在すること**（無ければ
            422 `not_found`）。**自分自身は 422 `self_link`。**
        link_type:
          type: string
          enum: [FS, SS, FF, SF, relates, duplicates, blocks]
        lag_days:
          type: integer
          format: int32
          default: 0

    TicketReference:
      description: |
        チケットから PB の外を指す参照（ApiDesign.md 9.10.2、DbDesign.md 6.12）。

        **`kind` ごとに埋まる項目が違う。** `code` は `repository` が必須で `branch` /
        `commit_sha` を伴い、`doc` は `url` が必須である。1つの表にまとめてあるので、
        使わない項目は `null` になる。

        **`created_by` は返すが画面は使わない**（GuiDesign.md 5.5）。この
        セクションが表すのは「チケットの成果物としてリポジトリ・ブランチ・コミットが
        紐づいている」という関係であって、行を登録したのが誰かではない。**コミットの
        committer でもない**——PB はリポジトリへ問い合わせない。それでも返して DB にも
        残すのは、将来エージェントの書いた行を区別したくなったときに遡れるようにするため。
      type: object
      required:
        [id, kind, repository, branch, commit_sha, url, label, note, sort_order,
         created_by, created_at, updated_at]
      properties:
        id:
          type: string
          description: ULID。
        kind:
          type: string
          enum: [code, doc]
          description: '`code` はリポジトリ・コミット、`doc` は仕様書などのURL。'
        repository:
          type: string
          nullable: true
          description: |
            リポジトリを識別する文字列（`kind='code'` では必須）。**FK ではない**
            ——リポジトリの定義は `project.settings` の `repositories` に jsonb で
            置かれており、参照できる主キーが無い。**プロジェクト設定に無い名前を
            書いても受け付ける**（DbDesign.md 6.12）。
        branch:
          type: string
          nullable: true
        commit_sha:
          type: string
          nullable: true
          description: '**短縮形を許す**——`git rev-parse --short` の出力をそのまま入れられる。'
        url:
          type: string
          nullable: true
          description: |
            `kind='doc'` では必須。**形式は検証しない**（空でないことのみ）。
            画面は `https://` または `http://` で始まるものだけをリンクにする
            （GuiDesign.md 5.5）。
        label:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        sort_order:
          type: integer
          format: int32
        created_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
          description: '書き手。`actor` の削除に `ON DELETE SET NULL` で追従するため `null` になりうる。'
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    TicketReferenceList:
      description: |
        外部参照の一覧（ApiDesign.md 9.10.2）。**ページネーションを持たない**
        ——1チケットあたり数件に収まる。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketReference'

    CreateTicketReferenceRequest:
      description: |
        外部参照の作成（ApiDesign.md 9.10.2）。**必須は `kind` と、`kind` に応じて
        `repository`（`code`）または `url`（`doc`）。**

        文字数の上限は `repository` 200 / `branch` 255 / `commit_sha` 64 /
        `url` 1000 / `label` 200 / `note` 500。**前後の空白は取り除いてから見る**。
        空文字は `null` と同じ「値なし」として扱う。
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [code, doc]
        repository:
          type: string
          nullable: true
          maxLength: 200
        branch:
          type: string
          nullable: true
          maxLength: 255
        commit_sha:
          type: string
          nullable: true
          maxLength: 64
        url:
          type: string
          nullable: true
          maxLength: 1000
        label:
          type: string
          nullable: true
          maxLength: 200
        note:
          type: string
          nullable: true
          maxLength: 500
        sort_order:
          type: integer
          format: int32
          description: 省略すると末尾（現在の最大値 + 10）。

    PatchTicketReferenceRequest:
      description: |
        外部参照の部分更新（ApiDesign.md 9.10.2）。**送られたフィールドだけを更新する。**

        **`null` は「その項目を空にする」を意味する**（キーごと送らないのとは区別する）。
        ただし**更新後の行が必須の条件を満たすこと**——`kind='doc'` の `url` や
        `kind='code'` の `repository` を空にする要求は 422 `required` になる。

        **`kind` は含められない**（送ると 422 `immutable_field`）。`additionalProperties`
        を `false` にしていないのは、`kind` を送ったときに 2.5 の形式で理由を返すためである
        （UpdateTicketRequest と同じ扱い）。
      type: object
      properties:
        repository:
          type: string
          nullable: true
          maxLength: 200
        branch:
          type: string
          nullable: true
          maxLength: 255
        commit_sha:
          type: string
          nullable: true
          maxLength: 64
        url:
          type: string
          nullable: true
          maxLength: 1000
        label:
          type: string
          nullable: true
          maxLength: 200
        note:
          type: string
          nullable: true
          maxLength: 500
        sort_order:
          type: integer
          format: int32

    UpdateTicketRequest:
      description: |
        チケットの部分更新（ApiDesign.md 9.5.2）。**送られたフィールドだけを更新する。**

        **`null` は「その項目を空にする」を意味する**（キーごと送らないのとは区別する）。
        `nullable: true` を付けてあるのはそのためで、担当を外す・親を外す・期限を消す
        といった操作はこの形でしか表せない。

        **`status_key` / `closed_at` / `sort_key` / `staged_at` / `id` / `seq` / `version` /
        `created_at` / `updated_at` / `reporter_id` は含められない。** 送ると 422 になる
        （`details[].code` はパスの説明にある3系統）。`additionalProperties: false` を
        付けていないのは、**サーバがそれらを「黙って無視」ではなく「明示的に弾く」ため**
        で、どの項目がなぜ書けないかを `details` で返す。
      type: object
      minProperties: 1
      properties:
        type:
          type: string
          enum: [epic, story, task]
          description: |
            **オンステージのチケットを `epic` にすると 422**（`not_stageable`）。
            エピックはどちらの段にも行として出ないため（9.4.1）。
        title:
          type: string
          minLength: 1
          maxLength: 200
        body_md:
          type: string
          nullable: true
          description: 本文（Markdown ソース）。`null` または空文字で消す。
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
          nullable: true
        assignee_id:
          type: string
          nullable: true
          description: |
            担当者の `actor.id`。**変更には `ticket.assign` 権限も要る**（9.5.2）。
            プロジェクトのメンバーでなければ 422（`not_a_member`）。`null` で担当を外す。
        working_agent_id:
          type: string
          nullable: true
          description: |
            実行者（エージェント）の `actor.id`。**変更には `ticket.assign` 権限も要る**
            （9.5.2。手順26b）。`null` で外す。

            **この経路は人が使う**——エージェント自身の宣言は 9.6 の遷移が副作用として
            立てる。**画面が出すのは「消す」だけである**（`GuiDesign.md` 5.5）。

            エージェントでなければ 422（`not_found`）。そのエージェントの**所有者**が
            プロジェクトのメンバーでなければ 422（`not_a_member`）——エージェントは
            `project_member` の行を持たないため、所有者で見る（`Design.md` 6.5）。
        parent_seq:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            親チケットの `seq`（同一プロジェクト内）。`null` で親を外す。
            **自分自身または自分の子孫を指定すると 422**（`parent_cycle`）。
            **オンステージのチケットをエピック以外の子にすると 422**（`not_stageable`）。
        tag_ids:
          type: array
          nullable: true
          items:
            type: string
          description: |
            **丸ごと置き換える**（部分更新ではない）。空配列または `null` で全て外す。
        estimate_point:
          type: number
          format: double
          minimum: 0
          nullable: true
        estimate_hours:
          type: number
          format: double
          minimum: 0
          nullable: true
        actual_hours:
          type: number
          format: double
          minimum: 0
          nullable: true
        actual_point:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: actual_point_version と同時に指定する。PM の追加権限が必要。
        actual_point_version:
          type: string
          pattern: '^actual-v[0-9]+$'
          nullable: true
          description: actual_point と同時に指定する。
        start_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の開始（エポックミリ秒。ApiDesign.md 9.3.1）。
        due_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の終わり（**含まない**。終日なら締切日の翌日の0時）。開始より前だと 422。終日なら両端は基準タイムゾーンの0時（違えば 422 `not_midnight`）。
        all_day:
          type: boolean
        execution_mode:
          type: string
          enum: [human_only, agent_only, agent_draft]
          description: |
            実行主体属性（Requirements.md 10.5.4）。
            **`null` は受け付けない**（列が NOT NULL。422 の `invalid`）。
            **`ticket.assign` は要らない**——追加の権限が要るのは「誰がやるか」を
            決める操作だけで、これは「何をしてよいか」である（9.5.2）。
        readiness:
          type: string
          enum: [red, yellow, green]
          nullable: true
          description: |
            実行可能性の信号（Requirements.md 10.5.1）。
            `null` で未判定へ戻す。
        readiness_note:
          type: string
          nullable: true
          description: |
            Readiness の理由。`null` で消す。
            **長さの上限を置かない**（`body_md` と同じ扱い）。
        scope:
          type: object
          additionalProperties: true
          description: |
            スコープ境界（Requirements.md 10.5.3）。
            **`null` は受け付けない**（列が NOT NULL DEFAULT `'{}'`）。`{}` で空に戻す。

            既知の4キー（`allow` / `deny` / `repositories` / `external_apis`）は
            **文字列の配列**であること。それ以外の型は 422（`invalid`）。
            **未知のキーは拒まずそのまま保存する**——境界の表し方はプロジェクトごとに
            育つため、形だけを見る（9.15 の完了レポートと同じ判断）。
      example:
        title: 認証APIの実装（改）
        priority: high
        assignee_id: null

    TransitionTicketRequest:
      description: |
        ステータスの遷移（ApiDesign.md 9.6）。
      type: object
      required: [to]
      properties:
        to:
          type: string
          description: |
            遷移先の `workflow_status.key`。プロジェクトのワークフローに無ければ 422
            （`unknown_status`）、定義が無い遷移なら 409（`invalid_transition`）。
          example: in_review
        comment:
          type: string
          maxLength: 20000
          description: |
            添えるコメント。**同じトランザクションで `kind='progress'` のコメントが作られる**
            （DbDesign.md 6.7）。**前後の空白を除いて20000字以内**（9.8 のコメントと同じ上限）。
            超えると 422（`details[].field = "comment"`、`code = "too_long"`）で、遷移は起きない。
          example: レビューをお願いします

    TicketTransitionOption:
      description: |
        遷移先の候補1件（ApiDesign.md 9.7）。
      type: object
      required: [key, name, category, allowed]
      properties:
        key:
          type: string
        name:
          type: string
          description: 画面に出す日本語（`workflow_status.name`）。
        category:
          type: string
          enum: [todo, in_progress, review, done]
        allowed:
          type: boolean
          description: |
            9.6 の検証2〜5 をすべて通るか。**`false` でも項目は返る**——ステータスを
            存在ごと隠すと「なぜ完了にできないのか」が分からなくなる。
        reason:
          type: string
          description: |
            `allowed` が `false` のときだけ在る。**そのまま画面に出せる日本語**（2.5）。

    TicketTransitionList:
      description: |
        遷移先の一覧（ApiDesign.md 9.7）。**ページングを持たない**——ワークフローの
        ステータスは高々数件で、2.6 の枠組みに載せる意味がない。
      type: object
      required: [current, items]
      properties:
        current:
          allOf: [$ref: '#/components/schemas/TicketStatus']
          nullable: true
          description: |
            現在のステータス。**ワークフローに無いキーでも返す**——ワークフローを
            差し替えた後の孤立した `status_key` がありうるため。
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketTransitionOption'
          description: ワークフローの全ステータスから現在のものを除いたもの。

    CreateTicketRequest:
      description: |
        チケットの作成（ApiDesign.md 9.3）。**`status_key` / `sort_key` / `seq` /
        `reporter_id` / `version` は含められない**——いずれもサーバが決める。
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [epic, story, task]
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 前後の空白は取り除かれる。
        body_md:
          type: string
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
        assignee_id:
          type: string
          description: |
            **当該プロジェクトの `project_member` であること。** 違えば 422
            （`details[].code = "not_a_member"`）。
        parent_seq:
          type: integer
          format: int32
          minimum: 1
          description: 同一プロジェクトに存在すること（9.1）。
        tag_ids:
          type: array
          items:
            type: string
          description: すべて当該プロジェクトのタグであること。重複は畳まれる。
        estimate_point:
          type: number
          format: double
          minimum: 0
        estimate_hours:
          type: number
          format: double
          minimum: 0
        start_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の開始（エポックミリ秒。ApiDesign.md 9.3.1）。
        due_at:
          type: integer
          format: int64
          nullable: true
          description: 予定の終わり（**含まない**。終日なら締切日の翌日の0時）。`start_at` 以上（DbDesign.md 6.6 の `ck_ticket_schedule`）。終日なら両端は基準タイムゾーンの0時（違えば 422 `not_midnight`）。
        all_day:
          type: boolean
          description: 省略時は true（終日）。

    MoveTicketRequest:
      description: |
        並べ替えの指定（ApiDesign.md 9.4）。

        | 指定 | 意味 |
        |---|---|
        | `{"after_seq": 44}` | 44 の直後へ |
        | `{"before_seq": 44}` | 44 の直前へ |
        | `{"after_seq": 44, "before_seq": 12}` | 44 と 12 の間へ |
        | `{"position": "first"}` | 段の先頭へ |
        | `{"position": "last"}` | 段の末尾へ |
        | `{"staged": true, "position": "first"}` | **オンステージ**へ上げ、その先頭に置く |
        | `{"staged": false, "after_seq": 44}` | **バックログ**へ戻し、44 の直後に置く |
        | `{"parent_seq": null, "after_seq": 44}` | **ルートにして**、44 の直後に置く（9.4.2） |

        `position` と `after_seq` / `before_seq` の同時指定は 422。いずれも無い場合も 422。
        **動かすチケット自身を基準にはできない**（422）。

        **`position` は段の中で解釈する**（9.4.1）。`"first"` は「オンステージの先頭」で
        あって「プロジェクト全体の先頭」ではない。**`after_seq` / `before_seq` は段を
        問わない**——`sort_key` はプロジェクト内で1本だからである。
      type: object
      properties:
        after_seq:
          type: integer
          format: int32
          minimum: 1
        before_seq:
          type: integer
          format: int32
          minimum: 1
        position:
          type: string
          enum: [first, last]
        staged:
          type: boolean
          description: |
            段を変える（9.4.1）。`true` でオンステージ、`false` でバックログへ戻す。
            **省略すると段は変わらない**（並べ替えだけを行う）。
            **段に置けるのは表示上のトップレベルだけ**——親を持たないもの、または
            親がエピックのもの。それ以外に `true` を送ると 422
            （`details[].code = "not_stageable"`）。**判定は `parent_seq` を
            適用した後の状態で行う**（9.4.2）。
        parent_seq:
          type: integer
          format: int32
          nullable: true
          description: |
            **ルートにする**（9.4.2）。**`null` だけを受け取る。** 省略すると親は
            変わらない。数値を送ると 422（`details[].code = "unsupported"`）
            ——「別の親の下の、この位置へ」を表すドロップが `GuiDesign.md` 5.4 に
            無いためで、その操作を作った日にここへ足す。

            **`move` が受け取るのは「位置と同時に決まるもの」だけである。**
            位置を伴わない親の変更（行の中央へ落として子にする）は `PATCH`
            （9.5.2）のままである。

    MoveTicketResult:
      description: 並べ替えの結果（ApiDesign.md 9.4）。
      type: object
      required: [seq, sort_key, staged_at, version, rebalanced]
      properties:
        seq:
          type: integer
          format: int32
        sort_key:
          type: string
          example: '0|hzzzr:'
        staged_at:
          type: integer
          format: int64
          nullable: true
          description: '移動後の段（9.4.1）。`null` がバックログ。'
        version:
          type: integer
          format: int32
          description: '**`If-Match` を要求しないが、`version` は +1 される**（9.4）。'
        rebalanced:
          type: boolean
          description: |
            隣接する2つのキーの間に新しいキーを作れず、プロジェクト全体の `sort_key` を
            振り直したことを示す。**`true` のとき、クライアントは一覧を取り直す**
            （手元の `sort_key` がすべて古くなっている）。
            **振り直しは他のチケットの `version` を上げない**——全行に触るので、
            上げると開いている詳細画面がすべて 409 になる。

    DocTreeList:
      description: |
        文書の目次（ApiDesign.md 10.2）。**ページャを持たない**——目次は木であり、
        途中で切ると子が親から外れる。
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocTreeItem'

    DocTreeItem:
      description: |
        目次の1件（ApiDesign.md 10.2）。**`body_md` を持たない。**
        `children` は各階層で `sort_order` 昇順、同値は `slug` 昇順。
      type: object
      required: [id, path, slug, title, sort_order, pack_mode, version, updated_at, children]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        path:
          description: '`slug` を根から連ねたもの（10.1）。'
          type: string
          example: rules/naming
        slug:
          type: string
          example: naming
        title:
          type: string
          example: 命名
        sort_order:
          type: integer
          example: 10
        pack_mode:
          type: string
          enum: [full, outline, none]
        version:
          description: |
            楽観ロックの現在値（2.8）。**木のドラッグ&ドロップが `If-Match` に使う**
            （GuiDesign.md 5.10）。
          type: integer
          example: 3
        updated_at:
          type: integer
          format: int64
        outline:
          description: '`?outline=1` を付けたときだけ現れる（10.2）。見出しが無くても `[]` を返す。'
          type: array
          items:
            $ref: '#/components/schemas/DocOutlineItem'
        children:
          type: array
          items:
            $ref: '#/components/schemas/DocTreeItem'

    DocOutlineItem:
      description: |
        見出し1件（ApiDesign.md 10.2）。**エージェントが「どの章を読むか」を決めるために使う。**

        `section` は見出しテキストそのもので、スラッグ化も番号付けもしない。同じ文書に
        同名の見出しが2つあるときだけ、2つ目以降に `#2` が付く。**この値はどこにも
        保存されず、常に現在の本文から作られる**ため、見出しを改名しても壊れる参照が
        生まれない（DbDesign.md 8.1.3）。
      type: object
      required: [section, level]
      properties:
        section:
          type: string
          example: 命名
        level:
          description: Markdown の見出しレベル（`##` が 2）。
          type: integer
          minimum: 1
          maximum: 6
          example: 2

    Doc:
      description: |
        文書の本文（ApiDesign.md 10.3）。

        **`created_by` / `updated_by` は `null` になりうる**（`ON DELETE SET NULL`。
        DbDesign.md 8.1.1）。コメントの `author` が `null` にならないのと異なり、
        **文書は書いた人が退職しても内容が生き続ける。**

        `kind` が `agent` のとき、画面はアバターを角丸四角にする（GuiDesign.md 8.4.2）。
        **憲章に「エージェントが最後に更新した」と出ることは正常である。**
      type: object
      required:
        [id, path, slug, parent_path, title, body_md, outline, sort_order, pack_mode, version,
         created_by, updated_by, created_at, updated_at]
      properties:
        id:
          type: string
          example: 01K2F8QW3H7YRJ4M5N6P7Q8R9S
        path:
          type: string
          example: rules
        slug:
          type: string
          example: rules
        parent_path:
          description: 親のパス。トップレベルなら `null`。
          type: string
          nullable: true
          example: null
        title:
          type: string
          example: 規約
        body_md:
          type: string
        outline:
          type: array
          items:
            $ref: '#/components/schemas/DocOutlineItem'
        sort_order:
          type: integer
          example: 20
        pack_mode:
          type: string
          enum: [full, outline, none]
        version:
          type: integer
          example: 3
        created_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        updated_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    DocSection:
      description: |
        `?section=` を付けたときの応答（ApiDesign.md 10.3）。**章1つを読みに来た相手に
        文書全体の情報は要らない**ので、`outline` も `created_by` も含まない。

        `body_md` は見出し行から、同じか上のレベルの次の見出しの直前までを含む。
      type: object
      required: [id, path, title, section, body_md, version, updated_at]
      properties:
        id:
          type: string
        path:
          type: string
          example: rules
        title:
          type: string
          example: 規約
        section:
          type: string
          example: 命名
        body_md:
          type: string
          example: "## 命名\n\n- テーブルは単数形…"
        version:
          type: integer
        updated_at:
          type: integer
          format: int64

    CreateDocRequest:
      description: 文書の作成（ApiDesign.md 10.4）。
      type: object
      required: [slug, title]
      properties:
        slug:
          description: |
            `^[a-z0-9][a-z0-9-]{0,63}$`（DbDesign.md 8.1.1 の CHECK と同じ式）。
            **`_` を含められない**ことが、`_revisions` を予約語にできる根拠である（10.1）。
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
          example: naming
        title:
          description: 1〜200文字。前後の空白を取り除いてから検証する。
          type: string
          minLength: 1
          maxLength: 200
          example: 命名
        parent_path:
          description: 省略・`null` でトップレベル。存在しないパスは 422（`details[].code = "not_found"`）。
          type: string
          nullable: true
          example: rules
        body_md:
          description: 既定は空文字。
          type: string
        sort_order:
          description: 省略時は同じ親の中の末尾（現在の最大値 + 10）。
          type: integer
        pack_mode:
          description: 省略時は outline（目次だけ）。
          type: string
          enum: [full, outline, none]

    PatchDocRequest:
      description: |
        文書の部分更新（ApiDesign.md 10.4）。**送られた項目だけを更新する。**

        **`parent_path` に `null` を送るとトップレベルへ移す。** 送らなければ親は変わらない
        ——「送られていない」と「`null` が送られた」を区別する。
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body_md:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        parent_path:
          type: string
          nullable: true
        sort_order:
          type: integer
        pack_mode:
          type: string
          enum: [full, outline, none]
        change_reason:
          description: |
            200文字以内。`document_revision.change_reason` に入る。**リビジョンを作らない
            更新で送っても捨てる**（422 にはしない）。
          type: string
          maxLength: 200
          example: ブランチ命名にチケット番号を入れる

    DocRevisionList:
      description: |
        リビジョンの一覧（ApiDesign.md 10.5）。2.6 のページネーションを持ち、
        **`revision_no` の降順に固定**。
      type: object
      required: [items, page, per_page, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocRevisionItem'
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    DocRevisionItem:
      description: '履歴の1件（ApiDesign.md 10.5）。**`body_md` を含めない。**'
      type: object
      required: [revision_no, title, changed_by, change_reason, created_at]
      properties:
        revision_no:
          type: integer
          example: 3
        title:
          type: string
          example: 規約
        changed_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        change_reason:
          type: string
          nullable: true
          example: ブランチ命名にチケット番号を入れる
        created_at:
          type: integer
          format: int64

    DocRevision:
      description: |
        履歴の1件（本文つき。ApiDesign.md 10.5）。**`version` も `outline` も持たない**
        ——`version` は現在の文書の楽観ロック値であって過去の版に属さず、`outline` は
        現在の本文から作るものである。
      type: object
      required: [revision_no, title, body_md, changed_by, change_reason, created_at]
      properties:
        revision_no:
          type: integer
        title:
          type: string
        body_md:
          type: string
        changed_by:
          allOf: [$ref: '#/components/schemas/ActorRef']
          nullable: true
        change_reason:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64

    ErrorCode:
      description: ApiDesign.md 2.5.1 の15コード。
      type: string
      enum:
        - bad_request
        - unauthenticated
        - invalid_credentials
        - forbidden
        - csrf_failed
        - not_found
        - method_not_allowed
        - conflict
        - already_exists
        - last_administrator
        - self_modification_forbidden
        - validation_failed
        - account_locked
        - rate_limited
        - internal_error

security:
  - cookieAuth: []
    csrfToken: []
  - bearerAuth: []
