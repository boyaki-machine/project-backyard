# Project Backyard — 実装済みAPIの現状
#
# 本ファイルは設計の写しではなく **実装されているAPIの記述** である（ApiDesign.md 1.3）。
# 設計の正本は ApiDesign.md にあり、まだ実装されていないエンドポイントはここに書かない。
#
# - 生成器を通さずに保守する（Design.md 3.3）。コード生成は client の TypeScript 型のみ
# - APIを追加・変更したステップの成果物に本ファイルの更新を含める
# - 実装との食い違いは server/internal/httpapi/openapi_drift_test.go が検出する
#   （chi.Walk のルート一覧と本ファイルの paths を突き合わせる）
#
# info.version は /api/v1 の契約バージョンであり、リポジトリの VERSION とは連動させない。

openapi: 3.1.0

info:
  title: Project Backyard API
  version: 1.0.0
  description: |
    人間とAIエージェントが共同で使うプロジェクト管理ツールの REST API。

    実装済みの範囲のみを記述する。設計の正本は `docs/design/ApiDesign.md`。

servers:
  # /healthcheck は唯一 /api/v1 の外にあるため（ApiDesign.md 2.11）、
  # ベースをルートに置き、paths 側に完全なパスを書く。
  - url: /
    description: 同一オリジン

tags:
  - name: auth
    description: 認証（ApiDesign.md 3章）
  - name: me
    description: |
      自分自身（ApiDesign.md 4章）。GET /me は Bearer でも使える。
      それ以外の /me の操作は人間のブラウザセッション（session Cookie）に限る。
  - name: projects
    description: プロジェクト（ApiDesign.md 5章）
  - name: admin
    description: ユーザー管理（ApiDesign.md 6章）。すべてアドミニストレータ専用
  - name: tickets
    description: チケットとその周辺（ApiDesign.md 9章）
  - name: docs
    description: プロジェクト文書（憲章。ApiDesign.md 10章）
  - name: settings
    description: アプリケーション設定（ApiDesign.md 11章）。必要権限は system.settings
  - name: ops
    description: 監視（ApiDesign.md 2.11）

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: ログイン
      operationId: login
      description: |
        メールアドレスとパスワードで認証し、セッションを発行する（ApiDesign.md 3.1）。

        応答本文は `GET /api/v1/me` と同じ内容を含む。ログイン直後に必ず権限が必要になるため、
        往復を1回減らしている。

        認証不要。IPあたり 10回/分のレート制限が掛かる（ApiDesign.md 2.9）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: |
            認証成功。`pb_session` と `pb_csrf` の2つの Cookie を発行する。
            **両者の Max-Age は揃える**（ApiDesign.md 3.1）。
          headers:
            Set-Cookie:
              description: |
                ```
                pb_session=pb_sess_...; HttpOnly; SameSite=Lax; Path=/; Max-Age=1209600
                pb_csrf=...; SameSite=Lax; Path=/; Max-Age=1209600
                ```
                `Secure` は設定 `PB_COOKIE_SECURE` が true のときに付く。
              schema:
                type: string
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
          content:
            application/json:
              schema:
                description: |
                  **第2要素が登録されていれば `MfaChallenge`、無ければ `Session`**
                  （ApiDesign.md 3.1）。`mfa_required` の有無で見分ける。
                  挑戦のときは Set-Cookie が付かない。
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - $ref: '#/components/schemas/MfaChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            認証失敗。**ユーザー不在・誤パスワード・アカウント無効を区別しない**
            （`invalid_credentials`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: |
            ログイン失敗が続いたことによるロック中（`account_locked`）。
            残り秒数を `error.retry_after_sec` と `Retry-After` ヘッダに入れる。
            **閾値に達した回から**この応答になる（ApiDesign.md 3.1）。
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: ログアウト
      operationId: logout
      description: |
        現在のセッショントークンを失効させ（`revoked_at` を設定）、Cookie を削除する
        （ApiDesign.md 3.2）。Cookie 認証のため `X-PB-CSRF` が必要（2.4）。
      responses:
        '204':
          description: |
            失効済み。`pb_session` と `pb_csrf` を削除する Set-Cookie を返す。
          headers:
            Set-Cookie:
              description: 2つの Cookie を `Max-Age=-1` で削除する。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me:
    get:
      tags: [me]
      summary: 自分自身と実効権限
      operationId: getMe
      description: |
        認証中のアクターと実効権限を返す（ApiDesign.md 4.1）。

        `permissions` はシステムロール由来の実効権限、`projects[].permissions` は
        当該プロジェクトでの実効権限（システムロール ∪ プロジェクトロール ∩ スコープ。
        Design.md 6.4.1）。`projects[]` にはアーカイブ済みのプロジェクトも含む。
        プロジェクト専用トークンでは、そのプロジェクトだけを返す。
      responses:
        '200':
          description: 認証中のアクター。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [me]
      summary: 自分のプロフィールを更新
      operationId: patchMe
      description: |
        認証中の本人のプロフィールと見た目の設定を更新する（ApiDesign.md 4.2）。
        必要権限は「本人」であり、権限キーを要求しない。

        **応答は `GET /me` と同一構造**（Session）。画面はこの応答で表示を
        差し替える（GuiDesign.md 6.4）。

        **`system_role` は変更できない。** 送られた場合は無視せず 422 で、
        `details[].code` が `not_allowed` になる。

        **`email` は変更できる。** この列はログインIDでもあるため、サーバは
        `user_identity.subject` を同じトランザクションで追随させる。他の
        ユーザーが使っているメールなら 409 `already_exists`。

        **`If-Match` は要求しない**（2.8）。自分の設定を同時に2箇所から編集する
        状況が実質無く、課すと `GET /me` に ETag が要る。`version` は加算され、
        管理者側（6.4）の楽観ロックは壊れない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 更新後の自分自身（4.1 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            メールアドレスが他のユーザーに使われている（`already_exists`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/avatar:
    put:
      tags: [me]
      summary: 自分のアイコンを登録または変更
      operationId: putMyAvatar
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 更新後のセッション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [me]
      summary: 自分のアイコンを削除
      operationId: deleteMyAvatar
      responses:
        '200':
          description: 更新後のセッション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/actors/{id}/avatar:
    get:
      tags: [me]
      summary: アクターのアイコン画像
      operationId: getActorAvatar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PNG画像
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: アイコンが登録されていない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/password:
    post:
      tags: [me]
      summary: 自分のパスワードを変更
      operationId: changeMyPassword
      description: |
        現在のパスワードを検証したうえで、新しいパスワードに差し替える
        （ApiDesign.md 4.3）。必要権限は「本人」。

        **成功すると、現在のセッションを除く全セッションが失効する**
        （Design.md 6.3）。API トークン（token_type='api'）も対象に含む。

        **`must_change` を false にする。** 要パスワード変更で入った利用者が
        変更しても誘導が消えない状態を避けるためである。

        **現在のパスワードの検証に失敗しても `failed_attempts` は増えない。**
        既にセッションを持つ本人の操作であり、ここで数えると自分で自分を
        締め出せる。連打はアクター単位のレート制限（2.9）が抑える。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 変更した。本文を持たない。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            未認証（`unauthenticated`）、または現在のパスワードが正しくない
            （`invalid_credentials`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            パスワード認証を使っていないアカウント（`conflict`）。
            IdP のみのユーザー（構想）が該当する。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/tokens:
    get:
      tags: [me]
      summary: 自分のアクセストークン一覧
      operationId: listMyTokens
      description: |
        CLI・スクリプト用の Bearer トークンを一覧する（ApiDesign.md 4.4.1）。
        必要権限は「本人」。

        **`token_type='api'` の行だけを返す。** ブラウザのセッションは現れない
        （本人が自分のセッションを見る画面を持たないため。GuiDesign.md 5.8）。

        **平文（`token`）は返さない。** 返すのは `token_prefix`（先頭8文字）だけで、
        再表示する経路は存在しない。

        **失効済みは返さない。期限切れは返す**（`status` が `expired`）——更新が要る
        ことに本人が気づく必要があり、上限5本を占めているためである。

        ページネーションも ETag も持たない（1人5本が上限）。
      responses:
        '200':
          description: 失効していないアクセストークン。`issued_at` の降順。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [me]
      summary: アクセストークンを発行
      operationId: createMyToken
      description: |
        自分のアクセストークンを発行する（ApiDesign.md 4.4.2）。必要権限は「本人」。

        **`token`（平文）はこの応答でのみ返る。** DB には SHA-256 のハッシュしか
        残らず、再表示する API は無い（DbDesign.md 6.2）。

        **`scopes` の語彙は権限カタログのキー**（`ticket.view` 等30件。Design.md
        6.4.2）。カタログに無い値は 422。空配列は「絞り込みなし」＝本人の実効権限
        そのままで、画面は常にこれで発行する。

        **失効していないトークンが既に5本あると 409。** 期限切れも数える
        （`GET /me/tokens` が返す行と一致させるため）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: 発行したトークン。**`token` を返す唯一の応答**。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAccessToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '409':
          description: |
            失効していないトークンが既に5本ある（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenID'
    delete:
      tags: [me]
      summary: アクセストークンを失効
      operationId: deleteMyToken
      description: |
        自分のアクセストークンを失効させる（ApiDesign.md 4.4.3）。必要権限は「本人」。

        **行は消さず `revoked_at` を立てる。** 監査ログの `token_id` から辿れる先を
        残すためである。

        **冪等。** 既に失効済みでも 204 を返し、`revoked_at` を上書きしない。

        **他人のトークン・存在しない `id`・`token_type` が `api` でないものは 404**
        （403 にしない。存在を漏らさないため。Design.md 6.4.5）。現在のセッションは
        `token_type='session'` なので、この経路では切れない。
      responses:
        '204':
          description: 失効させた（既に失効済みでも同じ）。本文を持たない。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分の `api` トークンとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login/mfa:
    post:
      tags: [auth]
      summary: ログインの第2要素を確認
      operationId: loginMfa
      description: |
        `POST /auth/login` が `mfa_required` を返したときの2段目（ApiDesign.md 3.4）。

        **`code`（TOTP の6桁）と `recovery_code` のどちらか一方**を、挑戦トークンと
        一緒に送る。成功すると 3.1 と同じ応答とセッション Cookie を返す。

        認証不要。**挑戦トークンが本人であることの証明を兼ねる**ので、Cookie にも
        Authorization ヘッダにも依存しない。IPあたり 10回/分のレート制限
        （ApiDesign.md 2.9）。

        **失敗は理由を分けず `invalid_credentials` に文言を被せる。** 期限切れ・
        コード違い・試行超過のいずれも、利用者が取る行動は「もう一度やる」で共通する。

        **第2要素の失敗でアカウントをロックしない**（Design.md 6.7.4）。抑止は
        挑戦ごとの5回とレート制限が担うため、`retry_after_sec` も返さない。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMfaRequest'
      responses:
        '200':
          description: |
            第2要素の確認に成功。`pb_session` と `pb_csrf` を発行する（3.1 と同じ）。
          headers:
            Set-Cookie:
              description: |
                ```
                pb_session=pb_sess_...; HttpOnly; SameSite=Lax; Path=/; Max-Age=1209600
                pb_csrf=...; SameSite=Lax; Path=/; Max-Age=1209600
                ```
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            挑戦が無い・期限切れ・消費済み・試行超過、またはコードが合わない
            （いずれも `invalid_credentials`。`message` で区別する）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/passkey/options:
    post:
      tags: [auth]
      summary: パスキーでのログインを始める
      operationId: startPasskeyLogin
      description: |
        挑戦を作り、`navigator.credentials.get()` に渡す options を返す（ApiDesign.md 3.5。
        Design.md 6.8.2）。本文を受けない。

        認証不要。IPあたり 10回/分のレート制限（ApiDesign.md 2.9）。

        **`options` は WebAuthn の JSON 表現そのままで、snake_case に変換しない。**
        **`allowCredentials` を持たない**——誰がログインしようとしているかを知らないまま
        挑戦を作るので、アカウントの有無が応答に現れない。
      security: []
      responses:
        '200':
          description: 挑戦を作った。`expires_at` は挑戦の期限（5分）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '409':
          description: |
            IP アドレスで開いている（`conflict`）。IP アドレスは RP ID になれない
            （Design.md 6.8.3）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/login/passkey:
    post:
      tags: [auth]
      summary: パスキーでログインする
      operationId: loginPasskey
      description: |
        `PublicKeyCredential.toJSON()` の結果を検証し、成功すれば 3.1 と同じ応答と
        セッション Cookie を返す（ApiDesign.md 3.6。Design.md 6.8.2）。

        認証不要。**パスキーの署名が本人であることの証明を兼ねる。** IPあたり 10回/分の
        レート制限（ApiDesign.md 2.9）。

        **失敗は理由を分けず、同じ `invalid_credentials` と同じ文言を返す**——誰でも叩ける
        口なので、「登録されていない」と「署名が合わない」を区別して見せない。

        **ロックと第2要素を通らない。** `failed_attempts` を増やさず、TOTP を登録していても
        `mfa_required` を返さない。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPasskeyRequest'
      responses:
        '200':
          description: |
            パスキーの確認に成功。`pb_session` と `pb_csrf` を発行する（3.1 と同じ）。
          headers:
            Set-Cookie:
              description: |
                ```
                pb_session=pb_sess_...; HttpOnly; SameSite=Lax; Path=/; Max-Age=1209600
                pb_csrf=...; SameSite=Lax; Path=/; Max-Age=1209600
                ```
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            挑戦が無い・期限切れ・消費済み、登録されていないパスキー、検証の失敗、
            無効化された利用者（いずれも `invalid_credentials`。区別しない）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/mfa:
    get:
      tags: [me]
      summary: 自分の第2要素
      operationId: getMyMfa
      description: |
        登録済みの認証器とリカバリコードの残数（ApiDesign.md 4.6.1）。
        必要権限は「本人」。

        **確定していない登録は返さない。** `confirmed_at` が NULL の行は認証の要素
        として数えないため（DbDesign.md 6.18）、一覧に出すと「登録できている」と読める。

        **リカバリコードを1本も持たないときは `recovery_codes` が null。**
        `remaining: 0` は「作って全部使った」であり、別の状態である。

        ページネーションも ETag も持たない（上限5件）。
      responses:
        '200':
          description: 登録済みの第2要素。`created_at` の昇順。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaOverview'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/mfa/totp:
    post:
      tags: [me]
      summary: 認証アプリの登録を始める
      operationId: startMyTotp
      description: |
        共有秘密を作り、QR の材料を返す（ApiDesign.md 4.6.2）。必要権限は「本人」。

        **この時点では登録されていない。** `confirmed_at` は NULL で、
        `POST /me/mfa/totp/{id}/confirm` が通るまで認証には一切影響しない。

        **`secret` と `otpauth_uri` は同じ値の2つの表現である。** QR を読めない環境で
        手入力に落とせるようにするため両方返す。**QR 画像は返さない**——描くのは
        クライアントである（GuiDesign.md 5.8）。

        **途中の行は1人1件まで。** 2回続けて呼ぶと1回目の行は消える——利用者から
        見て「いま出ている QR」は1つであり、捨てた QR で確定できる余地を残さない。

        **確定済みが5件あると 409。** 同じ名前の確定済みがあると 409
        （`already_exists`）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTotpRequest'
      responses:
        '201':
          description: |
            登録の途中の認証器。**`secret` と `otpauth_uri` を返す唯一の応答**。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartedTotpRegistration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '409':
          description: |
            確定済みが既に5件（`conflict`）、または同じ名前が使われている
            （`already_exists`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/mfa/totp/{id}/confirm:
    parameters:
      - $ref: '#/components/parameters/MfaCredentialID'
    post:
      tags: [me]
      summary: 認証アプリの登録を確定する
      operationId: confirmMyTotp
      description: |
        いまアプリに出ている6桁を照合し、認証器を確定させる（ApiDesign.md 4.6.3）。
        必要権限は「本人」。

        **MFA を最初に有効にしたときだけ `recovery_codes` が入る。** 2件目以降の
        認証器では返らない——既に持っているコードが無効になると読めてしまう。
        **平文が出るのはこの応答と `POST /me/mfa/recovery-codes` だけである。**

        **コード違いは 422**（401 ではない）。既にセッションを持つ本人が入力を
        間違えただけであり、セッションを疑う場面ではない。

        **同じ登録で5回失敗したら途中の行を捨てる。** やり直しは
        `POST /me/mfa/totp` から。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTotpRequest'
      responses:
        '200':
          description: 確定した認証器。初回は10本のリカバリコードを伴う。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmedTotp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分の未確定の認証器として見つからない（`not_found`）。
            他人のもの・存在しない ID・既に確定済みを区別しない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/mfa/totp/{id}:
    parameters:
      - $ref: '#/components/parameters/MfaCredentialID'
    delete:
      tags: [me]
      summary: 認証アプリを削除
      operationId: deleteMyTotp
      description: |
        登録済みの認証器を削除する（ApiDesign.md 4.6.4）。必要権限は「本人」。

        **現在のパスワードを求めない**（4.2 の扱いに揃える）。

        **最後の認証器を削除したら、リカバリコードも消える**（Design.md 6.7.5）。
        MFA が無効な状態でコードだけ残しても入口が無く、次に有効化したときに古い
        コードが通るのは筋が悪い。

        **行は消す**（アクセストークンのように `revoked_at` を立てる形にしない）。
        監査から辿る先は `audit_log` の `detail` で足り、**残した行は「登録されて
        いるのに効かない認証器」として一覧の判定を複雑にする。**
      responses:
        '204':
          description: 削除した。本文を持たない。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: 自分の認証器として見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/mfa/recovery-codes:
    post:
      tags: [me]
      summary: リカバリコードを作り直す
      operationId: regenerateMyRecoveryCodes
      description: |
        10本を作り直す（ApiDesign.md 4.6.5）。必要権限は「本人」。

        **既存のコードは未使用のものも含めて全部無効になる。**

        **本文を受けない。** 本数も形式も選ばせない——選択肢を先に作ると、使われ方を
        知る前に語彙が固まる（4.4.2 のスコープと同じ判断）。

        **確定済みの認証器が1件も無いと 409**（先に認証アプリを登録する必要がある）。
      responses:
        '200':
          description: |
            作り直した10本。**平文が出る2つの応答のうちの1つ**（もう1つは
            `POST /me/mfa/totp/{id}/confirm`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodeList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '409':
          description: 確定済みの認証器が1件も無い（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/passkeys:
    get:
      tags: [me]
      summary: 自分のパスキー
      operationId: listMyPasskeys
      description: |
        登録済みのパスキー（ApiDesign.md 4.7.1）。必要権限は「本人」。`created_at` の昇順。

        **公開鍵も credential_id も返さない。** ページネーションも ETag も持たない（上限5件）。
      responses:
        '200':
          description: 登録済みのパスキー。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [me]
      summary: パスキーを登録する
      operationId: registerMyPasskey
      description: |
        `POST /me/passkeys/options` で始めた登録を、認証器の応答で確定させる
        （ApiDesign.md 4.7.3）。必要権限は「本人」。

        **名前の重複と件数は、挑戦を消費する前に確かめる**——名前だけを直して同じ応答を
        送り直せる。検証の失敗は `401` ではなく `422`（既にセッションを持つ本人の操作であるため）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPasskeyRequest'
      responses:
        '201':
          description: 登録した。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passkey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            同じ名前か同じ認証器が登録済み（`already_exists`）、または既に5件ある（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/passkeys/options:
    post:
      tags: [me]
      summary: パスキーの登録を始める
      operationId: startMyPasskeyRegistration
      description: |
        挑戦を作り、`navigator.credentials.create()` に渡す options を返す
        （ApiDesign.md 4.7.2）。必要権限は「本人」。本文を受けない。

        **residentKey と userVerification は required、attestation は none。**
        `excludeCredentials` に、同じホスト名で登録済みのパスキーを入れる。

        登録の挑戦は1人1件までで、始め直したら置き換える。監査に残さない。
      responses:
        '200':
          description: 挑戦を作った。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyOptions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 既に5件ある、または IP アドレスで開いている（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/passkeys/{id}:
    parameters:
      - $ref: '#/components/parameters/PasskeyID'
    delete:
      tags: [me]
      summary: パスキーを削除する
      operationId: deleteMyPasskey
      description: |
        パスキーを1件削除する（ApiDesign.md 4.7.4）。必要権限は「本人」。
        現在のパスワードを求めない。

        **最後の1件を消しても他に何も消さない**——パスワードで入れる状態は変わらない。
        **端末の中のパスキーは消えない。**
      responses:
        '204':
          description: 削除した。本文を持たない。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 存在しない、または他人のパスキー（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/agent-client-kinds:
    get:
      tags: [agents]
      summary: クライアント種別のカタログ
      operationId: listAgentClientKinds
      description: |
        エージェントのクライアント種別（ApiDesign.md 4.5.7、正本は
        DbDesign.md 8.2.1.1 の `agent_client_kind`）。

        **必要権限は不要**（認証済みであればよい）。消費者は GuiDesign.md 5.8.2 の
        画面で、そこの必要権限は「本人」である。カタログ自体は秘密ではない。

        **画面に対応表を持たせないために在る**——`GET /roles` が display_name を
        返すようになった時点で `lib/roles.ts` を廃止したのと同じ形。値域は今後も
        増えるので、写しを置くと必ず腐る。

        `items[]` は `sort_order` の昇順。**ページネーションも ETag も持たない。**
      responses:
        '200':
          description: クライアント種別のカタログ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentClientKindList'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/agent-scopes:
    get:
      tags: [agents]
      summary: エージェント用トークンのスコープ
      operationId: getAgentScopes
      description: |
        エージェント用トークンの既定スコープと、既定に足せる権限（ApiDesign.md 4.5.9）。

        **必要権限は不要**（認証済みであればよい）。`/agent-client-kinds` と同じ扱い。

        **画面に既定スコープの写しを持たせないために在る。** `POST /me/agents/:id/tokens` の
        `scopes` は絶対指定なので、画面が「既定に `doc.edit` を足す」を送るには既定の中身が要る。
        許可リストは `default` ∪ `grantable`。
      responses:
        '200':
          description: 既定スコープと足せる権限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentScopes'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/me/agents:
    get:
      tags: [me]
      summary: 自分のエージェント一覧
      operationId: listMyAgents
      description: |
        自分の端末で動くクライアントを一覧する（ApiDesign.md 4.5.1）。
        必要権限は「本人」。

        **1件が表すのは「ある参加者の手元で動くクライアント1つ」である。** 人ではない。
        キーは（所有者・クライアント種別・プロジェクト）の3つ組で、同じ人が
        Claude Code と VS Code を使えば2件になる（Requirements.md 10.10.3）。

        **`token` は有効な1本だけを載せる。** 失効済みは返さず、期限切れは返す
        （`status` が `expired`）。有効なトークンが無ければ `null`。

        ページネーションも ETag も持たない（4.4.1 と同じ）。
      responses:
        '200':
          description: 自分のエージェント。`created_at` の降順。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAgentList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [me]
      summary: エージェントを登録
      operationId: createMyAgent
      description: |
        自分のエージェントを登録する（ApiDesign.md 4.5.2）。必要権限は「本人」。

        **トークンは同時に発行しない**（応答の `token` は常に `null`）。登録と発行を
        分けるのは、再発行のときに同じ経路（`POST /me/agents/{id}/tokens`）を通す
        ためである。

        **`project_key` は自分がメンバーであるプロジェクトに限る。** それ以外は 422
        （`details[].code` は `not_found`）。エージェントの権限は所有者から導かれる
        ので、自分が入っていないプロジェクトのエージェントを作っても権限0件になる。

        **`trust_level` と `capabilities` は受け取らない**（Design.md 6.5）。
        昇格の材料が構想のため、既定値で作る。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: 登録したエージェント。`token` は `null`。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAgent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '409':
          description: |
            同じ（プロジェクト・クライアント種別・表示名）の組が既にある
            （`already_exists`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    patch:
      tags: [me]
      summary: エージェントを更新・無効化
      operationId: updateMyAgent
      description: |
        自分のエージェントを更新する（ApiDesign.md 4.5.4）。必要権限は「本人」。
        送られた項目だけを更新する。

        **`project_key` と `client_kind` は変えられない**（本要求に含まれない）。
        その2つが「どのクライアントがどのプロジェクトにつないでいるか」という
        1件の同一性そのものであり、付け替えると過去の操作の文脈が後から変わる。

        **`is_active: false` が無効化である。** 行は消さない（`comment.author_id`
        などが参照するため）。**無効化すると、そのエージェントのトークンも失効する。**

        **他人のエージェント・存在しない `id` は 404**（403 にしない。Design.md 6.4.5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: 更新後のエージェント。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAgent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [me]
      summary: エージェントを削除
      operationId: deleteMyAgent
      description: |
        自分のエージェントを削除する（ApiDesign.md 4.5.4）。必要権限は「本人」。

        **物理削除である。** エージェントの `actor` 行を消すと、`agent` と
        `access_token` が `ON DELETE CASCADE` で追従し、**そのエージェントの
        資格情報は1本残らず消える。**

        **削除前に、そのエージェントが書いたコメントを付け替える**——
        付け替え先は `kind='agent'` の「削除されたエージェント」で、
        **アバターは角丸四角のまま残る**（GuiDesign.md 8.4.2）。
        `comment.author_id` は `NOT NULL` かつ `ON DELETE RESTRICT` なので、
        付け替えないと削除そのものが失敗する。

        **無効化（`is_active: false`）とは別の操作である。**
        「いま止めたいが記録は残したい」が無効化、「配った資格情報ごと
        消したい」が削除である。

        **他人のエージェント・存在しない `id` は 404**（403 にしない。Design.md 6.4.5）。

        **監査は `agent.delete`**（4.5.6）。`detail` に削除時点の表示名・
        クライアント種別・プロジェクトキーと、付け替えたコメントの件数が入る。
      responses:
        '204':
          description: 削除した。本文なし。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}/tokens:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    post:
      tags: [me]
      summary: エージェント用トークンを発行
      operationId: createMyAgentToken
      description: |
        エージェント用の Bearer トークンを発行する（ApiDesign.md 4.5.3）。
        必要権限は「本人」。

        **`token`（平文）はこの応答でのみ返る。** DB には SHA-256 のハッシュしか
        残らず、再表示する API は無い（DbDesign.md 6.2）。

        **有効なトークンは1件につき1本。** 再発行すると、それまでの有効なトークンを
        失効させたうえで発行する（応答は 201。失効は暗黙に行い、監査には残る）。

        **`scopes` は選ばせない。** Design.md 6.5 の既定を常に入れる——
        `ticket.close` と `doc.edit` を既定から外してあるのが要点で、選ばせると
        その禁止が画面の作りに依存してしまう。**トークンは所有者の権限との積に
        なる**ため、既定をそのまま載せても所有者が持たない権限は付かない。

        発行するトークンは `project_id` を持ち、他プロジェクトへのアクセスは 404 になる
        （Design.md 6.4.5）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentTokenRequest'
      responses:
        '201':
          description: 発行したトークン。**`token` を返す唯一の応答**。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAgentToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            無効化されたエージェントには発行できない（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}/tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/AgentID'
      - $ref: '#/components/parameters/AgentTokenID'
    delete:
      tags: [me]
      summary: エージェント用トークンを失効
      operationId: deleteMyAgentToken
      description: |
        エージェント用トークンを失効させる（ApiDesign.md 4.5.5）。必要権限は「本人」。

        **行は消さず `revoked_at` を立てる**（4.4.3 と同じ）。

        **冪等。** 既に失効済みでも 204 を返し、`revoked_at` を上書きしない。

        **他人のエージェント・存在しない `id` / `token_id`・`token_type` が `agent`
        でないものは 404**（Design.md 6.4.5）。
      responses:
        '204':
          description: 失効させた（既に失効済みでも同じ）。本文を持たない。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          description: |
            自分のエージェントのトークンとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}/setup:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    get:
      tags: [me]
      summary: 自分の接続設定（系統B）
      operationId: getMyAgentSetup
      parameters:
        - $ref: '#/components/parameters/ConnectTransport'
        - $ref: '#/components/parameters/BridgeOS'
        - $ref: '#/components/parameters/BridgeArch'
      description: |
        そのエージェントが PB に繋がるために、本人が自分の端末へ置くものを返す
        （ApiDesign.md 4.5.8、Requirements.md 10.9.1 の系統B）。必要権限は「本人」。

        **`/projects/{key}/agent-setup`（系統A）と対になる。** あちらはリポジトリに
        コミットするファイル（1リポジトリに1回、管理者が）、こちらは**各人の手元にしか
        残らないもの**（人ごとに、何度でも）。

        **答えるのは「MCP が使える状態になるまで」だけである。** 作業の材料をどこから
        どう用意するかは PB が知らないので返さない——プロジェクトの文書に書かれ、
        人もエージェントもそこから読む（手順28c）。

        **平文のトークンは返さない。** `export_line` は変数名までで、値はプレースホルダ。
        **接続できたかどうかも返さない**——`GET /me/agents` の `token.last_used_at` が
        既にそれを表しており、同じ事実を2か所から出すと必ず食い違う。

        **`ETag` もページネーションも持たない。**
      responses:
        '200':
          description: |
            接続設定一式。**`files` は空配列になりうる**
            （PB が接続設定の書式を持たない種別。4.5.8.3）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConnect'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me/agents/{id}/setup.zip:
    parameters:
      - $ref: '#/components/parameters/AgentID'
    get:
      tags: [me]
      summary: 自分の接続設定（zip ダウンロード）
      operationId: getMyAgentSetupZip
      parameters:
        - $ref: '#/components/parameters/ConnectTransport'
        - $ref: '#/components/parameters/BridgeOS'
        - $ref: '#/components/parameters/BridgeArch'
      description: |
        `/setup` と同じ接続設定を zip で返す（ApiDesign.md 4.5.8.5）。

        - **`mode` は常に `merge`** なので、**zip には別名で入る**
          （`.mcp.json` → `.mcp.pb-block.json`）。**展開した瞬間に既存の接続設定を
          消す zip を配らない**——`.mcp.json` は履歴管理の対象外で、消すと git から戻せない
        - **`PB-README.md` が1枚入る。** 中身は**種別ごとに違う**（置き場も、改名の要否も、
          `.gitignore` の扱いも種別で変わる）。**JSON の `files[]` には含まれない**
          ——画面が同じ内容を節として描いており、`files[]` に入れると
          「これも置くファイルだ」と読まれる
        - **`README.md` という名前にしない。** プロジェクト直下で展開されたときに
          本物の `README.md` を消す
        - **ファイル名に種別を入れる**（`pb-connect-<key>-<client_kind>.zip`）。Codex のブリッジZIPは
          `pb-connect-<key>-codex-<os>-<arch>.zip`。1人が同じ
          プロジェクトに2件持つことがあり、同じ名前の zip が並ぶと見分けられない
        - **別パスにしてあるのは、ブラウザの `<a download href>` で素直に落とすため**
      responses:
        '200':
          description: zip アーカイブ。
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="pb-connect-pb-claude_code.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 自分のエージェントとして見つからない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects:
    get:
      tags: [projects]
      summary: プロジェクト一覧
      operationId: listProjects
      description: |
        自分がメンバーであるプロジェクトを返す。アドミニストレータは全件（ApiDesign.md 5.1）。

        **必要権限は `project.view`。** ただしこの権限は「どのプロジェクトが見えるか」を
        決めない（オペレータもシステムロールとして持つ）。可視範囲はメンバーシップで絞る。

        `ticket_count` / `closed_count` / `progress` を含めるのは、プロジェクトごとに
        件数を問い合わせる N+1 を避けるためである（5.1）。
      parameters:
        - name: status
          in: query
          description: 既定は `active`。
          schema:
            type: string
            enum: [active, archived, all]
            default: active
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, key, updated_at, ticket_count, progress]
            default: updated_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
      responses:
        '200':
          description: 1ページ分のプロジェクト。
          headers:
            ETag:
              description: |
                弱い検証子 `W/"proj-<件数>-<MAX(updated_at) のナノ秒>"`（ApiDesign.md 2.7）。
                **`If-None-Match` は解釈しない**（304 を返さない）。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [projects]
      summary: プロジェクトの作成
      operationId: createProject
      description: |
        プロジェクトを作成する（ApiDesign.md 5.3）。必要権限は `project.create`
        （アドミニストレータのみ）。

        サーバ側は `project` 作成・`project_counter` 初期化・テンプレートからの
        ワークフロー複製・**テンプレートからの文書複製**・作成者の `project_admin` 登録・
        `audit_log` への記録を**単一トランザクション**で行う。

        文書テンプレートは `template_key = 'default'` 固定で、入力フィールドを持たない
        （`DbDesign.md` 8.1.2）。複製された文書はそれぞれ `revision_no = 1` を持ち、
        `created_by` は作成者になる。

        キー重複の検出はDBの `UNIQUE` 制約に委ねる（`check-key` の結果は信頼しない）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: 作成された。応答は `GET /projects/:key` と同形式（5.4）。
          headers:
            Location:
              description: '`/api/v1/projects/<key>`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            プロジェクトキーが既に使われている（`already_exists`。ApiDesign.md 5.3）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/check-key:
    get:
      tags: [projects]
      summary: プロジェクトキーの利用可否
      operationId: checkProjectKey
      description: |
        新規作成モーダルの即時検証に使う（ApiDesign.md 5.2）。

        判定の順は 形式 → 予約語 → 既存。**この結果は作成時の重複検出には使わない**
        （5.3。競合検出はDBの `UNIQUE` 制約に委ねる）。

        必要権限は作成と同じ `project.create`。
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          examples:
            available:
              value: my-app
      responses:
        '200':
          description: 判定結果。**使えない場合も 200 で返す**（エラーではない）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckKeyResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: プロジェクトの詳細
      operationId: getProject
      description: |
        1プロジェクトの本体・ワークフロー・メンバー・自分の実効権限を返す
        （ApiDesign.md 5.4）。必要権限は `project.view`。

        **メンバーでなければ 404**（403 ではない。Design.md 6.4.5）。403 で返すと
        「そのキーのプロジェクトは在る」と漏れ、キーを変えながら叩けば
        プロジェクトの一覧を復元できてしまう。アドミニストレータは全件に到達できる。

        `my_permissions` は認可ミドルウェアと同じ集合から作る
        （( システムロール ∪ プロジェクトロール ) ∩ スコープ。Design.md 6.4.1）。
      responses:
        '200':
          description: プロジェクトの詳細。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            プロジェクトが存在しない、または到達できない（`not_found`）。
            **両者を区別しない**（Design.md 6.4.5）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [projects]
      summary: プロジェクトの更新
      operationId: updateProject
      description: |
        `name` / `description` / `settings` を更新する（ApiDesign.md 5.5）。
        必要権限は `project.edit`。

        **送られたフィールドだけを更新する**（部分更新）。`"description": null` は
        「説明を消す」であり、`description` を送らない（据え置く）とは区別する。

        **`key` は変更できない。** 送られた場合は 422 で、`details[].code` が
        `immutable_field` になる（`error.code` は `validation_failed`）。

        **`If-Match` は必須**（2.8）。省略すると 422（`details[].field` が
        `If-Match`）、現在の `version` と食い違えば 409。成功すると `version` が +1 される。
      parameters:
        - name: If-Match
          in: header
          required: true
          description: 取得時の `version`。`"3"` のように引用符で囲む（RFC 9110 8.8.3）。
          schema:
            type: string
          examples:
            current:
              value: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: 更新後のプロジェクト（5.4 と同形式）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `If-Match` が現在の `version` と一致しない（`conflict`。ApiDesign.md 2.8）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [projects]
      summary: プロジェクトのアーカイブ
      operationId: archiveProject
      description: |
        `status` を `archived` にし、`archived_at` に現在時刻を入れる
        （ApiDesign.md 5.6）。必要権限は `project.archive`。

        リクエスト本文は取らない。**`If-Match` は要求しない**（2.8）。冪等であり、
        競合しても失われる編集内容がないためである。ただし `version` は +1 する。

        **既にアーカイブ済みなら何も変えずに 200 を返す。** そのとき `version` は
        進まず、監査ログにも残さない（空振りで本当の切り替えが埋もれるため）。

        監査は `project.archive` として記録し、`detail.status` で unarchive と区別する。
      responses:
        '200':
          $ref: '#/components/responses/ProjectStatusChanged'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [projects]
      summary: プロジェクトのアーカイブ解除
      operationId: unarchiveProject
      description: |
        `status` を `active` に戻し、`archived_at` を `null` にする
        （ApiDesign.md 5.6）。archive と同じ経路を通り、渡す `status` だけが違う。

        必要権限・冪等性・監査の扱いは archive と同じ。
      responses:
        '200':
          $ref: '#/components/responses/ProjectStatusChanged'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            権限不足（`forbidden`）または CSRF トークンの不一致（`csrf_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/agent-setup:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: エージェント連携セットアップ（配置ファイルの生成）
      operationId: getAgentSetup
      description: |
        リポジトリにコミットする配置ファイルを組み立てて返す
        （ApiDesign.md 5.7.1、Requirements.md 10.9.1 の系統A）。
        **必要権限は `agent.register`**（`project.edit` ではない。GuiDesign.md 3.2）。

        **接続設定（`.mcp.json` / `.vscode/mcp.json` / `.codex/config.toml`）は
        含まない。** 10.8.1 が履歴管理の対象外と定めたので、リポジトリに置くものを
        作るこの口には置き場がない——各人が `/me/agents` から受け取る（手順28b）。

        **`base_url` はリクエストの `Host` から組み立てる**（暫定）。PB は自分の
        公開 URL を知らず、設定にあるのは待受アドレス（`PB_BIND`）だけで URL に
        使えない。スキームは `PB_COOKIE_SECURE` を見る——リバースプロキシで TLS を
        終端する構成では `r.TLS` が nil になるためで、同じ問題を同じ設定で解いている。

        **`ETag` もページネーションも持たない。** 件数は選んだ種別で決まる。
      parameters:
        - name: client
          in: query
          required: true
          description: |
            `agent_client_kind` の `key` のうち、**`has_setup_template` が真のもの**
            （4.5.7）。**繰り返し指定する**（`?client=claude_code&client=codex`）。
            偽の値・未知の値は 422。**重複は畳み、並びはカタログの順に揃える。**
          schema:
            type: array
            minItems: 1
            items:
              type: string
          style: form
          explode: true
          example: [claude_code, codex]
      responses:
        '200':
          description: 配置ファイル一式。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSetup'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 権限不足（`forbidden`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `client` が無い、配置ファイルを持たない種別、未知の種別
            （`validation_failed`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/agent-setup.zip:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: エージェント連携セットアップ（zip ダウンロード）
      operationId: getAgentSetupZip
      description: |
        `/agent-setup` と同じ内容を zip で返す（ApiDesign.md 5.7.2）。

        - **リポジトリ直下からの相対パスでフォルダを掘る**
        - **`mode` が `create` でないものは別名で入れる**
          （`CLAUDE.md` → `CLAUDE.pb-block.md`）。展開した瞬間に既存のファイルを
          消す zip を配らないため
        - **別パスにしてあるのは、ブラウザの `<a download href>` で素直に落とすため**
          である（`Accept` ヘッダでの切り替えにしない）
      parameters:
        - name: client
          in: query
          required: true
          description: '`/agent-setup` と同じ。'
          schema:
            type: array
            minItems: 1
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: zip アーカイブ。
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="pb-setup-pb.zip"
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 権限不足（`forbidden`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: プロジェクトが存在しない、または到達できない（`not_found`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`client` の指定が不正（`validation_failed`）。'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/stats:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: プロジェクトの集計
      operationId: getProjectStats
      description: |
        プロジェクトダッシュボードの4枚のカードと「要対応」ブロックのデータ源
        （ApiDesign.md 9.13.1、GuiDesign.md 5.3）。**必要権限は `project.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        **`status` ではなく `status_category` で集計する。** ワークフローが
        プロジェクトごとに違っても、4つのカードの意味が変わらないようにするため
        である。**`by_category` は常に4つのキーを持つ**——そのカテゴリのステータスが
        ワークフローに1つも無くても `0` を返す（`simple` テンプレートは `review` を
        持たない。DbDesign.md 7.4）。

        **`by_category` の合計は `total` と一致しないことがある。** `status_key` が
        ワークフローに解決できないチケットはどのカテゴリにも数えられない。合わせに
        行かないのは、「分類できないチケットがある」ことを 0 で塗り潰さないためである。

        `overdue` / `stale` / `unassigned` はいずれも `closed_at IS NULL` が掛かる。
        **「今日」は DB の `CURRENT_DATE`** で決める（9.2.1 の `due_within` と同じ）。
        `app_user.timezone` は混ぜない——混ぜると同じプロジェクトの集計が読み手ごとに
        変わる。

        **`ETag`（2.7）は返さない。** 一覧ではなくページャも持たず、ETag の材料を
        採る走査が本体の集計とほぼ同じなので、付けても DB の仕事は減らない。
      responses:
        '200':
          description: プロジェクトの集計。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStats'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: 業務履歴の一覧
      operationId: listProjectActivity
      description: |
        チケットの変更履歴（ApiDesign.md 9.13.2）。**必要権限は `project.view`**。
        消費者は2つとも「全件を時系列で読む」——ダッシュボードの「最近の動き」
        （GuiDesign.md 5.3）と、チケット詳細の「履歴」セクション（同 5.5）である。

        **`audit_log`（2.10）とは読み手が違う**（9.1.1）。あちらはインスタンス
        管理者が認証・権限・トークンを追うためのもので、ここはプロジェクトの
        メンバーがチケットの変更を読むためのものである。

        **並び順は `occurred_at DESC, id DESC` で固定**で、`sort` / `order` は
        指定できない（どちらも 422）。`occurred_at` だけでは足りないのは、
        **1回の `PATCH` が変更した項目ごとに複数行を書く**ためである（9.5.2）
        ——タイトルと期限を同時に変えると2行が同じ時刻になる。

        **`entity` は資源の指定ではなくフィルタである。** 書式違反は 422 だが、
        形が正しくてチケットが無いときは**空の一覧を 200 で返す**（404 にしない）。
        **同じ理由で、削除されたチケットの履歴には `entity` で到達できない**
        ——`seq` から ULID を引く経路が消えるためで、その行はプロジェクト全体の
        一覧にだけ現れる。

        `If-None-Match` は解釈せず、ヘッダだけ出す（9.2.5 と同じ）。
      parameters:
        - name: entity
          in: query
          description: |
            `ticket:31` の形。省略時はプロジェクト全体。**受け付ける
            `entity_type` はチケットだけである**（9.1.1）。
          schema: { type: string, pattern: '^ticket:[1-9][0-9]*$' }
          example: ticket:31
        - name: action
          in: query
          description: |
            **単一値のみ。** カンマ区切りの OR を受け付けない——9.2.1 のフィルタ群と
            違う扱いだが、複数選択を要する画面が無い。
          schema:
            type: string
            enum: [create, update, delete, transition]
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: 既定 20、上限 200（ApiDesign.md 9.13.2 / 2.6）。
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: 業務履歴の一覧。
          headers:
            ETag:
              description: |
                `W/"act-<フィルタ条件のハッシュ>-<件数>-<MAX(occurred_at) のナノ秒>"`。
                **`page` / `per_page` もハッシュに含める**——ETag は応答本文を指す
                検証子であり、2ページ目と1ページ目が同じ値になってはならない。
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tags:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [tickets]
      summary: タグ一覧
      operationId: listTags
      description: |
        プロジェクトのタグを返す（ApiDesign.md 9.11）。**必要権限は `ticket.view`**
        （メンバーでない場合はプロジェクトごと 404）。

        `items[]` は `sort_order` 昇順、同値は `name` 昇順。第2キーを置くのは、
        `sort_order` が重複したときに順序が実行ごとに揺れないようにするためである。

        **ページネーションも `ETag` も持たない。** バックログのグループ化は全タグを
        セクションの順序に使うため（GuiDesign.md 5.4.1）、ページングすると2ページ目の
        タグがグループ化に現れず、設計上そもそも使えない。

        `ticket_count` は削除確認ダイアログが出す「12件のチケットで使われています」
        （GuiDesign.md 6.3）。
      responses:
        '200':
          description: タグの一覧。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [tickets]
      summary: タグの作成
      operationId: createTag
      description: |
        タグを1件作る（ApiDesign.md 9.11）。**必要権限は `project.edit`**——タグの定義は
        「プロジェクトの分類軸を決める」行為であり、チケットへの付与（`ticket.edit`）とは
        別の権限で扱う。

        `name` は前後の空白を取り除いてから検証する。**同一プロジェクト内で一意**で、
        重複は 409 `already_exists`。**大文字と小文字は区別する**（`uq_tag_project_name` が
        `text` の一意制約であり `citext` ではない。DbDesign.md 6.10）。

        `sort_order` を省略すると末尾（現在の最大値 + 10）に置く。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: 作成されたタグ。`Location` に作成先のURLを返す。
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/projects/my-app/tags/01K2F8QW3H7YRJ4M5N6P7Q8R9S
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '409':
          $ref: '#/components/responses/TagAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/tags/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
      - $ref: '#/components/parameters/TagID'
    patch:
      tags: [tickets]
      summary: タグの更新
      operationId: patchTag
      description: |
        タグの `name` / `sort_order` を変える（ApiDesign.md 9.11）。必要権限は `project.edit`。

        **`If-Match` を要求しない。** 2.8 の楽観ロックの対象は `project` と `app_user` で、
        `tag` は `version` 列を持たない。

        **並べ替え（9.11.1）もこのエンドポイントで表現する。** クライアントはドロップの
        確定時に新しい並びへ `10, 20, 30, …` を割り当て直し、値が変わった行だけ送る。
        専用の move は設けていない——`sort_order` は単なる整数で、チケットの `sort_key`
        （LexoRank）のような生成規則を持たないためである。

        送られなかった項目は据え置く。何も送られていない場合は現在の値をそのまま返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTagRequest'
      responses:
        '200':
          description: 更新後のタグ。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '409':
          $ref: '#/components/responses/TagAlreadyExists'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [tickets]
      summary: タグの削除
      operationId: deleteTag
      description: |
        タグを消す（ApiDesign.md 9.11）。必要権限は `project.edit`。

        `ticket_tag` の行は `CASCADE` で消える（DbDesign.md 6.10）。**チケットは消えず、
        タグが外れるだけである。**

        **使用中でも削除できる。** 禁止すると、要らなくなった分類を消すために全チケットから
        手で外すことになる。画面は確認ダイアログに使用中の件数を出す（GuiDesign.md 6.3）。
      responses:
        '204':
          description: 削除された（本文なし）。
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/TagNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/calendar:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    get:
      tags: [projects]
      summary: 暦の取得元と取得の状態
      operationId: getProjectCalendar
      description: |
        プロジェクトの祝日の取得元と、取得の状態を返す（ApiDesign.md 5.8.1）。
        **必要権限は `project.view`**。取得元が無ければ `source` は null。
      responses:
        '200':
          description: 暦の取得元と状態。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCalendar'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/calendar/source:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    put:
      tags: [projects]
      summary: 暦の取得元を選ぶ・外す
      operationId: putProjectCalendarSource
      description: |
        Google の祝日カレンダーを取得元に選ぶ、または外す（ApiDesign.md 5.8.2）。
        **必要権限は `project.edit`**。**選ぶだけで取りに行かない**（取得は 5.8.3）。
        同じ暦を他のプロジェクトが取得済みなら、その結果がすぐ使える。

        **URL は受けない。** サーバが `google_id` から組み立てる（SSRF を作らないため）。
        取り込みの暦を使っていたなら、その取り込み分は消える。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutProjectCalendarSourceRequest'
      responses:
        '200':
          description: 更新後の暦。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCalendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/calendar/fetch:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [projects]
      summary: 祝日を取得する
      operationId: fetchProjectCalendar
      description: |
        Google の祝日カレンダーを取りに行き、取り込む（ApiDesign.md 5.8.3）。
        **必要権限は `project.edit`**。日次の自動取得は持たず、この口だけが契機である。

        **同じ `google_id` への取得は、プロジェクトをまたいで1時間に1回まで**
        （失敗した試行も数える）。超えたら 429 と `Retry-After`。
        本文のハッシュ（`DTSTAMP` 行を除く）が前回と同じなら取り込み直さない。
        失敗しても前回までの取り込み分は残る。
      responses:
        '200':
          description: 取り込めた（変わっていなかったときも含む）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCalendar'
        '409':
          description: 取得元が Google の暦でない（`conflict`）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            相手先が応答しない・200 以外・iCal として読めない（`upstream_failed`）。
            `message` は `last_error` と同じ文。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProjectNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/projects/{key}/calendar/import:
    parameters:
      - $ref: '#/components/parameters/ProjectKey'
    post:
      tags: [projects]
      summary: .ics を取り込む
      operationId: importProjectCalendar
      description: |
        iCal の本文を取り込む（ApiDesign.md 5.8.4）。**必要権限は `project.edit`**。
        外へ出られない環境のための口である。**JSON で受ける**（iCal はテキスト）。

        取り込むのは終日の予定だけで、複数日の予定は日ごとに展開する。時刻付きの
        予定と繰り返し（`RRULE`）は取り込まず、数を `imported.skipped` に返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportProjectCalendarRequest'
      responses:
        '200':
          description: 取り込めた。`imported` が付く。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCalendar'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
