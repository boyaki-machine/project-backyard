<style>
/* ── PB のベーストークン（GuiDesign 8.3 / 8.4 の hex。gantt.html から写した） ── */
:root {
  color-scheme: light;
  --pb-1:#fafcfe; --pb-2:#f3f7fb; --pb-3:#e9eff6; --pb-4:#dde7ef; --pb-5:#d2dde8; --pb-6:#c4d2df;
  --pb-7:#b3c4d3; --pb-8:#95aec4; --pb-9:#2b77b0; --pb-10:#1368a1; --pb-11:#39688e; --pb-12:#102231;
  --pb-danger:#bd4542; --pb-danger-text:#963633;
  --pb-warning:#f9ce32; --pb-warning-bg:#fdf4d8; --pb-warning-border:#ebd696;
  --pb-ai:#8259bf;
  --pb-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Noto Sans Mono', monospace;
  --pb-font: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic UI', Meiryo, sans-serif;
  --pb-hue: 245;
  /* エピックの袖章（GuiDesign 5.4.4） */
  --pb-epic-0:#b66c02; --pb-epic-1:#3b4fa5; --pb-epic-2:#07bde5; --pb-epic-3:#97ba4f;
  --pb-epic-4:#902e5c; --pb-epic-5:#ee83af; --pb-epic-6:#575e01; --pb-epic-7:#01976d;
  --g-min-op: .45; --g-sub-op: .5; --g-rule-op: .3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --pb-1:#0b1014; --pb-2:#10171d; --pb-3:#162029; --pb-4:#1c2833; --pb-5:#21303c; --pb-6:#283a49;
    --pb-7:#344a5d; --pb-8:#446179; --pb-9:#4993cd; --pb-10:#61a5dd; --pb-11:#86b0d5; --pb-12:#e5f0fa;
    --pb-danger:#db6c66; --pb-danger-text:#ef958e;
    --pb-warning:#e9c025; --pb-warning-bg:#2d240b; --pb-warning-border:#554614;
    --pb-ai:#a07cdb;
    --pb-epic-0:#d68729; --pb-epic-1:#526ac3; --pb-epic-2:#57daff; --pb-epic-3:#b3d76d;
    --pb-epic-4:#ae4976; --pb-epic-5:#ffaacb; --pb-epic-6:#707902; --pb-epic-7:#1bb685;
    --g-min-op: .55; --g-sub-op: .6; --g-rule-op: .4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --pb-1:#0b1014; --pb-2:#10171d; --pb-3:#162029; --pb-4:#1c2833; --pb-5:#21303c; --pb-6:#283a49;
  --pb-7:#344a5d; --pb-8:#446179; --pb-9:#4993cd; --pb-10:#61a5dd; --pb-11:#86b0d5; --pb-12:#e5f0fa;
  --pb-danger:#db6c66; --pb-danger-text:#ef958e;
  --pb-warning:#e9c025; --pb-warning-bg:#2d240b; --pb-warning-border:#554614;
  --pb-ai:#a07cdb;
  --pb-epic-0:#d68729; --pb-epic-1:#526ac3; --pb-epic-2:#57daff; --pb-epic-3:#b3d76d;
  --pb-epic-4:#ae4976; --pb-epic-5:#ffaacb; --pb-epic-6:#707902; --pb-epic-7:#1bb685;
  --g-min-op: .55; --g-sub-op: .6; --g-rule-op: .4;
}

/* 派生トークン（他の変数を参照するものは :root で宣言しない。GuiDesign 5.14「実装の落とし穴」） */
.page {
  --g-bar: var(--pb-9);
  --g-bar-line: var(--pb-9);
  --g-bar-fill: color-mix(in srgb, var(--g-bar) 26%, transparent);
  --g-bar-glow: none;
  --g-done-fill: var(--pb-3);
  --g-done-line: var(--pb-7);
  --g-hdr-bg: var(--pb-2);
  --g-dep: var(--pb-8);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .page {
    --g-bar: var(--pb-10);
    --g-bar-line: color-mix(in srgb, var(--pb-10) 70%, var(--pb-12));
    --g-bar-fill: color-mix(in srgb, var(--g-bar) 42%, transparent);
    --g-bar-glow: drop-shadow(0 0 2.5px color-mix(in srgb, var(--g-bar) 65%, transparent));
    --g-done-fill: var(--pb-4);
    --g-done-line: var(--pb-8);
    --g-dep: color-mix(in srgb, var(--pb-11) 62%, var(--pb-1));
  }
}
:root[data-theme="dark"] .page {
  --g-bar: var(--pb-10);
  --g-bar-line: color-mix(in srgb, var(--pb-10) 70%, var(--pb-12));
  --g-bar-fill: color-mix(in srgb, var(--g-bar) 42%, transparent);
  --g-bar-glow: drop-shadow(0 0 2.5px color-mix(in srgb, var(--g-bar) 65%, transparent));
  --g-done-fill: var(--pb-4);
  --g-done-line: var(--pb-8);
  --g-dep: color-mix(in srgb, var(--pb-11) 62%, var(--pb-1));
}

/* ── ページの枠 ── */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--pb-1); color: var(--pb-12); font-family: var(--pb-font); font-size: 14px; line-height: 1.6; }
.page { height: 100vh; min-width: 1180px; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: var(--pb-1); color: var(--pb-12); }
.mono { font-family: var(--pb-font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--pb-11); }
.intro { display: flex; flex-direction: column; gap: 8px; flex: none; }
.intro .eyebrow { font: 11px var(--pb-font-mono); letter-spacing: .04em; color: var(--pb-11); }
.intro h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; line-height: 1.35; text-wrap: balance; }
.intro ol { margin: 0; padding-left: 1.5em; font-size: 12.5px; color: var(--pb-11); line-height: 1.6; max-width: 120ch; }
.intro ol li::marker { font: 11px var(--pb-font-mono); }
.intro ol b { color: var(--pb-12); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--pb-11); }
.seg { display: inline-flex; border: 1px solid var(--pb-7); border-radius: 6px; overflow: hidden; background: var(--pb-1); flex: none; }
.seg button { font: inherit; font-size: 12px; color: var(--pb-12); background: none; border: 0; padding: 3px 10px; cursor: pointer; border-left: 1px solid var(--pb-6); white-space: nowrap; }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--pb-4); }
.seg button[aria-pressed="true"] { background: var(--pb-9); color: var(--pb-1); }
.btn { font: inherit; font-size: 12px; color: var(--pb-12); background: var(--pb-1); border: 1px solid var(--pb-7); border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; flex: none; }
.btn:hover { background: var(--pb-4); }
.btn.pri { background: var(--pb-9); border-color: var(--pb-9); color: var(--pb-1); }
.btn.pri:hover { background: var(--pb-10); }
.btn.sq { width: 28px; padding: 3px 0; text-align: center; }
.btn[disabled] { opacity: .45; cursor: default; }
:is(.seg button, .btn, select, .chip):focus-visible { outline: 2px solid var(--pb-8); outline-offset: 1px; }
select { font: inherit; font-size: 12px; color: var(--pb-12); background: var(--pb-1); border: 1px solid var(--pb-7); border-radius: 6px; padding: 2px 4px; }
.clock { font-size: 13px; color: var(--pb-12); min-width: 5.2em; }

/* ── 画面のモック ── */
.app { flex: 1 1 auto; min-height: 440px; display: grid; grid-template-columns: 56px minmax(0, 1fr); border: 1px solid var(--pb-7);
  border-radius: 8px; overflow: hidden; background: var(--pb-1); color: var(--pb-12); font-size: 13px; line-height: 1.4; position: relative; }
.rail { background: var(--pb-2); border-right: 1px solid var(--pb-6); display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; }
.rail span { width: 36px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: var(--pb-11); font-size: 15px; }
.rail span.on { background: var(--pb-5); color: var(--pb-12); }
.rail hr { width: 28px; border: 0; border-top: 1px solid var(--pb-6); margin: 4px 0; }
.content { display: grid; grid-template-rows: 48px 38px minmax(0, 1fr) 26px; min-width: 0; min-height: 0; }
.pagehdr { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--pb-6); min-width: 0; }
.pagehdr h2 { font-size: 18px; font-weight: 600; margin: 0 6px 0 0; white-space: nowrap; }
.sp { flex: 1 1 auto; min-width: 8px; }
.vsep { width: 1px; height: 20px; background: var(--pb-6); flex: none; margin: 0 2px; }
.chip { font: inherit; font-size: 12px; color: var(--pb-12); background: var(--pb-1); border: 1px solid var(--pb-7); border-radius: 6px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
.chip:hover { background: var(--pb-4); }
.chip.on { border-color: var(--pb-9); box-shadow: inset 0 0 0 1px var(--pb-9); }
.chip .k { color: var(--pb-11); }
.rowsum { font-size: 12px; color: var(--pb-11); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 260px; }
.rowsum b { color: var(--pb-12); font-weight: 600; }
.poll { font-size: 11px; color: var(--pb-11); white-space: nowrap; min-width: 6.5em; text-align: right; }
.poll.warn { color: var(--pb-danger-text); }
.dd { position: relative; flex: none; }
.panel { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; min-width: 260px; background: var(--pb-1); border: 1px solid var(--pb-7); border-radius: 8px;
  box-shadow: 0 8px 24px oklch(0.2 0.03 245 / .18); padding: 8px; font-size: 12.5px; }
.panel.right { left: auto; right: 0; }
.panel .ph { font-size: 11px; color: var(--pb-11); padding: 2px 4px 6px; border-bottom: 1px solid var(--pb-6); margin-bottom: 4px; }
.panel label { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.panel label:hover { background: var(--pb-3); }
.panel .pf { display: flex; gap: 6px; padding-top: 6px; margin-top: 4px; border-top: 1px solid var(--pb-6); }
.panel .vrow { display: grid; grid-template-columns: auto auto 1fr; gap: 2px 8px; align-items: baseline; white-space: normal; }
.panel .vrow small { grid-column: 2 / 4; color: var(--pb-11); font-size: 11px; }
.panel .sw { display: inline-block; width: 8px; height: 14px; border-radius: 1px; flex: none; }

.notice { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--pb-6); font-size: 12.5px; min-width: 0; white-space: nowrap; overflow: hidden; }
.notice .msg { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.notice .msg b { font-weight: 600; }
.notice .lbl { font: 600 11px var(--pb-font-mono); letter-spacing: .04em; color: var(--pb-11); flex: none; }
.notice.trial { background: color-mix(in srgb, var(--pb-9) 9%, var(--pb-1)); }
.notice.fail { background: color-mix(in srgb, var(--pb-danger) 9%, var(--pb-1)); }
.notice.fail .lbl, .notice .dz { color: var(--pb-danger-text); }
.notice.step { background: var(--pb-2); }
.notice .ex { display: flex; gap: 6px; align-items: center; flex: none; }
.notice .ex .btn { font-size: 11.5px; padding: 2px 8px; }
.notice .other { margin-left: auto; color: var(--pb-11); font-size: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.notice .other mark { background: var(--pb-warning); color: var(--pb-12); border-radius: 3px; padding: 0 4px; }
.statusbar { border-top: 1px solid var(--pb-6); font-size: 11px; color: var(--pb-11); display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--pb-2); white-space: nowrap; overflow: hidden; }
.statusbar kbd { font-family: var(--pb-font-mono); font-size: 10.5px; border: 1px solid var(--pb-7); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--pb-12); background: var(--pb-1); }
.statusbar select { font-size: 11px; padding: 0 2px; }
.statusbar .r { margin-left: auto; }

/* ── 本体 ── */
.scroller { overflow: auto; position: relative; min-height: 0; overscroll-behavior: contain; }
.canvas { position: relative; }
.axis { position: sticky; top: 0; z-index: 6; display: flex; background: var(--g-hdr-bg); border-bottom: 1px solid var(--pb-7); }
.corner { position: sticky; left: 0; z-index: 7; flex: none; background: var(--g-hdr-bg); border-right: 1px solid var(--pb-7); font-size: 11px; color: var(--pb-11); padding: 4px 10px 4px 16px; line-height: 1.35; overflow: hidden; }
.corner b { color: var(--pb-12); font-weight: 600; }
.axtrack { position: relative; flex: none; overflow: hidden; }
.ax-maj { position: absolute; top: 3px; font: 600 11px var(--pb-font-mono); color: var(--pb-12); white-space: nowrap; padding-left: 4px; }
.ax-maj.lft { transform: translateX(-100%); padding: 0 4px 0 0; }
.ax-min { position: absolute; bottom: 3px; font: 10.5px var(--pb-font-mono); color: var(--pb-11); white-space: nowrap; padding-left: 3px; }
.ax-tk { position: absolute; bottom: 0; height: 6px; width: 1px; background: var(--pb-7); }
.ax-tk.M { height: 100%; background: var(--pb-8); }
.nowtag { position: absolute; bottom: 2px; transform: translateX(-50%); font: 600 10.5px var(--pb-font-mono); color: var(--pb-1); background: var(--g-bar); border-radius: 3px; padding: 0 5px; white-space: nowrap; z-index: 2; }
.grid { position: absolute; pointer-events: none; overflow: visible; }
.grid .f { stroke: var(--pb-6); stroke-width: 1; stroke-dasharray: 1 3; opacity: var(--g-sub-op); }
.grid .m { stroke: var(--pb-6); stroke-width: 1; opacity: var(--g-min-op); }
.grid .M { stroke: var(--pb-7); stroke-width: 1; }
.past { position: absolute; pointer-events: none; display: none; }
.nowline { position: absolute; z-index: 2; width: 0; border-left: 1.5px solid var(--g-bar); pointer-events: none; filter: var(--g-bar-glow); }
#ghosts { position: absolute; z-index: 3; pointer-events: none; }

.row { display: flex; position: relative; border-bottom: 1px solid color-mix(in srgb, var(--pb-6) 70%, transparent); }
.rlabel { position: sticky; left: 0; z-index: 4; flex: none; background: var(--pb-1); border-right: 1px solid var(--pb-7); padding: 7px 10px 6px 18px; overflow: hidden; }
.rlabel .sleeve { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; }
.rlabel .rn { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rlabel .rm { font: 10.5px var(--pb-font-mono); color: var(--pb-11); white-space: nowrap; }
.rlabel .lanetag { position: absolute; right: 8px; font: 10px var(--pb-font-mono); color: var(--pb-11); line-height: 1; white-space: nowrap; }
.track { position: relative; flex: none; }
.subzone { position: absolute; left: 0; right: 0; pointer-events: none; border-top: 1px dotted color-mix(in srgb, var(--pb-7) 80%, transparent); }

/* バー（共通の骨組み。見た目は各案で上書きする） */
.bar { position: absolute; height: var(--bh); border-radius: 3px; cursor: pointer; user-select: none; -webkit-user-select: none; }
.bar .in { position: relative; display: block; width: fit-content; max-width: 100%; height: 100%; overflow: hidden; padding: 3px 7px; }
.bar .l1, .bar .l2 { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 15px; }
.bar .l1 { font-size: 12.5px; font-weight: 600; }
.bar .l2 { font-size: 11px; }
.bar.w-s .in { padding: 3px 4px; }
.bar.w-xs .in { padding: 3px 0; width: 100%; text-align: center; }
.bar.w-xs .l2, .bar.w-xs .tt { display: none; }
.bar.w-0 .in { display: none; }
.bar .hE, .bar .hS { position: absolute; top: -2px; bottom: -2px; width: 9px; cursor: ew-resize; z-index: 2; }
.bar .hE { right: -5px; }
.bar .hS { left: -5px; }
.bar .hE::after, .bar .hS::after { content: ''; position: absolute; top: 8px; bottom: 8px; left: 3px; width: 3px; border-left: 1px solid var(--pb-11); border-right: 1px solid var(--pb-11); opacity: 0; }
.bar:hover .hE::after, .bar:hover .hS::after { opacity: .9; }
.bar.sel { outline: 2px solid var(--pb-9); outline-offset: 2px; }
.bar.flash { animation: flash 2.4s ease-out both; }
@keyframes flash { 0%, 35% { box-shadow: 0 0 0 3px var(--pb-warning), 0 0 14px var(--pb-warning); } 100% { box-shadow: 0 0 0 3px transparent; } }
.who { position: absolute; transform: translateY(-100%); font-size: 10.5px; background: var(--pb-warning); color: #1d1a10; border-radius: 3px; padding: 0 5px; white-space: nowrap; z-index: 5; pointer-events: none; animation: whofade 2.4s ease-out both; }
@keyframes whofade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
/* アンカー（杭）：端から上下にはみ出す縦線と、上下の短い横棒 */
.pin { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--pin, var(--pb-12)); z-index: 3; pointer-events: none; }
.pin::before, .pin::after { content: ''; position: absolute; left: -3px; width: 9px; height: 2px; background: inherit; }
.pin::before { top: 0; } .pin::after { bottom: 0; }
.pin.s { left: -1px; } .pin.e { right: -1px; }
/* FS の印 */
.fs { position: absolute; pointer-events: none; z-index: 3; }
.fs.j { width: 9px; height: 9px; transform: translate(-50%, -50%) rotate(45deg); background: var(--pb-1); border: 1.5px solid var(--g-dep); }
.fs.ln { height: 0; border-top: 1.5px solid var(--g-dep); transform: translateY(-50%); }
.fs.ln::after { content: ''; position: absolute; right: -1px; top: -5px; border: 4px solid transparent; border-left: 6px solid var(--g-dep); border-right: 0; }
/* 押している：終了からいままでの延長 */
.lateext { position: absolute; height: 0; border-top: 2px dashed var(--pb-danger); pointer-events: none; z-index: 2; }
.lateext::after { content: ''; position: absolute; right: -1px; top: -7px; height: 9px; border-right: 2px solid var(--pb-danger); }
/* 衝突 */
.coll { position: absolute; pointer-events: none; z-index: 2; background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--pb-danger) 45%, transparent) 0 2px, transparent 2px 6px); border: 1px solid var(--pb-danger); }
/* 実績の細線（着手→完了） */
.act { position: absolute; height: 2px; pointer-events: none; background: var(--pb-11); border-radius: 1px; }
.act::before, .act::after { content: ''; position: absolute; top: -2px; width: 1px; height: 6px; background: inherit; }
.act::before { left: 0; } .act::after { right: 0; }
/* 当初計画の影（形は各案で上書きする） */
.base { position: absolute; pointer-events: none; }
.gonelbl { position: absolute; font-size: 10.5px; color: var(--pb-11); white-space: nowrap; pointer-events: none; font-style: italic; }
.newtag { font: 600 9.5px var(--pb-font-mono); border: 1px dashed currentColor; border-radius: 3px; padding: 0 3px; margin-right: 4px; color: var(--pb-11); vertical-align: 1px; }

/* 試算の影 */
.ghost { position: absolute; border: 2px dashed var(--pb-10); background: color-mix(in srgb, var(--pb-9) 20%, transparent); border-radius: 3px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--pb-1) 70%, transparent); }
.bar.tr-from { opacity: .35; }
.ghost.src { border-style: solid; }
.ghost.block { border-color: var(--pb-danger); background: color-mix(in srgb, var(--pb-danger) 14%, transparent); }
.ghost.sug { border-color: var(--pb-11); border-style: dotted; background: color-mix(in srgb, var(--pb-11) 10%, transparent); }
.gl { position: absolute; font: 600 10.5px/14px var(--pb-font-mono); color: var(--pb-1); background: var(--pb-10); border-radius: 3px; padding: 0 4px; white-space: nowrap; transform: translate(4px, -50%); }
.gl.block { background: var(--pb-danger); }
.gl.sug { background: var(--pb-11); }

/* 吹き出し（詳細ペインの代わり。題名と操作だけ） */
.pop { position: absolute; z-index: 40; width: 340px; background: var(--pb-1); border: 1px solid var(--pb-7); border-radius: 8px; box-shadow: 0 10px 28px oklch(0.2 0.03 245 / .22); padding: 10px 12px; font-size: 12.5px; }
.pop .pt { font-weight: 600; font-size: 13.5px; line-height: 1.45; margin: 2px 0 6px; }
.pop .pid { font: 11px var(--pb-font-mono); color: var(--pb-11); }
.pop dl { display: grid; grid-template-columns: 6.5em 1fr; gap: 2px 8px; margin: 0 0 8px; }
.pop dt { color: var(--pb-11); font-size: 11.5px; }
.pop dd { margin: 0; }
.pop .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.pop .note { margin-top: 8px; font-size: 11px; color: var(--pb-11); border-top: 1px dashed var(--pb-6); padding-top: 6px; }
.pop .x { position: absolute; right: 6px; top: 4px; border: 0; background: none; color: var(--pb-11); cursor: pointer; font-size: 14px; }
.dz { color: var(--pb-danger-text); }
@media (prefers-reduced-motion: reduce) { .bar.flash, .who { animation-duration: .01s; } }

<style>

   ・延びたら隙間を吸収し、足りない分だけ後ろを押す（隙間は保たない。7.1 T7）
   ・縮んだら後ろは動かさない。ただし同じ行の FS の後続は、先行の終了まで寄せる（7.1 T7 FS）
   ・開始のアンカー／着手済みの開始／完了は動かさない（T9）。終了のアンカーは開始だけ動いて縮む
   ・まだ始まっていないものを「いま」より前に置かない（T9）
   o.shift：[ここで詰める] のとき、後ろを同じだけ前へ寄せる量（負）。o.lens：U2 で縮めた長さ */
const startFixed = t => t.ps || t.st !== 'todo';
const endFixed = t => t.pe || t.st === 'done';
const seqOf = epic => S.tk.filter(t => t.epic === epic && t.chk).sort((a, b) => a.s - b.s || a.e - b.e);
const predsOf = id => S.links.filter(l => l[1] === id).map(l => l[0]);
function plan(id, ns, ne, o = {}) {

  const R = { id, ok: true, pos: new Map(), reason: null, blocker: null, short: 0, att: null, from: { s: T.s, e: T.e }, to: { s: ns, e: ne } };
  if (ne - ns < min) { R.ok = false; R.reason = 'short'; R.short = min - (ne - ns); return R; }
  R.pos.set(id, { s: ns, e: ne });

      if (e - s < min) { R.ok = false; R.reason = 'endpin'; R.blocker = Xt.id; R.short = min - (e - s); R.att = { s, e }; return R; }

/* ── 表示する中身（当日／版の遷移／振り返り） ── */
function model() {
  const vs = S.versions;
  if (S.step != null) {
    const cur = S.step >= vs.length;
    const items = cur ? S.tk.map(t => ({ ...t })) : Object.values(vs[S.step].snap).map(r => ({ ...r, st: 'plan' }));
    const base = S.step > 0 ? vs[Math.min(S.step, vs.length) - 1].snap : null;
    return { items, base, mode: 'step' };
  }
  const base = S.base != null ? vs[S.base].snap : null;

  const end = hm(17), now = nowS();
  for (const t of S.tk) {
    if (t.st === 'done') { t.ras = t.sa ?? t.s; t.rae = t.ca ?? t.e; continue; }
    const j1 = Math.round((hash(t.id + 'a') * 14 - 3)) * 60, j2 = Math.round((hash(t.id + 'b') * 24 - 7)) * 60;
    t.ras = t.st === 'prog' ? (t.sa ?? t.s) : Math.max(t.s + j1, Math.min(S.now, t.s));
    t.rae = Math.min(end, Math.max(t.ras + 5 * 60, t.e + j2, t.st === 'prog' ? now : 0));
  }
  for (const ep of EPICS) {
    let prev = 0;
    for (const t of seqOf(ep.id)) {
      if (t.st === 'todo' && t.ras < prev) { const len = t.rae - t.ras; t.ras = prev; t.rae = Math.min(end, Math.max(t.ras + 5 * 60, t.ras + len)); }
      prev = Math.max(prev, t.rae);
    }
  }
}

let LAY = null;
function layout(M) {
  const rows = [];
  let top = 0;
  for (const ep of EPICS) {
    if (!S.rows.has(ep.id)) continue;
    const items = M.items.filter(t => t.epic === ep.id && t.s != null && t.e != null);
    const gone = M.base ? Object.values(M.base).filter(b => b.epic === ep.id && !M.items.some(t => t.id === b.id)) : [];
    const lane = new Map(), ends = [];
    const free = [...items.filter(t => !t.chk), ...gone.filter(b => !b.chk).map(b => ({ ...b, gone: true }))].sort((a, b) => a.s - b.s);
    for (const t of free) { let k = ends.findIndex(e => e <= t.s); if (k < 0) { k = ends.length; ends.push(0); } ends[k] = t.e; lane.set(t.id, k + 1); }
    for (const t of items) if (t.chk) lane.set(t.id, 0);
    for (const b of gone) if (b.chk) lane.set(b.id, 0);
    const lanes = 1 + ends.length, h = lanes * V.LANE + ROWPAD * 2;
    rows.push({ ep, items, gone, lane, lanes, top, h });
    top += h;
  }
  return { rows, H: top };
}
const laneTop = l => ROWPAD + l * V.LANE + (V.LANE - V.BAR_H) / 2;

  if (M.base) { const b = M.base[it.id]; if (!b) c.isNew = true; else { const ds = it.s - b.s, de = it.e - b.e; if (Math.abs(ds) >= 60 || Math.abs(de) >= 60) c.dev = { ds, de, b }; c.b = b; } }
  if (M.mode === 'day') {

}

    : (S.now >= T0 + sc.scrollLeft / S.pps && S.now <= T0 + (sc.scrollLeft + sc.clientWidth - V.LW) / S.pps ? X(S.now) - sc.scrollLeft : (sc.clientWidth - V.LW) / 2);
  const t = T0 + (sc.scrollLeft + ax) / S.pps;
  S.pps = pps;
  renderRows();
  S.progScroll = true;
  sc.scrollLeft = X(t) - ax;
  renderGrid();
}
function gotoNow() {
  const sc = $('#sc');
  S.progScroll = true;
  sc.scrollLeft = Math.max(0, X(S.now) - (sc.clientWidth - V.LW) * (V.followAt || 0.3));
  if (V.follow) S.follow = true;
  renderGrid();
}
function setTheme(v) {
  if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme');
  setPressed('#segTheme', v || '');
}
function syncURL() {
  const q = new URLSearchParams(location.search);
  if (S.rows.size === EPICS.length) q.delete('rows'); else q.set('rows', [...S.rows].join(','));
  try { history.replaceState(null, '', `${location.pathname}?${q}`.replace(/\?$/, '')); } catch (e) { /* file: では失敗してよい */ }
}

/* 他の人の変更（定期取得で入ってくるもの）を1件流す */
const POLLS = [
  { who: '田中（模擬店）', run() { const t = byId('s5'); const d = t.e > hm(11, 55) ? -600 : 600; t.e += d; flash(t.id, this.who); return `「${short(t.title, 10)}」の終了を ${sdur(d)}（重複チェック無し：ほかは動かない）`; } },
  { who: '鈴木（本部）', run() { const t = byId('k3'); const d = t.e > hm(15) ? -900 : 900; const R = plan(t.id, t.s, t.e + d); if (!R.ok) return null; applyPos(R.pos, this.who); const n = R.pos.size - 1; return `「1-C ${t.title}」の終了を ${sdur(d)}${d > 0 ? (n ? `（後ろの ${n}件を押した）` : '（隙間で吸収）') : '（後ろは動かない）'}`; } },
  { who: '山本（放送）', run() { const t = byId('b2'); t.title = t.title.includes('迷子') ? 'お昼の放送「DJ タイム」' : 'お昼の放送「DJ タイム」と迷子のお知らせ'; flash(t.id, this.who); return `「${short(t.title, 12)}」の題名を変更`; } },
  { who: '伊藤（2-A）', run() { const t = byId('a5'); if (t.st === 'todo') { t.st = 'prog'; t.sa = nowS(); } else { t.st = 'todo'; t.sa = null; } flash(t.id, this.who); return `「${t.title}」を${STN[t.st]}に`; } },
];
function pollOnce(force) {
  S.sincePoll = 0; S.pollCount++;
  if (!force && S.pollCount % 2) { renderPoll(); return; }
  if (S.retro || S.step != null) { renderPoll(); return; }
  const P = POLLS[S.pollIdx++ % POLLS.length];
  const text = P.run(); if (!text) return;
  S.lastOther = { who: P.who, text, at: Date.now() };
  if (S.trial) { S.trial = makeTrial(S.trial.a); S.trial.stale = true; }
  renderRows(); renderNotice(); renderPoll(); if (S.pop) renderPop();
}

function examples(k) {
  const g3 = byId('g3');
  if (k === 'dance30') setTrial({ op: 'end', id: 'g3', ne: g3.e + 1800 });
  if (k === 'dance70') setTrial({ op: 'end', id: 'g3', ne: g3.e + 4200 });
  if (k === 'obake') setTrial({ op: 'end', id: 'a1', ne: byId('a1').e + 3600 });
  if (k === 'mochi') setTrial({ op: 'compact', id: 'y3' });
  if (k === 'dancenow') setTrial({ op: 'now', id: 'g3' });
}

function bind() {
  const sc = $('#sc');
  $('#segTheme').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.v); });
  $('#segRole').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    S.role = b.dataset.v; S.rows = new Set(S.role === 'admin' ? EPICS.map(x => x.id) : ['gym']);
    syncURL(); renderAll();
  });
  $('#segScene').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const r = b.dataset.v === 'retro'; if (r === S.retro) return;
    S.trial = null; S.step = null; closePop();
    if (r) { S.savedNow = S.now; S.savedPlay = S.playing; makeActuals(); S.now = hm(17); S.playing = false; S.retro = true; if (S.base == null) S.base = S.versions.length - 1; }
    else { S.retro = false; S.now = S.savedNow; S.playing = S.savedPlay; }
    renderAll(); gotoNow();
  });
  $('#segPoll').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.pollOn = b.dataset.v === 'on'; renderHeader(); renderPoll(); } });
  $('#btnPollNow').addEventListener('click', () => pollOnce(true));
  $('#btnPlay').addEventListener('click', () => { S.playing = !S.playing; renderHeader(); });
  $('#selSpeed').addEventListener('change', e => { S.speed = +e.target.value; });
  $('#btnAdd5').addEventListener('click', () => { S.now += 300; tickRender(true); });
  $('#selSnap').addEventListener('change', e => { S.snap = +e.target.value; if (S.trial) setTrial(S.trial.a); });
  $('#segZoom').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setZoom(ZOOMS[b.dataset.v]); });
  $('#btnNow').addEventListener('click', gotoNow);
  $('#btnSave').addEventListener('click', () => {
    const vs = S.versions; const n = vs[vs.length - 1].n + 1;
    vs.push({ n, at: `10/24 ${fmtT(S.now)}`, who: '鈴木（本部）', label: `当日 ${fmtT(S.now)}`, snap: snap(S.tk) });
    S.base = vs.length - 1;
    S.savedMsg = { at: Date.now(), text: `v${n} として保存しました（${S.tk.length}件。行を絞っていても全体を保存）。この版を重ねています。` };
    renderAll();
  });
  $('#btnStep').addEventListener('click', () => { if (S.step != null) S.step = null; else { S.step = 0; S.trial = null; closePop(); } renderAll(); });
  $('#btnRows').addEventListener('click', e => { e.stopPropagation(); $('#pnlVer').hidden = true; $('#pnlRows').hidden = !$('#pnlRows').hidden; });
  $('#btnVer').addEventListener('click', e => { e.stopPropagation(); $('#pnlRows').hidden = true; $('#pnlVer').hidden = !$('#pnlVer').hidden; });
  $('#pnlRows').addEventListener('click', e => e.stopPropagation());
  $('#pnlVer').addEventListener('click', e => e.stopPropagation());
  $('#pnlRows').addEventListener('change', e => {
    const id = e.target.dataset.epic; if (!id) return;
    if (e.target.checked) S.rows.add(id); else S.rows.delete(id);
    syncURL(); renderHeader(); renderRows(); $('#pnlRows').hidden = false;
  });
  $('#pnlRows').addEventListener('click', e => {
    const p = e.target.closest('[data-preset]'); if (!p) return;
    S.rows = new Set(p.dataset.preset === 'all' ? EPICS.map(x => x.id) : p.dataset.preset === 'gym' ? ['gym'] : ['gym', 'yard']);
    syncURL(); renderHeader(); renderRows(); $('#pnlRows').hidden = false;
  });
  $('#pnlVer').addEventListener('change', e => { if (e.target.name === 'base') { S.base = +e.target.value < 0 ? null : +e.target.value; renderAll(); $('#pnlVer').hidden = false; } });
  $('#pnlVer').addEventListener('click', e => { if (e.target.closest('[data-act="step"]')) { S.step = 0; S.trial = null; $('#pnlVer').hidden = true; renderAll(); } });
  document.addEventListener('click', e => {
    $('#pnlRows').hidden = true; $('#pnlVer').hidden = true;
    if (S.pop && !e.target.closest('#pop') && !e.target.closest('.bar')) closePop();
  });
  $('#notice').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.ex) return examples(b.dataset.ex);
    const a = b.dataset.act;
    if (a === 'commit') commit(false);
    if (a === 'u2') commit(true);
    if (a === 'cancel') setTrial(null);
    if (a === 'seek') { const sc = $('#sc'); S.follow = false; S.progScroll = true; sc.scrollLeft = Math.max(0, X(+b.dataset.t) - (sc.clientWidth - V.LW) * 0.6); renderGrid(); renderNotice(); }
    if (a === 'prev') { S.step = Math.max(0, S.step - 1); renderAll(); }
    if (a === 'next') { S.step = Math.min(S.versions.length, S.step + 1); renderAll(); }
    if (a === 'endstep') { S.step = null; renderAll(); }
  });
  $('#notice').addEventListener('mouseover', e => { const on = !!e.target.closest('[data-act="u2"]'); if (on !== S.showSug) { S.showSug = on; renderGhosts(); } });
  $('#pop').addEventListener('click', e => {
    const b = e.target.closest('[data-pa]'); if (!b) return;
    const t = byId(S.pop), a = b.dataset.pa;
    if (a === 'close') return closePop();
    if (a === 'start') { t.st = 'prog'; t.sa = nowS(); flash(t.id, 'あなた'); }
    if (a === 'done') { t.st = 'done'; t.ca = nowS(); flash(t.id, 'あなた'); }
    if (a === 'ps') t.ps = !t.ps;
    if (a === 'pe') t.pe = !t.pe;
    if (a === 'chk') t.chk = !t.chk;
    if (a === 'now' || a === 'compact') { setTrial({ op: a, id: t.id }); closePop(); return; }
    renderRows(); renderPop(); renderNotice();
  });
  // バー：クリックで吹き出し、端のドラッグで試算
  $('#rows').addEventListener('pointerdown', e => {
    const h = e.target.closest('.hE, .hS'); if (!h || S.step != null || S.retro) return;
    const id = h.closest('.bar').dataset.id, t = byId(id), edge = h.classList.contains('hE') ? 'e' : 's';
    e.preventDefault();
    S.drag = { id, edge, x0: e.clientX, v0: edge === 'e' ? t.e : t.s, moved: false, cur: null };
  });
  window.addEventListener('pointermove', e => {
    const d = S.drag; if (!d) return;
    if (Math.abs(e.clientX - d.x0) > 2) d.moved = true;
    if (!d.moved) return;
    const v = Math.round((d.v0 + (e.clientX - d.x0) / S.pps) / S.snap) * S.snap;
    if (v === d.cur) return; d.cur = v;
    setTrial(d.edge === 'e' ? { op: 'end', id: d.id, ne: v } : { op: 'start', id: d.id, ns: v });
  });
  window.addEventListener('pointerup', () => {
    const d = S.drag; if (!d) return; S.drag = null;
    if (d.moved) { S.eatClick = true; if (d.cur === d.v0) setTrial(null); }
  });
  $('#rows').addEventListener('click', e => {
    if (S.eatClick) { S.eatClick = false; return; }
    const bar = e.target.closest('.bar'); if (!bar || e.target.closest('.hE, .hS')) return;
    e.stopPropagation();
    if (S.step != null && !byId(bar.dataset.id)) return;
    openPop(bar.dataset.id, e.clientX, e.clientY);
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input, select, textarea')) return;
    if (e.key === 'Escape') { if (S.trial) setTrial(null); else closePop(); }
    if (e.key === 'Enter' && S.trial && S.trial.R.ok) commit(false);
    if (S.step != null && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { S.step = Math.max(0, Math.min(S.versions.length, S.step + (e.key === 'ArrowRight' ? 1 : -1))); renderAll(); }
    if (!e.metaKey && !e.ctrlKey && !e.altKey && (e.key === '+' || e.key === '-')) setZoom(S.pps * (e.key === '+' ? 1.6 : 1 / 1.6));
  });
  sc.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(S.pps * Math.exp(-e.deltaY * 0.0025), e.clientX); }
    else if (e.shiftKey && !e.deltaX) { e.preventDefault(); sc.scrollLeft += e.deltaY; }
    if (e.deltaX || e.shiftKey || e.ctrlKey || e.metaKey) S.follow = false;
  }, { passive: false });
  let raf = 0;
  sc.addEventListener('scroll', () => {
    if (S.progScroll) S.progScroll = false; else if (V.follow && S.follow && !S.drag) S.follow = false;
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; renderGrid(); });
  });
  window.addEventListener('resize', () => { renderGrid(); });
  window.addEventListener('message', e => { const d = e.data || {}; if (d.type === 'theme') setTheme(d.theme); });
}

/* 時計と定期取得 */
let lastWall = performance.now(), acc = 0;
function tickRender(force) {
  const m = Math.floor(S.now / 60);
  if (force || m !== S.lastMin) { S.lastMin = m; renderRows(); if (V.rowInfo || S.pop) { if (S.pop) renderPop(); } if (S.trial && !S.drag) { S.trial = makeTrial(S.trial.a); renderGhosts(); renderNotice(); } }
  placeNow();
}
function loop() {
  const t = performance.now(), dt = (t - lastWall) / 1000; lastWall = t;
  if (S.playing && !S.retro) { S.now = Math.min(hm(17, 10), S.now + dt * S.speed); tickRender(false); }
  acc += dt;
  if (acc >= 1) {
    acc = 0;
    if (S.pollOn) { S.sincePoll++; if (S.sincePoll >= 5) pollOnce(false); else renderPoll(); }
    if (S.lastOther && Date.now() - S.lastOther.at > 20000 && !S.trial) { S.lastOther = null; renderNotice(); }
    if (S.savedMsg && Date.now() - S.savedMsg.at > 8000 && !S.trial) { S.savedMsg = null; renderNotice(); }
  }
  setTimeout(loop, 250);
}

/* 起動 */
skeleton();
const th = qs.get('theme'); if (th === 'light' || th === 'dark') setTheme(th);
if (qs.get('play') === '0') S.playing = false;
if (qs.get('poll') === '0') S.pollOn = false;
bind();
renderAll();
requestAnimationFrame(() => { gotoNow(); renderGrid(); });
loop();
window.__tl = { S, plan, makeTrial, setTrial, commit, examples, setZoom, gotoNow, renderAll, pollOnce, byId, hm };
})();

</script>
</body>
</html>
