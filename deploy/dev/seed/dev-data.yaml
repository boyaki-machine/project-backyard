# 開発端末での動作確認用。本番には投入されない（DbDesign.md 7.6.3 のガード）。
password: pbdev-password        # 全デモアカウント共通

users:
  - email: admin@example.com
    display_name: 開発管理者
    system_role: administrator
  - email: pm@example.com
    display_name: 開発PM
    system_role: operator
  - email: member@example.com
    display_name: 開発メンバー
    system_role: operator
  - email: viewer@example.com
    display_name: 開発閲覧者
    system_role: operator

projects:
  - key: demo
    name: デモプロジェクト
    description: 動作確認用のサンプルプロジェクト
    workflow_template: simple
    members:
      - { email: pm@example.com,     role: project_admin }
      - { email: member@example.com, role: project_member }
      - { email: viewer@example.com, role: project_viewer }

    # エージェント（DbDesign.md 8.2.1、手順24a）。
    #
    # **owner は必ずこのプロジェクトのメンバーであること。** 権限は所有者から
    # 導かれるので（Design.md 6.5 の委譲）、メンバーでない人に付けると権限0件になる。
    #
    # **1件だけ置く。** 入れないと `/admin/users` のエージェント行も Avatar の
    # 角丸四角（GuiDesign.md 8.4.2）も画面で一度も描かれない。
    #
    # **トークンは seed に入れない。** 平文は発行応答にしか存在せず（4.5.3）、
    # 定義ファイルに書くと「秘密をリポジトリに置かない」に反する。
    # 使えるトークンが要るときは画面か API から発行する。
    agents:
      - display_name: 開発PMのClaude Code
        owner: pm@example.com
        client_kind: claude_code
        model_name: claude-opus-5

    # タグ（DbDesign.md 6.10、手順16a）。バックログのグループ化の軸になる。
    # 色は持たない（GuiDesign.md 8.6）。sort_order がセクションの並び順。
    tags:
      - { name: 設計,   sort_order: 10 }
      - { name: GUI,    sort_order: 20 }
      - { name: API,    sort_order: 30 }
      - { name: MCP連携, sort_order: 40 }
      # **バグは種別ではなくタグで表す**（手順16d。DbDesign.md 6.10）。
      - { name: バグ,   sort_order: 50 }

    # スプリント（DbDesign.md 6.9、手順16a）。**3つの状態をすべて置く**
    # ——プロジェクト設定のスプリントタブ（GuiDesign.md 5.9.5）が
    # planned / active / completed を出し分けられるかを目で確かめるため。
    # 日付の無い1件も置く（並び順の NULLS LAST を確かめる）。
    sprints:
      - name: Sprint 1
        goal: ログインを通す
        start_date: '2026-07-22'
        end_date: '2026-08-04'
        status: completed
      - name: Sprint 2
        goal: プロジェクト管理をひととおり動かす
        start_date: '2026-08-05'
        end_date: '2026-08-18'
        status: active
      - name: Sprint 3
        goal: チケットを扱えるようにする
        start_date: '2026-08-19'
        end_date: '2026-09-01'
        status: planned
      - name: 未定
        goal: 日程が決まっていないもの置き場
        status: planned

    # チケット（DbDesign.md 6.6、手順16b）。バックログ画面（GuiDesign.md 5.4）が
    # 「見て確かめられる」状態を作るための組み合わせを揃えてある。
    #
    #   階層2段        親子のインデント表示（└）と折りたたみ（5.4）。
    #                  **エピック配下では足りない**——エピックは行として
    #                  出ないので、その子は表示上のトップレベルになる。
    #                  story / task どうしの親子を別に1組置く（手順16d-b）
    #   タグ複数持ち   タグでグループ化したとき同じ行が2つのセクションに出る（5.4.1）
    #   タグ無し       「未分類」セクション
    #   期限超過       ⚠ と赤字（5.4）。日付は seed の実行日より前に置く
    #   未割当         担当の「—」表示
    #   完了済み       open フィルタと、スプリントの進捗（5.9.5 の 5/12）
    #   スプリント3種  グループ化の軸の切り替え
    #   優先度5段      ▲▲ 〜 ▽▽ と無表示（8.7）
    #   オンステージ2件 上下二段（5.4）。**片方は未着手**で、進捗とは独立した
    #                  軸であることが目で分かる（DbDesign.md 6.6）
    #   エピック3件    行として出さず、フィルタの選択肢になる（5.4）
    #
    # **parent は自分より前に書いたタイトルを指すこと**（前から順に作るため）。
    # status は simple ワークフローの todo / in_progress / done。
    tickets:
      - title: 認証基盤を通す
        type: epic
        status: done
        priority: highest
        assignee: pm@example.com
        tags: [設計]
        sprint: Sprint 1
        start_date: '2026-07-22'
        due_date: '2026-08-04'
        estimate_point: 13
        body_md: ローカルID/PW認証でログインできるところまで。
      - title: ログインAPIの実装
        type: task
        parent: 認証基盤を通す
        status: done
        priority: high
        assignee: member@example.com
        tags: [API, 設計]
        sprint: Sprint 1
        estimate_point: 5
      - title: ログイン画面
        type: task
        parent: 認証基盤を通す
        status: done
        priority: medium
        assignee: member@example.com
        tags: [GUI]
        sprint: Sprint 1
        estimate_point: 3

      - title: プロジェクト管理をひととおり動かす
        type: epic
        status: in_progress
        priority: high
        assignee: pm@example.com
        tags: [設計]
        sprint: Sprint 2
        start_date: '2026-08-05'
        due_date: '2026-08-18'
        estimate_point: 21
      - title: プロジェクト一覧・作成
        type: story
        parent: プロジェクト管理をひととおり動かす
        status: done
        priority: medium
        assignee: member@example.com
        tags: [GUI, API]
        sprint: Sprint 2
        estimate_point: 8
      # 期限超過（⚠ の確認）。担当は未割当。
      - title: プロジェクト設定の権限まわりを詰める
        type: task
        parent: プロジェクト管理をひととおり動かす
        status: in_progress
        priority: highest
        tags: [設計]
        sprint: Sprint 2
        start_date: '2026-08-10'
        due_date: '2026-08-14'
        estimate_point: 5
      # **旧 type: bug**。種別を3値へ減らしたので、タスク＋タグ「バグ」で表す
      # （手順16d。DbDesign.md 6.6 / 6.10）。
      - title: アーカイブの冪等性が怪しい
        type: task
        parent: プロジェクト管理をひととおり動かす
        status: todo
        priority: low
        assignee: member@example.com
        tags: [API, バグ]
        sprint: Sprint 2

      - title: チケットを扱えるようにする
        type: epic
        status: in_progress
        priority: highest
        assignee: pm@example.com
        tags: [設計, API]
        sprint: Sprint 3
        start_date: '2026-08-19'
        due_date: '2026-09-01'
        estimate_point: 21
      # **オンステージ**（GuiDesign.md 5.4、手順16d）。親がエピックなので
      # 表示上のトップレベルであり、段に置ける（ApiDesign.md 9.4.1）。
      - title: チケット一覧API
        type: task
        parent: チケットを扱えるようにする
        status: in_progress
        priority: high
        assignee: member@example.com
        tags: [API]
        sprint: Sprint 3
        due_date: '2026-08-26'
        estimate_point: 8
        staged: true
        # **Markdown を一通り含める**（GuiDesign.md 5.5「説明欄」）。
        # 見出し・箇条書き・チェックボックス・コード・表・リンクが
        # 開いた瞬間に描画されることを、seed だけで確かめられるようにする。
        body_md: |
          # 概要

          バックログが使う一覧APIを実装する。フィルタは13種類あり、
          **総件数と最終更新は窓関数で同じクエリから返す**。

          # ゴール条件

          - `GET /projects/:key/tickets` が 200 を返す（済）
          - `page` / `per_page` / `total` / `total_pages` を規約どおり返す（済）
          - `ETag` がフィルタ条件を混ぜたハッシュになっている

          # 制約条件

          | 項目 | 値 |
          |---|---|
          | 既定の並び | `sort_key` の昇順 |
          | `per_page` の上限 | 200 |

          `sort_key` の比較には `COLLATE "C"` を明示すること。

          ```sql
          SELECT count(*) OVER () AS total, t.*
            FROM ticket t
           ORDER BY t.sort_key COLLATE "C";
          ```

          詳しくは <https://example.com/pb/api-design> を見ること。
        # **外部参照**（GuiDesign.md 5.5、手順17c）。**code は画面から追加できない**
        # ので、seed が唯一の供給源である。1件も無いとセクションごと出ない。
        #
        # **積み上がることを見せる**（DbDesign.md 6.12）——エージェントが作業の
        # 経過として「このブランチで始めた」「このコミットを積んだ」を残していく形。
        references:
          - kind: code
            repository: project-backyard
            branch: feature/step-16b-ticket-api
            commit_sha: 9f3c1a7
            url: https://example.com/project-backyard/commit/9f3c1a7
            label: 一覧のクエリと窓関数
          - kind: code
            repository: project-backyard
            branch: feature/step-16b-ticket-api
            commit_sha: 2e8b40d
            url: https://example.com/project-backyard/commit/2e8b40d
            label: フィルタ13種の検証
          # **URL を持たない code。** リンクにならず文字列だけが並ぶ形を
          # 画面で確かめられるようにする（5.5「url があればリンク」）。
          - kind: code
            repository: project-backyard
            branch: feature/step-16b-ticket-api
            note: ローカルで動かした分。まだ push していない
          - kind: doc
            url: https://example.com/pb/api-design
            label: API設計メモ（9.2 のフィルタ一覧）
        # **完了条件**（GuiDesign.md 5.5、手順18a）。**済みと未の両方を混ぜる**
        # ——チェックの見分けが画面で確かめられるようにするため。
        dod:
          - { body: 'GET /projects/:key/tickets が 200 を返す', satisfied: true }
          - { body: 'page / per_page / total / total_pages を規約どおり返す', satisfied: true }
          - { body: 'ETag がフィルタ条件を混ぜたハッシュになっている', satisfied: false }
          - { body: '結合テストでフィルタ13種すべてを通す', satisfied: false }
        # **コメント**（GuiDesign.md 5.5、手順18a）。**kind を散らす**——
        # 情報の類型（Requirements.md 6.5）が画面で見分けられるかを確かめる。
        comments:
          - author: pm@example.com
            kind: decision
            body: |
              総件数は窓関数で同じクエリから返す方針にした。
              件数だけ別クエリにすると、**フィルタと件数がずれる瞬間**が生まれるため。
          - author: member@example.com
            kind: progress
            body: フィルタ13種のうち11種まで実装。残りは `staged` と `open`。
          - author: member@example.com
            kind: caveat
            body: |
              `sort_key` の比較は `COLLATE "C"` を明示すること。
              省略すると照合順がロケール依存になり、並びが端末で変わる。
          - author: pm@example.com
            kind: discussion
            ref: etag-page
            body: ETag にページ番号を混ぜないと、2ページ目が1ページ目と同じ値になりませんか？
          # **返信と削除済み**（pb-24）。`↩ 返信先:` と `返信 N件:` の両向きリンク、
          # 「削除されました」を画面で確かめられるようにする
          - author: member@example.com
            kind: discussion
            reply_to: etag-page
            body: 混ぜます。ページ番号と per_page の両方をハッシュに入れる形にしました。
          - author: member@example.com
            kind: discussion
            deleted: true
            body: （別チケットへ書くつもりのコメント）
        # **関連チケット**（GuiDesign.md 5.5、手順18a）。**target は自分より前に
        # 書かれたチケット**である（前から順に作るため）。逆向き（incoming）は
        # 相手側から自動的に見える——1本の GET が双方向を返す（9.10.1）。
        links:
          - { target: ログインAPIの実装, type: relates }
      # **オンステージ、かつ未着手。** 進捗とオンステージが独立した軸である
      # ことを画面で確かめられるようにする（DbDesign.md 6.6）。
      - title: バックログ画面
        type: task
        parent: チケットを扱えるようにする
        status: todo
        priority: high
        tags: [GUI]
        sprint: Sprint 3
        due_date: '2026-08-28'
        estimate_point: 8
        staged: true
        # **コードを持たず参考リンクだけを持つチケット。** 「コードは0件なら
        # 見出しごと出さない／参考リンクは常に出す」の出し分けを画面で確かめる
        # （GuiDesign.md 5.5）。
        #
        # **2件目はブラウザから開けない形**（SSH）。リンクにせず文字列として
        # 出し、コピーできる状態にとどめる規則を確かめる。
        references:
          - kind: doc
            url: https://example.com/pb/gui-design
            label: 画面設計メモ（5.4 バックログ）
          - kind: doc
            url: git@example.com:org/project-backyard.git
            label: リポジトリ（SSH）
            note: ブラウザからは開けないのでリンクにしない
        # **すべて未チェックの完了条件。** 「1件も満たしていない」状態の
        # 見え方を画面で確かめる（上の「チケット一覧API」は一部が済み）。
        dod:
          - { body: '二段（オンステージとバックログ）が出る', satisfied: false }
          - { body: 'ドラッグ&ドロップで段を移せる', satisfied: false }
        # **コメントが1件だけのチケット。** 件数の見出し「コメント (1)」と
        # 複数件の並びの両方を確かめられるようにする。
        comments:
          - author: viewer@example.com
            kind: discussion
            body: 一覧の右にペインで開く形だと、狭い窓ではどうなりますか？
        # **blocks を張る。** 相手（チケット一覧API）側からは incoming として
        # 見える——**双方向が1本の GET で返ることを画面で確かめられる**
        # （ApiDesign.md 9.10.1）。
        links:
          - { target: チケット一覧API, type: blocks }
      # タグの無いチケット（「未分類」セクションの確認）。
      - title: 並べ替えの操作感を見る
        type: task
        parent: チケットを扱えるようにする
        status: todo
        priority: lowest
        sprint: Sprint 3

      # トップレベルで、親を持たず日付も持たないもの。
      # **旧 type: phase**（手順16d で廃止）。親を持たないトップレベルのまま。
      # **配下を2件持つ**（手順16d-b）——エピックを行から外すと、エピック配下の
      # チケットは表示上のトップレベルになるため、**エピックを介さない親子が
      # 1組も無いとツリーのインデントも折りたたみも画面に現れない**。
      # この行は親を持たないので段にも置ける。上げると配下ごとバックログから
      # 消えることを確かめられる（GuiDesign.md 5.4「配下の行き先」）。
      - title: MCP サーバの足場を作る
        type: task
        status: todo
        priority: medium
        tags: [MCP連携, 設計]
        sprint: 未定
        estimate_point: 13
        # 子を2件持つので、詳細の「子チケット」セクションが出る（5.5）。
        body_md: |
          # 概要

          PB 自身を MCP サーバとして公開し、Claude Code から使えるようにする。

          # ゴール条件

          - `ticket.list` / `ticket.get` / `ticket.claim` が呼べる
          - 認証は `/me/tokens` の API トークンに寄せる

          # 制約条件

          - Phase 2 の手順22。**Phase 1 では足場だけ**
      - title: MCP のツール定義を決める
        type: task
        parent: MCP サーバの足場を作る
        status: todo
        priority: medium
        tags: [MCP連携]
        sprint: 未定
        estimate_point: 5
      # 親を持つので段に置けない（ApiDesign.md 9.4.1 の not_stageable）。
      # 段をまたぐドラッグが弾かれることを画面で確かめる行でもある。
      - title: MCP の認証をトークンに寄せる
        type: task
        parent: MCP サーバの足場を作る
        status: in_progress
        priority: low
        assignee: member@example.com
        tags: [MCP連携, 設計]
        sprint: 未定
        estimate_point: 3
      # タグもスプリントも担当も無い（「未分類」「スプリント未設定」「未割当」）。
      - title: ドキュメントの棚卸し
        type: task
        status: todo
        priority: lowest
