# migrate.conf — goose（migrate.sh）が pb_owner で繋ぐ先
#
# **パスワードを書かない。** パスワードは secrets/pgpass に置く（書くとスクリプトが止まる）。
# コメントと空行を除いた最初の1行を、接続先として読む。
# secrets/app_database_url と同じ PostgreSQL（ホスト・ポート・DB名）を指すこと。
#
# **ホストは「コンテナの中から見た」名前で書く。** 127.0.0.1 はコンテナ自身を指す。
#   - 同じ端末の PostgreSQL：host.docker.internal（Linux では、PostgreSQL が docker のブリッジの
#     アドレスでも待ち受け、そこからの接続を許している必要がある）
#   - コンテナで動く PostgreSQL：そのコンテナ名（環境変数 PB_DOCKER_NETWORK に同じネットワークを入れる）
#   - 別のマシン：そのホスト名。sslmode=disable を require 以上にする
postgres://pb_owner@host.docker.internal:5432/pb?sslmode=disable
