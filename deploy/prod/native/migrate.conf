# migrate.conf — goose（migrate.sh／migrate.ps1）が pb_owner で繋ぐ先
#
# **パスワードを書かない。** パスワードは secrets/pgpass に置く（書くとスクリプトが止まる）。
# コメントと空行を除いた最初の1行を、接続先として読む。
# secrets/app_database_url と同じ PostgreSQL（ホスト・ポート・DB名）を指すこと。
# 別のマシンの PostgreSQL へ繋ぐなら、sslmode=disable を require 以上にする。
postgres://pb_owner@127.0.0.1:5432/pb?sslmode=disable
