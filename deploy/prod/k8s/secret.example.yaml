# secret.example.yaml — PB の秘密の雛形（make release TARGET=k8s が出力した）
#
# **このファイルに実際の値を書かない。** 複製して secret.yaml を作り、CHANGE_ME を置き換えてから
# apply する。手順は MANUAL.md「5.3 秘密を作る」。
#
#   cp secret.example.yaml secret.yaml
#   chmod 600 secret.yaml
#   （secret.yaml の CHANGE_ME を3か所書き換える）
#   kubectl create -n <namespace> -f secret.yaml
#
# **apply ではなく create で入れる。** apply は入れた内容を Secret の注釈（last-applied-configuration）に
# 平文のまま残す。値を変えるときは kubectl replace を使う（これも注釈を残さない）。
#
# **k8s/ の外に置いてあるのは、kubectl apply -f k8s/ で値の入っていない Secret まで入れないため。**
#
# 値は、各コンテナへ**環境変数として**渡る（DbDesign.md 3.3）。
#
#   キー             使うもの                                     環境変数
#   owner_password   DB のサンプル（pb_owner を作る）と migrate    POSTGRES_PASSWORD / PGPASSWORD
#   app_password     DB のサンプル（pb_app を作る）                （ファイルとして DB のコンテナへ渡す）
#   database_url     PB 本体                                      PB_DATABASE_URL
#
# **database_url の中のパスワードは、app_password と同じ値にする。** 食い違っても apply は通り、
# PB 本体が DB へ繋ぐときに初めて認証エラーになる。
# **パスワードは英数字だけにする**（openssl rand -hex 16 など）。記号を含むと database_url の書き方に
# 気を遣う必要がある（@ → %40、: → %3A）。
apiVersion: v1
kind: Secret
metadata:
  name: pb
  labels:
    app.kubernetes.io/name: project-backyard
type: Opaque
stringData:
  owner_password: CHANGE_ME
  app_password: CHANGE_ME
  database_url: postgres://pb_app:CHANGE_ME@pb-db:5432/pb?sslmode=disable&application_name=pb
  # 外部の PostgreSQL へ繋ぐときは、上の database_url を消して次の行を使う。ホストとポートを直し、
  # sslmode を require 以上にする。app_password は使われない（ロールは外部側で作る。MANUAL.md 5.7）:
  # database_url: postgres://pb_app:CHANGE_ME@postgres.example.com:5432/pb?sslmode=require&application_name=pb
